schema_version = 1
name = "vibesys-evaluator-priority-queue"
version = "0.1.0"
protocol_version = 1
toolchains = ["go", "rust"]
go_module = "."
# The file a candidate's [build] must produce; the framework verifies it and passes it on.
candidate_outputs = ["priority-queue-candidate.so"]

[entrypoints]
vibesys-priority-queue = ["go", "-C", "${PACKAGE_ROOT}", "run", "."]
