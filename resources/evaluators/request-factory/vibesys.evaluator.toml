schema_version = 1
name = "vibesys-evaluator-request-factory"
version = "0.1.0"
protocol_version = 1

[tools.request-factory]
kind = "cargo-git"
git = "https://github.com/uw-syfi/request-factory"
rev = "89dce4a64ae12e7084fbe464ddda882fa0a4c482"
package = "req-frontend"
bins = ["session_runner"]

[entrypoints]
request-factory-engine = ["${TOOL:request-factory/session_runner}"]
request-factory-adapter = [
  "python3",
  "${PACKAGE_ROOT}/adapter.py",
  "--engine",
  "${TOOL:request-factory/session_runner}",
  "--",
]
request-factory-fixed-text-v1 = [
  "python3",
  "${PACKAGE_ROOT}/fixed_text.py",
  "--request-factory-engine",
  "${TOOL:request-factory/session_runner}",
]
