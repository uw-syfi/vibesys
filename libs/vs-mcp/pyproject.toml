[build-system]
requires = ["setuptools>=70.1", "wheel>=0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "vs-mcp"
version = "0.1.0"
description = "Declaring, describing and serving MCP tool servers"
requires-python = ">=3.12"
dependencies = ["mcp>=1.0,<2", "pydantic>=2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vs_mcp = ["py.typed"]
