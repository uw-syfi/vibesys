# vs_agent is the one importer of agentshim, so this file replaces the repository's
# banned-api table for libs/vs-agent with every entry except "agentshim" (a nested
# table replaces, not merges). Keep the real-time entries in step with pyproject.toml.
extend = "../../pyproject.toml"

[lint.flake8-tidy-imports.banned-api]
"time".msg = "Take a vs_sim.api Clock or Sleeper as a required argument instead of reading real time."
"datetime.datetime.now".msg = "Stamp times from a vs_sim.api Clock (vs_sim.api.utc_datetime(clock))."
"datetime.datetime.utcnow".msg = "Stamp times from a vs_sim.api Clock (vs_sim.api.utc_datetime(clock))."
"datetime.datetime.today".msg = "Stamp times from a vs_sim.api Clock (vs_sim.api.utc_datetime(clock))."
"datetime.date.today".msg = "Stamp times from a vs_sim.api Clock (vs_sim.api.utc_datetime(clock))."
"asyncio.sleep".msg = "Wait on a vs_sim.api Sleeper; yield to the loop with vs_sim.api.yield_now()."
