[build-system]
requires = ["setuptools>=70.1", "wheel>=0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "vs-sim"
version = "0.1.0"
description = "Time, scheduling, seeds, signals, processes and synchronization behind interfaces, with a deterministic simulator for tests"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vs_sim = ["py.typed"]
