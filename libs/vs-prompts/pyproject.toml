[build-system]
requires = ["setuptools>=70.1", "wheel>=0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "vs-prompts"
version = "0.1.0"
description = "Strict Jinja2 template rendering with required-context checks"
requires-python = ">=3.12"
dependencies = ["jinja2>=3.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vs_prompts = ["py.typed"]
