[build-system]
requires = ["setuptools>=70.1", "wheel>=0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "vs-proto"
version = "0.1.0"
description = "Generated run store and host API contracts"
requires-python = ">=3.12"
dependencies = ["protobuf-py==0.6.0", "protobuf==6.33.5", "protovalidate==2.0.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vs_proto = ["py.typed"]
