[build-system]
requires = ["setuptools>=70.1", "wheel>=0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "vs-core"
version = "0.1.0"
description = "Pure strategy-neutral lifecycle kernel"
requires-python = ">=3.12"
dependencies = ["pydantic>=2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vs_core = ["py.typed"]
