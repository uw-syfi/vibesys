syntax = "proto3";
package vibesys.runtime.testing.v1;

import "vibesys/store/v1/replay.proto";

message PromptContext {
  option (vibesys.store.v1.replay_context) = true;
  string candidate = 1 [(vibesys.store.v1.replay_field) = REPLAY_FIELD_KIND_IDENTITY];
  string instruction = 2 [(vibesys.store.v1.replay_field) = REPLAY_FIELD_KIND_POLICY];
}

message UnclassifiedContext {
  option (vibesys.store.v1.replay_context) = true;
  string candidate = 1;
}
