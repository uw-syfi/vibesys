[build-system]
requires = ["setuptools>=70.1", "wheel>=0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "vs-runtime"
version = "0.1.0"
description = "Run mechanisms: sessions, workspaces, evaluation execution and the core shell"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1",
    "pydantic>=2",
    "protobuf-py==0.6.0",
    "vs-proto",
    "pyyaml>=6",
    "vs-agent",
    "vs-async-ops",
    "vs-core",
    "vs-decode",
    "vs-evaluation",
    "vs-evaluator-protocol",
    "vs-github",
    "vs-issue-tracker",
    "vs-mcp",
    "vs-project",
    "vs-prompts",
    "vs-redaction",
    "vs-sandbox",
    "vs-sim",
    "vs-slurm",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vs_runtime = ["py.typed", "prompts/*.j2", "features/src/*/*", "features/test/*/*"]

[tool.uv.sources]
vs-agent = { workspace = true }
vs-async-ops = { workspace = true }
vs-core = { workspace = true }
vs-decode = { workspace = true }
vs-evaluation = { workspace = true }
vs-evaluator-protocol = { workspace = true }
vs-github = { workspace = true }
vs-issue-tracker = { workspace = true }
vs-mcp = { workspace = true }
vs-project = { workspace = true }
vs-proto = { workspace = true }
vs-prompts = { workspace = true }
vs-redaction = { workspace = true }
vs-sandbox = { workspace = true }
vs-sim = { workspace = true }
vs-slurm = { workspace = true }
