schema_version = 1
command = "/merge-scoped"
repository = "uw-syfi/vibesys"
base_branch = "main"
merge_method = "squash"
required_checks = ["pr-ci"]

[checks.pr-ci]
workflow_file = "test.yml"
job_name = "Required PR CI"

# Shared client libraries may be merged by the delegated client maintainers.
# Entry points, manifests, workflows, and broker policy stay on the maintainer path.
[capabilities.clients]
members = ["AyanBinRafaih", "Nano-AI"]
prefixes = [
  "clients/libs/run-state/src/",
  "clients/libs/transport/src/",
]
paths = []
additional_checks = []

[capabilities.server]
members = ["AyanBinRafaih", "Nano-AI"]
prefixes = [
  "src/server/",
  "tests/server/",
]
paths = [
  "tests/entrypoints/test_server.py",
]
additional_checks = []
