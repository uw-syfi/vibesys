schema_version = 1
command = "/merge-scoped"
repository = "uw-syfi/vibesys"
base_branch = "main"
merge_method = "squash"
required_checks = ["pr-ci"]

[checks.pr-ci]
workflow_file = "test.yml"
job_name = "Required PR CI"

# Keep shared manifests, dependency locks, entrypoint composition, workflows,
# and this broker's policy and implementation under the normal maintainer path.
[capabilities.tui]
members = ["AyanBinRafaih", "Nano-AI"]
prefixes = [
  "clients/backend-client/src/",
  "clients/core-state/src/",
  "clients/tui/dev/",
  "clients/tui/src/",
  "docs/contributing/tui/",
]
# TEMPORARY: old location of the TUI conventions doc, now
# docs/contributing/tui/conventions.md. Open PRs #691 and #719 still modify the
# old path until they merge main (git follows the rename). Drop this entry once
# both have merged.
paths = [
  "docs/contributing/tui-conventions.md",
]
additional_checks = []

[capabilities.server]
members = ["AyanBinRafaih", "Nano-AI"]
prefixes = [
  "src/server/",
  "tests/server/",
]
paths = [
  "tests/entrypoints/test_server.py",
]
additional_checks = []
