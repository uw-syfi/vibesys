name: P2 probe

on:
  push:
    branches: [ci/p2-probe]

jobs:
  bytecode:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.14
      - run: uv sync --dev --python 3.14
      - name: Hardware
        run: lscpu | grep -E "Model name"
      - name: Cold collection, parallel precompile, and what each saves
        env:
          VIBESYS_TEST_SHARD: 1/3
          COVERAGE_FILE: .coverage.probe
          COVERAGE_CORE: sysmon
        run: |
          clean() { find . -name __pycache__ -type d -not -path './clients/*' -prune -exec rm -rf {} + ; }
          collect() { /usr/bin/time -f "$1 wall %e s" uv run --no-sync python -m pytest --collect-only -q -n0 -p no:cacheprovider --cov-report= 2>&1 | grep -E "tests collected| wall "; }
          clean; collect "A cold"
          collect "A warm"
          clean
          /usr/bin/time -f "precompile (compileall -j4 venv+project) wall %e s" .venv/bin/python -m compileall -q -j 4 .venv/lib src libs sdk scripts tests packaging conftest.py > /dev/null
          collect "B after precompile (project and site-packages, no pytest rewrite)"
          collect "B warm"
          clean
          /usr/bin/time -f "precompile venv only wall %e s" .venv/bin/python -m compileall -q -j 4 .venv/lib > /dev/null
          collect "C after venv-only precompile"
          du -sk $(find . -name __pycache__ -type d -not -path './clients/*' -not -path './.venv/*') | awk '{s+=$1} END {print "project pycache KB", s}'
          du -sk $(find .venv -name __pycache__ -type d) | awk '{s+=$1} END {print "venv pycache KB", s}'
          tar --zstd -cf /tmp/pyc.tzst $(find . -name __pycache__ -type d -not -path './clients/*') && ls -la /tmp/pyc.tzst | awk '{print "compressed bytes", $5}'
