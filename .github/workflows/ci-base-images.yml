name: Mirror CI base images

on:
  push:
    paths:
      - 'scripts/ci_base_images.toml'
      - 'scripts/ci_base_images.py'
      - 'scripts/ci_mirror_base_images.sh'
      - '.github/workflows/ci-base-images.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-base-image-mirrors
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # A composite step cannot carry its own timeout, so the calling step bounds
      # a slow cache restore or a hung mirror.
      - name: Install the manifest-preserving registry copier
        timeout-minutes: 3
        uses: ./.github/actions/setup-runner-apt
        with:
          packages: skopeo

      - name: Mirror all pins without changing their digests
        env:
          GHCR_TOKEN: ${{ github.token }}
        run: ./scripts/ci_mirror_base_images.sh
