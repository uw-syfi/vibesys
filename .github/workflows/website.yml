name: Website

# Runs independently of the main Tests workflow, which ignores docs/** and
# *.md changes to avoid running the full backend matrix on doc-only edits.
# The Docusaurus docs plugin renders docs/ directly (no copy step) and
# sidebars.ts hardcodes doc ids against those filenames, so a docs/ change
# can break the site build without touching website/ at all.
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - '*.md'
      - 'scripts/check_doc_links.py'
      - 'scripts/check_doc_citations.py'
      - '.github/workflows/website.yml'
  pull_request:
    branches: [main]
    paths:
      - 'website/**'
      - 'docs/**'
      - '*.md'
      - 'scripts/check_doc_links.py'
      - 'scripts/check_doc_citations.py'
      - '.github/workflows/website.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Stdlib-only, so it needs no uv/dependency setup in this Node-only job.
      # Covers what the Docusaurus build cannot: absolute links back into this
      # repository, and Markdown outside docs/ that the site never renders.
      - name: Check Markdown links
        run: python3 scripts/check_doc_links.py

      # Also stdlib-only. Runs here as well as in the python_quality group
      # because the Tests workflow ignores docs/**, so a docs-only edit that
      # drifts a code citation would otherwise reach main ungated.
      - name: Check doc code citations
        run: python3 -m scripts.check_doc_citations

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Install website dependencies
        working-directory: website
        run: npm ci

      - name: Check TypeScript
        working-directory: website
        run: npm run typecheck

      - name: Build website
        working-directory: website
        run: npm run build
