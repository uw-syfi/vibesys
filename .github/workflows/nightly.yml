name: Nightly

# Full-strength runs of checks that the pull-request tier reduces to keep CI
# under five minutes. A failure here is a regression the PR tier could not see.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-properties:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      # VIBESYS_FULL_PROPERTIES=1 lifts the reduced Hypothesis example counts
      # that pull requests use (see tests/vibesys/orchestration/dynamic/loop/test_loop.py).
      - name: Run the full test suite at full property strength
        env:
          VIBESYS_FULL_PROPERTIES: '1'
        run: uv run python -m pytest -n auto --dist loadgroup --no-cov -q
