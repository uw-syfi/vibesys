name: Nightly

# Full-strength runs of checks that the pull-request tier reduces to keep CI
# under five minutes. A failure here is a regression the PR tier could not see.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-properties:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Randomized Hypothesis (conftest.py `nightly` profile), seeded by the run
      # number: every night draws new examples, and the seed replays them.
      HYPOTHESIS_PROFILE: nightly
      # Lifts the reduced example counts that pull requests use (see
      # tests/vibesys/orchestration/dynamic/loop/test_loop.py).
      VIBESYS_FULL_PROPERTIES: '1'
      # The fixed chaos baseline. The rotating window is the chaos-sweep job.
      CHAOS_SEEDS: 0-11,2018,2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      # The example database holds failing examples. Pull requests restore it
      # read-only (test.yml), so a failure found here replays there. A failing
      # job does not save a cache, hence the explicit save with `always()`.
      - name: Restore the Hypothesis example database
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hypothesis
          key: hypothesis-${{ github.run_id }}
          restore-keys: hypothesis-

      - name: Run the full test suite at full property strength
        shell: bash
        run: |
          uv run python -m pytest -n auto --dist loadgroup --no-cov -q \
            --hypothesis-seed="$GITHUB_RUN_NUMBER" 2>&1 | tee pytest.log

      - name: Save the Hypothesis example database
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hypothesis
          key: hypothesis-${{ github.run_id }}

      - name: Summarize the failure with a repro command
        if: failure()
        run: |
          ./scripts/nightly_failure_summary.sh pytest.log "Nightly full-properties" \
            "HYPOTHESIS_PROFILE=nightly VIBESYS_FULL_PROPERTIES=1 CHAOS_SEEDS=$CHAOS_SEEDS" \
            "PYTEST_ADDOPTS=--hypothesis-seed=$GITHUB_RUN_NUMBER" >> "$GITHUB_STEP_SUMMARY"

  # Seeds the pull-request tier never draws (see
  # tests/vibesys/orchestration/dynamic/loop/test_chaos.py). Each run sweeps a
  # window that no earlier run covered: run N starts at BASE + N * WINDOW, and
  # the window is split into contiguous per-shard ranges so wall time stays
  # bounded as the window grows. The seeds are above every hand-picked seed.
  chaos-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      CHAOS_BASE: 100000
      CHAOS_SHARD_SIZE: 100
      CHAOS_SHARDS: 4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Compute this shard's seed range
        run: |
          first=$((CHAOS_BASE + GITHUB_RUN_NUMBER * CHAOS_SHARDS * CHAOS_SHARD_SIZE + ${{ matrix.shard }} * CHAOS_SHARD_SIZE))
          echo "CHAOS_FIRST=$first" >> "$GITHUB_ENV"
          echo "Shard ${{ matrix.shard }} sweeps seeds $first-$((first + CHAOS_SHARD_SIZE - 1))"

      - name: Sweep the dynamic-loop chaos harness over the window
        shell: bash
        run: |
          ./scripts/chaos_dynamic_loop.sh "$CHAOS_SHARD_SIZE" "$CHAOS_FIRST" 2 2>&1 | tee chaos.log

      - name: Summarize the failure with a repro command
        if: failure()
        run: |
          ./scripts/nightly_failure_summary.sh chaos.log "Nightly chaos sweep (shard ${{ matrix.shard }}, seeds $CHAOS_FIRST-$((CHAOS_FIRST + CHAOS_SHARD_SIZE - 1)))" \
            "CHAOS_SEEDS=$CHAOS_FIRST" >> "$GITHUB_STEP_SUMMARY"
