name: Nightly

# Nightly-depth runs (`--depth=nightly`) of checks that the pull-request tier
# samples to keep CI short. A failure here is a regression the PR tier could not see.
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  full-depth:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Record when this job's cancel clock started
        run: echo "VIBESYS_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pass the pytest cancel deadline
        run: python3 scripts/pytest_job_deadline.py

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      # `--depth=nightly` is the one depth setting (vs-sim pytest plugin): every
      # crash point, the larger Hypothesis example counts, and the randomized
      # `nightly` Hypothesis profile (conftest.py), so each night explores new
      # inputs. The `slow` tests run in the `crash-sweep` job below.
      - name: Run the full test suite at nightly depth
        run: uv run python -m pytest --depth=nightly -m 'not slow and not native_build' -n auto --dist loadgroup --no-cov -q

      # A failure prints its `@reproduce_failure` blob (print_blob); the
      # artifact uploaded below holds the failing examples for replay.
      - name: Keep the failing examples
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hypothesis-examples
          path: .hypothesis/examples
          if-no-files-found: ignore

  # The exhaustive crash sweeps (`-m slow`), which a pull request deselects.
  crash-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Record when this job's cancel clock started
        run: echo "VIBESYS_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pass the pytest cancel deadline
        run: python3 scripts/pytest_job_deadline.py

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Run the slow crash sweeps at nightly depth
        run: uv run pytest --depth=nightly -m slow -n auto --no-cov

  # The real-system tiers (issue #1732) on main, a backstop for changes the
  # pull-request change filter (`real_tiers` in .repoctl/components.toml)
  # misses. A failed job fails the workflow. The minimal-container tier builds
  # the CPU base only; CUDA and ROCm bases are about 25 GB each to pull.
  real-tiers:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        group: [slurm_cluster_tests, minimal_container_tests]
    steps:
      - name: Record when this job's cancel clock started
        run: echo "VIBESYS_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Pass the pytest cancel deadline
        run: python3 scripts/pytest_job_deadline.py

      # The host-side job confinement the tier exercises needs bubblewrap; see
      # the sandbox-linux job for why the AppArmor userns restriction is lifted.
      - name: Install bubblewrap
        timeout-minutes: 3
        uses: ./.github/actions/setup-runner-apt
        with:
          packages: bubblewrap

      - name: Enable runner user namespaces
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Set up Go for repoctl
        uses: actions/setup-go@v5
        with:
          go-version-file: support/repoctl/go.mod
          cache-dependency-path: support/repoctl/go.sum

      - name: Run the tier
        env:
          VIBESYS_SLURM_CLUSTER_DIR: ${{ runner.temp }}/slurm-cluster
          VIBESYS_MINIMAL_CONTAINER_DIR: ${{ runner.temp }}/minimal-container
          VIBESYS_MINIMAL_CONTAINER_BASES: cpu,ubuntu-uid-1000
        run: ./support/repoctl/repoctl run-checks --group ${{ matrix.group }}

  # The Go property tests (testing/quick) with a fresh seed each night. A pull request runs them from a
  # seed fixed by each test's name (internal/propcheck in each module), so a result there is a pure
  # function of the code. A failure logs its seed and the command that reruns it; pin the failing
  # input as an example case so the pull-request tier replays it.
  go-properties:
    name: go-properties (${{ matrix.module }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        module: [cli, gateway, orchestrator, support/repoctl]
    env:
      VIBESYS_PROPERTY_SEED: random
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Run the module's Go tests with fresh property seeds
        working-directory: ${{ matrix.module }}
        run: go test -count=1 -timeout 1200s ./...

  # The published install path of vibesys-cli, run as a user runs it: the install script from main
  # against the live GitHub releases. No other workflow reads the releases after they are made, so a
  # missing or stale cli-latest (it is made only by a stable cli-v* tag, see cli-release.yml) or a
  # missing attestation shows up here within a day. No checkout: every step uses what a user has.
  cli-install:
    name: cli-install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
      # gh attestation verify reads the repository's attestations through the API.
      attestations: read
    strategy:
      fail-fast: false
      matrix:
        # Linux amd64 and macOS arm64; macos-15 is pinned rather than macos-latest so the
        # architecture cannot drift.
        os: [ubuntu-24.04, macos-15]
    env:
      INSTALL_URL: https://raw.githubusercontent.com/uw-syfi/vibesys/main/cli/install.sh
      LATEST_URL: https://github.com/uw-syfi/vibesys/releases/download/cli-latest
    # bash with pipefail: under the default shell, a failed curl piped into sh is an empty
    # script that succeeds.
    defaults:
      run:
        shell: bash
    steps:
      # The runner context is not available in job-level env.
      - name: Pick the install directories
        run: |
          echo "LATEST_DIR=$RUNNER_TEMP/cli-latest" >> "$GITHUB_ENV"
          echo "PINNED_DIR=$RUNNER_TEMP/cli-pinned" >> "$GITHUB_ENV"

      - name: Install the newest release as cli/README.md says
        run: curl -fsSL "$INSTALL_URL" | VIBESYS_CLI_INSTALL_DIR="$LATEST_DIR" sh

      - name: Check that it reports the version cli-latest publishes
        run: |
          expected="$(curl -fsSL "$LATEST_URL/VERSION")"
          reported="$("$LATEST_DIR/vibesys-cli" --version)"
          echo "cli-latest VERSION: $expected"
          echo "--version: $reported"
          # --version prints "vibesys-cli <version> (task schemas ...)".
          read -r _ got _ <<< "$reported"
          if [[ "$got" != "$expected" ]]; then
            echo "::error::the installed binary is $got, but cli-latest's VERSION is $expected"
            exit 1
          fi
          echo "VERSION=$expected" >> "$GITHUB_ENV"

      - name: Install the same version by number
        run: |
          curl -fsSL "$INSTALL_URL" | VIBESYS_CLI_VERSION="$VERSION" VIBESYS_CLI_INSTALL_DIR="$PINNED_DIR" sh
          read -r _ got _ <<< "$("$PINNED_DIR/vibesys-cli" --version)"
          [[ "$got" == "$VERSION" ]] || { echo "::error::the pinned install is $got, want $VERSION"; exit 1; }

      - name: Check that upgrade finds the fresh install up to date
        run: |
          out="$("$LATEST_DIR/vibesys-cli" upgrade)"
          echo "$out"
          [[ "$out" == "vibesys-cli $VERSION is up to date" ]] || { echo "::error::upgrade said: $out"; exit 1; }

      # The binary was built and attested by cli-release.yml in this repository, not merely
      # matched against a checksum served beside it.
      - name: Verify the build attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh attestation verify "$LATEST_DIR/vibesys-cli" --repo uw-syfi/vibesys \
            --signer-workflow uw-syfi/vibesys/.github/workflows/cli-release.yml

      # The smallest real use: a throwaway repository with a host task (no Dockerfile, so no docker),
      # a check job and a command job, each through the daemon the client starts on demand.
      - name: Run a check and a command job end to end
        working-directory: ${{ runner.temp }}
        run: |
          mkdir -p smoke/.vibesys/tasks/smoke
          cd smoke
          git init -q -b main
          printf 'committed\n' > src.txt
          cat > .vibesys/tasks/smoke/vibesys.input.toml <<'TOML'
          version = "0.1"
          backends = ["cpu"]

          [accuracy]
          command = ['sh', '-c', 'test "$(cat ${PROJECT_ROOT}/src.txt)" = committed']
          timeout_seconds = 60

          [benchmark]
          command = ['sh', '-c', 'printf "{\"ops\": 1}" > "$2"', 'sh']
          timeout_seconds = 60

          [benchmark.result]
          json_argument = "--out"
          metric = "ops"
          TOML
          printf '[[objective]]\nname = "ops"\ndirection = "max"\n' > .vibesys/tasks/smoke/objectives.toml
          git add -A
          git -c user.name=ci -c user.email=ci@example.com -c commit.gpgsign=false commit -q -m task
          export VIBESYS_TASK=smoke
          "$LATEST_DIR/vibesys-cli" submit check HEAD --wait
          "$LATEST_DIR/vibesys-cli" submit command HEAD --env host --wait -- sh -c 'test -f src.txt'

      - name: Stop the daemon
        if: always()
        working-directory: ${{ runner.temp }}
        run: |
          if [[ -x "$LATEST_DIR/vibesys-cli" ]]; then "$LATEST_DIR/vibesys-cli" daemon stop || true; fi

  # The fast-check property tests of the TypeScript clients (desktop, ui) with a fresh seed each
  # night. A pull request runs them with a fixed seed (clients/tools/scripts/property_seed.mjs),
  # so a counterexample found here is a new input and not a flake. A failure prints fast-check's
  # `{ seed, path }`; replay it with VIBESYS_PROPERTY_SEED=<seed> VIBESYS_PROPERTY_PATH=<path>.
  ts-property-seeds:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up the client workspace
        uses: ./.github/actions/setup-clients

      - name: Run the property tests with a fresh seed
        working-directory: clients
        env:
          VIBESYS_PROPERTY_SEED: random
        # The packages that depend on fast-check; check_test_runners.mjs holds them to the
        # seeding runners.
        run: pnpm --filter ./apps/desktop --filter ./libs/ui run test
