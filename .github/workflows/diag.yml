name: Diag
on:
  push:
    branches: [tmp/ci-hang-diag]
jobs:
  per-file:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        file: ["libs/vs-project/tests/test_errors.py", "libs/vs-project/tests/test_git_tracker_guards.py", "libs/vs-project/tests/test_state_guards.py", "tests/packaging/test_fetch_bun.py", "tests/vibesys/agents/drivers/test_omnigent_errors.py", "tests/vibesys/agents/drivers/test_omnigent_mcp.py", "tests/vibesys/loops/agent/test_loop_guards.py", "tests/vibesys/loops/agent/test_state_validation_errors.py", "tests/vibesys/loops/evolve/test_evolve_failure_paths.py", "tests/vibesys/loops/test_gates.py", "tests/vibesys/loops/test_request_protocols.py", "tests/vibesys/run/test_round_transaction.py", "tests/vibesys/run/test_round_transaction_errors.py", "tests/vibesys/sandbox/test_command_translation.py", "tests/vibesys/sandbox/test_modal_evaluator.py", "tests/vibesys/sandbox/test_run_environment.py", "tests/vibesys/skypilot/test_bridge.py", "tests/vibesys/skypilot/test_evaluator_helper_frames.py", "tests/vibesys/skypilot/test_recovery.py", "tests/vibesys/skypilot/test_runner.py", "tests/vibesys/test_evaluator_packages.py", "tests/vibesys/test_input_manifest_validation.py", "tests/vibesys/test_profilers.py", "tests/vibesys/test_project_provisioning.py", "tests/vibesys/test_workspace.py"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.12
      - run: uv sync --dev
      - name: Run one file
        timeout-minutes: 5
        run: uv run python -m pytest ${{ matrix.file }} -n 2 -p no:tach --no-cov -q -p no:cacheprovider
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.12
      - run: uv sync --dev
      - name: Everything except the new files
        timeout-minutes: 9
        run: uv run python -m pytest -n auto --dist loadgroup -p no:tach --no-cov -q -p no:cacheprovider --ignore=libs/vs-project/tests/test_errors.py --ignore=libs/vs-project/tests/test_git_tracker_guards.py --ignore=libs/vs-project/tests/test_state_guards.py --ignore=tests/packaging/test_fetch_bun.py --ignore=tests/vibesys/agents/drivers/test_omnigent_errors.py --ignore=tests/vibesys/agents/drivers/test_omnigent_mcp.py --ignore=tests/vibesys/loops/agent/test_loop_guards.py --ignore=tests/vibesys/loops/agent/test_state_validation_errors.py --ignore=tests/vibesys/loops/evolve/test_evolve_failure_paths.py --ignore=tests/vibesys/loops/test_gates.py --ignore=tests/vibesys/loops/test_request_protocols.py --ignore=tests/vibesys/run/test_round_transaction.py --ignore=tests/vibesys/run/test_round_transaction_errors.py --ignore=tests/vibesys/sandbox/test_command_translation.py --ignore=tests/vibesys/sandbox/test_modal_evaluator.py --ignore=tests/vibesys/sandbox/test_run_environment.py --ignore=tests/vibesys/skypilot/test_bridge.py --ignore=tests/vibesys/skypilot/test_evaluator_helper_frames.py --ignore=tests/vibesys/skypilot/test_recovery.py --ignore=tests/vibesys/skypilot/test_runner.py --ignore=tests/vibesys/test_evaluator_packages.py --ignore=tests/vibesys/test_input_manifest_validation.py --ignore=tests/vibesys/test_profilers.py --ignore=tests/vibesys/test_project_provisioning.py --ignore=tests/vibesys/test_workspace.py
