name: Diag
on:
  push:
    branches: [tmp/ci-hang-diag]
jobs:
  full-cov-without-file:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        drop: ["libs/vs-project/tests/test_state_guards.py", "tests/vibesys/loops/agent/test_state_validation_errors.py", "tests/vibesys/run/test_round_transaction_errors.py", "tests/vibesys/skypilot/test_evaluator_helper_frames.py", "tests/vibesys/test_profilers.py"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv python install 3.12
      - run: uv sync --dev
      - name: Full suite with coverage, ignoring one file
        timeout-minutes: 9
        run: uv run python -m pytest -v -n auto --dist loadgroup -p no:cacheprovider --cov-report=xml --cov-report=json --cov-fail-under=0 --ignore=${{ matrix.drop }}
