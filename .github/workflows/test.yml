name: Tests

on:
  push:
    branches: [main]
    # Skip CI for pure-documentation changes. Only root-level Markdown and the
    # docs/ tree are ignored; Markdown under resources/skills/ and test fixtures
    # is consumed by prompt/skill snapshot tests, so it is deliberately not
    # listed here. A change touching any non-doc file still runs the full
    # matrix (paths-ignore skips only when every changed file matches).
    paths-ignore:
      - '*.md'
      - 'docs/**'
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'

jobs:
  format:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Check Python formatting
        run: ./scripts/check_format.sh

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Check Python lint
        run: ./scripts/check_lint.sh

  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Check Python types
        run: ./scripts/check_types.sh

  tui:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.11.0

      - name: Set up verified Bun 1.3.9 for OpenTUI
        run: |
          python3 scripts/fetch_bun.py --target linux-x86_64 --output "$RUNNER_TEMP/bun/bin/bun"
          echo "$RUNNER_TEMP/bun/bin" >> "$GITHUB_PATH"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Python dependencies
        run: uv sync --dev

      - name: Install TUI dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript formatting and lint
        run: pnpm check:ts

      - name: Test repository launcher
        run: uv run vibesys --headless --help >/dev/null

      - name: Check generated protocol bindings
        run: |
          pnpm --dir clients/tui generate:protocol
          git diff --exit-code -- clients/tui/src/generated/protocol.schema.json clients/tui/src/generated/protocol.generated.ts

      - name: Check TypeScript
        run: pnpm --dir clients/tui check

      - name: Test TUI
        run: pnpm --dir clients/tui test

      - name: Build TUI
        run: pnpm --dir clients/tui build

  queue-native:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: examples/evaluators/queue/go.mod
          cache-dependency-path: |
            examples/evaluators/queue/go.sum
            examples/evaluators/microservice/go.sum
            examples/evaluators/priority-queue/go.sum

      - name: Install managed-candidate containment dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.78.0
        with:
          components: clippy, rustfmt

      - name: Check native runner formatting
        working-directory: examples/evaluators/queue/native_runner
        run: cargo fmt -- --check

      - name: Lint native runner
        working-directory: examples/evaluators/queue/native_runner
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test native runner
        working-directory: examples/evaluators/queue/native_runner
        run: cargo test --locked

      - name: Check starter formatting
        working-directory: examples/starters/queue-rs
        run: cargo fmt -- --check

      - name: Lint starter
        working-directory: examples/starters/queue-rs
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test starter
        working-directory: examples/starters/queue-rs
        run: cargo test --locked

      - name: Test queue evaluator
        working-directory: examples/evaluators/queue
        run: go test -race ./...

      - name: Check priority-queue native runner formatting
        working-directory: examples/evaluators/priority-queue/native_runner
        run: cargo fmt -- --check

      - name: Lint priority-queue native runner
        working-directory: examples/evaluators/priority-queue/native_runner
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test priority-queue native runner
        working-directory: examples/evaluators/priority-queue/native_runner
        run: cargo test --locked

      - name: Check priority-queue starter formatting
        working-directory: examples/starters/priority-queue-rs
        run: cargo fmt -- --check

      - name: Lint priority-queue starter
        working-directory: examples/starters/priority-queue-rs
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test priority-queue starter
        working-directory: examples/starters/priority-queue-rs
        run: cargo test --locked

      - name: Test priority-queue evaluator
        working-directory: examples/evaluators/priority-queue
        run: go test -race ./...

      - name: Test microservice evaluator
        working-directory: examples/evaluators/microservice
        env:
          VIBESYS_REQUIRE_MANAGED_CANDIDATE_TESTS: "1"
        run: go test -race ./...

      - name: Validate microservice workloads
        working-directory: examples/evaluators/microservice
        run: |
          go run ./cmd/servicebench --workload ../../microservices/train-ticket/benchmark/workload.toml --validate-only
          go run ./cmd/servicebench --mode accuracy --workload ../../microservices/train-ticket/benchmark/workload.toml --validate-only
          go run ./cmd/servicebench --workload ../../microservices/train-ticket/benchmark/workload.toml --profile offered-load --validate-only
          go run ./cmd/servicebench --workload ../../microservices/social-network-read-timeline/benchmark/workload.toml --validate-only
          go run ./cmd/servicebench --workload ../../microservices/hotel-reservation/benchmark/workload.toml --telemetry-command-json '["go","run","./cmd/otelcapture","--input-json","../../metrics/otel/traces.otlp.ndjson","--settle-seconds","5"]' --telemetry-output ../../metrics/telemetry.json --telemetry-timeout 60 --validate-only
          go run ./cmd/servicebench --mode accuracy --workload ../../microservices/hotel-reservation/benchmark/workload.toml --validate-only

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        # `addopts` in pyproject.toml already sets `--cov --cov-report=term-missing`
        # against the source list in `[tool.coverage.run]` (vibesys, vs_feature_flags,
        # vs_github, vs_issue_board, vs_sandbox). Add the report formats CI needs on
        # top of that instead of repeating `--cov=...` for each package.
        run: uv run python -m pytest -v --cov-report=xml --cov-report=json --cov-fail-under=75

      - name: Enforce per-module coverage floor
        # Repo-wide --cov-fail-under is an average and can't see a single
        # near-zero module hiding inside it (issue #298). Reads the floor and
        # allowlist from [tool.vibesys.per_module_coverage] in pyproject.toml.
        run: uv run python scripts/check_coverage_floor.py coverage.json

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml

  # Exercises the real Linux workspace-confinement boundary (issue #149). The
  # main `test` job skips these (no bubblewrap), so this job installs it and
  # forces the tests to run — VIBESYS_REQUIRE_SANDBOX_TESTS=1 turns a missing or
  # broken sandbox into a failure instead of a silent skip.
  sandbox-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor;
          # relax it so bwrap can create the namespace on the runner.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Run workspace-confinement tests
        env:
          VIBESYS_REQUIRE_SANDBOX_TESTS: "1"
        run: uv run python -m pytest tests/_agent_cli/test_hostsandbox.py -v

  # macOS counterpart of sandbox-linux: exercises the Seatbelt confinement
  # boundary on a real macOS host. sandbox-exec ships with macOS, so no install
  # step is needed; VIBESYS_REQUIRE_SANDBOX_TESTS=1 forces the Seatbelt test to
  # run (and fail loudly) rather than skip.
  sandbox-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Run workspace-confinement tests
        env:
          VIBESYS_REQUIRE_SANDBOX_TESTS: "1"
        run: uv run python -m pytest tests/_agent_cli/test_hostsandbox.py -v

  patch-coverage:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Download coverage report
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-xml

      - name: Check patch coverage
        run: uv run diff-cover coverage.xml --compare-branch=origin/${{ github.base_ref }} --fail-under=80
