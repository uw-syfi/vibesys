name: Tests

on:
  push:
    branches: [main]
    # Skip CI for changes that can't affect backend correctness:
    # pure-documentation changes and the Docusaurus site (checked separately
    # by website.yml). Root-level Markdown, docs/, website/, and the website
    # workflow itself are ignored by exact name, not `.github/workflows/**`,
    # so edits to this workflow (or publish.yml) still run the full matrix.
    # Markdown under resources/skills/ and test fixtures is consumed by
    # prompt/skill snapshot tests, so it is deliberately not listed here. A
    # change touching any non-ignored file still runs the full matrix
    # (paths-ignore skips only when every changed file matches).
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'website/**'
      - '.github/workflows/website.yml'
  pull_request:
    branches: [main]
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'website/**'
      - '.github/workflows/website.yml'

env:
  # Wall-clock budget for a whole run, enforced as a warning by `ci-budget`
  # below (issue #474). Kept here so raising or lowering the budget is a
  # one-line change and the guard and the documentation can't disagree.
  CI_WALL_TIME_BUDGET_SECONDS: '300'

jobs:
  # The workflow-level `paths-ignore` above already skips everything for
  # docs-only changes. This job covers the case it deliberately cannot express:
  # which *parts* of the tree a non-doc change can affect. It is the only place
  # that decides, so a new job opts in by reading one of these outputs.
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      tui: ${{ steps.filter.outputs.tui }}
      examples: ${{ steps.filter.outputs.examples }}
      agent_image: ${{ steps.filter.outputs.agent_image }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            # Ruff and ty never read clients/, so a change confined to the
            # TypeScript workspace cannot change their verdict. Everything else
            # (including this workflow) does.
            python:
              - '**'
              - '!clients/**'
            # Mirrors the rebuild watch set the repository launcher uses in
            # src/entrypoints/launcher.py: the TUI is affected by the TypeScript
            # workspace itself and by the Python modules that feed the
            # generated protocol bindings, and by nothing else.
            tui:
              - 'clients/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'src/server/api/schema.py'
              - 'src/server/events.py'
              - 'src/server/api/protocol.py'
              - 'src/server/controller.py'
              - 'src/server/diagnostics.py'
              - 'src/server/settings.py'
              - 'scripts/fetch_bun.py'
              - 'scripts/check_ts_architecture.test.mjs'
              - 'scripts/check_ts_package_manifests.mjs'
              - '.github/workflows/test.yml'
            # What `validate-examples` checks: the example repositories
            # themselves (a submodule bump shows up as a change to the gitlink
            # path under examples/), the two validators, and the fetcher that
            # materializes the overlays.
            examples:
              - 'examples/**'
              - '.gitmodules'
              - 'src/entrypoints/headless.py'
              - 'src/vibesys/input_manifest.py'
              - 'src/vibesys/evaluators/**'
              - 'resources/evaluators/microservice/**'
              - 'scripts/example_repositories.py'
              - 'tests/vibesys/test_microservice_inputs.py'
              - 'tests/vibesys/test_input_sources.py'
              - '.github/workflows/test.yml'
            # The agent image build: its Dockerfile, the module that builds
            # it, and the version pins it takes as build args.
            agent_image:
              - 'src/vibesys/sandbox/images/**'
              - 'src/vibesys/sandbox/images.py'
              - 'src/vibesys/agents/provider_policy.py'
              - '.github/workflows/test.yml'

  # One environment setup for every cheap Python check. Issue #89 split these
  # apart so a failure names the check that failed; each check is still its own
  # step, so the failing step, its log, and the red annotation stay exactly as
  # attributable as they were when each check owned a runner.
  python-checks:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          # Narrower than the action's default glob, which also keys on every
          # pyproject.toml and requirements.txt in the tree: `uv sync` installs
          # exactly what uv.lock pins, so a pyproject edit that doesn't move the
          # lock should keep hitting the same cache entry.
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Check Python formatting
        run: ./scripts/check_format.sh

      - name: Check Python lint
        run: ./scripts/check_lint.sh

      - name: Check Python package boundaries
        run: uv run lint-imports

      # docs/ and root Markdown are covered by website.yml, which this
      # workflow's paths-ignore hands off to. This pass catches the rest:
      # Markdown under src/, resources/, clients/, and examples/.
      - name: Check Markdown links
        run: python3 scripts/check_doc_links.py

      # Lived in the `tui` job, which now skips for Python-only changes. It
      # exercises the Python entry point rather than anything TypeScript, so it
      # belongs with the other Python checks.
      - name: Test repository launcher
        run: uv run vibesys --headless --help >/dev/null

  # Fully independent: no `needs:`, so it starts with the run rather than after
  # the filter, and nothing waits on it. Type checking is not sequenced with
  # anything else, and at ~20s it is not worth a filter's latency.
  typecheck:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Check Python types
        run: ./scripts/check_types.sh

  tui:
    needs: changes
    if: needs.changes.outputs.tui == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.11.0

      # Resolved after pnpm exists rather than hardcoded: the store location is
      # pnpm's to choose, and a wrong path caches an empty directory silently.
      - name: Locate the pnpm store
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          # A lockfile bump usually changes a handful of packages, so an older
          # store is still worth most of its download cost.
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Set up verified Bun 1.3.9 for OpenTUI
        run: |
          python3 scripts/fetch_bun.py --target linux-x86_64 --output "$RUNNER_TEMP/bun/bin/bun"
          echo "$RUNNER_TEMP/bun/bin" >> "$GITHUB_PATH"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Python dependencies
        run: uv sync --dev

      - name: Install TUI dependencies
        run: pnpm install --frozen-lockfile

      - name: Check TypeScript formatting and lint
        run: pnpm check:ts

      - name: Check TypeScript package boundaries
        run: pnpm check:ts-architecture

      - name: Check generated protocol bindings
        run: |
          pnpm --dir clients/backend-client generate:protocol
          git diff --exit-code -- clients/backend-client/src/generated/protocol.schema.json clients/backend-client/src/generated/protocol.generated.ts

      - name: Check TypeScript packages
        run: pnpm check:clients

      - name: Test TypeScript packages
        run: pnpm test:clients

      - name: Build TypeScript packages
        run: pnpm build:clients

      - name: Smoke-test packed public TUI package
        run: |
          pack_dir="$RUNNER_TEMP/vibesys-tui-pack"
          install_dir="$RUNNER_TEMP/vibesys-tui-install"
          mkdir -p "$pack_dir" "$install_dir"
          pnpm --dir clients/tui pack --pack-destination "$pack_dir"
          npm install --prefix "$install_dir" --ignore-scripts "$pack_dir"/*.tgz
          test -f "$install_dir/node_modules/@vibesys/tui/node_modules/@vibesys/backend-client/dist/index.js"
          test -f "$install_dir/node_modules/@vibesys/tui/node_modules/@vibesys/core-state/dist/index.js"
          bun "$install_dir/node_modules/@vibesys/tui/dist/self-test.js"

      - name: Smoke-test deployed TUI workspace packages
        run: |
          deploy_dir="$RUNNER_TEMP/vibesys-tui-deploy"
          pnpm --config.node-linker=hoisted --filter @vibesys/tui deploy --prod "$deploy_dir"
          test -f "$deploy_dir/node_modules/@vibesys/backend-client/dist/index.js"
          test -f "$deploy_dir/node_modules/@vibesys/core-state/dist/index.js"
          bun "$deploy_dir/dist/self-test.js"

  queue-native:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: resources/evaluators/queue/go.mod
          cache-dependency-path: |
            resources/evaluators/queue/go.sum
            resources/evaluators/microservice/go.sum
            examples/evaluators/priority-queue/go.sum

      # Bounded because an apt mirror or a service-restart prompt makes this
      # hang rather than fail: three runs on this branch sat here for tens of
      # minutes each and never reached a test. A timeout turns that into a
      # legible failure in minutes instead of a job that burns hours.
      - name: Install managed-candidate containment dependency
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.78.0
        with:
          components: clippy, rustfmt

      - name: Check native runner formatting
        working-directory: resources/evaluators/queue/native_runner
        run: cargo fmt -- --check

      - name: Lint native runner
        working-directory: resources/evaluators/queue/native_runner
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test native runner
        working-directory: resources/evaluators/queue/native_runner
        run: cargo test --locked

      - name: Check queue candidate formatting
        working-directory: examples/data-structures/repositories/queue-rs
        run: cargo fmt -- --check

      - name: Lint queue candidate
        working-directory: examples/data-structures/repositories/queue-rs
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test queue candidate
        working-directory: examples/data-structures/repositories/queue-rs
        run: cargo test --locked

      # The SDK is consumed by `go get`, so a module path that disagrees with
      # its directory fails only for outside consumers and never for us.
      - name: Check evaluator SDK module path
        run: |
          declared=$(sed -n 's/^module //p' sdk/vs-evaluator/vseval/go.mod)
          expected=github.com/uw-syfi/vibesys/sdk/vs-evaluator/vseval
          if [ "$declared" != "$expected" ]; then
            echo "go.mod declares $declared but its directory requires $expected"
            exit 1
          fi

      - name: Test evaluator SDK
        working-directory: sdk/vs-evaluator/vseval
        run: go test -race ./...

      - name: Test queue evaluator
        working-directory: resources/evaluators/queue
        run: go test -race ./...

      - name: Check priority-queue native runner formatting
        working-directory: examples/evaluators/priority-queue/native_runner
        run: cargo fmt -- --check

      - name: Lint priority-queue native runner
        working-directory: examples/evaluators/priority-queue/native_runner
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test priority-queue native runner
        working-directory: examples/evaluators/priority-queue/native_runner
        run: cargo test --locked

      - name: Check priority-queue starter formatting
        working-directory: examples/starters/priority-queue-rs
        run: cargo fmt -- --check

      - name: Lint priority-queue starter
        working-directory: examples/starters/priority-queue-rs
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test priority-queue starter
        working-directory: examples/starters/priority-queue-rs
        run: cargo test --locked

      - name: Test priority-queue evaluator
        working-directory: examples/evaluators/priority-queue
        run: go test -race ./...

      - name: Test microservice evaluator
        working-directory: resources/evaluators/microservice
        env:
          VIBESYS_REQUIRE_MANAGED_CANDIDATE_TESTS: "1"
        run: go test -race ./...

  # Owns everything that needs a repository-native example's `.vibesys` overlay,
  # so no other job pays for one. It fetches the overlay alone (blob-filtered,
  # depth-1, sparse) at the pinned gitlink rather than checking the submodule
  # out: ~7s and ~8MB for all four examples, against ~95s for one full
  # submodule clone.
  #
  # Data-driven over .gitmodules and over each overlay's own tasks, so a new
  # example repository or a new task needs no edit here. The `servicebench`
  # workload checks below stay explicit because their flags differ per task.
  validate-examples:
    needs: changes
    if: needs.changes.outputs.examples == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: resources/evaluators/microservice/go.mod
          cache-dependency-path: resources/evaluators/microservice/go.sum

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Fetch repository-native example overlays
        run: uv run python scripts/example_repositories.py

      - name: Validate example tasks
        run: |
          set -euo pipefail
          for manifest in examples/*/repositories/*/.vibesys/tasks/*/vibesys.input.toml; do
            repository="${manifest%%/.vibesys/*}"
            task="$(basename "$(dirname "$manifest")")"
            echo "::group::$repository --task $task"
            uv run python -m entrypoints.headless validate "$repository" --task "$task"
            echo "::endgroup::"
          done

      # The overlay is present here and nowhere else, so force the module to
      # fail rather than skip if the fetch above ever stops producing it.
      - name: Check microservice input contracts
        env:
          VIBESYS_REQUIRE_EXAMPLE_OVERLAYS: "1"
        run: uv run python -m pytest tests/vibesys/test_microservice_inputs.py tests/vibesys/test_input_sources.py -v --no-cov

      - name: Validate microservice workloads
        working-directory: resources/evaluators/microservice
        run: |
          go run ./cmd/servicebench --workload "$GITHUB_WORKSPACE/examples/microservices/train-ticket/benchmark/workload.toml" --validate-only
          go run ./cmd/servicebench --mode accuracy --workload "$GITHUB_WORKSPACE/examples/microservices/train-ticket/benchmark/workload.toml" --validate-only
          go run ./cmd/servicebench --workload "$GITHUB_WORKSPACE/examples/microservices/train-ticket/benchmark/workload.toml" --profile offered-load --validate-only
          go run ./cmd/servicebench --workload "$GITHUB_WORKSPACE/examples/microservices/repositories/deathstarbench/.vibesys/tasks/social-network-read-timeline/benchmark/workload.toml" --validate-only
          go run ./cmd/servicebench --workload "$GITHUB_WORKSPACE/examples/microservices/repositories/deathstarbench/.vibesys/tasks/hotel-reservation/benchmark/workload.toml" --telemetry-command-json '["go","run","./cmd/otelcapture","--input-json","/tmp/vibesys-hotel-traces.otlp.ndjson","--settle-seconds","5"]' --telemetry-output /tmp/vibesys-hotel-telemetry.json --telemetry-timeout 60 --validate-only
          go run ./cmd/servicebench --mode accuracy --workload "$GITHUB_WORKSPACE/examples/microservices/repositories/deathstarbench/.vibesys/tasks/hotel-reservation/benchmark/workload.toml" --validate-only

  # Builds the CPU agent image for real and runs every shipped CLI inside it
  # as the non-root `agent` user (issue #675). ubuntu-latest ships Docker, so
  # no separate engine setup is needed. Filtered narrowly: only a change that
  # can actually change the image's contents pays for this job's build time.
  agent-image:
    needs: changes
    if: needs.changes.outputs.agent_image == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Build the CPU agent image and run every shipped CLI in it
        env:
          VIBESYS_E2E_DOCKER: "1"
        run: uv run pytest tests/e2e/test_agent_image_e2e.py -v -s --no-cov

  # Deliberately unfiltered: several tests read clients/ directly (packaging,
  # theme, and distribution tests), so a TypeScript-only change still needs
  # this job.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --dev

      - name: Run tests
        # `addopts` in pyproject.toml already sets `--cov --cov-report=term-missing`
        # against the source list in `[tool.coverage.run]` (vibesys, vs_feature_flags,
        # vs_github, vs_issue_board, vs_sandbox). Add the report formats CI needs on
        # top of that instead of repeating `--cov=...` for each package.
        #
        # `-n auto` fans the suite across the runner's cores; pytest-cov
        # collects per worker and combines, so the two `--cov-fail-under`
        # gates below still measure the whole suite. `--dist loadgroup` keeps
        # each `xdist_group` on one worker, which is what the `serial` marker
        # in conftest.py relies on. `--durations` keeps the slowest tests
        # visible in every run instead of needing a local bisect.
        run: >-
          uv run python -m pytest -v -n auto --dist loadgroup --durations=25
          --cov-report=xml --cov-report=json --cov-fail-under=75

      - name: Enforce per-module coverage floor
        # Repo-wide --cov-fail-under is an average and can't see a single
        # near-zero module hiding inside it (issue #298). Reads the floor and
        # allowlist from [tool.vibesys.per_module_coverage] in pyproject.toml.
        run: uv run python scripts/check_coverage_floor.py coverage.json

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml

      # Was its own `needs: test` job, which put a second checkout, uv install,
      # dependency sync, and artifact download on the critical path after the
      # longest job in the run just to spend a few seconds in diff-cover. This
      # job already has the full history and the coverage report it needs.
      - name: Check patch coverage
        if: github.event_name == 'pull_request'
        run: uv run diff-cover coverage.xml --compare-branch=origin/${{ github.base_ref }} --fail-under=80

  # Exercises the real Linux workspace-confinement boundary (issue #149). The
  # main `test` job skips these (no bubblewrap), so this job installs it and
  # forces the tests to run — VIBESYS_REQUIRE_SANDBOX_TESTS=1 turns a missing or
  # broken sandbox into a failure instead of a silent skip.
  sandbox-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Bounded for the same reason as the containment-dependency install in
      # `queue-native`: this apt install intermittently hangs on these runners
      # instead of failing, and an unbounded step reports nothing while it
      # burns the job's budget.
      - name: Install bubblewrap
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor;
          # relax it so bwrap can create the namespace on the runner.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Run workspace-confinement tests
        env:
          VIBESYS_REQUIRE_SANDBOX_TESTS: "1"
        run: uv run python -m pytest tests/vibesys/agents/test_hostsandbox.py -v

  # macOS counterpart of sandbox-linux: exercises the Seatbelt confinement
  # boundary on a real macOS host. sandbox-exec ships with macOS, so no install
  # step is needed; VIBESYS_REQUIRE_SANDBOX_TESTS=1 forces the Seatbelt test to
  # run (and fail loudly) rather than skip.
  sandbox-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Run workspace-confinement tests
        env:
          VIBESYS_REQUIRE_SANDBOX_TESTS: "1"
        run: uv run python -m pytest tests/vibesys/agents/test_hostsandbox.py -v

  # Reports the run's wall time against CI_WALL_TIME_BUDGET_SECONDS (issue
  # #474). Warns rather than fails: a green run that is merely slow should still
  # be mergeable, and macOS runner queueing can push a run over the budget for
  # reasons no workflow change can fix, so the summary reports queue time
  # separately from execution time.
  #
  # `typecheck` is deliberately absent from `needs` so that nothing in this
  # workflow sequences it. It still appears in the table: the step reads every
  # job of the run from the API, not just the ones listed here, and at ~20s it
  # has long finished by the time the jobs below have.
  ci-budget:
    needs:
      - changes
      - python-checks
      - tui
      - queue-native
      - validate-examples
      - agent-image
      - test
      - sandbox-linux
      - sandbox-macos
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Report wall time against the budget
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          BUDGET_SECONDS: ${{ env.CI_WALL_TIME_BUDGET_SECONDS }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.created_at' > run_created.txt
          # This job is still running, so its own row has an empty
          # completed_at and drops out of the wall-time math below.
          gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" --paginate \
            --jq '.jobs[] | [.name, (.conclusion // ""), (.started_at // ""), (.completed_at // "")] | @tsv' \
            > jobs.tsv
          python3 - <<'PY'
          import os
          from datetime import datetime
          from pathlib import Path

          def moment(value: str) -> datetime | None:
              return datetime.fromisoformat(value.replace("Z", "+00:00")) if value else None

          budget = int(os.environ["BUDGET_SECONDS"])
          created = moment(Path("run_created.txt").read_text().strip())
          assert created is not None

          rows = []
          for line in Path("jobs.tsv").read_text().splitlines():
              name, conclusion, started, completed = line.split("\t")
              # Skipped jobs report a completed_at that precedes their
              # started_at, and they cost the run nothing.
              start, end = moment(started), moment(completed)
              if start is None or end is None or conclusion == "skipped":
                  continue
              rows.append((
                  name,
                  conclusion,
                  (start - created).total_seconds(),
                  (end - start).total_seconds(),
                  (end - created).total_seconds(),
              ))

          if not rows:
              print("Every job in this run was skipped; nothing to measure.")
              raise SystemExit(0)

          rows.sort(key=lambda row: row[4], reverse=True)
          wall = rows[0][4]
          slowest, _, slowest_queue, slowest_run, _ = rows[0]

          lines = [
              f"## CI wall time: {wall:.0f}s (budget {budget}s)",
              "",
              "Measured from the run's `created_at` to the last job's `completed_at`,"
              " which is what a reviewer waiting on the run experiences.",
              "",
              "| job | result | queued (s) | ran (s) | finished at (s) |",
              "| --- | --- | ---: | ---: | ---: |",
          ]
          for name, conclusion, queued, ran, finished in rows:
              lines.append(
                  f"| {name} | {conclusion or 'n/a'} | {queued:.0f} | {ran:.0f} | {finished:.0f} |"
              )
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(lines) + "\n")

          if wall > budget:
              print(
                  f"::warning title=CI over wall-time budget::Run took {wall:.0f}s against a"
                  f" {budget}s budget. Long pole: {slowest} ({slowest_queue:.0f}s queued,"
                  f" {slowest_run:.0f}s running)."
              )
          else:
              print(f"Run took {wall:.0f}s, within the {budget}s budget.")
          PY
