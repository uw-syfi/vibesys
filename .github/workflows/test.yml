name: Tests

on:
  push:
    branches: [main]
    # Post-merge CI can still skip pure documentation and website changes.
    # Pull-request CI always runs below so Required PR CI is always reported.
    paths-ignore:
      - '*.md'
      - 'docs/**'
      - 'website/**'
      - '.github/workflows/website.yml'
  pull_request:
    branches: [main]
  # GitHub merge queue: Required PR CI must report on the queue's temporary
  # gh-readonly-queue/... branch or the queue waits for it until timeout.
  merge_group:
    types: [checks_requested]

env:
  # Wall-clock budget for a whole run, enforced as a warning by `ci-budget`
  # below (issue #474). Kept here so raising or lowering the budget is a
  # one-line change and the guard and the documentation can't disagree.
  CI_WALL_TIME_BUDGET_SECONDS: '300'

jobs:
  # This job decides which parts of the tree a change can affect. The workflow
  # itself always runs so Required PR CI is always reported; expensive jobs opt
  # in by reading these outputs and can skip for documentation-only changes.
  changes:
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      tui: ${{ steps.filter.outputs.tui }}
      examples: ${{ steps.filter.outputs.examples }}
      agent_image: ${{ steps.filter.outputs.agent_image }}
      evaluators: ${{ steps.filter.outputs.evaluators }}
      native_targets: ${{ steps.filter.outputs.native_targets }}
      native_languages: ${{ steps.filter.outputs.native_languages }}
      pnpm_packages: ${{ steps.filter.outputs.pnpm_packages }}
      impact: ${{ steps.filter.outputs.impact }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: support/repoctl/go.mod

      - name: Select affected CI jobs
        id: filter
        run: |
          ./support/repoctl/repoctl validate
          ./support/repoctl/repoctl verify-policy --cases tests/repoctl/cases.toml
          ./support/repoctl/repoctl plan --github-event --github-output "$GITHUB_OUTPUT"

  # One environment setup for the Python quality group. repoctl prints each
  # command before running it and names the failing command in its error.
  python-checks:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          # Narrower than the action's default glob, which also keys on every
          # pyproject.toml and requirements.txt in the tree: `uv sync` installs
          # exactly what uv.lock pins, so a pyproject edit that doesn't move the
          # lock should keep hitting the same cache entry.
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Set up Go for repoctl
        uses: actions/setup-go@v5
        with:
          go-version-file: support/repoctl/go.mod

      - name: Run Python quality checks
        run: ./support/repoctl/repoctl run-checks --group python_quality

  # Python type checking is unnecessary when the Python watch set is untouched.
  typecheck:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Set up Go for repoctl
        uses: actions/setup-go@v5
        with:
          go-version-file: support/repoctl/go.mod

      - name: Check Python types
        run: ./support/repoctl/repoctl run-checks --group python_types

  tui:
    needs: changes
    if: needs.changes.outputs.tui == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Enable pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.11.0

      # Resolved after pnpm exists rather than hardcoded: the store location is
      # pnpm's to choose, and a wrong path caches an empty directory silently.
      - name: Locate the pnpm store
        run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache the pnpm store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('clients/pnpm-lock.yaml') }}
          # A lockfile bump usually changes a handful of packages, so an older
          # store is still worth most of its download cost.
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Set up verified Bun 1.3.9 for OpenTUI
        run: |
          python3 packaging/fetch_bun.py --target linux-x86_64 --output "$RUNNER_TEMP/bun/bin/bun"
          echo "$RUNNER_TEMP/bun/bin" >> "$GITHUB_PATH"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Python dependencies
        run: uv sync --dev

      - name: Install TUI dependencies
        working-directory: clients
        run: pnpm install --frozen-lockfile

      - name: Set up Go for repoctl
        uses: actions/setup-go@v5
        with:
          go-version-file: support/repoctl/go.mod

      - name: Check TypeScript packages
        run: ./support/repoctl/repoctl run-checks --group tui_quality

      - name: Test affected TypeScript packages
        env:
          PNPM_PACKAGES: ${{ needs.changes.outputs.pnpm_packages }}
        run: ./support/repoctl/repoctl run-checks --group tui_tests --collection-json "$PNPM_PACKAGES"

      - name: Build TypeScript packages
        run: ./support/repoctl/repoctl run-checks --group tui_build

      - name: Install Chromium for the web smoke test
        working-directory: clients
        run: pnpm --filter @vibesys/web exec playwright install --with-deps chromium

      - name: Test the replay-driven web viewer
        run: ./support/repoctl/repoctl run-checks --group tui_e2e

      - name: Smoke-test TUI packages
        run: ./support/repoctl/repoctl run-checks --group tui_package_smoke

  queue-native:
    needs: changes
    if: needs.changes.outputs.evaluators == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: support/repoctl/go.mod
          cache-dependency-path: |
            resources/evaluators/queue/go.sum
            resources/evaluators/microservice/go.sum
            examples/evaluators/priority-queue/go.sum

      # Bounded because an apt mirror or a service-restart prompt makes this
      # hang rather than fail: three runs on this branch sat here for tens of
      # minutes each and never reached a test. A timeout turns that into a
      # legible failure in minutes instead of a job that burns hours.
      - name: Install managed-candidate containment dependency
        if: contains(fromJSON(needs.changes.outputs.native_targets), 'resources/evaluators/microservice')
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Set up Rust
        if: contains(fromJSON(needs.changes.outputs.native_languages), 'rust')
        uses: dtolnay/rust-toolchain@1.78.0
        with:
          components: clippy, rustfmt

      - name: Check selected native targets
        env:
          NATIVE_TARGETS: ${{ needs.changes.outputs.native_targets }}
        run: ./support/repoctl/repoctl run-native --targets-json "$NATIVE_TARGETS"

  impact-tool:
    needs: changes
    if: needs.changes.outputs.impact == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: support/repoctl/go.mod

      - name: Test repoctl
        run: ./support/repoctl/repoctl run-checks --group repoctl_tests

  # Owns everything that needs a repository-native example's external repository `.vibesys` directory,
  # so no other job pays for one. It fetches `.vibesys/` alone (blob-filtered,
  # depth-1, sparse) at the pinned gitlink rather than checking the submodule
  # out: ~7s and ~8MB for all four examples, against ~95s for one full
  # submodule clone.
  #
  # Data-driven over .gitmodules and over each external repository's own tasks, so a new
  # example repository or a new task needs no edit here. The `servicebench`
  # workload checks below stay explicit because their flags differ per task.
  validate-examples:
    needs: changes
    if: needs.changes.outputs.examples == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: support/repoctl/go.mod
          cache-dependency-path: resources/evaluators/microservice/go.sum

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Check registered examples and input contracts
        run: ./support/repoctl/repoctl run-checks --group examples_tests

      - name: Validate microservice workloads
        run: ./support/repoctl/repoctl run-checks --group microservice_workload_checks

  # Builds the CPU agent image for real and runs every shipped CLI inside it
  # as the non-root `agent` user (issue #675), then reuses that same build to
  # prove the Docker sandbox backend enforces the shared resource-list
  # contract (the Docker case of test_sandbox_conformance.py's suite, which
  # needs a real image and container instead of a skip-when-unavailable
  # backend). ubuntu-latest ships Docker, so no separate engine setup is
  # needed. Filtered narrowly: only a change that can actually change the
  # image's contents or the sandbox backend pays for this job's build time.
  agent-image:
    needs: changes
    if: needs.changes.outputs.agent_image == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Set up Go for repoctl
        uses: actions/setup-go@v5
        with:
          go-version-file: support/repoctl/go.mod

      - name: Build the CPU agent image, run every shipped CLI in it, and prove the Docker sandbox contract
        run: ./support/repoctl/repoctl run-checks --group agent_image_tests

  # Several tests read clients/ directly (packaging, theme, and distribution
  # tests), so a TypeScript-only change still needs this job. Documentation-only
  # changes do not.
  test:
    needs: changes
    if: >-
      needs.changes.outputs.python == 'true' ||
      needs.changes.outputs.tui == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Set up Go for repoctl
        uses: actions/setup-go@v5
        with:
          go-version-file: support/repoctl/go.mod

      - name: Run Python tests and coverage checks
        run: ./support/repoctl/repoctl run-checks --group python_ci_tests

      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-xml
          path: coverage.xml

      # Was its own `needs: test` job, which put a second checkout, uv install,
      # dependency sync, and artifact download on the critical path after the
      # longest job in the run just to spend a few seconds in diff-cover. This
      # job already has the full history and the coverage report it needs.
      - name: Check patch coverage
        if: github.event_name == 'pull_request'
        run: ./support/repoctl/repoctl run-checks --group patch_coverage

  # Exercises the real Linux workspace-confinement boundary (issue #149). The
  # main `test` job skips these (no bubblewrap), so this job installs it and
  # forces the tests to run — VIBESYS_REQUIRE_SANDBOX_TESTS=1 turns a missing or
  # broken sandbox into a failure instead of a silent skip.
  sandbox-linux:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Bounded for the same reason as the containment-dependency install in
      # `queue-native`: this apt install intermittently hangs on these runners
      # instead of failing, and an unbounded step reports nothing while it
      # burns the job's budget.
      - name: Install bubblewrap
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
          NEEDRESTART_MODE: a
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # Ubuntu 24.04 restricts unprivileged user namespaces via AppArmor;
          # relax it so bwrap can create the namespace on the runner.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Set up Go for repoctl
        uses: actions/setup-go@v5
        with:
          go-version-file: support/repoctl/go.mod

      - name: Run workspace-confinement tests
        run: ./support/repoctl/repoctl run-checks --group sandbox_tests

  # macOS counterpart of sandbox-linux: exercises the Seatbelt confinement
  # boundary on a real macOS host. sandbox-exec ships with macOS, so no install
  # step is needed; VIBESYS_REQUIRE_SANDBOX_TESTS=1 forces the Seatbelt test to
  # run (and fail loudly) rather than skip.
  sandbox-macos:
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Set up Go for repoctl
        uses: actions/setup-go@v5
        with:
          go-version-file: support/repoctl/go.mod

      - name: Run workspace-confinement tests
        run: ./support/repoctl/repoctl run-checks --group sandbox_tests

  # One stable, always-present result for branch protection and delegated merge
  # policy. Filtered jobs may skip, but every job that ran must succeed. Keep
  # this independent of ci-budget, which is intentionally advisory.
  required-pr-ci:
    name: Required PR CI
    needs:
      - changes
      - python-checks
      - typecheck
      - tui
      - queue-native
      - impact-tool
      - validate-examples
      - agent-image
      - test
      - sandbox-linux
      - sandbox-macos
    if: always()
    runs-on: ubuntu-24.04

    steps:
      - name: Require every applicable test job to succeed
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os

          results = {
              name: details["result"]
              for name, details in json.loads(os.environ["JOB_RESULTS"]).items()
          }
          failed = {name: result for name, result in results.items() if result not in {"success", "skipped"}}
          if failed:
              raise SystemExit(f"Required test jobs did not succeed: {failed}")
          PY

  # Temporary branch-protection compatibility alias. Remove this after main
  # requires Required PR CI instead of Scoped merge gate.
  scoped-merge-gate:
    name: Scoped merge gate
    needs: required-pr-ci
    if: always()
    runs-on: ubuntu-24.04

    steps:
      - name: Mirror Required PR CI
        env:
          REQUIRED_PR_CI_RESULT: ${{ needs.required-pr-ci.result }}
        run: |
          if [[ "$REQUIRED_PR_CI_RESULT" != "success" ]]; then
            echo "Required PR CI did not succeed: $REQUIRED_PR_CI_RESULT" >&2
            exit 1
          fi

  # Reports the run's wall time against CI_WALL_TIME_BUDGET_SECONDS (issue
  # #474). Warns rather than fails: a green run that is merely slow should still
  # be mergeable, and macOS runner queueing can push a run over the budget for
  # reasons no workflow change can fix, so the summary reports queue time
  # separately from execution time.
  #
  # `typecheck` is deliberately absent from `needs`; Required PR CI owns that
  # dependency. It still appears in the table because this step reads every job
  # of the run from the API, not just the ones listed here.
  ci-budget:
    needs:
      - changes
      - python-checks
      - tui
      - queue-native
      - impact-tool
      - validate-examples
      - agent-image
      - test
      - sandbox-linux
      - sandbox-macos
    if: always()
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read

    steps:
      - name: Report wall time against the budget
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          BUDGET_SECONDS: ${{ env.CI_WALL_TIME_BUDGET_SECONDS }}
        run: |
          set -euo pipefail
          gh api "repos/$REPO/actions/runs/$RUN_ID" --jq '.created_at' > run_created.txt
          # This job is still running, so its own row has an empty
          # completed_at and drops out of the wall-time math below.
          gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" --paginate \
            --jq '.jobs[] | [.name, (.conclusion // ""), (.started_at // ""), (.completed_at // "")] | @tsv' \
            > jobs.tsv
          python3 - <<'PY'
          import os
          from datetime import datetime
          from pathlib import Path

          def moment(value: str) -> datetime | None:
              return datetime.fromisoformat(value.replace("Z", "+00:00")) if value else None

          budget = int(os.environ["BUDGET_SECONDS"])
          created = moment(Path("run_created.txt").read_text().strip())
          assert created is not None

          rows = []
          for line in Path("jobs.tsv").read_text().splitlines():
              name, conclusion, started, completed = line.split("\t")
              # Skipped jobs report a completed_at that precedes their
              # started_at, and they cost the run nothing.
              start, end = moment(started), moment(completed)
              if start is None or end is None or conclusion == "skipped":
                  continue
              rows.append((
                  name,
                  conclusion,
                  (start - created).total_seconds(),
                  (end - start).total_seconds(),
                  (end - created).total_seconds(),
              ))

          if not rows:
              print("Every job in this run was skipped; nothing to measure.")
              raise SystemExit(0)

          rows.sort(key=lambda row: row[4], reverse=True)
          wall = rows[0][4]
          slowest, _, slowest_queue, slowest_run, _ = rows[0]

          lines = [
              f"## CI wall time: {wall:.0f}s (budget {budget}s)",
              "",
              "Measured from the run's `created_at` to the last job's `completed_at`,"
              " which is what a reviewer waiting on the run experiences.",
              "",
              "| job | result | queued (s) | ran (s) | finished at (s) |",
              "| --- | --- | ---: | ---: | ---: |",
          ]
          for name, conclusion, queued, ran, finished in rows:
              lines.append(
                  f"| {name} | {conclusion or 'n/a'} | {queued:.0f} | {ran:.0f} | {finished:.0f} |"
              )
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(lines) + "\n")

          if wall > budget:
              print(
                  f"::warning title=CI over wall-time budget::Run took {wall:.0f}s against a"
                  f" {budget}s budget. Long pole: {slowest} ({slowest_queue:.0f}s queued,"
                  f" {slowest_run:.0f}s running)."
              )
          else:
              print(f"Run took {wall:.0f}s, within the {budget}s budget.")
          PY
