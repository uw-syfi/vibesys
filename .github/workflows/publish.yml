name: Build and publish release wheel

on:
  pull_request:
    branches: [main]
    paths:
      - 'pyproject.toml'
      - 'uv.lock'
      - 'setup.py'
      - 'MANIFEST.in'
      - 'packaging/**'
      - 'src/**'
      - 'libs/**'
      - 'resources/**'
      - 'skills/**'
      - 'sdk/**'
      - '.github/workflows/publish.yml'
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'release' && 'pypi-production' || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify universal wheel
    # The repository also publishes vibesys-cli releases (cli-v<version> and the rolling cli-latest);
    # those are not wheels. cli-release.yml builds them.
    if: github.event_name != 'release' || !startsWith(github.event.release.tag_name, 'cli-')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.24"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Set up Python
        run: uv python install 3.12

      - name: Validate source and tag versions
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$EVENT_NAME" == release ]]; then
            uv run python packaging/check_release_version.py --tag "refs/tags/$RELEASE_TAG"
            git fetch --no-tags origin main
            release_commit="$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")"
            git merge-base --is-ancestor "$release_commit" origin/main
          else
            uv run python packaging/check_release_version.py
          fi

      - name: Export pinned runtime dependencies
        run: |
          uv export --no-dev --no-editable --no-emit-project --no-hashes \
            --no-header --no-annotate \
            -o "$RUNNER_TEMP/release-verify-constraints.txt"

      - name: Build universal wheel
        run: |
          mkdir -p dist/release
          uv build --wheel --out-dir dist/release
          uv run python packaging/check_release_version.py --wheel-dir dist/release

      - name: Verify wheel in a clean installation
        run: |
          set -- dist/release/*.whl
          test "$#" -eq 1
          wheel="$(cd "$(dirname "$1")" && pwd -P)/$(basename "$1")"
          runtime_root="$(cd "$RUNNER_TEMP" && pwd -P)/vibesys-installed"
          bootstrap_bin="$runtime_root/bootstrap-bin"
          tool_bin="$runtime_root/tool-bin"
          tool_root="$runtime_root/tools"
          install_home="$runtime_root/install-home"
          verify_home="$runtime_root/verify-home"
          mkdir -p "$bootstrap_bin" "$tool_bin" "$tool_root" "$install_home" "$verify_home"
          test -z "$(find "$install_home" -mindepth 1 -print -quit)"
          test -z "$(find "$verify_home" -mindepth 1 -print -quit)"
          cp "$(command -v uv)" "$bootstrap_bin/uv"
          cp packaging/verify_installed_release.py "$runtime_root/verify_installed_release.py"
          install_wheel="$runtime_root/$(basename "$wheel")"
          cp "$wheel" "$install_wheel"
          python_path="$(uv python find 3.12)"
          clean_path="$tool_bin:$bootstrap_bin:/usr/bin:/bin"
          HOME="$install_home" PATH="$clean_path" PYTHONNOUSERSITE=1 PYTHONPATH="" \
            UV_CACHE_DIR="$runtime_root/uv-cache" UV_PYTHON_DOWNLOADS=never \
            UV_TOOL_BIN_DIR="$tool_bin" UV_TOOL_DIR="$tool_root" \
            "$bootstrap_bin/uv" tool install --no-cache --no-config \
              --constraints "$RUNNER_TEMP/release-verify-constraints.txt" \
              --python "$python_path" "$install_wheel"
          rm "$install_wheel"
          cd "$runtime_root"
          HOME="$verify_home" PATH="$clean_path" PYTHONNOUSERSITE=1 PYTHONPATH="" \
            UV_CACHE_DIR="$runtime_root/uv-cache" UV_PYTHON_DOWNLOADS=never \
            UV_TOOL_BIN_DIR="$tool_bin" UV_TOOL_DIR="$tool_root" \
            VIBESYS_RELEASE_RUNTIME_ROOT="$runtime_root" \
            "$tool_root/vibesys/bin/python" "$runtime_root/verify_installed_release.py"

      - name: Upload verified wheel
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-dist
          path: dist/release/*.whl
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: pypi
    permissions:
      actions: read
      id-token: write
    steps:
      - name: Download verified wheel
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-dist
          path: dist/release

      - name: Require exactly one wheel and no sdist
        run: |
          test "$(find dist/release -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 1
          test "$(find dist/release -maxdepth 1 -type f -name '*.whl' | wc -l | tr -d ' ')" -eq 1

      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/release
          attestations: true
