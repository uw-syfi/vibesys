name: Build and publish the managed-run bundles

# A tag vibesys-v<version> publishes the bundles install.sh installs for managed runs, for Linux
# (amd64 and arm64) and Apple Silicon macOS: vibesys-client, vibesys-host and vibesys-cli plus the
# sidecar source and the skills marketplace. See "Install for managed runs" in orchestrator/README.md.
on:
  push:
    tags:
      - 'vibesys-v*'

permissions:
  contents: read

# One release at a time, and a started release is never cancelled half published.
concurrency:
  group: managed-release
  cancel-in-progress: false

env:
  TAG: ${{ github.ref_name }}

jobs:
  build:
    name: Build the bundles
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Validate the tag
        run: |
          if [[ ! "$TAG" =~ ^vibesys-v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Tag '$TAG' must be vibesys-vMAJOR.MINOR.PATCH with an optional -suffix" >&2
            exit 1
          fi
          # Never publish a commit that is not on main.
          git fetch --no-tags origin main
          release_commit="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          git merge-base --is-ancestor "$release_commit" origin/main

      # The orchestrator contract is exempt from `buf breaking` until the first release
      # (docs/contributing/process-boundaries.md). A tagged release makes it a public contract, so
      # the tag is refused until the check holds the path again.
      - name: Require the orchestrator contract to be under the breaking check
        run: python3 scripts/check_boundaries.py --release

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: gateway/go.mod
          cache-dependency-path: |
            gateway/go.sum
            cli/go.sum

      - name: Build the bundles
        run: |
          version="${TAG#vibesys-v}"
          for target in linux/amd64 linux/arm64 darwin/arm64; do
            ./scripts/build_release_bundle.sh "$version" "${target%/*}" "${target#*/}" "$RUNNER_TEMP/release"
          done
          printf '%s\n' "$version" > "$RUNNER_TEMP/release/VERSION"

      - name: Upload the assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: managed-release
          path: ${{ runner.temp }}/release/*
          if-no-files-found: error

  publish:
    name: Attest and publish
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GH_TOKEN: ${{ github.token }}
      # This job has no checkout, so gh cannot infer the repository from a git remote.
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download the assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: managed-release
          path: release

      - name: Attest the assets
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release/*

      # The release for this version, under its own tag. It never takes GitHub's "latest" marker:
      # the repository's other releases use it, and the next one created would take it back.
      - name: Publish the release for this version
        run: |
          version="${TAG#vibesys-v}"
          prerelease=()
          if [[ "$version" == *-* ]]; then prerelease=(--prerelease); fi
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --verify-tag --latest=false "${prerelease[@]}" \
              --title "VibeSys $version" \
              --notes "Bundles for managed runs on Linux (amd64 and arm64) and Apple Silicon macOS. Install with install.sh at the repository root. Each file has a build attestation: gh attestation verify <file> --repo $GITHUB_REPOSITORY"
          fi
          # A re-run after a partial failure replaces assets with identical content. The bundles
          # go first and the files that name them last.
          gh release upload "$TAG" release/vibesys_*.tar.gz --clobber
          gh release upload "$TAG" release/vibesys_*.sha256 release/VERSION --clobber

      # The rolling vibesys-latest release carries the VERSION file of the newest stable version,
      # which is all install.sh reads from it. A pre-release, or a version older than one already
      # published, leaves it alone.
      - name: Move vibesys-latest to this version
        run: |
          version="${TAG#vibesys-v}"
          if [[ "$version" == *-* ]]; then
            echo "$TAG is a pre-release; vibesys-latest stays where it is."
            exit 0
          fi
          newest="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/vibesys-v" --paginate --jq '.[].ref' \
            | sed 's#^refs/tags/vibesys-v##' | grep -v -- '-' | sort -V | tail -n 1)"
          if [[ "$newest" != "$version" ]]; then
            echo "$TAG is not the newest stable version ($newest is); vibesys-latest stays where it is."
            exit 0
          fi
          if gh release view vibesys-latest > /dev/null 2>&1; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/vibesys-latest" \
              -f sha="$GITHUB_SHA" -F force=true > /dev/null
          else
            gh release create vibesys-latest --target "$GITHUB_SHA" --latest=false \
              --title "VibeSys (newest)" \
              --notes "Names the newest stable VibeSys version for install.sh, under a tag that does not change name. Do not pin to this tag; use vibesys-v<version>."
          fi
          gh release upload vibesys-latest release/VERSION --clobber
