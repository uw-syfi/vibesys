name: Delegated merge

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: delegated-merge-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.event.issue.pull_request &&
      startsWith(github.event.comment.body, '/merge-')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # issue_comment workflows use the default branch. Pin the checkout to it
      # explicitly and never fetch or execute the pull request head.
      - name: Check out trusted merge policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # Landing writes (enqueue, async merge, direct merge) use a fine-grained
      # PAT (repo-scoped to vibesys, Pull requests write + Contents write)
      # because GITHUB_TOKEN-created queue entries do not start merge_group CI.
      # Reads, the role check, and audit comments keep GITHUB_TOKEN.
      - name: Authorize and merge or enqueue
        env:
          GH_TOKEN: ${{ github.token }}
          LANDING_GH_TOKEN: ${{ secrets.MERGE_QUEUE_PAT }}
        run: python3 scripts/delegated_merge.py --event "$GITHUB_EVENT_PATH"
