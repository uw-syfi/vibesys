name: Build and publish vibesys-evaluator release

# A published GitHub release whose tag is evaluator-v<version> releases vibesys-evaluator: the
# platform wheels (Linux and macOS, x86_64 and arm64, each bundling the Go binaries) and the sdist
# to PyPI, one image per domain (ghcr.io/uw-syfi/vibesys-evaluator-microservices:<version> and
# ghcr.io/uw-syfi/vibesys-evaluator-llm-serving:<version>), and the Go module tag
# sdk/vibesys-evaluator/go/v<semver>, all from the same commit of main. The flow and the
# one-time setup are in docs/contributing/publishing.md, "vibesys-evaluator releases".
on:
  release:
    types: [published]

permissions:
  contents: read

# One evaluator release at a time, and a started release is never cancelled half published.
# Every other release of the repository (vibesys v*, vibesys-cli) also starts this workflow,
# skips every job, and gets a group of its own, so it never queues behind or displaces an
# evaluator release.
concurrency:
  group: ${{ startsWith(github.event.release.tag_name, 'evaluator-') && 'evaluator-release' || format('evaluator-release-skipped-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  TAG: ${{ github.event.release.tag_name }}
  # Each domain's image is $IMAGE_PREFIX-<domain>, built from the Dockerfile's target <domain>.
  IMAGE_PREFIX: ghcr.io/uw-syfi/vibesys-evaluator
  DOMAINS: microservices llm-serving
  PACKAGE_ROOT: sdk/vibesys-evaluator

jobs:
  verify:
    name: Build and verify the wheel and the images
    # publish.yml skips every tag starting evaluator-; this workflow takes them all, and the
    # version check below refuses any that is not evaluator-v<canonical PEP 440 version>.
    if: startsWith(github.event.release.tag_name, 'evaluator-')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # The Python checks import fixtures/check_histograms.py; a __pycache__ left in fixtures/
      # fails loadgen's conformance test (TestFixturesAreCurrent), which allows only fixtures.
      PYTHONDONTWRITEBYTECODE: "1"
    outputs:
      version: ${{ steps.version.outputs.version }}
      go_version: ${{ steps.version.outputs.go_version }}
      commit: ${{ steps.version.outputs.commit }}
      digest_microservices: ${{ steps.image.outputs.digest_microservices }}
      digest_llm_serving: ${{ steps.image.outputs.digest_llm_serving }}
    steps:
      # The package tests run pytest, which dumps hung tests just before this job's timeout.
      - name: Record when this job's cancel clock started
        run: echo "VIBESYS_JOB_STARTED_AT=$(date +%s)" >> "$GITHUB_ENV"

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: false

      - name: Pass the pytest cancel deadline
        run: python3 scripts/pytest_job_deadline.py

      # No dependency cache anywhere in this workflow: a cache written by another workflow run
      # must not reach what is published.
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.24"
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.12

      # The platform wheels bundle the Go binaries, cross-compiled here (CGO_ENABLED=0).
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sdk/vibesys-evaluator/go/go.mod
          cache: false

      - name: Validate the tag, the source version and main
        id: version
        run: |
          check=(uv run --frozen python packaging/check_release_version.py
            --source-root "$PACKAGE_ROOT/python" --tag-prefix refs/tags/evaluator-v
            --tag "refs/tags/$TAG")
          version="$("${check[@]}")"
          go_version="$("${check[@]}" --go-module-version)"
          # Never publish a commit that is not on main.
          git fetch --no-tags origin main
          release_commit="$(git rev-parse --verify "refs/tags/$TAG^{commit}")"
          git merge-base --is-ancestor "$release_commit" origin/main
          test "$(git rev-parse HEAD)" = "$release_commit"
          {
            echo "version=$version"
            echo "go_version=$go_version"
            echo "commit=$release_commit"
          } >> "$GITHUB_OUTPUT"

      # GitHub's "latest" marker belongs to the vibesys Python releases (publishing.md). Refuse
      # before anything is published, so the marker can be moved back and the run re-run.
      - name: Refuse a release that took the latest marker
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          latest="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2> /dev/null || true)"
          if [[ "$latest" == "$TAG" ]]; then
            echo "::error::Release $TAG is marked as the repository's latest release. Mark the newest vibesys v* release as latest again, keep 'Set as the latest release' off for $TAG, then re-run this workflow."
            exit 1
          fi

      - name: Export pinned runtime dependencies
        run: |
          uv export --frozen --package vibesys-evaluator --no-dev --no-editable \
            --no-emit-project --no-emit-workspace --no-hashes --no-header --no-annotate \
            -o "$RUNNER_TEMP/evaluator-constraints.txt"

      # One wheel per platform, each bundling the three Go binaries in vibesys_evaluator/_bin
      # (packaging/evaluator_wheels.py: linux x86_64 and aarch64, static, with the manylinux and
      # the musllinux tags; macOS x86_64 and arm64, cross-compiled), and one sdist, which has no
      # binary and tells a user to set $VIBESYS_EVALUATOR_BIN. There is no py3-none-any wheel.
      # The binaries are stamped with the Go module version of the release.
      - name: Build the wheels
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GO_VERSION: ${{ steps.version.outputs.go_version }}
          COMMIT: ${{ steps.version.outputs.commit }}
        run: |
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct "$COMMIT")"
          export SOURCE_DATE_EPOCH
          uv run --frozen python packaging/evaluator_wheels.py build \
            --out dist/evaluator --go-version "$GO_VERSION"
          uv run --frozen python packaging/check_release_version.py \
            --source-root "$PACKAGE_ROOT/python" --wheel-dir dist/evaluator --evaluator-wheels
          uv run --frozen python packaging/evaluator_wheels.py verify dist/evaluator --version "$VERSION"
          ls -l dist/evaluator

      # The wheel the images and the smoke tests below use: linux x86_64 (the runner's).
      - name: Pick the linux x86_64 wheel
        id: linux_wheel
        run: |
          set -- dist/evaluator/*-py3-none-manylinux_2_17_x86_64.*.whl
          test "$#" -eq 1
          test -f "$1"
          echo "wheel=$1" >> "$GITHUB_OUTPUT"

      - name: Install the wheel in a clean environment
        id: install
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GO_VERSION: ${{ steps.version.outputs.go_version }}
          WHEEL: ${{ steps.linux_wheel.outputs.wheel }}
        run: |
          root="$(cd "$RUNNER_TEMP" && pwd -P)/evaluator-installed"
          home="$root/home"
          venv="$root/venv"
          mkdir -p "$home"
          test -z "$(find "$home" -mindepth 1 -print -quit)"
          cp "$WHEEL" "$root/"
          wheel="$root/$(basename "$WHEEL")"
          uv_bin="$(command -v uv)"
          python_path="$(uv python find 3.12)"
          # No Go toolchain on this PATH: the wheel alone must carry everything. The runner image
          # has go in /usr/bin, so the clean PATH is one directory linking every system command
          # but the Go toolchain's.
          clean_path="$root/clean-bin"
          mkdir -p "$clean_path"
          for cmd in /usr/bin/* /bin/*; do
            name="$(basename "$cmd")"
            case "$name" in go | gofmt | go[0-9]*) continue ;; esac
            [[ -e "$clean_path/$name" ]] || ln -s "$cmd" "$clean_path/$name"
          done
          if PATH="$clean_path" command -v go > /dev/null; then
            echo "::error::a Go toolchain is on the clean PATH ($clean_path); the smoke test needs none"
            exit 1
          fi
          clean_env=(env -i HOME="$home" PATH="$clean_path" PYTHONNOUSERSITE=1
            UV_CACHE_DIR="$root/uv-cache" UV_PYTHON_DOWNLOADS=never)
          "${clean_env[@]}" "$uv_bin" venv --no-config --python "$python_path" "$venv"
          "${clean_env[@]}" "$uv_bin" pip install --no-config --no-cache --python "$venv/bin/python" \
            --constraints "$RUNNER_TEMP/evaluator-constraints.txt" "$wheel"
          rm "$wheel"
          cd "$root"
          "${clean_env[@]}" EXPECTED_VERSION="$VERSION" EXPECTED_PREFIX="$venv" \
            "$venv/bin/python" -I -c '
          import importlib.metadata, os, pathlib
          import vibesys_evaluator, vibesys_evaluator.microservices.k8s
          import vibesys_evaluator.llm_serving.agentx, vibesys_evaluator.llm_serving.golden
          where = pathlib.Path(vibesys_evaluator.__file__).resolve()
          assert where.is_relative_to(pathlib.Path(os.environ["EXPECTED_PREFIX"]).resolve()), where
          installed = importlib.metadata.version("vibesys-evaluator")
          assert installed == os.environ["EXPECTED_VERSION"], installed
          print(f"vibesys_evaluator {installed} imports from {where.parent}")
          '
          # The binaries are the wheel's (in _bin/, stamped with the release), and a task script's
          # main() runs a sample through the core binary, with no Go toolchain on PATH.
          "${clean_env[@]}" "$venv/bin/python" -I "$GITHUB_WORKSPACE/packaging/evaluator_wheel_smoke.py" \
            --check "$GO_VERSION" "$venv"
          "${clean_env[@]}" "$venv/bin/python" -I "$GITHUB_WORKSPACE/packaging/evaluator_wheel_smoke.py" \
            benchmark --vs-output "$root/smoke-records.jsonl"
          grep -q '"smoke_ops"' "$root/smoke-records.jsonl"
          echo "python=$venv/bin/python" >> "$GITHUB_OUTPUT"

      # The Linux binaries are static, which is what lets one wheel carry the musllinux tag too:
      # run the wheel's binaries on Alpine (musl), with no network. The other three wheels' binaries
      # cannot run on this runner; their architecture and static linking are checked in the
      # build step (evaluator_wheels.py verify).
      - name: Run the wheel's binaries on musl
        env:
          GO_VERSION: ${{ steps.version.outputs.go_version }}
          WHEEL: ${{ steps.linux_wheel.outputs.wheel }}
        run: |
          bins="$RUNNER_TEMP/musl-bin"
          mkdir -p "$bins"
          unzip -q -j "$WHEEL" 'vibesys_evaluator/_bin/*' -d "$bins"
          docker run --rm --network none -v "$bins:/b:ro" \
            alpine@sha256:bfe7ceb9f09ec0566c48fb93356e45a47a00be5a1dd14fa5b909e7709c66b034 sh -c '
            set -e
            /b/vibesys-evaluator core version | grep -F "\"loadgen_version\":\"$0\""
            /b/loadgen --capabilities > /dev/null
            /b/otelcapture -h 2> /dev/null || test "$?" -eq 2
            ' "$GO_VERSION"

      - name: Check the type completeness of the installed public API
        env:
          INSTALLED_PYTHON: ${{ steps.install.outputs.python }}
        run: |
          # pyright in a venv of its own, so it cannot add to what the package is checked against.
          # --verifytypes finds packages through the `python` on PATH (it ignores --pythonpath),
          # so that is the clean installation's interpreter.
          tools="$RUNNER_TEMP/pyright-venv"
          uv venv --no-config --python 3.12 "$tools"
          uv pip install --no-config --python "$tools/bin/python" 'pyright[nodejs]==1.1.414'
          mkdir -p "$RUNNER_TEMP/verifytypes"
          cd "$RUNNER_TEMP/verifytypes"
          PATH="$(dirname "$INSTALLED_PYTHON"):$PATH" \
            "$tools/bin/pyright" --verifytypes vibesys_evaluator --ignoreexternal

      - name: Check the conformance fixtures from Python
        env:
          INSTALLED_PYTHON: ${{ steps.install.outputs.python }}
        run: |
          # With the installed package's decoder, then with the reference HdrHistogram library.
          "$INSTALLED_PYTHON" -I "$PACKAGE_ROOT/fixtures/check_histograms.py" --core
          uv run --no-config --no-project --with hdrhistogram==0.10.8 \
            python -I "$PACKAGE_ROOT/fixtures/check_histograms.py"

      - name: Run the package tests
        run: |
          uv sync --frozen
          uv run --frozen python -m pytest "$PACKAGE_ROOT/python/tests" --no-cov

      # The pull-request check (python_quality): api/public-api.txt regenerated with griffe and
      # diffed, `griffe check` against the last release tag (the checkout has every tag),
      # `pyright --verifytypes`, and the examples type-checking against the package.
      - name: Check the public API snapshot
        run: uv run --frozen python scripts/check_vibesys_evaluator_api.py

      - name: Test loadgen and its conformance fixtures
        working-directory: sdk/vibesys-evaluator/go
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted" >&2
            echo "::error::Run gofmt -w on the files above." >&2
            exit 1
          fi
          go vet ./...
          go test -race ./...

      # Each image installs the linux x86_64 wheel verified above (the Dockerfile's `wheels` stage
      # replaced by a directory holding just that wheel), not one it builds itself.
      # Each image is built once, here, into an OCI archive. The image job pushes these exact
      # blobs, so the digest recorded now is the digest published, and the smoke test below
      # runs what is published.
      - name: Build the images
        id: image
        env:
          VERSION: ${{ steps.version.outputs.version }}
          COMMIT: ${{ steps.version.outputs.commit }}
          LINUX_WHEEL: ${{ steps.linux_wheel.outputs.wheel }}
        run: |
          docker buildx create --name evaluator-release --driver docker-container \
            --driver-opt image=moby/buildkit:v0.22.0@sha256:832fa7aa1eb3deb56fa62ae933bfa42dad9a83ff4824dbbaf173b49c722b59d0 \
            --use
          mkdir -p "$RUNNER_TEMP/image" "$RUNNER_TEMP/image-wheel"
          # The images are linux/amd64: they install that platform's wheel (the Dockerfile's
          # `wheels` stage), which carries the Go binaries; no Go toolchain runs in the image build.
          cp "$LINUX_WHEEL" "$RUNNER_TEMP/image-wheel/"
          for domain in $DOMAINS; do
            archive="$RUNNER_TEMP/image/vibesys-evaluator-$domain.oci.tar"
            docker buildx build --file "$PACKAGE_ROOT/image/Dockerfile" --target "$domain" \
              --platform linux/amd64 --provenance=false --sbom=false --pull --no-cache \
              --build-context wheels="$RUNNER_TEMP/image-wheel" \
              --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
              --label "org.opencontainers.image.revision=$COMMIT" \
              --label "org.opencontainers.image.version=$VERSION" \
              --output "type=oci,dest=$archive" "$PACKAGE_ROOT"
            index="$RUNNER_TEMP/image/index-$domain.json"
            tar -xOf "$archive" index.json > "$index"
            test "$(jq '.manifests | length' "$index")" -eq 1
            test "$(jq -r '.manifests[0].mediaType' "$index")" \
              = application/vnd.oci.image.manifest.v1+json
            digest="$(jq -r '.manifests[0].digest' "$index")"
            [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            echo "$digest" > "$RUNNER_TEMP/image/digest-$domain"
            echo "digest_${domain//-/_}=$digest" >> "$GITHUB_OUTPUT"
            echo "Image $domain digest: $digest"
          done

      - name: Smoke the images
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GO_VERSION: ${{ steps.version.outputs.go_version }}
        run: |
          command -v skopeo > /dev/null
          for domain in $DOMAINS; do
            skopeo copy "oci-archive:$RUNNER_TEMP/image/vibesys-evaluator-$domain.oci.tar" \
              "docker-daemon:vibesys-evaluator-$domain-verify:$VERSION"
            docker run --rm --network none -e EXPECTED_VERSION="$VERSION" \
              "vibesys-evaluator-$domain-verify:$VERSION" python -c '
          import importlib.metadata, os
          import vibesys_evaluator
          installed = importlib.metadata.version("vibesys-evaluator")
          assert installed == os.environ["EXPECTED_VERSION"], installed
          '
          done
          microservices="vibesys-evaluator-microservices-verify:$VERSION"
          # The capabilities file is a header line and then the Capabilities message.
          docker run --rm --network none "$microservices" loadgen --capabilities --format json \
            > "$RUNNER_TEMP/image/capabilities.json"
          loadgen_version="$(sed -n 2p "$RUNNER_TEMP/image/capabilities.json" | jq -r .loadgenVersion)"
          if [[ "$loadgen_version" != "$GO_VERSION" ]]; then
            echo "::error::loadgen in the image reports version '$loadgen_version', not $GO_VERSION: the wheel must stamp its binaries with the release version (evaluator_wheels.py build --go-version)."
            exit 1
          fi
          docker run --rm --network none "$microservices" python -c 'import vibesys_evaluator.microservices.k8s'
          # The core on the PATH and the one the package runs are both the wheel's.
          docker run --rm --network none "$microservices" python -c '
          import shutil
          from vibesys_evaluator._private import core
          for name in core.ENV_VARS:
              assert core.find_binary(name).endswith(f"/vibesys_evaluator/_bin/{name}"), name
              assert shutil.which(name), name
          '
          # The harness the image installs is the one the package replays with.
          docker run --rm --network none "vibesys-evaluator-llm-serving-verify:$VERSION" python -c '
          import importlib.metadata
          from vibesys_evaluator.llm_serving import agentx
          installed = importlib.metadata.version("agentx-harness")
          assert installed == agentx.HARNESS_VERSION, installed
          '

      - name: Upload the verified wheels and sdist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evaluator-dist
          path: |
            dist/evaluator/*.whl
            dist/evaluator/*.tar.gz
          if-no-files-found: error
          retention-days: 7

      - name: Upload the verified image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evaluator-image
          path: |
            ${{ runner.temp }}/image/vibesys-evaluator-*.oci.tar
            ${{ runner.temp }}/image/digest-*
          if-no-files-found: error
          retention-days: 7

  pypi:
    name: Publish the wheels and sdist to PyPI
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The Trusted Publisher on PyPI names this environment; it deploys only evaluator-v* tags.
    environment: pypi-evaluator
    permissions:
      actions: read # download the verified wheel
      id-token: write # PyPI Trusted Publishing and the wheel's PyPI attestations
    steps:
      - name: Download the verified wheels and sdist
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: evaluator-dist
          path: dist/evaluator

      # Exactly what verify built: the four platform wheels and the sdist, and no py3-none-any
      # wheel (an installer must never take a wheel without the binaries over the sdist's message).
      - name: Require the four platform wheels and the sdist
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          test "$(find dist/evaluator -maxdepth 1 -type f | wc -l | tr -d ' ')" -eq 5
          test -f "dist/evaluator/vibesys_evaluator-$VERSION.tar.gz"
          for platform in manylinux_2_17_x86_64 manylinux_2_17_aarch64 macosx_12_0_x86_64 macosx_12_0_arm64; do
            set -- dist/evaluator/vibesys_evaluator-"$VERSION"-py3-none-*"$platform"*.whl
            test "$#" -eq 1
            test -f "$1"
          done
          test -z "$(find dist/evaluator -name '*-any.whl' -print -quit)"

      # A version is published once and never overwritten. A re-run after a partial upload skips
      # the files PyPI already holds with the same sha256 and uploads the rest; a file PyPI holds
      # with other contents stops the release.
      - name: Keep only the files PyPI does not hold yet
        id: pending
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          status="$(curl -sS -o "$RUNNER_TEMP/pypi.json" -w '%{http_code}' \
            "https://pypi.org/pypi/vibesys-evaluator/$VERSION/json")"
          case "$status" in
            200) ;;
            404) echo '{"urls": []}' > "$RUNNER_TEMP/pypi.json" ;;
            *) echo "::error::PyPI answered $status for vibesys-evaluator $VERSION"; exit 1 ;;
          esac
          remaining=0
          for file in dist/evaluator/*; do
            name="$(basename "$file")"
            ours="$(sha256sum "$file" | cut -d' ' -f1)"
            held="$(jq -r --arg name "$name" '.urls[] | select(.filename == $name) | .digests.sha256' "$RUNNER_TEMP/pypi.json")"
            if [[ -z "$held" ]]; then
              remaining=$((remaining + 1))
            elif [[ "$held" == "$ours" ]]; then
              echo "$name is already on PyPI with this sha256"
              rm "$file"
            else
              echo "::error::$name is already on PyPI with sha256 $held, not the verified $ours. Publish a new version."
              exit 1
            fi
          done
          echo "pending=$remaining" >> "$GITHUB_OUTPUT"

      - name: Publish with PyPI Trusted Publishing
        if: steps.pending.outputs.pending != '0'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/evaluator
          attestations: true

      # Every file has a PyPI attestation (PEP 740: publisher identity and the source commit),
      # the publish action's, which PyPI serves from its integrity API.
      - name: Check that PyPI serves an attestation for every file
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          curl -fsS "https://pypi.org/pypi/vibesys-evaluator/$VERSION/json" \
            | jq -r '.urls[].filename' | sort > "$RUNNER_TEMP/files.txt"
          test "$(wc -l < "$RUNNER_TEMP/files.txt" | tr -d ' ')" -eq 5
          while read -r name; do
            for attempt in 1 2 3 4 5 6; do
              if curl -fsS -o /dev/null -H 'Accept: application/vnd.pypi.integrity.v1+json' \
                "https://pypi.org/integrity/vibesys-evaluator/$VERSION/$name/provenance"; then
                echo "attested: $name"
                continue 2
              fi
              sleep 20
            done
            echo "::error::PyPI serves no attestation for $name"
            exit 1
          done < "$RUNNER_TEMP/files.txt"

  image:
    name: Push and attest the ${{ matrix.domain }} image
    # After PyPI, so a release whose wheel was not published publishes nothing else either.
    needs: [verify, pypi]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # One leg per domain image; the two lists name the same domains as DOMAINS.
    strategy:
      fail-fast: false
      matrix:
        domain: [microservices, llm-serving]
    env:
      IMAGE: ghcr.io/uw-syfi/vibesys-evaluator-${{ matrix.domain }}
    # id-token and attestations sign the build provenance, as cli-release.yml does for its
    # binaries. This job's OIDC token cannot publish to PyPI: the Trusted Publisher requires the
    # pypi-evaluator environment, which only the pypi job runs in.
    permissions:
      actions: read # download the verified image
      packages: write # push the image and its attestation to ghcr.io
      id-token: write # sign the build provenance
      attestations: write # record the attestation in the repository
    steps:
      - name: Download the verified image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: evaluator-image
          path: image

      - name: Push the image
        id: push
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          VERIFIED_DIGEST: ${{ matrix.domain == 'microservices' && needs.verify.outputs.digest_microservices || needs.verify.outputs.digest_llm_serving }}
          DOMAIN: ${{ matrix.domain }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(cat "image/digest-$DOMAIN")" = "$VERIFIED_DIGEST"
          authfile="$RUNNER_TEMP/registry-auth.json"
          trap 'rm -f "$authfile"' EXIT
          printf '%s' "$GH_TOKEN" | skopeo login --authfile "$authfile" \
            --username "$GITHUB_ACTOR" --password-stdin ghcr.io
          destination="docker://$IMAGE:$VERSION"
          # A version is pushed once. A re-run after a partial failure finds the same digest and
          # goes on; a different image under the tag is never overwritten.
          if published="$(skopeo inspect --authfile "$authfile" --raw "$destination" 2> /dev/null)"; then
            published_digest="sha256:$(printf '%s' "$published" | sha256sum | cut -d' ' -f1)"
            if [[ "$published_digest" != "$VERIFIED_DIGEST" ]]; then
              echo "::error::$IMAGE:$VERSION already exists with digest $published_digest, not the verified $VERIFIED_DIGEST. Publish a new version."
              exit 1
            fi
          else
            skopeo copy --authfile "$authfile" --preserve-digests \
              "oci-archive:image/vibesys-evaluator-$DOMAIN.oci.tar" "$destination"
          fi
          pushed_digest="sha256:$(skopeo inspect --authfile "$authfile" --raw "$destination" | sha256sum | cut -d' ' -f1)"
          test "$pushed_digest" = "$VERIFIED_DIGEST"
          echo "digest=$pushed_digest" >> "$GITHUB_OUTPUT"
          echo "Pushed $IMAGE:$VERSION@$pushed_digest"
          echo "Image: \`$IMAGE:$VERSION@$pushed_digest\`" >> "$GITHUB_STEP_SUMMARY"

      # The attest action pushes the attestation with Docker's credentials, not skopeo's
      # authfile above, so it needs its own login; the logout step removes it again.
      - name: Log in to the registry for the attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Attest the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Log out of the registry
        if: always()
        run: docker logout ghcr.io

  go-tag:
    name: Tag the Go module and record the images in the release
    needs: [verify, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the Go module tag and edit the release notes
    env:
      GH_TOKEN: ${{ github.token }}
      # This job has no checkout, so gh cannot infer the repository from a git remote.
      GH_REPO: ${{ github.repository }}
      COMMIT: ${{ needs.verify.outputs.commit }}
      GO_TAG: sdk/vibesys-evaluator/go/v${{ needs.verify.outputs.go_version }}
    steps:
      - name: Tag the Go module
        run: |
          # matching-refs answers an empty list when the tag does not exist; git/ref/tags answers
          # 404 with its error body on stdout, which must not be read as an existing tag (rc2).
          existing="$(gh api "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/$GO_TAG" \
            --jq "map(select(.ref == \"refs/tags/$GO_TAG\")) | .[0].object.sha // \"\"")"
          if [[ -z "$existing" ]]; then
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
              -f ref="refs/tags/$GO_TAG" -f sha="$COMMIT" > /dev/null
            echo "Tagged $GO_TAG at $COMMIT"
          elif [[ "$existing" != "$COMMIT" ]]; then
            echo "::error::$GO_TAG already points at $existing, not $COMMIT. A Go module version is never moved; publish a new version."
            exit 1
          else
            echo "$GO_TAG already points at $COMMIT"
          fi

      # Editing the release keeps it off GitHub's "latest" marker, which belongs to the vibesys
      # Python releases (publishing.md).
      # Each image job pushed exactly the verified digest (it checks), so the verified digests
      # are the published ones.
      - name: Record the image digests in the release notes
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          DIGEST_MICROSERVICES: ${{ needs.verify.outputs.digest_microservices }}
          DIGEST_LLM_SERVING: ${{ needs.verify.outputs.digest_llm_serving }}
        run: |
          gh release view "$TAG" --json body --jq .body > "$RUNNER_TEMP/notes.md"
          for domain in $DOMAINS; do
            if [[ "$domain" == microservices ]]; then digest="$DIGEST_MICROSERVICES"; else digest="$DIGEST_LLM_SERVING"; fi
            image="$IMAGE_PREFIX-$domain"
            line="Image: \`$image:$VERSION@$digest\` (provenance: \`gh attestation verify oci://$image@$digest --repo $GITHUB_REPOSITORY\`)."
            if ! grep -qF "$digest" "$RUNNER_TEMP/notes.md"; then
              printf '\n\n%s\n' "$line" >> "$RUNNER_TEMP/notes.md"
            fi
          done
          if ! grep -qF "Go module: \`$GO_TAG\`" "$RUNNER_TEMP/notes.md"; then
            printf '\n\nGo module: \`%s\`.\n' "$GO_TAG" >> "$RUNNER_TEMP/notes.md"
          fi
          gh release edit "$TAG" --verify-tag --latest=false --notes-file "$RUNNER_TEMP/notes.md"
