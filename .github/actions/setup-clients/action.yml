name: Set up the client workspace
description: >-
  Node, a cached pnpm binary and store, the cached Electron binary, verified
  Bun, uv with the Python dev environment, the cached native replays the tests
  read, the `clients/` workspace install, and Go for repoctl. Every client job
  of test.yml starts from this, so the
  legs cannot drift apart. Set `playwright` to install cached Chromium using
  the runner-provided system libraries for end-to-end jobs.

inputs:
  playwright:
    description: >-
      Install the cached Chromium browser using the runner system libraries. Client
      end-to-end jobs set this; other client jobs leave it off.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 24

    # pnpm's store cache does not hold the pnpm binary. corepack installs that
    # from the npm registry into COREPACK_HOME. Electron's postinstall reads
    # the two cache variables below; the pnpm store does not hold that zip.
    - name: Pin client download locations
      shell: bash
      run: |
        echo "PNPM_VERSION=11.11.0" >> "$GITHUB_ENV"
        echo "COREPACK_HOME=$HOME/.cache/node/corepack" >> "$GITHUB_ENV"
        echo "ELECTRON_CACHE=$HOME/.cache/electron" >> "$GITHUB_ENV"
        echo "electron_config_cache=$HOME/.cache/electron" >> "$GITHUB_ENV"

    - name: Cache the pnpm binary
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.COREPACK_HOME }}
        key: pnpm-binary-${{ runner.os }}-${{ env.PNPM_VERSION }}

    # An exact version already present under COREPACK_HOME is reused with no
    # registry request. After that, corepack must not reach the network again.
    - name: Enable pnpm
      shell: bash
      run: |
        corepack enable
        bash "$GITHUB_WORKSPACE/.github/actions/setup-clients/retry-download.sh" \
          corepack install --global "pnpm@${PNPM_VERSION}"
        echo "COREPACK_ENABLE_NETWORK=0" >> "$GITHUB_ENV"

    # Resolved after pnpm exists rather than hardcoded: the store location is
    # pnpm's to choose, and a wrong path caches an empty directory silently.
    - name: Locate the pnpm store
      shell: bash
      run: echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

    - name: Cache the pnpm store
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.PNPM_STORE_PATH }}
        key: pnpm-store-${{ runner.os }}-${{ hashFiles('clients/pnpm-lock.yaml') }}
        # A lockfile bump usually changes a handful of packages, so an older
        # store is still worth most of its download cost.
        restore-keys: pnpm-store-${{ runner.os }}-

    - name: Set up verified Bun 1.4.2 for client tests
      shell: bash
      run: |
        bash "$GITHUB_WORKSPACE/.github/actions/setup-clients/retry-download.sh" \
          python3 packaging/fetch_bun.py --target linux-x86_64 --output "$RUNNER_TEMP/bun/bin/bun"
        echo "$RUNNER_TEMP/bun/bin" >> "$GITHUB_PATH"

    - name: Install uv
      uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
      with:
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Set up Python
      shell: bash
      run: |
        bash "$GITHUB_WORKSPACE/.github/actions/setup-clients/retry-download.sh" \
          uv python install 3.12

    - name: Install Python dependencies
      shell: bash
      run: |
        bash "$GITHUB_WORKSPACE/.github/actions/setup-clients/retry-download.sh" \
          uv sync --dev

    # The native replays that the run page tests and the desktop e2e read are generated from their
    # declarations, not committed (tests/support/derived_replays.py). The key is the hash of every
    # file they derive from, computed by the module that owns that list, so none is repeated here.
    # A job that restores the set pays seconds; the first job to see a new key generates it in its
    # test step (about 90 s) and saves it for the runs after.
    - name: Key the derived replays
      id: derived-replays
      shell: bash
      run: python3 -m tests.support.derived_replays key >> "$GITHUB_OUTPUT"

    - name: Cache the derived replays
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.derived-replays.outputs.path }}
        key: derived-replays-${{ runner.os }}-${{ steps.derived-replays.outputs.key }}

    - name: Resolve the Electron version
      id: electron
      shell: bash
      run: |
        version="$(python3 scripts/client_ci_downloads.py clients/pnpm-lock.yaml)"
        echo "version=$version" >> "$GITHUB_OUTPUT"

    - name: Cache the Electron binary
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ env.ELECTRON_CACHE }}
        key: electron-${{ runner.os }}-${{ steps.electron.outputs.version }}

    - name: Install client dependencies
      shell: bash
      working-directory: clients
      run: |
        bash "$GITHUB_WORKSPACE/.github/actions/setup-clients/retry-download.sh" \
          pnpm install --frozen-lockfile

    # The workspace scripts run through Turborepo; CI keeps no Turborepo cache
    # between runs and sends it no telemetry.
    - name: Disable Turborepo telemetry
      shell: bash
      run: echo "TURBO_TELEMETRY_DISABLED=1" >> "$GITHUB_ENV"

    - name: Set up Go for repoctl
      uses: actions/setup-go@v5
      with:
        go-version-file: support/repoctl/go.mod
        cache-dependency-path: |
          support/repoctl/go.sum
          gateway/go.sum

    - name: Resolve the Playwright version
      id: playwright
      if: inputs.playwright == 'true'
      shell: bash
      working-directory: clients
      run: echo "version=$(pnpm --filter @vibesys/app-desktop-main exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

    # Ubuntu runners already provide Chromium runtime libraries and Xvfb.
    # Cache the browser separately by the resolved Playwright version.
    - name: Cache the Playwright browsers
      if: inputs.playwright == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-chromium-${{ runner.os }}-${{ steps.playwright.outputs.version }}

    - name: Install Chromium for client end-to-end tests
      if: inputs.playwright == 'true'
      shell: bash
      working-directory: clients
      run: |
        # The green clients-e2e job 119777039202 confirmed runtime libraries
        # were preinstalled; apt only added fonts and upgraded existing packages.
        # Avoid refreshing and downloading those packages on every e2e shard.
        bash "$GITHUB_WORKSPACE/.github/actions/setup-clients/retry-download.sh" \
          timeout --kill-after=5s 60s pnpm --filter @vibesys/app-desktop-main exec playwright install chromium
