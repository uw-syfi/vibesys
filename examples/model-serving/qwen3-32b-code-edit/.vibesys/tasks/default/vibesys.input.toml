version = 1
backends = ["cuda"]

[agent]
domain = "llm-serving"

[accuracy]
command = ["uv", "run", "python", "${PROJECT_ROOT}/.vibesys/tasks/default/accuracy_checker/checker.py"]
timeout_seconds = 120

[benchmark]
command = ["uv", "run", "python", "${PROJECT_ROOT}/.vibesys/tasks/default/benchmark/benchmark.py"]
timeout_seconds = 300

[benchmark.result]
json_argument = "--output-json"
metric = "median_tok_per_sec"

[catalogue]
domain = "llm-serving"

[catalogue.hardware]
accelerator = "NVIDIA H100"
count = 1
vendor = "nvidia"

[catalogue.model]
name = "Qwen3 32B"
maker = "qwen"
