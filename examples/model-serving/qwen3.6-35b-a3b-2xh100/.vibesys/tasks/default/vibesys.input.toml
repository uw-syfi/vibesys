version = 1
backends = ["cuda"]

[agent]
domain = "llm-serving"

[accuracy]
command = ["uv", "run", "python", "${PROJECT_ROOT}/.vibesys/tasks/default/accuracy_checker/checker.py"]
timeout_seconds = 300

[evaluator]
name = "vibesys-evaluator-request-factory"
version = "0.1.0"

[benchmark]
entrypoint = "request-factory-fixed-text-v1"
args = [
  "--model", "Qwen/Qwen3.6-35B-A3B",
  "--tokenizer", "Qwen/Qwen3.6-35B-A3B",
  "--tokenizer-revision", "995ad96eacd98c81ed38be0c5b274b04031597b0",
  "--request-count", "64",
  "--input-tokens", "256",
  "--output-tokens", "128",
  "--concurrency", "16",
]
timeout_seconds = 600
result_protocol = 2

[catalogue]
domain = "llm-serving"

[catalogue.hardware]
accelerator = "NVIDIA H100"
count = 2
vendor = "nvidia"

[catalogue.model]
name = "Qwen3.6 35B A3B"
maker = "qwen"
