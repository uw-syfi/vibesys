version = 1
backends = ["rocm"]

[agent]
domain = "llm-serving"

[resources]
nodes = 1
accelerators_per_node = 4
accelerator_backend = "rocm"

# Both programs boot the candidate's `python3 server.py` themselves (startup
# budget 5400s) and run from the workspace root.
[accuracy]
command = ["python3", "${PROJECT_ROOT}/.vibesys/tasks/default/accuracy_checker/checker.py"]
timeout_seconds = 7200

# Two objectives (see objectives.toml), so the single-scalar [benchmark.result]
# block cannot represent the result: the benchmark speaks the evaluator result
# protocol instead. VibeSys appends `--vs-output <path>` and reads the complete
# metric row from the record stream written there.
[benchmark]
command = ["python3", "${PROJECT_ROOT}/.vibesys/tasks/default/benchmark/run.py", "--repetitions", "1"]
timeout_seconds = 9000
result_protocol = 2

[catalogue]
domain = "llm-serving"

[catalogue.hardware]
accelerator = "AMD MI300A"
count = 4
vendor = "amd"

[catalogue.model]
name = "Qwen3.5 397B A17B MXFP4"
maker = "qwen"
