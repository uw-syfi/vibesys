version = 1

[agent]
domain = "llm-serving"

[resources]
nodes = 1
accelerators_per_node = 4
accelerator_backend = "rocm"

# Both programs boot the candidate's `python3 server.py` themselves (startup
# budget 5400s) and run from the workspace root.
[accuracy]
command = ["python3", "accuracy_checker/checker.py"]
timeout_seconds = 7200

[benchmark]
command = ["python3", "benchmark/run.py", "--repetitions", "1"]
timeout_seconds = 9000

[benchmark.result]
json_argument = "--output-json"
metric = "p95_ttft_turn2plus_ms"
