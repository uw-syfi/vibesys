# CPU-only environment for the baseline engine's tiny-model HTTP check (`pytest cpu_check`).
# Separate from the project's requirements files, which serve the real checkpoint on GPUs:
# this one needs only the CPU torch wheel and pins the engine's other dependencies to the
# versions requirements-agentx.txt names.
[project]
name = "qwen3.6-35b-a3b-cpu-check"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
  "accelerate==1.12.0",
  "httpx==0.28.1",
  "torch==2.9.1",
  "transformers==5.22.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cpu", marker = "sys_platform == 'linux'" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
