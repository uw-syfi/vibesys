# Qwen3.6-35B-A3B on 4 AMD MI210 GPUs, AgentX replay: a task of two images for vibesys-cli
# (schema 0.2). The candidate's server runs in the image Dockerfile.rocm builds from the
# candidate's commit, with the task's AMD GPUs; this directory is the task image (Dockerfile
# here), which runs the checker and the replay against the server at VIBESYS_SERVICE_URL.
version = "0.2"
backends = ["rocm"]

[agent]
domain = "llm-serving"
interface = "service"

# The operator provides the AMD GPUs, and the Hugging Face cache as the read-only mount named
# "hf" (/vibesys/mounts/hf), which both images read offline: Qwen/Qwen3.6-35B-A3B at the pinned
# revision (weights for the server, tokenizer for the replay) and the prepared AgentX corpus.
[environment]
needs = ["rocm", "mounts"]

[candidate]
dockerfile = "Dockerfile.rocm"
context = "."
serve = ["python", "-m", "engine.server", "--host", "127.0.0.1", "--port", "${PORT}"]
ready = "/health"
# Loading about 70 GB of BF16 weights from the shared file system onto the GPUs.
startup_timeout_seconds = 1800

# The shared service checker (sentinel echo, known answers, greedy repeatability).
[accuracy]
command = ["sh", "-c", "exec python3 -I /task/checker.py --url \"$VIBESYS_SERVICE_URL\""]
timeout_seconds = 300

# The AgentX replay in full mode, the recipe of the earlier `agentx-v1` evaluator: the June 21
# corpus, seed 42, four concurrent session trees, the 262,144-token context, ten warmup requests
# per lane and 900 s of measurement. `python /task/bench.py profile` is its unscored smoke replay.
[benchmark]
command = ["python", "/task/bench.py", "benchmark"]
timeout_seconds = 10800
result_protocol = 2

[catalogue]
domain = "llm-serving"

[catalogue.hardware]
accelerator = "AMD MI210"
count = 4
vendor = "amd"

[catalogue.model]
name = "Qwen3.6 35B A3B"
maker = "qwen"
