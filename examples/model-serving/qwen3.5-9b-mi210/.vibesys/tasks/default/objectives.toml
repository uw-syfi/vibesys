# Throughput is the headline objective, read from the benchmark result JSON
# (vibesys.input.toml, [benchmark.result] metric). The latency objectives are read from
# the same result JSON's nested fields:
#   ttft_p50_ms = ttft_ms.p50    ttft_p90_ms = ttft_ms.p90
#   tpot_p50_ms = tpot_ms.p50    tpot_p90_ms = tpot_ms.p90
# and recorded beside each sample (measurements.py record --observations).
# The goal is the throughput/latency Pareto frontier, not a single winner.

[[objective]]
name = "output_tokens_per_s"
direction = "max"

[[objective]]
name = "ttft_p50_ms"
direction = "min"

[[objective]]
name = "ttft_p90_ms"
direction = "min"

[[objective]]
name = "tpot_p50_ms"
direction = "min"

[[objective]]
name = "tpot_p90_ms"
direction = "min"

[pareto]
relative_noise = 0.03
