version = "0.1"
backends = ["cuda"]

[agent]
domain = "llm-serving"
# The accuracy checker and the benchmark reach the candidate only over its HTTP API.
interface = "service"

[evaluator]
name = "vibesys-evaluator-request-factory"
version = "0.1.0"

[accuracy]
# The clip directory is named so that a run environment that stages only the directories
# a command names (Modal) copies it next to the checker.
command = [
  "uv", "run", "python", "${PROJECT_ROOT}/.vibesys/tasks/default/accuracy_checker/checker.py",
  "--audio-dir", "${PROJECT_ROOT}/.vibesys/tasks/default/test_audio",
]
timeout_seconds = 300

[benchmark]
entrypoint = "request-factory-engine"
args = [
  "--trace", "${PROJECT_ROOT}/.vibesys/tasks/default/benchmark/requests.jsonl",
  "--input-file-format", "multimodal-independent-v1",
  "--base-url", "http://localhost:8000/v1",
  "--model", "whisper-large-v3",
  "--backend", "openai-transcriptions",
  "--dialect", "openai",
  "--temperature", "0",
  "--arrival-mode", "saturated",
  "--max-concurrency", "8",
  "--request-log", "false",
  "--timeline", "false",
]
timeout_seconds = 600

[benchmark.result]
json_argument = "--summary-path"
metric = "request_throughput_per_s"

[catalogue]
domain = "llm-serving"

[catalogue.hardware]
accelerator = "NVIDIA GPU"
count = 1
vendor = "nvidia"

[catalogue.model]
name = "Whisper large v3"
maker = "openai"
