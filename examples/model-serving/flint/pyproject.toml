[project]
name = "flint-amd-agentx-input"
version = "0.1.0"
requires-python = ">=3.12,<3.14"
dependencies = [
  "accelerate==1.12.0",
  "httpx==0.28.1",
  "pytorch-triton-rocm",
  "torch==2.9.1",
  "transformers==5.22.1",
]

[tool.uv]
package = false
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-rocm" }
pytorch-triton-rocm = { index = "pytorch-rocm" }

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm6.4"
explicit = true
