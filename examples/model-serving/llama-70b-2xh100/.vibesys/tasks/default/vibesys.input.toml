version = 1
backends = ["cuda"]

[agent]
domain = "llm-serving"

[accuracy]
command = ["uv", "run", "python", "${PROJECT_ROOT}/.vibesys/tasks/default/accuracy_checker/checker.py"]
timeout_seconds = 300

[evaluator]
name = "vibesys-evaluator-request-factory"
version = "0.1.0"

[benchmark]
entrypoint = "request-factory-fixed-text-v1"
args = [
  "--model", "meta-llama/Llama-3.3-70B-Instruct",
  "--tokenizer", "meta-llama/Llama-3.3-70B-Instruct",
  "--tokenizer-revision", "6f6073b423013f6a7d4d9f39144961bfbfbc386b",
  "--request-count", "64",
  "--input-tokens", "256",
  "--output-tokens", "128",
  "--concurrency", "8",
]
timeout_seconds = 600
result_protocol = 2

[catalogue]
domain = "llm-serving"

[catalogue.hardware]
accelerator = "NVIDIA H100"
count = 2
vendor = "nvidia"

[catalogue.model]
name = "Llama 3.3 70B Instruct"
maker = "meta"
