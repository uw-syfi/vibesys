version = 1
backends = ["cuda"]

[agent]
domain = "llm-serving"

[accuracy]
command = ["uv", "run", "python", "${PROJECT_ROOT}/.vibesys/tasks/from-scratch/accuracy_checker/checker.py"]
timeout_seconds = 120

[benchmark]
command = ["uv", "run", "python", "${PROJECT_ROOT}/.vibesys/tasks/from-scratch/benchmark/benchmark.py"]
timeout_seconds = 300

[benchmark.result]
json_argument = "--output-json"
metric = "aggregate_throughput_tok_per_sec"

[catalogue]
domain = "llm-serving"

[catalogue.hardware]
accelerator = "NVIDIA L4"
count = 1
vendor = "nvidia"

[catalogue.model]
name = "Olmo Hybrid 7B"
maker = "ai2"
