version = 1
backends = ["cuda"]

[agent]
domain = "llm-serving"

[accuracy]
command = ["uv", "run", "python", "${PROJECT_ROOT}/.vibesys/tasks/vllm/accuracy_checker/checker.py"]
timeout_seconds = 120

[benchmark]
command = ["uv", "run", "python", "${PROJECT_ROOT}/.vibesys/tasks/vllm/benchmark/benchmark.py"]
timeout_seconds = 300

[benchmark.result]
json_argument = "--output-json"
metric = "aggregate_throughput_tok_per_sec"

[[workspace.sources]]
name = "vllm"
repo = "https://github.com/vllm-project/vllm"
commit = "568afb3a13806beb53bb2e6bd518269357b237c0"
dest = "vllm"

[catalogue]
domain = "llm-serving"

[catalogue.hardware]
accelerator = "NVIDIA L4"
count = 1
vendor = "nvidia"

[catalogue.model]
name = "Olmo Hybrid 7B"
maker = "ai2"
