version = 1

[agent]
domain = "llm-serving"

[accuracy]
command = ["uv", "run", "python", "accuracy_checker/checker.py"]
timeout_seconds = 600

[benchmark]
entrypoint = "request-factory-adapter"
args = ["benchmark/benchmark.py"]
timeout_seconds = 1800
result_protocol = 2

[evaluator]
name = "vibesys-evaluator-request-factory"
version = "0.1.0"
