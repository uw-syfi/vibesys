version = 1
backends = ["metal"]

[agent]
domain = "llm-serving"

[accuracy]
command = ["uv", "run", "python", "${PROJECT_ROOT}/.vibesys/tasks/macbook/accuracy_checker/checker.py"]
timeout_seconds = 120

[benchmark]
command = ["uv", "run", "python", "${PROJECT_ROOT}/.vibesys/tasks/macbook/benchmark/benchmark.py"]
timeout_seconds = 300

[catalogue]
domain = "llm-serving"

[catalogue.hardware]
accelerator = "Apple Silicon"
count = 1
vendor = "apple"

[catalogue.model]
name = "Show-o2 1.5B HQ"
maker = "other"
