version = 1
backends = ["cuda"]

[agent]
domain = "llm-serving"

[accuracy]
command = ["uv", "run", "python", "${PROJECT_ROOT}/.vibesys/tasks/h100/accuracy_checker/checker.py"]
timeout_seconds = 120

[benchmark]
command = ["uv", "run", "python", "${PROJECT_ROOT}/.vibesys/tasks/h100/benchmark/benchmark.py"]
timeout_seconds = 300

[catalogue]
domain = "llm-serving"

[catalogue.hardware]
accelerator = "NVIDIA H100"
count = 1
vendor = "nvidia"

[catalogue.model]
name = "Show-o2 1.5B HQ"
maker = "other"
