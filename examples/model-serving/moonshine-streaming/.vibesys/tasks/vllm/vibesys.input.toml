version = 1
backends = ["cuda"]

[agent]
domain = "llm-serving"

[accuracy]
command = ["uv", "run", "python", "${PROJECT_ROOT}/.vibesys/tasks/vllm/accuracy_checker/checker.py"]
timeout_seconds = 120

[benchmark]
command = ["uv", "run", "python", "${PROJECT_ROOT}/.vibesys/tasks/vllm/benchmark/benchmark.py"]
timeout_seconds = 300

[[workspace.sources]]
name = "vllm"
repo = "https://github.com/vllm-project/vllm"
commit = "568afb3a13806beb53bb2e6bd518269357b237c0"
dest = "vllm"

[catalogue]
domain = "llm-serving"

[catalogue.hardware]
accelerator = "NVIDIA GPU"
count = 1
vendor = "nvidia"

[catalogue.model]
name = "Moonshine Streaming Medium"
maker = "other"
