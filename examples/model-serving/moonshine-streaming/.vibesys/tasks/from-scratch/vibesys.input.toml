version = "0.1"
backends = ["cuda"]

[agent]
domain = "llm-serving"
# The accuracy checker and the benchmark reach the candidate only over its HTTP API.
interface = "service"

[accuracy]
# The clip directory is named so that a run environment that stages only the directories
# a command names (Modal) copies it next to the checker.
command = [
  "uv", "run", "python", "${PROJECT_ROOT}/.vibesys/tasks/from-scratch/accuracy_checker/checker.py",
  "--audio-dir", "${PROJECT_ROOT}/.vibesys/tasks/from-scratch/test_audio",
]
timeout_seconds = 120

[benchmark]
command = ["uv", "run", "python", "${PROJECT_ROOT}/.vibesys/tasks/from-scratch/benchmark/benchmark.py"]
timeout_seconds = 300

[catalogue]
domain = "llm-serving"

[catalogue.hardware]
accelerator = "NVIDIA GPU"
count = 1
vendor = "nvidia"

[catalogue.model]
name = "Moonshine Streaming Medium"
maker = "other"
