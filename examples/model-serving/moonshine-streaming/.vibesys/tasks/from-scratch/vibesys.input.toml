version = 1
backends = ["cuda"]

[agent]
domain = "llm-serving"

[accuracy]
command = ["uv", "run", "python", "${PROJECT_ROOT}/.vibesys/tasks/from-scratch/accuracy_checker/checker.py"]
timeout_seconds = 120

[benchmark]
command = ["uv", "run", "python", "${PROJECT_ROOT}/.vibesys/tasks/from-scratch/benchmark/benchmark.py"]
timeout_seconds = 300

[catalogue]
domain = "llm-serving"

[catalogue.hardware]
accelerator = "NVIDIA GPU"
count = 1
vendor = "nvidia"

[catalogue.model]
name = "Moonshine Streaming Medium"
maker = "other"
