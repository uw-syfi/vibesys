version = 1
backends = ["metal"]

[agent]
domain = "llm-serving"

[accuracy]
command = ["uv", "run", "python", "${PROJECT_ROOT}/.vibesys/tasks/default/accuracy_checker/checker.py"]
timeout_seconds = 120

[benchmark]
command = ["uv", "run", "python", "${PROJECT_ROOT}/.vibesys/tasks/default/benchmark/benchmark.py"]
timeout_seconds = 300

[catalogue]
domain = "llm-serving"

[catalogue.hardware]
accelerator = "Apple Silicon"
count = 1
vendor = "apple"

[catalogue.model]
name = "Llama 3.1 8B Instruct"
maker = "meta"
