[project]
name = "jsonschemabench-judge"
version = "0.1.0"
description = "The environment bench.py runs in: the judge, not the candidate."
requires-python = ">=3.12"
# Pinned exactly: this file and uv.lock are trusted task files, read-only to the agent, so the
# candidate cannot change what judges it. The candidate's own environment is the project root's.
dependencies = [
  "vibesys-evaluator==0.3.0rc3",
  "httpx==0.28.1",
  "huggingface-hub==2.4.0",
  "jsonschema==4.26.0",
  "pyarrow==26.0.1",
  "tokenizers==0.23.3",
]

[tool.uv]
package = false
