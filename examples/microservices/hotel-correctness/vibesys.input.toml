version = 1

[agent]
domain = "microservices"

[evaluator]
name = "vibesys-evaluator-microservice"
version = "0.1.0"

[accuracy]
entrypoint = "hotel-correctness"
args = [
  "--candidate-dir", "${PROJECT_ROOT}/deathstarbench/hotelReservation",
  "--seed", "148622",
  "--cases", "4",
  "--report", "/tmp/vibesys-hotel-reservation/user-correctness.json",
]
timeout_seconds = 900

[benchmark]
entrypoint = "servicebench"
args = [
  "trace",
  "--workload", "${PACKAGE_ROOT}/hotelcorrectness/workload.toml",
  "--seed", "random",
  "--fixture-seed", "random",
  "--candidate-dir", "${PROJECT_ROOT}/deathstarbench/hotelReservation",
  "--run-command-json", "[\"sh\",\"-c\",\"rm -f /tmp/vibesys-hotel-reservation/otel/traces.otlp.ndjson && go -C \\\"$1\\\" run ./cmd/otelinject --compose \\\"$2\\\" --config \\\"$3\\\" --metrics-dir /tmp/vibesys-hotel-reservation/otel --output /tmp/vibesys-hotel-reservation/otel/compose.telemetry.yaml && docker compose -f \\\"$2\\\" -f /tmp/vibesys-hotel-reservation/otel/compose.telemetry.yaml up -d --build\",\"vibesys-hotel-run\",\"${PACKAGE_ROOT}\",\"${PROJECT_ROOT}/deathstarbench/hotelReservation/docker-compose.yml\",\"${PACKAGE_ROOT}/hotelcorrectness/telemetry.toml\"]",
  "--stop-command-json", "[\"docker\",\"compose\",\"stop\",\"-t\",\"10\",\"frontend\",\"geo\",\"profile\",\"rate\",\"recommendation\",\"reservation\",\"search\",\"user\"]",
  "--cleanup-command-json", "[\"docker\",\"compose\",\"down\",\"-v\",\"--remove-orphans\"]",
  "--startup-timeout", "120",
  "--telemetry-command-json", "[\"go\",\"-C\",\"${PACKAGE_ROOT}\",\"run\",\"./cmd/otelcapture\",\"--input-json\",\"/tmp/vibesys-hotel-reservation/otel/traces.otlp.ndjson\",\"--settle-seconds\",\"5\"]",
  "--telemetry-output", "/tmp/vibesys-hotel-reservation/otel/telemetry.json",
  "--trace-graph-json", "/tmp/vibesys-hotel-reservation/otel/trace-graph.json",
  "--telemetry-timeout", "60",
]
timeout_seconds = 360

[benchmark.result]
json_argument = "--output-json"
metric = "primary_value"

[[workspace.sources]]
name = "deathstarbench"
repo = "https://github.com/vibesys-playground/DeathStarBench.git"
commit = "867806e575e1f7fb24437ae969910ddb17a76121"
dest = "deathstarbench"
