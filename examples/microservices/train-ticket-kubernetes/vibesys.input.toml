version = 1

[agent]
domain = "microservices"

[evaluator]
name = "vibesys-evaluator-microservice"
version = "0.1.0"

[accuracy]
entrypoint = "kubernetes-runtime"
args = [
  "--config", "${PACKAGE_ROOT}/kubernetes_examples/train-ticket/runtime.yaml",
  "--candidate-dir", "${PROJECT_ROOT}",
  "--",
  "go", "-C", "${PACKAGE_ROOT}", "run", "./cmd/servicebench",
  "--mode", "accuracy",
  "--workload", "${PACKAGE_ROOT}/kubernetes_examples/train-ticket/workload.toml",
  "--seed", "random",
  "--target", "config=${ENDPOINT:config}",
  "--target", "station=${ENDPOINT:station}",
  "--target", "train=${ENDPOINT:train}",
  "--target", "travel=${ENDPOINT:travel}",
  "--target", "route=${ENDPOINT:route}",
  "--target", "price=${ENDPOINT:price}",
]
timeout_seconds = 1200

[benchmark]
entrypoint = "kubernetes-runtime"
args = [
  "--config", "${PACKAGE_ROOT}/kubernetes_examples/train-ticket/runtime.yaml",
  "--candidate-dir", "${PROJECT_ROOT}",
  "--",
  "go", "-C", "${PACKAGE_ROOT}", "run", "./cmd/servicebench",
  "--workload", "${PACKAGE_ROOT}/kubernetes_examples/train-ticket/workload.toml",
  "--seed", "random",
  "--fixture-seed", "random",
  "--target", "config=${ENDPOINT:config}",
  "--target", "station=${ENDPOINT:station}",
  "--target", "train=${ENDPOINT:train}",
  "--target", "travel=${ENDPOINT:travel}",
  "--target", "route=${ENDPOINT:route}",
  "--target", "price=${ENDPOINT:price}",
]
timeout_seconds = 1200

[benchmark.result]
json_argument = "--output-json"
metric = "primary_value"

[[workspace.sources]]
name = "train-ticket"
repo = "https://github.com/FudanSELab/train-ticket.git"
commit = "350f62000e6658e0e543730580c599d8558253e7"
dest = "train-ticket"
