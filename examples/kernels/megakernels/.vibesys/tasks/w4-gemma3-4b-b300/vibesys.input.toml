version = "0.1"
backends = ["cuda"]

[agent]
domain = "kernel-writing"

[accuracy]
command = ["python", "${PROJECT_ROOT}/.vibesys/shared/evaluate.py", "accuracy", "--task", "w4-gemma3-4b-b300"]
timeout_seconds = 1800

[benchmark]
command = ["python", "${PROJECT_ROOT}/.vibesys/shared/evaluate.py", "benchmark", "--task", "w4-gemma3-4b-b300"]
timeout_seconds = 2400

[benchmark.result]
json_argument = "--output-json"
metric = "kernel_latency_ms"

[catalogue]
domain = "kernel-writing"

[catalogue.hardware]
accelerator = "NVIDIA B300"
count = 1
vendor = "nvidia"
