version = "0.1"
backends = ["trainium"]

[agent]
domain = "kernel-writing"

[accuracy]
command = ["python", "${PROJECT_ROOT}/.vibesys/shared/evaluate.py", "accuracy", "--task", "world-waypoint1.5-1b-trn2"]
timeout_seconds = 3000

[benchmark]
command = ["python", "${PROJECT_ROOT}/.vibesys/shared/evaluate.py", "benchmark", "--task", "world-waypoint1.5-1b-trn2", "--benchmark-trials", "1"]
timeout_seconds = 3000

[benchmark.result]
json_argument = "--output-json"
metric = "kernel_latency_ms"

[catalogue]
domain = "kernel-writing"

[catalogue.hardware]
accelerator = "AWS Trainium2"
count = 1
vendor = "aws"
