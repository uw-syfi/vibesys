version = 1
backends = ["cpu"]

[agent]
domain = "generic"

[evaluator]
name = "vibesys-evaluator-priority-queue"
version = "0.1.0"

[accuracy]
entrypoint = "vibesys-priority-queue"
args = [
  "check", "--workspace", "${PROJECT_ROOT}",
  "--scenario", "mpsc", "--operations", "24", "--trials", "50",
]
timeout_seconds = 120

[benchmark]
entrypoint = "vibesys-priority-queue"
args = [
  "benchmark", "--workspace", "${PROJECT_ROOT}",
  "--scenario", "mpsc", "--repetitions", "3",
]
timeout_seconds = 300

[benchmark.result]
json_argument = "--output-json"
metric = "total_ops_per_sec"

[catalogue]
domain = "data-structures"

[catalogue.hardware]
accelerator = "CPU"
count = 1
vendor = "cpu"

[catalogue.workload]
name = "Multiple producers, single consumer"
description = "A bounded priority queue where several threads add items and one thread removes them; checked for linearizability, scored in operations per second."
