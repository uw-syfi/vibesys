version = 1
backends = ["cpu"]

[agent]
domain = "generic"

[evaluator]
name = "vibesys-evaluator-unordered-map"
version = "0.1.0"

[accuracy]
entrypoint = "vibesys-unordered-map"
args = [
  "check", "--workspace", "${PROJECT_ROOT}",
  "--scenario", "mw", "--operations", "24", "--trials", "100",
]
timeout_seconds = 120

[benchmark]
entrypoint = "vibesys-unordered-map"
args = [
  "benchmark", "--workspace", "${PROJECT_ROOT}",
  "--scenario", "mw", "--repetitions", "3",
]
timeout_seconds = 300

[benchmark.result]
json_argument = "--output-json"
metric = "total_ops_per_sec"

[catalogue]
domain = "data-structures"

[catalogue.hardware]
accelerator = "CPU"
count = 1
vendor = "cpu"

[catalogue.workload]
name = "Mixed, multiple writers"
description = "A concurrent unordered map where several threads put, get and remove keys at once; checked for linearizability, scored in operations per second."
