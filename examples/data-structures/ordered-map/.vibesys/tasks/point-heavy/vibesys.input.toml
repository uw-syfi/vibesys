version = 1
backends = ["cpu"]

[agent]
domain = "generic"

[evaluator]
name = "vibesys-evaluator-ordered-map"
version = "0.1.0"

[accuracy]
entrypoint = "vibesys-ordered-map"
args = [
  "check", "--workspace", "${PROJECT_ROOT}",
  "--scenario", "point-heavy", "--operations", "24", "--trials", "100",
]
timeout_seconds = 120

[benchmark]
entrypoint = "vibesys-ordered-map"
args = [
  "benchmark", "--workspace", "${PROJECT_ROOT}",
  "--scenario", "point-heavy", "--repetitions", "3",
]
timeout_seconds = 300

[benchmark.result]
json_argument = "--output-json"
metric = "total_ops_per_sec"

[catalogue]
domain = "data-structures"

[catalogue.hardware]
accelerator = "CPU"
count = 1
vendor = "cpu"

[catalogue.workload]
name = "Point operations dominate"
description = "A concurrent ordered map where most operations are single-key puts, gets and removes, with some ordered queries; checked for linearizability, scored in operations per second."
