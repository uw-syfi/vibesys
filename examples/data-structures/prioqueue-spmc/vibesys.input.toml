version = 1

[agent]
domain = "generic"

[workspace]
seed = "../../starters/priority-queue-rs"

[evaluator]
source = "../../evaluators/priority-queue"

[accuracy]
command = [
  "go", "-C", "_evaluator/priority-queue",
  "run", ".", "check", "--workspace", "../..",
  "--scenario", "spmc", "--operations", "24", "--trials", "50",
]
timeout_seconds = 120

[benchmark]
command = [
  "go", "-C", "_evaluator/priority-queue",
  "run", ".", "benchmark", "--workspace", "../..",
  "--scenario", "spmc", "--repetitions", "3",
]
timeout_seconds = 300

[benchmark.result]
json_argument = "--output-json"
metric = "total_ops_per_sec"
