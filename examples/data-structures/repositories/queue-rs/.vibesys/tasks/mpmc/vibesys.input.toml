version = 1
backends = ["cpu"]
metric = "total_ops_per_sec"

[agent]
domain = "generic"

[evaluator]
name = "vibesys-evaluator-queue"
version = "0.1.0"

# Candidate code: runs confined in a fresh checkout of the measured commit and
# must produce queue-candidate.so, which the evaluator requires.
[build]
command = ["make", "queue-candidate.so"]
timeout_seconds = 600

[check]
entrypoint = "vibesys-queue"
args = [
  "check", "--workspace", "${PROJECT_ROOT}",
  "--scenario", "mpmc", "--operations", "24", "--trials", "100",
]
timeout_seconds = 120

[measure]
entrypoint = "vibesys-queue"
args = [
  "benchmark", "--workspace", "${PROJECT_ROOT}",
  "--scenario", "mpmc", "--repetitions", "3",
]
timeout_seconds = 300

[catalogue]
domain = "data-structures"

[catalogue.hardware]
accelerator = "CPU"
count = 1
vendor = "cpu"

[catalogue.workload]
name = "Multiple producers, multiple consumers"
description = "A bounded FIFO queue where several threads add items and several threads remove them; checked for linearizability, scored in operations per second."
