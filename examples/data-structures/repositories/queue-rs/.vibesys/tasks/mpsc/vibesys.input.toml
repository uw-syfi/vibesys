version = 1
metric = "total_ops_per_sec"

[agent]
domain = "generic"

[evaluator]
name = "vibesys-evaluator-queue"
version = "0.1.0"

# Candidate code: runs confined in a fresh checkout of the measured commit and
# must produce queue-candidate.so, which the evaluator requires.
[build]
command = ["make", "queue-candidate.so"]
timeout_seconds = 600

[check]
entrypoint = "vibesys-queue"
args = [
  "check", "--workspace", "${PROJECT_ROOT}",
  "--scenario", "mpsc", "--operations", "24", "--trials", "50",
]
timeout_seconds = 120

[measure]
entrypoint = "vibesys-queue"
args = [
  "benchmark", "--workspace", "${PROJECT_ROOT}",
  "--scenario", "mpsc", "--repetitions", "3",
]
timeout_seconds = 300
