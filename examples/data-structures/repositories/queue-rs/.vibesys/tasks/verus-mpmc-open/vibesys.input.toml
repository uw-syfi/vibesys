version = 1
backends = ["cpu"]

[agent]
domain = "generic"

[accuracy]
command = [
  "python3", ".vibesys/tasks/verus-mpmc-open/runner.py", "check",
]
timeout_seconds = 300

[benchmark]
command = [
  "python3", ".vibesys/tasks/verus-mpmc-open/runner.py", "benchmark",
]
timeout_seconds = 300

[benchmark.result]
json_argument = "--output-json"
metric = "total_ops_per_sec"

[catalogue]
domain = "data-structures"

[catalogue.hardware]
accelerator = "CPU"
count = 1
vendor = "cpu"

[catalogue.workload]
name = "Verified multiple producers, multiple consumers"
description = "A formally verified pure-Rust bounded FIFO queue under several producers and consumers, scored in operations per second."
