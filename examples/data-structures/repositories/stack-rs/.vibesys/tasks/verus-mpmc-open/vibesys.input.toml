version = 1

[agent]
domain = "generic"

[accuracy]
command = [
  "python3", ".vibesys/tasks/verus-mpmc-open/runner.py", "check",
]
timeout_seconds = 300

[benchmark]
command = [
  "python3", ".vibesys/tasks/verus-mpmc-open/runner.py", "benchmark",
]
timeout_seconds = 300

[benchmark.result]
json_argument = "--output-json"
metric = "total_ops_per_sec"
