version = 1
backends = ["cpu"]

[agent]
domain = "database"

[accuracy]
command = ["uv", "run", "python", "${PROJECT_ROOT}/.vibesys/tasks/default/accuracy_checker/checker.py", "--strict"]
timeout_seconds = 3600

[benchmark]
command = ["uv", "run", "python", "${PROJECT_ROOT}/.vibesys/tasks/default/benchmark/benchmark.py"]
timeout_seconds = 1800

[benchmark.result]
json_argument = "--output-json"
metric = "cpu_seconds"

[profile_guided]
command = ["uv", "run", "python", "${PROJECT_ROOT}/.vibesys/tasks/default/profiler/attribute_cpu.py"]
timeout_seconds = 1800
result_protocol = 1
min_measured_rounds = 2
min_relative_improvement = 0.02

[[workspace.sources]]
name = "engine"
repo = "https://github.com/HQingXuan/differential-dataflow-pinned"
commit = "4f05cbb61775a45844a0905de9dacfee1e91dd80"
dest = "engine"
strip_git = true

[[workspace.sources]]
name = "ref_engine"
repo = "https://github.com/HQingXuan/differential-dataflow-pinned"
commit = "4f05cbb61775a45844a0905de9dacfee1e91dd80"
dest = "_ref_engine"
strip_git = true

[catalogue]
domain = "databases"

[catalogue.hardware]
accelerator = "CPU"
count = 1
vendor = "cpu"
