# Registry of every runnable example under examples/. One [[example]] table per example.
# tests/examples/test_example_registry.py iterates this file and fails if a directory
# that looks like an example is missing from it. See docs/contributing/examples.md.
#
# Every example is a project root with its tasks under .vibesys/tasks/<task>/.
# Static checks run for every entry and every task, always: validate (vibesys validate),
# path-refs (${PROJECT_ROOT} paths in commands exist), trust-policy (files the commands
# read are read-only for the agent). Stale examples/ references are checked repo-wide.
# Needing docker, a cluster, a GPU or weights never exempts an example. The registry does
# not track whether any real run exercises an example.
#
#   path        repo-relative example root
#   tasks       "all" (default) or the exact task names on disk
#   external_repo  true (default false) when the task files and app source come from another
#               repository that scripts/example_repositories.py checks out. Only this changes
#               behavior: its checks run in CI (checkout required) and skip locally if absent
#   known_failing  [{ check, reason, tracking }]: strict xfail; the test fails once the check
#               passes, so entries only shrink
#   skips       [{ check, reason }]: a check that cannot run because source is absent from
#               the checkout; the test fails if the skip is no longer needed

version = 1

[[example]]
path = "examples/data-structures/kvstore-default"

[[example]]
path = "examples/data-structures/ordered-map"
known_failing = [
  { check = "candidate-build", reason = "its tasks declare no build of the candidate library its evaluator requires", tracking = "#2964" },
]

