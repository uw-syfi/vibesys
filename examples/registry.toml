# Registry of every runnable example under examples/. One table-array entry per example.
# Tests in tests/architecture/test_example_registry.py iterate this file, and fail if a
# directory that looks like an example is missing from it. See docs/contributing/examples.md.
#
#   path           repo-relative example root
#   layout         "task" (.vibesys/tasks/<task>/) or "legacy" (root vibesys.input.toml)
#   tasks          "all" (default) or the exact task names on disk; legacy: omit
#   requires       overlay | docker | kubernetes | gpu | model-weights
#   status         validated     static checks pass; requires only "overlay"
#                  live-only     static checks pass; a live run needs something CI lacks (reason)
#                  known-failing a listed check fails today (reason, tracking, failing_checks);
#                                the test fails once it passes, so remove the entry then
#   failing_checks validate | trust-policy (known-failing only)
#
# Static checks run in CI for every entry: `vibesys validate` per task, ${PROJECT_ROOT}
# path references exist, and (task layout) evaluator inputs are read-only for the agent.
# No status runs an evaluator: live runs are not covered by CI.


version = 1

[[example]]
path = "examples/data-structures/kvstore-default"
layout = "task"
requires = []
status = "validated"

