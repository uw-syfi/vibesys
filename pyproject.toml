[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vibesys"
version = "0.1.0"
description = "AI agent framework for generating bespoke systems from application, workload, and hardware requirements"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "agentshim>=0.5.0",
    "deepagents",
    "jinja2>=3.1",
    "langchain-google-vertexai>=3.2.2",
    "langchain-openai",
    "huggingface_hub",
    "pydantic>=2",
    "pyyaml>=6",
    "python-dotenv>=1.0.1",
    "loguru>=0.7.2",
    "vs-feature-flags",
    "vs-github",
    "vs-issue-board",
    "vs-loop-state",
    "vs-sandbox",
    "openevolve==0.3.1",
]

[project.optional-dependencies]
# Opt-in backend behind the `omnigent_agent_backend` feature flag. Kept out of
# the base dependencies because it is a fast-moving alpha with no stability
# policy, so end users who never enable the flag should not carry it. Install
# with `uv sync --extra omnigent`.
omnigent = ["omnigent==0.6.0"]

[project.scripts]
vibesys-issue-mcp = "vs_issue_board.mcp:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["vibesys*"]

[tool.setuptools.package-data]
vibesys = ["prompts/*.j2", "prompts/**/*.j2", "prompts/**/*.md", "domains/README.md"]

[dependency-groups]
dev = [
    "chardet<6",
    "diff-cover",
    "hypothesis",
    "matplotlib>=3.10.8",
    "pyright>=1.1.411",
    "pytest",
    "pytest-cov",
    # Pinned exactly (not `>=`): a routine lock refresh with a floating bound
    # could silently change what CI enforces under the strict rule set below.
    "ruff==0.15.12",
    # Optional for users, required for contributors: without it pyright cannot
    # resolve the Omnigent backend and its tests silently skip. `uv sync --dev`
    # (what CI runs) therefore installs it. Version comes from the extra, so
    # there is one pin.
    "vibesys[omnigent]",
]
test = [
    "hypothesis",
    "pytest",
    "pytest-cov",
]

[tool.pytest.ini_options]
testpaths = ["tests", "libs/vs-feature-flags/tests", "libs/vs-github/tests", "libs/vs-issue-board/tests", "libs/vs-loop-state/tests", "libs/vs-sandbox/tests"]
# Bare `--cov` measures the packages listed in `[tool.coverage.run] source`
# below, so `uv run pytest` reports coverage locally without needing the full
# flag string CI uses. CI layers on `--cov-report=xml`, `--cov-report=json`,
# and `--cov-fail-under` on top of this; it does not need its own `--cov=...`
# flags.
addopts = "-ra --cov --cov-report=term-missing"
pythonpath = ["."]

[tool.coverage.run]
branch = true
source = ["vibesys", "vs_feature_flags", "vs_github", "vs_issue_board", "vs_loop_state", "vs_sandbox"]
relative_files = true
omit = [
    # `python -m vibesys` launcher stub: one import and a guarded call into
    # `vibesys.main.main`, which is itself measured. Not exercised by unit
    # tests because doing so would mean invoking the process as a script;
    # there is no branching logic here for a test to miss.
    "*/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.vibesys.per_module_coverage]
# Per-module coverage floor (percent, statement + branch combined by
# `coverage`). `--cov-fail-under` below is a repo-wide average and cannot
# see a single near-zero module hiding inside a healthy total (issue #298).
# `scripts/check_coverage_floor.py` enforces this floor per file using the
# `coverage json` report.
#
# Chosen from the distribution measured on 2026-08-08 (branch coverage,
# `vs_feature_flags` included): every module actually exercised by the
# suite sits at 53%+, and the only module below that is the allowlisted
# one below, at 0%. 40 catches modules with no meaningful coverage while
# leaving comfortable headroom above every module that has real tests, so
# it does not require an immediate test-writing project.
floor = 40

# Modules intentionally below the floor. Every entry must be preceded by a
# comment naming why; do not add bare entries. Only list a module that
# actually falls below the floor: allowlisting a covered module wrongly
# implies it is untested.
allowlist = [
    # Zero tests and zero callers anywhere in the repo (verified by
    # grepping src/, tests/, and libs/). This is an adopt-or-delete
    # decision, not a test gap, and is tracked separately from coverage
    # enforcement. See #298.
    "src/vibesys/_model_config/",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "libs/vs-feature-flags/src", "libs/vs-feature-flags/tests", "libs/vs-github/src", "libs/vs-github/tests", "libs/vs-issue-board/src", "libs/vs-issue-board/tests", "libs/vs-loop-state/src", "libs/vs-loop-state/tests", "libs/vs-sandbox/src", "libs/vs-sandbox/tests"]
# resources/skills/ vendors reference code (submodule checkouts and copied
# reference material) that VibeSys does not own and does not hold to repo
# lint standards; see the UP040/UP046/UP047 note below.
extend-exclude = ["resources/skills"]

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "W",
    "SIM", "RUF", "C4", "PIE", "ISC", "RSE", "INT", "FLY", "PERF", "FURB", "RET",
    "A", "DTZ", "LOG", "G", "N", "PTH", "YTT", "EXE", "ASYNC", "ERA", "T10", "T20", "TID", "ICN", "INP",
    "FBT", "FIX", "TD", "PGH",
    "ANN", "BLE", "SLF", "C901", "PL", "S", "PT", "ARG", "TRY", "TC", "D",
]
ignore = [
    "E501",
    # PEP 695 type-parameter syntax (`def f[T]()`, `class C[T]`, `type X = ...`)
    # only becomes lintable at target-version py312, so raising the floor
    # surfaced 11 of these at once. The repo has not adopted that syntax, and
    # this is not the change to adopt it in: ruff marks the rewrites unsafe,
    # and the hits include vendored reference code under `resources/skills/`
    # that VibeSys does not own. Moving to PEP 695 is a separate decision.
    "UP040",
    "UP046",
    "UP047",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "D", "INP001"]
"libs/*/tests/**" = ["S101", "PLR2004", "D", "INP001"]
# scripts/ holds standalone CI helper tools whose job is to report diagnostics
# on stdout, so `print` is the intended output mechanism rather than a stray
# debug statement. Same categorical treatment as S101 in tests/.
"scripts/**" = ["T201"]
# examples/ ships candidate reference implementations, benchmark harnesses,
# and vendored submodule checkouts (transformers, DeathStarBench, TensorRT-LLM,
# Show-o, train-ticket, TraceLab) rather than first-party framework code. Keep
# it held to the pre-existing baseline (E, F, I, UP, B, W) but do not apply the
# newly added rule families here.
"examples/**" = [
    "SIM", "RUF", "C4", "PIE", "ISC", "RSE", "INT", "FLY", "PERF", "FURB", "RET",
    "A", "DTZ", "LOG", "G", "N", "PTH", "YTT", "EXE", "ASYNC", "ERA", "T10", "T20", "TID", "ICN", "INP",
    "FBT", "FIX", "TD", "PGH",
    "ANN", "BLE", "SLF", "C901", "PL", "S", "PT", "ARG", "TRY", "TC", "D",
]

[tool.pyright]
typeCheckingMode = "strict"
# Strict minus the three rules below: untyped third-party dependencies
# (deepagents, langchain, modal, docker SDKs) leak Unknown into member
# accesses, inferred variables, and call arguments throughout the agent
# runner and loop code. Declared annotations remain fully enforced via
# reportUnknownParameterType / reportMissingParameterType /
# reportMissingTypeArgument, which stay at strict defaults.
reportUnknownMemberType = "none"
reportUnknownVariableType = "none"
reportUnknownArgumentType = "none"
# Makes every `# pyright: ignore[...]` a ratchet rather than a permanent hole:
# once the underlying error is fixed, the now-dead suppression becomes an error
# itself and has to be removed. Set at the top level so it covers `src` and
# `libs/*/src` too, not just the test paths whose baseline relies on it.
reportUnnecessaryTypeIgnoreComment = "error"
pythonVersion = "3.12"
include = ["src", "tests", "libs/vs-feature-flags/src", "libs/vs-feature-flags/tests", "libs/vs-github/src", "libs/vs-github/tests", "libs/vs-issue-board/src", "libs/vs-issue-board/tests", "libs/vs-loop-state/src", "libs/vs-loop-state/tests", "libs/vs-sandbox/src", "libs/vs-sandbox/tests"]
# `tests` and `libs/*/tests` are included above so the strict checker actually
# sees them (previously they were unchecked entirely). Running them at full
# strict produced thousands of errors, almost all from patterns strict mode was
# never meant to police in test code rather than latent bugs.
# Per-execution-environment `typeCheckingMode` is documented but not honored by
# pyright 1.1.411 (verified: setting it to "off"/"standard" on a scoped
# environment below left the error count unchanged), so the relaxation is
# spelled out explicitly instead. Two tiers, both scoped to test paths only --
# `src` and `libs/*/src` above stay at unmodified strict:
#   1. Declaration-completeness rules that pytest's own conventions make
#      unsatisfiable: fixture parameters (tmp_path, monkeypatch, custom
#      fixtures) are injected by name and have no annotation to check
#      (reportMissingParameterType, reportUnknownParameterType,
#      reportUnknownLambdaType, reportMissingTypeArgument); tests
#      intentionally reach into module-private state and monkeypatch a
#      module's own imported names to assert on internals
#      (reportPrivateUsage, reportPrivateImportUsage); and unittest.mock
#      objects expose attributes (call_args, assert_called_once_with, ...)
#      that their static type doesn't declare (reportAttributeAccessIssue,
#      reportFunctionMemberAccess).
#      These rules are categorically inapplicable to test code, so they are
#      relaxed at the rule level for these paths.
#   2. Everything else stays at the strict default here and is instead
#      suppressed per site with `# pyright: ignore[<rule>]` carrying a
#      `tracked: #297` marker. Those findings (reportArgumentType,
#      reportOptionalMemberAccess, reportOperatorIssue, reportReturnType,
#      reportCallIssue, reportOptionalOperand, reportIndexIssue,
#      reportAbstractUsage) can be real bugs rather than missing
#      declarations, so they must not become invisible: a rule-level "none"
#      would also silently accept every *future* violation in test code.
#      Per-site ignores plus reportUnnecessaryTypeIgnoreComment above give a
#      baseline that can only shrink, mirroring the `# noqa: CODE` + RUF100
#      approach used for the ruff rule expansion under the same parent.
#      Grep `tracked: #297` for the remaining burn-down list.
executionEnvironments = [
    { root = "libs/vs-feature-flags/src" },
    { root = "libs/vs-github/src" },
    { root = "libs/vs-issue-board/src" },
    { root = "libs/vs-loop-state/src" },
    { root = "libs/vs-sandbox/src" },
    { root = "src" },
    { root = "tests", reportMissingParameterType = "none", reportUnknownParameterType = "none", reportUnknownLambdaType = "none", reportMissingTypeArgument = "none", reportPrivateUsage = "none", reportPrivateImportUsage = "none", reportAttributeAccessIssue = "none", reportFunctionMemberAccess = "none" },
    { root = "libs/vs-feature-flags/tests", reportMissingParameterType = "none", reportUnknownParameterType = "none", reportUnknownLambdaType = "none", reportMissingTypeArgument = "none", reportPrivateUsage = "none", reportPrivateImportUsage = "none", reportAttributeAccessIssue = "none", reportFunctionMemberAccess = "none" },
    { root = "libs/vs-github/tests", reportMissingParameterType = "none", reportUnknownParameterType = "none", reportUnknownLambdaType = "none", reportMissingTypeArgument = "none", reportPrivateUsage = "none", reportPrivateImportUsage = "none", reportAttributeAccessIssue = "none", reportFunctionMemberAccess = "none" },
    { root = "libs/vs-issue-board/tests", reportMissingParameterType = "none", reportUnknownParameterType = "none", reportUnknownLambdaType = "none", reportMissingTypeArgument = "none", reportPrivateUsage = "none", reportPrivateImportUsage = "none", reportAttributeAccessIssue = "none", reportFunctionMemberAccess = "none" },
    { root = "libs/vs-loop-state/tests", reportMissingParameterType = "none", reportUnknownParameterType = "none", reportUnknownLambdaType = "none", reportMissingTypeArgument = "none", reportPrivateUsage = "none", reportPrivateImportUsage = "none", reportAttributeAccessIssue = "none", reportFunctionMemberAccess = "none" },
    { root = "libs/vs-sandbox/tests", reportMissingParameterType = "none", reportUnknownParameterType = "none", reportUnknownLambdaType = "none", reportMissingTypeArgument = "none", reportPrivateUsage = "none", reportPrivateImportUsage = "none", reportAttributeAccessIssue = "none", reportFunctionMemberAccess = "none" },
]

[tool.uv]
package = true

[tool.uv.workspace]
exclude = ["exp_env/**"]
members = ["libs/*"]

[tool.uv.sources]
vs-feature-flags = { workspace = true }
vs-github = { workspace = true }
vs-issue-board = { workspace = true }
vs-loop-state = { workspace = true }
vs-sandbox = { workspace = true }
