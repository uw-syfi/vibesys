[build-system]
requires = ["setuptools>=70.1", "wheel>=0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "vibesys"
version = "0.1.1"
description = "AI agent framework for generating bespoke systems from application, workload, and hardware requirements"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "agentshim>=0.6.1,<0.7",
    "cbor2<6",
    "cryptography<50",
    "jinja2>=3.1",
    "huggingface_hub",
    "mcp>=1.0,<2",
    "modal>=1.4.2",
    "pydantic>=2",
    "pyyaml>=6",
    "python-dotenv>=1.0.1",
    "openevolve==0.3.1",
    # Agent driver selected with `[agent].driver = "omnigent"`. A fast-moving
    # alpha, pinned exactly; carried in the base dependencies so every install
    # can run omnigent-configured projects without an extra.
    "omnigent==0.10.0",
]

[project.urls]
Repository = "https://github.com/uw-syfi/vibesys"
Issues = "https://github.com/uw-syfi/vibesys/issues"

[project.scripts]
vibesys-issue-mcp = "vs_issue_board.mcp:main"
# The `vibesys` launcher: starts the interactive TUI (bundled only when the
# wheel was built with a JavaScript toolchain), or runs the headless engine with
# `--headless`/`validate`/no TTY. The engine itself is
# `python -m entrypoints.headless`.
vibesys = "entrypoints.launcher:main"

[tool.setuptools.package-data]
# ``entrypoints/_tui`` is produced at build time by setup.py's build_py step;
# the glob keeps it as package data when present.
vibesys = ["prompts/*.j2", "prompts/**/*.j2", "prompts/**/*.md", "domains/README.md", "_resources/**/*", "_sdk/**/*", "sandbox/images/**"]
entrypoints = ["py.typed", "_tui/**/*"]
server = ["py.typed"]
vs_evaluator_protocol = ["py.typed"]
vs_feature_flags = ["py.typed"]
vs_github = ["py.typed"]
vs_issue_board = ["py.typed"]
vs_loop_state = ["py.typed"]
vs_project = ["py.typed"]
vs_prompts = ["py.typed"]
vs_sandbox = ["py.typed"]
vs_agent = ["py.typed"]

[dependency-groups]
dev = [
    "auditwheel==6.8.0",
    "chardet<6",
    "check-wheel-contents",
    "diff-cover",
    "hypothesis",
    "tach==0.35.1",
    "matplotlib>=3.10.8",
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "pytest-xdist",
    "respx",
    "vs-bench",
    # Pinned exactly (not `>=`): a routine lock refresh with a floating bound
    # could silently change what CI enforces under the strict rule set below.
    "ruff==0.15.12",
    "twine",
    "ty==0.0.75",
]
test = [
    "hypothesis",
    "pytest",
    "pytest-cov",
]

[tool.pytest.ini_options]
testpaths = ["tests", "libs/vs-evaluator-protocol/tests", "libs/vs-feature-flags/tests", "libs/vs-github/tests", "libs/vs-issue-board/tests", "libs/vs-loop-state/tests", "libs/vs-project/tests", "libs/vs-prompts/tests", "libs/vs-sandbox/tests", "libs/vs-agent/tests", "sdk/vs-bench/tests"]
# Bare `--cov` measures the packages listed in `[tool.coverage.run] source`
# below, so `uv run pytest` reports coverage locally without needing the full
# flag string CI uses. CI layers on `--cov-report=xml`, `--cov-report=json`,
# and `--cov-fail-under` on top of this; it does not need its own `--cov=...`
# flags.
addopts = "-ra --import-mode=importlib --cov --cov-report=term-missing"
pythonpath = [".", "packaging"]
markers = [
    # Applied by `pytest_collection_modifyitems` in the root conftest.py, which
    # maps it onto an xdist scheduling group so CI's `-n auto --dist loadgroup`
    # keeps these tests off each other's worker.
    "serial: claims a process-wide or host-wide resource and must not run beside another such test",
    # Real provider CLIs, real credentials, real network. Every such test is
    # skipped unless its opt-in environment variable is set, so no addopts
    # deselection is needed; the marker exists to select or exclude them.
    "e2e: drives an installed agent CLI for real; opt in with VIBESYS_E2E_AGENTS=1",
    # A Fake-vs-real contract suite run against the real implementation. Each
    # such test is skipped unless its opt-in environment variable is set.
    "real_contract: runs a Fake-vs-real contract suite against the real implementation (real DB, subprocess, or service); opt in with VIBESYS_REAL_CONTRACTS=1",
]

[tool.coverage.run]
branch = true
source = ["entrypoints", "server", "vibesys", "vs_evaluator_protocol", "vs_feature_flags", "vs_github", "vs_issue_board", "vs_loop_state", "vs_project", "vs_prompts", "vs_sandbox", "vs_agent", "vs_bench"]
relative_files = true
omit = [
    # Module execution stubs contain only a guarded call into a measured
    # entrypoint. Exercising them would require invoking a separate process.
    "*/__main__.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.vibesys.per_module_coverage]
# Per-module coverage floor (percent, statement + branch combined by
# `coverage`). `--cov-fail-under` below is a repo-wide average and cannot
# see a single near-zero module hiding inside a healthy total (issue #298).
# `scripts/check_coverage_floor.py` enforces this floor per file using the
# `coverage json` report.
#
# Chosen from the distribution measured on 2026-08-08 (branch coverage,
# `vs_feature_flags` included): every module actually exercised by the
# suite sits at 53%+, and the only module below that is the allowlisted
# one below, at 0%. 40 catches modules with no meaningful coverage while
# leaving comfortable headroom above every module that has real tests, so
# it does not require an immediate test-writing project.
floor = 40

# Modules intentionally below the floor. Every entry must be preceded by a
# comment naming why; do not add bare entries. Only list a module that
# actually falls below the floor: allowlisting a covered module wrongly
# implies it is untested.
allowlist = [
    # Zero tests and zero callers anywhere in the repo (verified by
    # grepping src/, tests/, and libs/). This is an adopt-or-delete
    # decision, not a test gap, and is tracked separately from coverage
    # enforcement. See #298.
    "src/vibesys/_model_config/",
    # Protocol-only typing module, imported solely under TYPE_CHECKING, so it
    # is never executed at runtime and has no statements for tests to cover.
    "src/vibesys/loops/request.py",
]

[tool.vibesys.file_length]
# God-file ceiling for first-party Python, in physical lines (`wc -l`).
# Enforced by `scripts/check_file_length.py`. Ruff's C901/PL rules bound
# individual functions but say nothing about how many of them one module may
# accumulate, and `clients/biome.json` has the TypeScript counterpart
# (`style/noExcessiveLinesPerFile`) at the same 2000-line ceiling.
max_lines = 2000

# Directories scanned for `*.py`. Any path with a `tests` or `__pycache__`
# component is skipped: long test modules are normal, and `clients/biome.json`
# exempts `*.test.ts` from its file-length rule for the same reason.
roots = ["src", "libs", "scripts", "packaging", "sdk", "support"]

# Temporary migration debt only. Do not add entries or raise recorded counts.
# Remove each entry as its file is refactored below the ceiling. Exceeding a
# recorded count fails, and an entry that drops back to 2000 or below is stale.
# These counts record the existing debt on 2026-09-13.
[tool.vibesys.file_length.allowlist]
# The agent loop: round orchestration, agent invocation, and result handling.
# Candidate archive selection/rendering now lives in its own module.
"src/vibesys/loops/agent/loop.py" = 3578
# Sandbox run environment: setup, execution, and teardown across strategies.
# Semantic command-argument translation now lives in its own module.
"src/vibesys/sandbox/run_environment.py" = 2150

[tool.vibesys.test_isolation]
# Shrink-only ratchet for test isolation, enforced by
# `scripts/check_test_isolation.py`. Tests should exercise public APIs and use
# in-memory Fakes instead of monkeypatch or mock, and should never use sleeps
# as synchronization. Existing violations are recorded per (file, rule) in the
# baseline; counts may only go down.
#
# Glob patterns of directories scanned for `*.py`. They mirror
# `[tool.pytest.ini_options] testpaths`. `__pycache__` and `fixtures`
# directories are skipped.
roots = ["tests", "libs/*/tests", "sdk/*/tests"]

# Repo-relative JSONL baseline, one {"path", "rule", "count"} entry per line.
baseline = "test_isolation_baseline.jsonl"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "resources/evaluators/microservice", "libs/vs-evaluator-protocol/src", "libs/vs-evaluator-protocol/tests", "libs/vs-feature-flags/src", "libs/vs-feature-flags/tests", "libs/vs-github/src", "libs/vs-github/tests", "libs/vs-issue-board/src", "libs/vs-issue-board/tests", "libs/vs-loop-state/src", "libs/vs-loop-state/tests", "libs/vs-project/src", "libs/vs-project/tests", "libs/vs-prompts/src", "libs/vs-prompts/tests", "libs/vs-sandbox/src", "libs/vs-sandbox/tests", "libs/vs-agent/src", "libs/vs-agent/tests", "sdk/vs-bench/src", "sdk/vs-bench/tests"]
# resources/skills/ vendors reference code (submodule checkouts and copied
# reference material) that VibeSys does not own and does not hold to repo
# lint standards; see the UP040/UP046/UP047 note below.
extend-exclude = [
    "resources/skills",
    "examples/microservices/repositories/deathstarbench",
    "examples/model-serving/repositories/vllm",
    "examples/model-serving/repositories/vllm-omni",
    # Verbatim transformers modeling code shipped as a bundle reference.
    "examples/model-serving/qwen3.5-397b-a17b-mi300a-bespoke/reference/modeling_qwen3_5_moe.py",
    "examples/model-serving/qwen3.5-397b-a17b-mi300a-bespoke/reference/configuration_qwen3_5_moe.py",
]

[tool.ruff.lint]
select = [
    "E", "F", "I", "UP", "B", "W",
    "SIM", "RUF", "C4", "PIE", "ISC", "RSE", "INT", "FLY", "PERF", "FURB", "RET",
    "A", "DTZ", "LOG", "G", "N", "PTH", "YTT", "EXE", "ASYNC", "ERA", "T10", "T20", "TID", "ICN", "INP",
    "FBT", "FIX", "TD", "PGH",
    "ANN", "BLE", "SLF", "C901", "PL", "S", "PT", "ARG", "TRY", "TC", "D",
]
ignore = [
    "E501",
    # PEP 695 type-parameter syntax (`def f[T]()`, `class C[T]`, `type X = ...`)
    # only becomes lintable at target-version py312, so raising the floor
    # surfaced 11 of these at once. The repo has not adopted that syntax, and
    # this is not the change to adopt it in: ruff marks the rewrites unsafe,
    # and the hits include vendored reference code under `resources/skills/`
    # that VibeSys does not own. Moving to PEP 695 is a separate decision.
    "UP040",
    "UP046",
    "UP047",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"deepagents".msg = "The deepagents backend was removed; agents run through agent CLI drivers."
"langchain".msg = "langchain was removed; do not reintroduce it."
"langchain_core".msg = "langchain was removed; do not reintroduce it."
"langchain_openai".msg = "langchain was removed; do not reintroduce it."
"langchain_google_vertexai".msg = "langchain was removed; do not reintroduce it."
"langgraph".msg = "langgraph was removed; do not reintroduce it."

[tool.ruff.lint.flake8-type-checking]
runtime-evaluated-base-classes = ["pydantic.BaseModel"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "D", "INP001"]
"libs/*/tests/**" = ["S101", "PLR2004", "D", "INP001"]
"sdk/*/tests/**" = ["S101", "PLR2004", "D", "INP001"]
"support/*/tests/**" = ["S101", "PLR2004", "D", "INP001"]
# scripts/ holds standalone CI helper tools whose job is to report diagnostics
# on stdout, so `print` is the intended output mechanism rather than a stray
# debug statement. Same categorical treatment as S101 in tests/.
"scripts/**" = ["T201"]
# packaging/ holds top-level build modules with no __init__.py on purpose (a
# `packaging` package would shadow the PyPA `packaging` library), and release
# tools that report on stdout/stderr like scripts/.
"packaging/*.py" = ["INP001", "T201"]
# examples/ ships candidate reference implementations, benchmark harnesses,
# and vendored submodule checkouts (transformers, DeathStarBench, TensorRT-LLM,
# Show-o, train-ticket, TraceLab) rather than first-party framework code. Keep
# it held to the pre-existing baseline (E, F, I, UP, B, W) but do not apply the
# newly added rule families here.
"examples/**" = [
    "SIM", "RUF", "C4", "PIE", "ISC", "RSE", "INT", "FLY", "PERF", "FURB", "RET",
    "A", "DTZ", "LOG", "G", "N", "PTH", "YTT", "EXE", "ASYNC", "ERA", "T10", "T20", "TID", "ICN", "INP",
    "FBT", "FIX", "TD", "PGH",
    "ANN", "BLE", "SLF", "C901", "PL", "S", "PT", "ARG", "TRY", "TC", "D",
]

[tool.ty.environment]
python-version = "3.12"
# The repo installs as one editable distribution whose packages come from
# several source roots (see `discover_distribution_packages` in
# `packaging/packaging_support.py`). Editable installs of that shape are resolved at
# runtime by a setuptools import hook that a static checker cannot follow, so
# the first-party roots are listed explicitly here. Mirrors the layout that
# `[tool.ruff] src` and `[tool.pytest.ini_options] testpaths` already encode.
root = [
    # Repository root: the `scripts` package is imported by tests, which pytest
    # makes importable through `[tool.pytest.ini_options] pythonpath`.
    ".",
    # Release/packaging helpers (`wheel_targets`, `packaging_support`,
    # `tui_packaging`, `resources_packaging`, `release_versions`) are top-level
    # modules in `packaging/`, which deliberately has no `__init__.py` so it
    # cannot shadow the PyPA `packaging` library.
    "packaging",
    "src",
    "tests",
    "resources/evaluators/microservice",
    "libs/vs-evaluator-protocol/src",
    "libs/vs-feature-flags/src",
    "libs/vs-github/src",
    "libs/vs-issue-board/src",
    "libs/vs-loop-state/src",
    "libs/vs-project/src",
    "libs/vs-prompts/src",
    "libs/vs-sandbox/src",
    "libs/vs-agent/src",
    "sdk/vs-bench/src",
]

[tool.ty.src]
# Same tree the previous checker covered: first-party sources plus their
# tests. `examples/`, `resources/skills/`, and `3rd_party/` vendor code
# VibeSys does not own and are left out.
include = [
    "src",
    "tests",
    "resources/evaluators/microservice/kubernetes_runtime",
    "libs/vs-evaluator-protocol/src",
    "libs/vs-evaluator-protocol/tests",
    "libs/vs-feature-flags/src",
    "libs/vs-feature-flags/tests",
    "libs/vs-github/src",
    "libs/vs-github/tests",
    "libs/vs-issue-board/src",
    "libs/vs-issue-board/tests",
    "libs/vs-loop-state/src",
    "libs/vs-loop-state/tests",
    "libs/vs-project/src",
    "libs/vs-project/tests",
    "libs/vs-prompts/src",
    "libs/vs-prompts/tests",
    "libs/vs-sandbox/src",
    "libs/vs-sandbox/tests",
    "libs/vs-agent/src",
    "libs/vs-agent/tests",
    "sdk/vs-bench/src",
    "sdk/vs-bench/tests",
]

[tool.uv]
package = true

[tool.uv.workspace]
# `sdk/vs-evaluator` ships a protocol spec, conformance fixtures, and non-Python
# SDKs, so it has no `pyproject.toml` and is not a uv workspace member.
exclude = ["exp_env/**", "sdk/vs-evaluator"]
members = ["sdk/*"]

[tool.uv.sources]
vs-bench = { workspace = true }
