version: v2
inputs:
  - directory: proto
    paths: [proto/vibesys/core/v1/common.proto, proto/vibesys/core/v1/control.proto, proto/vibesys/core/v1/vocabulary.proto, proto/vibesys/core/v1/leaves.proto, proto/vibesys/core/v1/contracts.proto, proto/vibesys/core/v1/failures.proto, proto/vibesys/core/v1/agent_facts.proto]
plugins:
  - local: [uv, run, --locked, --group, proto, python, -m, scripts.protoc_gen_corevalue]
    out: libs/vs-core/src/vs_core/_generated
  - local: [uv, run, --locked, --group, proto, python, -m, scripts.protoc_gen_corevalue]
    out: libs/vs-runtime/src/vs_runtime/_core_values
    opt: [boundary=true, value_module=vs_core.api.values]
