<!doctype html>
<!--
VibeSys desktop app, mockup v3.1 (brief: scratchpad/design-brief-v3.md plus the owner's and Codex's review).
Built from app.tpl.html by app-build.py; do not edit app.html by hand.

Data: rounds R1..R7 are the real recording (demo-run.jsonl via tui-data.json): hypotheses, agent notes, tool
calls and outputs, judge analyses and verdicts, metrics, commits, files, invocation ids, tool counts. Baseline
950 tok/s is from the R1 judge text.
[mock] other runs, projects and relative times; the judge's elapsed time; agent prompts (composed from the
recorded plan fields: task, hypothesis, pass criteria) and implementer todos (derived from its recorded tool
descriptions); the steer text on #steer; the second chat thread and the chat answer to "Why did round 3 fail
the judge?" (paraphrases the recorded verdict); new-thread replies use the recorder's own "Mock reply" text;
the claude-sonnet-5 option; notes text; setup variants (dirty tree, rejected key, Codex CLI backend); the
round 6 hunk is rebuilt from the recorded rg output (old) and Write content (new); "Open in editor" and
"Copy" only change their labels.

Screens by hash: home setup setup-checking setup-blockers setup-new starting round1 startfail live steer
pausing paused stop round prompt todos changes changes-full agents experiments design ask thread model
nochat notes palette collapsed otherrun. ?capture=1 (or any automated browser) hides the screen switcher.
?theme=light|dark forces a theme; otherwise it follows the system.

Colour: Radix Slate neutrals, one Indigo accent, elevation by lightness. Changes from the brief's table, all
to reach WCAG AA on every surface the colour sits on (hover, selected, raised and diff tints included):
  text.3   dark #696e77 -> #9a9ea6 (between Slate 10 and 11); light #8b8d98 -> #60646c (Slate 11). Slate has
           no light step between 10 and 11 that passes on the selected fill, so light text.3 equals text.2 and
           hierarchy there comes from size and weight. Nothing meaningful is fainter than text.3.
  line     new token for editable-field borders, graph edges and arrowheads (>= 3:1).
  live     accent in light, accent-text (#9eb1ff) in dark, for the live dot and active ring (>= 3:1). No pulse.
  status   light success #218358 -> #1c724d, warn #ab6400 -> #935600, error #ce2c31 -> #c22a2f.
Traffic-light colours are OS chrome, not tokens.

Contrast (WCAG 2.x, computed by app-build.py from the tokens; min over the listed surfaces)
  token        | light min | dark min | needs | on
  -------------|-----------|----------|-------|------------------------------
  text-1       |     13.41 |    11.26 |   4.5 | app, sidebar, raised, hover, selected, tint-add, tint-del (body, titles, diff text)
  text-2       |      4.86 |     6.28 |   4.5 | app, sidebar, raised, hover, selected (secondary text, meta)
  text-3       |      4.86 |     4.86 |   4.5 | app, sidebar, raised, hover, selected, tint-add, tint-del (labels, hints, placeholders, line numbers, ticks)
  success      |      4.82 |     6.97 |   4.5 | app, sidebar, raised, hover, selected (kept, +lines, Accepted)
  warn         |      4.81 |     8.53 |   4.5 | app, sidebar, raised, hover, selected (paused)
  error        |      4.69 |     6.20 |   4.5 | app, sidebar, raised, hover, selected (rejected, exit codes, −lines)
  accent-text  |      4.91 |     6.34 |   4.5 | app, sidebar, raised, hover, selected (links, active role)
  line         |      3.12 |     3.33 |   3.0 | app, sidebar, raised (field borders, graph edges, arrowheads)
  live         |      4.26 |     6.34 |   3.0 | app, sidebar, hover, selected (live dot, active node ring)
  white/accent |      5.21 |     5.21 |   4.5 | primary button label

Element inventory, live screen (element | its one message)
  traffic lights, sidebar toggle | native window; the sidebar can be hidden (and is, at 1024 with a pane open)
  New run ⌘N                     | start another run
  Search and commands ⌘K         | every command and destination
  project label                  | which repository these runs belong to
  run row                        | this run is live, and when it last changed
  round rows (glyph, rN, title, Δ)| each hypothesis, kept or reverted, and what it moved the metric by
  "6 more planned"               | how much of the round budget is left
  title: run name                | which run (hover: objective)
  "Judging round 6"              | what the run is doing now (the only run-level live signal)
  Pause                          | pause after the current agent call
  "Retained 1,230 tok/s +29%..." | the run's best kept result, scoped to the run, against the baseline
  pane toggle, ••• menu          | Ask, Changes, Agents, Experiments, Notes; Stop
  sticky round bar               | which round you are reading, and its result so far
  hypothesis paragraph           | what this round tests
  turn heading (role, phase)     | which agent invocation, in which phase
  Prompt / Todos                 | what the agent was asked, and its checklist
  action rows (verb, object)     | one tool call each; click for full command and output; time is tool time
  active Judge turn              | the judge is working, and what it is checking
  steer composer                 | guide the next agent call

Left out (and where it went): the graph (Agents tab), per-agent colours, agent durations in the transcript
(graph detail panel), token and context counters, the TUI key-hint footer (⌘K and hover titles), rounds
r7..r12 (one "6 more planned" line), Stop as a button (••• menu, ⌘K), a separate performance pane (Experiments
chart), Task lines that restate the hypothesis (implementer Prompt), status badges (glyphs and words).
-->

<style>

  --accent: #3e63dd; --accent-text: #3a5bc7; --live: #3e63dd;
  --success: #1c724d; --warn: #935600; --error: #c22a2f;
  --tint-add: #e3eee9; --tint-del: #f8e5e6;
  --shadow: 0 10px 32px -6px rgb(0 0 0 / .16), 0 2px 6px rgb(0 0 0 / .06);

}
:root[data-theme="dark"] {
  --bg-app: #111113; --bg-sidebar: #18191b; --bg-raised: #212225; --bg-hover: #272a2d; --bg-selected: #2e3135;
  --border-subtle: #272a2d; --border: #363a3f; --line: #6e737a;
  --text-1: #edeef0; --text-2: #b0b4ba; --text-3: #9a9ea6;
  --accent: #3e63dd; --accent-text: #9eb1ff; --live: #9eb1ff;
  --success: #3dd68c; --warn: #ffca16; --error: #ff9592;
  --tint-add: #172b23; --tint-del: #302224;

  --scrim: rgb(0 0 0 / .45);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg-app); color: var(--text-1); font: 13px/20px var(--sans); -webkit-font-smoothing: antialiased; overflow: hidden; }
::selection { background: color-mix(in srgb, var(--accent) 32%, transparent); }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: default; text-align: left; }
button[disabled] { cursor: default; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 6px; }
.mono { font-family: var(--mono); font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }
.t2 { color: var(--text-2); } .t3 { color: var(--text-3); }
.ok { color: var(--success); } .bad { color: var(--error); } .warn { color: var(--warn); }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
svg.g { width: 12px; height: 12px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
* { scrollbar-width: thin; scrollbar-color: var(--border) transparent; }
.kbd { font-size: 11px; line-height: 14px; color: var(--text-3); letter-spacing: .02em; white-space: nowrap; }
.dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; flex: none; }
.dot.live { background: var(--live); } .dot.err { background: var(--error); } .dot.okd { background: var(--success); } .dot.wrn { background: var(--warn); }
.gl { display: grid; place-items: center; width: 14px; height: 20px; }
.spin { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--line); border-top-color: var(--text-1); animation: rot .9s linear infinite; flex: none; }
@keyframes rot { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation: none; } }

/* window */
.win { display: flex; height: 100vh; }
.side { flex: none; background: var(--bg-sidebar); border-right: 1px solid var(--border-subtle); display: flex; flex-direction: column; position: relative; min-width: 0; }
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; container-type: inline-size; }
.pane { flex: none; border-left: 1px solid var(--border-subtle); display: flex; flex-direction: column; position: relative; min-width: 0; background: var(--bg-app); }
.drag { position: absolute; top: 0; bottom: 0; width: 7px; cursor: col-resize; z-index: 5; touch-action: none; }
.side > .drag { right: -4px; } .pane > .drag { left: -4px; }
.drag:hover, .drag.on { background: linear-gradient(90deg, transparent 3px, var(--line) 3px, var(--line) 4px, transparent 4px); }

/* sidebar */
.lights { height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 16px; flex: none; }
.lights i { width: 12px; height: 12px; border-radius: 50%; display: block; box-shadow: inset 0 0 0 .5px rgb(0 0 0 / .15); }
.lights i:nth-child(1) { background: #ff5f57; } .lights i:nth-child(2) { background: #febc2e; } .lights i:nth-child(3) { background: #28c840; }
.side .lights .iconbtn { margin-left: auto; }
.iconbtn { width: 28px; height: 28px; display: inline-grid; place-items: center; border-radius: 6px; color: var(--text-2); flex: none; }
.iconbtn:hover { background: var(--bg-hover); color: var(--text-1); }
.iconbtn.on { color: var(--text-1); background: var(--bg-selected); }
.nav, .run, .rnd { width: calc(100% - 16px); margin: 0 8px; border-radius: 6px; }
.nav { display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px; color: var(--text-2); }
.nav:hover { background: var(--bg-hover); color: var(--text-1); }
.nav.on { background: var(--bg-selected); color: var(--text-1); font-weight: 500; }
.nav .kbd { margin-left: auto; }
.sect { font-size: 11px; line-height: 14px; color: var(--text-3); padding: 18px 18px 6px; }
.sidescroll { flex: 1; overflow: auto; padding-bottom: 12px; }
.run { display: grid; grid-template-columns: 14px 1fr auto; align-items: center; gap: 8px; min-height: 30px; padding: 5px 8px; color: var(--text-2); }
.run:hover { background: var(--bg-hover); }
.run .ttl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.run.cur { color: var(--text-1); font-weight: 500; }
.run.sel { background: var(--bg-selected); color: var(--text-1); font-weight: 500; }
.run .meta { font-size: 12px; color: var(--text-2); font-weight: 400; }
.rounds { margin: 2px 0 6px; }
.rnd { display: grid; grid-template-columns: 14px 22px 1fr auto; align-items: start; gap: 4px 6px; padding: 4px 8px 4px 20px; font-size: 12px; line-height: 16px; color: var(--text-2); }
.rnd:hover { background: var(--bg-hover); }
.rnd.sel { background: var(--bg-selected); color: var(--text-1); font-weight: 500; }
.rnd .gl { height: 16px; }
.rnd .rn { color: var(--text-3); font-variant-numeric: tabular-nums; font-weight: 400; }
.rnd .ttl { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.rnd .d { font-variant-numeric: tabular-nums; font-weight: 400; }
.rnd.more { display: block; color: var(--text-3); padding-left: 62px; }

/* title row */
.titlebar { height: 40px; flex: none; display: flex; align-items: center; gap: 8px; padding: 0 8px 0 18px; border-bottom: 1px solid var(--border-subtle); min-width: 0; }
.titlebar .lights { padding: 0 6px 0 0; }
.titlebar .name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 60px; flex-shrink: 1; }
.titlebar .status { flex-shrink: 0; }
.titlebar .proj { color: var(--text-2); white-space: nowrap; }
.titlebar .sp { flex: 1; }
.status { display: inline-flex; align-items: center; gap: 7px; color: var(--text-2); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.kept { font-size: 12px; white-space: nowrap; color: var(--text-2); }
.kept b { color: var(--text-1); font-weight: 500; }
.vsep { width: 1px; height: 16px; background: var(--border); margin: 0 2px; flex: none; }
.chip { height: 26px; padding: 0 9px; border-radius: 6px; display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-1); flex: none; box-shadow: inset 0 0 0 1px var(--border); }
.chip:hover { background: var(--bg-hover); }
@container (max-width: 820px) { .titlebar .proj, .kept .lbl, .kept .unit { display: none; } }

/* transcript */
.scroll { flex: 1; overflow: auto; min-height: 0; position: relative; }
.col { max-width: 720px; margin: 0 auto; padding: 0 32px 32px; }
.sticky { position: sticky; top: 0; z-index: 3; background: var(--bg-app); border-bottom: 1px solid var(--border-subtle); }
.sticky .in { max-width: 720px; margin: 0 auto; padding: 0 32px; height: 40px; display: flex; align-items: center; gap: 10px; min-width: 0; }
.sticky .rn { color: var(--text-2); font-size: 12px; white-space: nowrap; }
.sticky .ttl { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.res { margin-left: auto; font-size: 12px; color: var(--text-2); white-space: nowrap; display: flex; gap: 6px; flex: none; }
.res .sep { color: var(--text-3); }
.claim { margin: 18px 0 0; color: var(--text-2); max-width: 66ch; }
.turn { margin-top: 30px; }
.who { display: flex; align-items: baseline; gap: 8px; margin-bottom: 8px; min-width: 0; }
.who .r { font-weight: 600; color: var(--text-1); }
.who .r.act { color: var(--accent-text); }
.who .ph { color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.block .bh { color: var(--text-2); margin-bottom: 4px; }

.trow:hover { background: var(--bg-hover); }
.trow .verb { font-weight: 500; color: var(--text-2); flex: none; }

.out { margin: 4px 0 8px 6px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg-sidebar); overflow: auto; }

.diff > div { padding: 0 12px 0 0; white-space: pre; }

.diff .d { background: var(--tint-del); color: var(--text-1); }

.hmeta { text-align: right; font-size: 12px; color: var(--text-2); display: flex; justify-content: flex-end; gap: 6px; align-items: center; }
.filterbar { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--text-2); margin-top: 14px; }
.linkbtn { color: var(--accent-text); font-size: 12px; }
.linkbtn:hover { text-decoration: underline; text-underline-offset: 2px; }
.endline { color: var(--text-2); margin-top: 20px; font-size: 12px; }

/* composer */
.dock { flex: none; padding: 0 32px 16px; }
.dock .inner { max-width: 656px; margin: 0 auto; }
.pill { display: flex; align-items: center; gap: 6px; min-height: 44px; padding: 6px 6px 6px 16px; border-radius: 22px; background: var(--bg-raised); border: 1px solid var(--line); }
.pill:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }

.pill input::placeholder { color: var(--text-3); }

/* right pane */

.tab { height: 26px; padding: 0 9px; border-radius: 6px; color: var(--text-2); white-space: nowrap; }

.tab.on { background: var(--bg-selected); color: var(--text-1); font-weight: 500; }
.tabs .iconbtn { margin-left: auto; }
.pbody { flex: 1; overflow: auto; min-height: 0; display: flex; flex-direction: column; }
.phead { display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 16px; font-size: 12px; color: var(--text-2); border-bottom: 1px solid var(--border-subtle); flex: none; }

.phead .r { margin-left: auto; display: flex; gap: 2px; align-items: center; }

.chart { padding: 12px 16px 0; }

.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 8px 16px 12px; font-size: 11px; line-height: 14px; color: var(--text-2); border-bottom: 1px solid var(--border-subtle); }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.xrow { display: grid; grid-template-columns: 22px 1fr auto 44px; align-items: center; gap: 8px; min-height: 36px; padding: 0 16px; border-bottom: 1px solid var(--border-subtle); color: var(--text-1); width: 100%; }
.xrow:hover { background: var(--bg-hover); }
.xrow.sel { background: var(--bg-selected); }
.xrow .id { color: var(--text-2); font-size: 12px; font-variant-numeric: tabular-nums; }
.xrow .ttl { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.xrow .oc { font-size: 12px; }
.xrow .m { text-align: right; font-size: 12px; color: var(--text-2); font-variant-numeric: tabular-nums; }
.ev { padding: 4px 16px 14px 46px; border-bottom: 1px solid var(--border-subtle); background: var(--bg-sidebar); }
.kv { display: grid; grid-template-columns: 96px 1fr; gap: 6px 12px; font-size: 12px; line-height: 18px; margin: 10px 0 0; }
.kv dt { color: var(--text-2); } .kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }
.seg2 { display: inline-flex; gap: 2px; }
.graphwrap { position: relative; flex: none; border-bottom: 1px solid var(--border-subtle); }
.graph { min-height: 80px; }
.ag { width: 140px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg-app); cursor: pointer; }
.ag:hover { background: var(--bg-hover); }
.ag.sel { box-shadow: 0 0 0 1px var(--bg-app), 0 0 0 2px var(--text-2); }
.ag.act { border-color: var(--live); box-shadow: 0 0 0 3px color-mix(in srgb, var(--live) 22%, transparent); }
.ag.act.sel { box-shadow: 0 0 0 3px color-mix(in srgb, var(--live) 22%, transparent), 0 0 0 4px var(--text-2); }
.ag .r { display: flex; align-items: center; gap: 6px; color: var(--text-1); font-size: 12px; line-height: 16px; font-weight: 500; }
.ag .r .g { margin-left: auto; color: var(--text-2); }
.ag .r .dot { margin-left: auto; }
.ag .m { font-size: 11px; line-height: 14px; color: var(--text-2); margin-top: 2px; white-space: nowrap; }
.react-flow { --xy-background-color: transparent; }
.react-flow__handle { opacity: 0; width: 1px; height: 1px; min-width: 0; min-height: 0; border: 0; }
.react-flow__node { cursor: pointer; }
.react-flow__attribution { display: none; }
.detail { padding: 12px 16px 16px; }
.detail h3 { font-size: 13px; line-height: 20px; margin: 0; font-weight: 600; }
.detail h3 span { color: var(--text-2); font-weight: 400; margin-left: 6px; }
.notesed { flex: 1; min-height: 200px; margin: 0; padding: 14px 16px; border: 0; outline: 0; resize: none; background: transparent; color: var(--text-1); font: 13px/20px var(--sans); }
.notesed::placeholder { color: var(--text-3); }
.pfoot { flex: none; display: flex; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--border-subtle); align-items: center; }
.thread { flex: 1; overflow: auto; padding: 16px; }
.thread .human { margin-top: 0; }
.answer { margin: 8px 0 18px; }
.answer .who2 { font-size: 12px; color: var(--text-2); margin-bottom: 4px; }
.answer p { margin: 0 0 8px; }
.pdock { flex: none; padding: 0 12px 12px; }
.empty1 { color: var(--text-2); padding: 16px; }

/* popovers */
.pop { position: absolute; z-index: 40; background: var(--bg-raised); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); padding: 4px; min-width: 220px; }
.pop .it { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 30px; padding: 5px 10px; border-radius: 6px; color: var(--text-1); }
.pop .it:hover, .pop .it.on { background: var(--bg-hover); }
.pop .it .d { margin-left: auto; color: var(--text-2); font-size: 12px; }
.pop .it.danger { color: var(--error); }
.pop .sepl { height: 1px; background: var(--border-subtle); margin: 4px 6px; }
.pop .gh { font-size: 11px; color: var(--text-3); padding: 6px 10px 2px; }
.confirm { padding: 14px 14px 12px; width: 300px; }
.confirm h4 { margin: 0 0 4px; font-size: 13px; }
.confirm p { margin: 0 0 12px; color: var(--text-2); font-size: 12px; line-height: 18px; }
.confirm .row { display: flex; gap: 8px; justify-content: flex-end; }

/* palette */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 50; display: flex; justify-content: center; align-items: flex-start; padding-top: 12vh; }
.pal { width: min(580px, calc(100vw - 32px)); background: var(--bg-raised); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; display: flex; flex-direction: column; max-height: 76vh; }
.pal input { width: 100%; height: 48px; border: 0; outline: 0; padding: 0 16px; font: 14px var(--sans); background: transparent; color: var(--text-1); border-bottom: 1px solid var(--border-subtle); flex: none; }
.pal input::placeholder { color: var(--text-3); }
.pal .list { overflow: auto; padding: 6px; max-height: 392px; }
.pal .list.more { -webkit-mask-image: linear-gradient(#000 calc(100% - 36px), transparent); mask-image: linear-gradient(#000 calc(100% - 36px), transparent); }
.pal .gh { font-size: 11px; color: var(--text-3); padding: 10px 10px 4px; }
.pal .it { display: flex; align-items: center; gap: 10px; height: 32px; padding: 0 10px; border-radius: 6px; width: 100%; color: var(--text-1); }
.pal .it .d { color: var(--text-2); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.pal .it .kbd { margin-left: auto; }
.pal .it.on { background: var(--bg-selected); }
.pal .foot { display: flex; gap: 14px; padding: 8px 14px; border-top: 1px solid var(--border-subtle); flex: none; }

/* setup */
.form { max-width: 600px; margin: 0 auto; padding: 32px 32px 40px; }
.fr { display: grid; grid-template-columns: 116px 1fr; gap: 12px; align-items: start; margin-bottom: 16px; }
.fr > label, .fr > .lab { padding-top: 6px; color: var(--text-2); }
.fld { height: 32px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg-raised); padding: 0 10px; display: flex; align-items: center; gap: 8px; color: var(--text-1); min-width: 0; }
.fld.area { height: auto; min-height: 52px; padding: 6px 10px; align-items: flex-start; }
.fld .sp { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fld .ph { color: var(--text-3); }
.fld.bad { border-color: var(--error); }
.fld.focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 20%, transparent); }
.hint.bad { color: var(--error); }
.hint { font-size: 12px; line-height: 18px; color: var(--text-2); margin-top: 6px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.row2 { display: flex; gap: 8px; }
.row2 > .fld { flex: 1; }
.summary { border: 1px solid var(--border); border-radius: 8px; background: var(--bg-raised); padding: 10px 12px; display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; }
.summary .t { font-weight: 500; }
.summary .m { font-size: 12px; color: var(--text-2); grid-column: 1; }
.summary .btn { grid-row: 1 / span 3; grid-column: 2; align-self: start; }
.btn { height: 30px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--line); background: var(--bg-raised); color: var(--text-1); display: inline-flex; align-items: center; gap: 6px; flex: none; font-size: 13px; }
.btn:hover { background: var(--bg-hover); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary[disabled] { background: var(--bg-selected); border-color: var(--border); color: var(--text-2); }
.btn.ghost { border-color: transparent; background: none; color: var(--text-2); }
.btn.ghost:hover { color: var(--text-1); background: var(--bg-hover); }
.btn.danger { color: var(--error); }
.sheetfoot { flex: none; border-top: 1px solid var(--border-subtle); padding: 10px 20px; display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--text-2); }
.sheetfoot .sp { flex: 1; }
.empty { flex: 1; display: grid; place-items: center; color: var(--text-2); }

/* harness */
.harness { position: fixed; right: 12px; bottom: 12px; z-index: 99; font-size: 12px; background: var(--bg-raised); border: 1px solid var(--border); border-radius: 8px; padding: 4px 6px; box-shadow: var(--shadow); color: var(--text-2); }
.harness select { font: inherit; color: var(--text-1); background: var(--bg-raised); border: 0; }
</style>

  if (e.tool === 'Write') { const m = /(\d+) lines added/.exec(e.out || ''); return { verb: 'Wrote', obj: e.file, add: m ? +m[1] : null }; }

/* ================= right pane ================= */
function lcsDiff(a, b) { // prefix/suffix context, middle as -/+
  let i = 0; while (i < a.length && i < b.length && a[i] === b[i]) i++;
  let j = 0; while (j < a.length - i && j < b.length - i && a[a.length - 1 - j] === b[b.length - 1 - j]) j++;
  return [...a.slice(0, i).map(t => ['c', t]), ...a.slice(i, a.length - j).map(t => ['d', t]), ...b.slice(i, b.length - j).map(t => ['a', t]), ...a.slice(a.length - j).map(t => ['c', t])];
}
function Hunk({ file, oldT, newT, start = null }) {
  const rows = lcsDiff((oldT || '').replace(/\n$/, '').split('\n'), (newT || '').replace(/\n$/, '').split('\n'));
  let o = start || 1, n = start || 1;
  return html`<div className="diff">${rows.map(([k, t], i) => { const ln = start ? (k === 'a' ? n++ : k === 'd' ? o++ : (o++, n++)) : '';
    return html`<div className=${k} key=${i}><span className="ln">${ln}</span><span className="mk">${k === 'a' ? '+' : k === 'd' ? '−' : ''}</span>${t}</div>`; })}</div>`;
}
function roundChanges(r) {
  const ents = r.entries.filter(e => e.k === 'tool');
  const stat = [...ents].reverse().find(e => /git diff --stat/.test(e.cmd || ''))?.out || '';
  const m = /(\d+) insertions?\(\+\)(?:, (\d+) deletions?\(-\))?/.exec(stat);
  const files = r.files.map(f => {
    const hunks = [];
    ents.forEach((e, idx) => {
      if (e.tool === 'Edit' && e.file === f && (e.old || e.new)) hunks.push({ oldT: e.old, newT: e.new });
      if (e.tool === 'Write' && e.file === f && e.new) {
        const prior = ents.slice(0, idx).reverse().find(x => /^rg -n/.test(x.cmd || '') && (x.out || '').startsWith(f + ':'));
        const mm = prior && /^[^:]+:(\d+):([\s\S]*)$/.exec(prior.out);
        hunks.push({ oldT: mm ? mm[2] : '', newT: e.new, start: mm ? +mm[1] : null });
      }
    });
    return { f, hunks };
  });
  const shown = files.reduce((n, x) => n + x.hunks.reduce((k, h) => k + lcsDiff((h.oldT || '').split('\n'), (h.newT || '').replace(/\n$/, '').split('\n')).filter(([t]) => t !== 'c').length, 0), 0);
  return { files, add: m ? +m[1] : null, del: m ? +(m[2] || 0) : null, shown };
}
function Changes() {
  const { s, set } = useApp();
  const r = ROUNDS[s.round - 1], h = HIST[r.n - 1], ch = roundChanges(r), total = (ch.add || 0) + (ch.del || 0), rest = total - ch.shown;
  const cmd = `git show ${r.commit}`;
  return html`<${Frag}>

      <div className="fr"><label htmlFor="f-folder">Folder</label><div>
        <div className="row2"><div className=${'fld' + (blk ? ' bad' : '')} id="f-folder" tabIndex="0"><span className="sp mono">~/src/llm-serve</span></div><button className="btn">Browse…</button></div>
        ${blk ? html`<div className="hint bad">Uncommitted changes in src/batch.rs. Commit or stash them so rounds can revert cleanly.</div>`
          : html`<div className="hint"><${Check}/>Git repository on main, working tree clean</div>`}</div></div>
      <div className="fr"><span className="lab">Task</span>${isNew ? html`<div className="fld"><span className="sp">New task</span><${Icon} n="down" cls="g t2"/></div>`
        : html`<div className="summary"><span className="t">Increase decode throughput</span>
            <span className="m">${OBJECTIVE}</span><span className="m"><span className="mono">${BENCH}</span>, ${METRIC} higher is better, 12 rounds</span>
            <button className="btn" onClick=${() => set({ setup: 'new' })}>Edit</button></div>`}</div>
      ${isNew && html`<${Frag}>
        <div className="fr"><label htmlFor="f-obj">Objective</label><div className="fld area" id="f-obj" tabIndex="0"><span className="ph">What should improve, and what must not change?</span></div></div>
        <div className="fr"><label>Benchmark</label><div><div className="fld"><span className="sp mono">${BENCH}</span></div><div className="hint">Found in benches/ of this folder.</div></div></div>
        <div className="fr"><label>Metric</label><div className="row2"><div className="fld"><span className="sp mono">${METRIC}</span></div><div className="fld" style=${{ flex: 'none' }}>Higher is better<${Icon} n="down" cls="g t2"/></div></div></div>
        <div className="fr"><label>Rounds</label><div className="fld num" style=${{ width: '64px' }}>12</div></div></${Frag}>`}
      <div className="fr"><span className="lab">Model</span><div>
        <div className="fld"><span className="sp">${isNew ? html`Codex CLI <span className="t2">gpt-5-codex</span>` : html`Claude Code <span className="t2">claude-opus-5</span>`}</span><${Icon} n="down" cls="g t2"/></div>
        <button className="disc" style=${{ marginTop: '4px', marginLeft: '-6px' }}><${Chev}/>Use a different model per role</button></div></div>
      <div className="fr"><label htmlFor="f-key">${isNew ? 'OpenAI key' : 'Anthropic key'}</label><div>
        <div className=${'fld' + (blk ? ' bad' : checking ? ' focus' : '')} id="f-key" tabIndex="0">
          ${isNew ? html`<span className="sp ph">Paste a key…</span>` : html`<span className="sp" style=${{ letterSpacing: '.12em' }}>••••••••••••••••••••</span>`}
          ${checking && html`<span className="spin"/><span className="t2" style=${{ fontSize: '12px' }}>Checking…</span><button className="linkbtn">Cancel</button>`}
          ${ready && html`<${Check} label="accepted"/><span className="t2" style=${{ fontSize: '12px' }}>Accepted</span>`}
        </div>
        <div className=${'hint' + (blk ? ' bad' : '')}>${blk ? html`Rejected: the provider answered 401 invalid x-api-key. Paste a new key.`
          : isNew ? 'Required by Codex CLI. The check was cancelled; paste the key again to check it. Write-only.' : 'Write-only. Stored for this machine and never shown again.'}</div></div></div>
      <div className="fr"><span/><button className="disc" style=${{ marginLeft: '-6px' }}><${Chev}/>Advanced</button></div>
    </div></div>
    <footer className="sheetfoot">
      ${blockers.length ? html`<span>${blockers.length} to fix:</span>${blockers.map(([id, t], i) => html`<button key=${id} className="linkbtn" onClick=${() => focusF(id)}>${t}</button>`)}` : ''}
      <span className="sp"/><button className="btn ghost" onClick=${() => set({ view: 'home' })}>Cancel</button>
      <button className="btn primary" disabled=${!ready} onClick=${() => set({ view: 'starting' })}>Start run</button>
    </footer>
  </${Frag}>`;
}
function Starting({ failed }) {
  const { s, set } = useApp();
  const [opened, setOpened] = useState(false);
  return html`<${Frag}>
    <${TitleRow}><span className="status" aria-live="polite">${failed ? html`<span className="dot err"/>Did not start` : html`<span className="spin"/>Measuring the baseline`}</span></${TitleRow}>
    <div className="scroll">
      <div className="sticky"><div className="in"><span className="rn">Before round 1</span><span className="ttl">Baseline</span>
        <span className="res">${failed ? html`<span className="bad">Failed</span>` : html`<span>No agents running yet</span>`}</span></div></div>
      <div className="col">
        <p className="claim">${failed ? html`The benchmark exited with code 101 before printing <span className="mono">${METRIC}</span>. Your settings are kept.`
          : html`VibeSys measures <span className="mono">${METRIC}</span> on the unchanged code. Round 1’s orchestrator starts when it finishes.`}</p>
        <div className="actions" style=${{ marginTop: '20px' }}>
          ${failed ? html`<div className="tool open"><div className="trow"><span className="verb">Ran</span><span className="obj">${BENCH}</span><span className="end bad">exit 101</span></div>
            <div className="out"><pre><span className="cmd">${'$ ' + BENCH + '\n'}</span>${'error[E0599]: no method named `decode_step` found\n  --> '}<button className="linkish" onClick=${() => setOpened(true)}>benches/decode.rs:41:14</button></pre></div></div>`
          : html`<div className="tool"><div className="trow"><span className="spin"/><span className="verb">Running</span><span className="obj">${BENCH}</span><span className="end t2">12s</span></div></div>`}
        </div>
        ${failed && html`<div style=${{ display: 'flex', gap: '8px', marginTop: '6px' }}><button className="btn primary" onClick=${() => set({ view: 'starting' })}>Retry</button>
          <button className="btn" onClick=${() => setOpened(true)}>${opened ? 'Opened in editor' : 'Open benches/decode.rs:41 in editor'}</button><button className="btn ghost" onClick=${() => set({ view: 'setup', setup: 'ready' })}>Back to setup</button></div>`}
      </div>
    </div>
    ${!failed && html`<${SteerDock} placeholder="Steer round 1’s planning…"/>`}
  </${Frag}>`;
}

/* ================= app ================= */
function setTheme(t) { const r = document.documentElement; const dark = t === 'dark' || (t === 'system' && matchMedia('(prefers-color-scheme: dark)').matches); r.setAttribute('data-theme', dark ? 'dark' : 'light'); }
const params = new URLSearchParams(location.search);
setTheme(params.get('theme') || 'system');
if (!params.get('theme')) matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => setTheme('system'));
const hideHarness = params.get('capture') === '1' || navigator.webdriver;

function App() {
  const [s, setS] = useState(fromHash);
  const set = patch => setS(p => ({ ...p, ...(typeof patch === 'function' ? patch(p) : patch) }));
  const later = (ms, fn) => setTimeout(() => setS(p => ({ ...p, ...fn(p) })), ms);
  const w = useWidth();
  const narrow = w < 1200;
  const sideShown = s.sideOpen && !(narrow && s.view === 'run' && s.pane);
  useEffect(() => { const f = () => setS(fromHash()); addEventListener('hashchange', f); return () => removeEventListener('hashchange', f); }, []);
  useEffect(() => { const f = e => { if (!(e.metaKey || e.ctrlKey)) return;
    if (e.key === 'k') { e.preventDefault(); set({ palette: true, palQ: '' }); }
    if (e.key === 'n') { e.preventDefault(); set({ view: 'setup', setup: 'ready', palette: false }); }
    if (e.key === 'g') { e.preventDefault(); set({ palette: true, palQ: 'Round ' }); } };
    addEventListener('keydown', f); return () => removeEventListener('keydown', f); }, []);
  let main;
  if (s.view === 'home') main = html`<${TitleRow} name="" proj=${null} tools=${false}/><div className="empty">Select a run, or start one with ⌘N</div>`;
  else if (s.view === 'other') main = html`<${TitleRow} name=${s.other} proj=${null} tools=${false}><span className="status">Finished</span></${TitleRow}><div className="empty">This run’s rounds are not part of the recording.</div>`;
  else if (s.view === 'setup') main = html`<${Setup}/>`;
  else if (s.view === 'starting') main = html`<${Starting}/>`;
  else if (s.view === 'startfail') main = html`<${Starting} failed=${true}/>`;
  else main = html`<${TitleRow}><${RunControls}/></${TitleRow}><${Transcript}/><${SteerDock}/>`;
  return html`<${Ctx.Provider} value=${{ s, set, later, sideShown }}>
    <div className="win">
      ${sideShown && html`<${Sidebar}/>`}
      <main className="main">${main}</main>
      ${s.view === 'run' && s.pane && html`<${Pane}/>`}
    </div>
    ${s.palette && html`<${Palette}/>`}
    ${!hideHarness && html`<div className="harness">Screen <select value=${location.hash.slice(1) || 'live'} onChange=${e => location.hash = e.target.value}>${Object.keys(SCREENS).map(k => html`<option key=${k}>${k}</option>`)}</select></div>`}
  </${Ctx.Provider}>`;
}
createRoot(document.getElementById('root')).render(html`<${App}/>`);
</script>
</body>
</html>
