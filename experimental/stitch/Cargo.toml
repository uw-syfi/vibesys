[workspace]
members = ["crates/stitch-core", "crates/stitch-sources", "crates/stitch-mapping", "crates/stitch-session", "crates/stitch-cli"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tempfile = "3"
