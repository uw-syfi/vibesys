[package]
name = "stitch-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "stitch"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde_json.workspace = true
stitch-core = { path = "../stitch-core" }
stitch-session = { path = "../stitch-session" }
