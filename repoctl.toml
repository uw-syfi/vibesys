# Repository policy consumed by repoctl.
default_base = "main"
jobs = ["python", "tui", "examples", "agent_image", "evaluators", "impact"]

ignored_roots = ["website", "3rd_party", "third_party", ".agents", ".claude", ".github/ISSUE_TEMPLATE", ".github/DISCUSSION_TEMPLATE"]
ignored_files = ["AGENTS.md", "CLAUDE.md", "LICENSE", "agent.toml.example", ".env.example", ".gitattributes", ".gitignore", ".github/CODEOWNERS", ".github/pull_request_template.md", ".github/delegated-merge.md"]

[[discoveries]]
adapter = "tach"
config = "tach.toml"
class = "python_module"
id_prefix = "python:"
job = "python"
ownership_group = "python_modules"

[[discoveries]]
adapter = "package_json"
manifest_glob = "clients/*/package.json"
class = "workspace_package"
id_prefix = "pnpm:"
job = "tui"
ownership_group = "workspace_packages"
workspace_prefix = "workspace:"
dependency_fields = ["dependencies", "devDependencies", "optionalDependencies"]

[[discoveries]]
adapter = "manifest_directories"
class = "native"
id_prefix = "native:"
target = true
ownership_group = "native_manifests"
manifests = { "Cargo.toml" = "rust", "go.mod" = "go" }
scope_roots = ["resources/evaluators", "examples/evaluators", "sdk/vs-evaluator"]
selected_roots = [
  "resources/evaluators/queue",
  "resources/evaluators/queue/native_runner",
  "resources/evaluators/microservice",
  "examples/data-structures/repositories/queue-rs",
  "examples/evaluators/priority-queue",
  "examples/evaluators/priority-queue/native_runner",
  "examples/starters/priority-queue-rs",
  "sdk/vs-evaluator/vseval",
]
selected_jobs = ["evaluators"]

[[collections]]
name = "native_targets"
class = "native"
field = "root"
selected_only = true

[[collections]]
name = "native_languages"
class = "native"
field = "language"
selected_only = true

[[collections]]
name = "pnpm_packages"
class = "workspace_package"
field = "name"

[native_checks]
timeout_seconds = 600
[native_checks.commands]
go = [["go", "test", "-race", "./..."]]
rust = [
  ["cargo", "fmt", "--", "--check"],
  ["cargo", "clippy", "--locked", "--all-targets", "--", "-D", "warnings"],
  ["cargo", "test", "--locked"],
]

[[check_groups]]
name = "python_tests"
trigger_job = "python"
include_in_test = true
language = "python"
directory = "."
timeout_seconds = 1800
commands = [["uv", "run", "python", "-m", "pytest", "-q"]]

[[check_groups]]
name = "python_quality"
language = "python"
directory = "."
timeout_seconds = 600
commands = [
  ["./scripts/check_format.sh"],
  ["./scripts/check_lint.sh"],
  ["uv", "run", "python", "scripts/check_file_length.py"],
  ["uv", "run", "tach", "check"],
  ["uv", "run", "python", "scripts/check_tach_graph.py", "--check"],
  ["python3", "scripts/check_doc_links.py"],
  ["uv", "run", "vibesys", "--headless", "--help"],
]

[[check_groups]]
name = "python_types"
language = "python"
directory = "."
timeout_seconds = 600
commands = [["./scripts/check_types.sh"]]

[[check_groups]]
name = "tui_tests"
trigger_job = "tui"
include_in_test = true
language = "typescript"
directory = "clients"
collection = "pnpm_packages"
timeout_seconds = 1200
commands = [
  ["pnpm", "--filter", "@vibesys/backend-client", "test"],
  ["pnpm", "--filter", "@vibesys/core-state", "test"],
  ["pnpm", "--filter", "@vibesys/tui", "test"],
  ["pnpm", "--filter", "@vibesys/web", "test"],
]
package_commands = [["pnpm", "--filter", "{package}", "test"]]
always_commands = [["pnpm", "test:ts-architecture"], ["pnpm", "test:conformance"]]

[[check_groups]]
name = "tui_quality"
language = "typescript"
directory = "clients"
timeout_seconds = 1200
commands = [
  ["pnpm", "check:ts"],
  ["pnpm", "check:ts-architecture"],
  ["pnpm", "check:knip"],
  ["pnpm", "--dir", "backend-client", "generate:protocol"],
  ["git", "diff", "--exit-code", "--", "backend-client/src/generated/protocol.schema.json", "backend-client/src/generated/protocol.generated.ts"],
  ["pnpm", "check:clients"],
]

[[check_groups]]
name = "tui_build"
language = "typescript"
directory = "clients"
timeout_seconds = 1200
commands = [["pnpm", "build:clients"]]

[[check_groups]]
name = "tui_e2e"
language = "typescript"
directory = "clients"
timeout_seconds = 1200
commands = [["pnpm", "--filter", "@vibesys/web", "test:e2e"]]

[[check_groups]]
name = "tui_package_smoke"
language = "typescript"
directory = "clients"
timeout_seconds = 600
commands = [["bash", "scripts/check_package_smoke.sh"]]

[[check_groups]]
name = "examples_tests"
trigger_job = "examples"
include_in_test = true
language = "python"
directory = "."
timeout_seconds = 1200
env = { VIBESYS_REQUIRE_EXAMPLE_EXTERNAL_REPOS = "1" }
commands = [
  ["uv", "run", "python", "scripts/example_repositories.py"],
  ["uv", "run", "python", "-m", "pytest", "tests/examples/test_example_registry.py", "-v", "--no-cov"],
  ["uv", "run", "python", "-m", "pytest", "tests/vibesys/test_microservice_inputs.py", "tests/vibesys/test_input_sources.py", "-v", "--no-cov"],
]

[[check_groups]]
name = "agent_image_tests"
trigger_job = "agent_image"
include_in_test = true
language = "python"
directory = "."
timeout_seconds = 1200
env = { VIBESYS_E2E_DOCKER = "1" }
commands = [
  ["docker", "info", "--format", "{{.ServerVersion}}"],
  ["uv", "run", "pytest", "tests/e2e/test_agent_image_e2e.py", "libs/vs-sandbox/tests/test_docker_conformance_e2e.py", "-v", "-s", "--no-cov"],
]

[[check_groups]]
name = "repoctl_tests"
trigger_job = "impact"
include_in_test = true
language = "go"
directory = "support/repoctl"
timeout_seconds = 600
commands = [
  ["go", "test", "./..."],
  ["go", "vet", "./..."],
  ["go", "test", "-run=^$", "-fuzz=^FuzzGraphSelection$", "-fuzztime=20000x", "-parallel=2", "."],
  ["go", "test", "-run=^$", "-fuzz=^FuzzParseNameStatusZ$", "-fuzztime=20000x", "-parallel=2", "."],
]

[[check_groups]]
name = "sandbox_tests"
language = "python"
directory = "."
timeout_seconds = 900
env = { VIBESYS_REQUIRE_SANDBOX_TESTS = "1" }
commands = [["uv", "run", "python", "-m", "pytest", "tests/vibesys/agents/test_hostsandbox.py", "-v"]]

[[check_groups]]
name = "microservice_workload_checks"
language = "go"
directory = "resources/evaluators/microservice"
timeout_seconds = 1200
commands = [["bash", "check_workloads.sh"]]

[[check_groups]]
name = "python_ci_tests"
language = "python"
directory = "."
timeout_seconds = 1800
commands = [
  ["uv", "run", "python", "-m", "pytest", "-v", "-n", "auto", "--dist", "loadgroup", "--durations=25", "--cov-report=xml", "--cov-report=json", "--cov-fail-under=75"],
  ["uv", "run", "python", "scripts/check_coverage_floor.py", "coverage.json"],
]

[[check_groups]]
name = "patch_coverage"
language = "python"
directory = "."
timeout_seconds = 300
commands = [["uv", "run", "diff-cover", "coverage.xml", "--compare-branch=origin/main", "--fail-under=80"]]

[[native_check_overrides]]
root = "sdk/vs-evaluator/vseval"
assertions = [{ file = "go.mod", line_prefix = "module ", equals = "github.com/uw-syfi/vibesys/sdk/vs-evaluator/vseval" }]

[[native_check_overrides]]
root = "resources/evaluators/microservice"
env = { VIBESYS_REQUIRE_MANAGED_CANDIDATE_TESTS = "1" }

[[components]]
id = "python_support"
class = "python_support"
job = "python"
# Central tests and project tooling are outside Tach's source roots.
roots = ["tests", "libs", "sdk", "scripts", "packaging", "benchmarks", "resources", "examples"]
files = ["tach.toml", "pyproject.toml", "uv.lock", "setup.py", "conftest.py", "MANIFEST.in", ".github/delegated-merge.toml", ".github/workflows/delegated-merge.yml"]

[[components]]
id = "server_protocol"
files = ["src/server/api/schema.py", "src/server/events.py", "src/server/api/protocol.py", "src/server/controller.py", "src/server/diagnostics.py", "src/server/settings.py"]

[[components]]
id = "clients"
class = "manual"
job = "tui"
root = "clients"
depends_on = ["server_protocol", "bun_fetcher"]

[[components]]
id = "bun_fetcher"
files = ["packaging/fetch_bun.py"]

[[components]]
id = "examples"
class = "manual"
job = "examples"
roots = ["examples", "docs"]
files = [".gitmodules", "README.md"]
depends_on = ["example_validation", "microservice_evaluator"]

[[components]]
id = "example_validation"
files = ["src/entrypoints/headless.py", "src/vibesys/run/project_policy.py", "scripts/example_repositories.py", "tests/vibesys/test_microservice_inputs.py", "tests/vibesys/test_input_sources.py", "tests/examples/test_example_registry.py", "tests/support/example_registry.py"]
roots = ["src/vibesys/evaluators"]

[[components]]
id = "agent_image"
class = "manual"
job = "agent_image"
roots = ["src/vibesys/sandbox/images", "libs/vs-sandbox"]
files = ["src/vibesys/sandbox/images.py", "src/vibesys/agents/provider_policy.py"]

[[components]]
id = "microservice_evaluator"
roots = ["resources/evaluators/microservice"]

[[edges]]
from = "native:sdk/vs-evaluator/vseval"
to = "native:resources/evaluators/microservice"

[[edges]]
from = "native:sdk/vs-evaluator/vseval"
to = "native:resources/evaluators/queue"

[[edges]]
from = "native:resources/evaluators/queue/native_runner"
to = "native:resources/evaluators/queue"

[[edges]]
from = "native:examples/evaluators/priority-queue/native_runner"
to = "native:examples/evaluators/priority-queue"

[[edges]]
from = "native:examples/data-structures/repositories/queue-rs/verus-mpmc"
to = "native:examples/data-structures/repositories/queue-rs"

[[components]]
id = "repo_policy"
# Keep the previous paths owned while this rename appears in a diff.
roots = ["support/repoctl", "support/ci_impact"]
files = [".github/workflows/test.yml", "repoctl.toml", "repoctl-cases.toml", "ci-impact.toml"]
select_all_jobs = true
select_all_collections = true

[[components]]
id = "workflow_references"
class = "manual"
job = "examples"
root = ".github/workflows"
