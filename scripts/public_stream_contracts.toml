# Delivery semantics for every public observation stream served through the app-facing host
# services. Protocol Buffers remain the owners of fields and wire behavior; this registry makes the
# cross-contract differences closed and reviewable. scripts/check_public_stream_contracts.py keeps
# this list equal to the server-streaming RPCs and Subscribe topics in those services.

[[stream]]
id = "vibesys.api.v1.HostService/Tail"
owner = "proto/vibesys/api/v1/host.proto"
delivery = "ordered"
initial = "cursor"
ordering = "log_sequence"
resume = "offset"
cursor_scope = "durable_log"
completeness = "lossless"
bounds = "message"
liveness = "transport"
failure = "grpc_status"
compatibility = "schema_hash"

[[stream]]
id = "vibesys.api.v1.HostService/TailStream"
owner = "proto/vibesys/api/v1/host.proto"
delivery = "ordered"
initial = "cursor"
ordering = "byte_offset"
resume = "offset"
cursor_scope = "durable_log"
completeness = "lossless"
bounds = "chunk"
liveness = "transport"
failure = "grpc_status"
compatibility = "schema_hash"

[[stream]]
id = "vibesys.api.v1.HostService/Subscribe#machine_stats"
owner = "proto/vibesys/api/v1/subscribe.proto"
delivery = "conflated"
initial = "empty_then_snapshot"
ordering = "key_order"
resume = "restart"
cursor_scope = "none"
completeness = "latest_per_key"
bounds = "key_value"
liveness = "heartbeat_source_lease"
failure = "terminal_frame_or_grpc"
compatibility = "schema_hash"

[[stream]]
id = "vibesys.api.v1.HostService/Subscribe#runs"
owner = "proto/vibesys/api/v1/subscribe.proto"
delivery = "conflated"
initial = "empty_then_snapshot"
ordering = "key_order"
resume = "restart"
cursor_scope = "none"
completeness = "latest_per_key"
bounds = "key_value"
liveness = "heartbeat_source_lease"
failure = "terminal_frame_or_grpc"
compatibility = "schema_hash"

[[stream]]
id = "vibesys.orchestrator.v1.OrchestratorService/WatchRuns"
owner = "proto/vibesys/orchestrator/v1/service.proto"
delivery = "composite"
initial = "snapshot_or_resume"
ordering = "per_channel"
resume = "sequence"
cursor_scope = "per_channel"
completeness = "per_channel"
bounds = "explicit_omission"
liveness = "transport"
failure = "grpc_status"
compatibility = "version_range"
channel_oneof = "body"
channels = { snapshot = "bounded_snapshot", change = "ordered_change", search = "stream_revision_view", summary = "replacement_view" }

[[stream]]
id = "vibesys.orchestrator.v1.OrchestratorService/WatchAgent"
owner = "proto/vibesys/orchestrator/v1/service.proto"
delivery = "ordered"
initial = "page_or_resume"
ordering = "committed_sequence"
resume = "sequence"
cursor_scope = "durable_log"
completeness = "committed_and_ephemeral"
bounds = "paged_elision"
liveness = "transport"
failure = "grpc_status"
compatibility = "version_range"

[[stream]]
id = "vibesys.orchestrator.v1.OrchestratorService/WatchRunCost"
owner = "proto/vibesys/orchestrator/v1/service.proto"
delivery = "replacement"
initial = "current_view"
ordering = "stream_order"
resume = "restart"
cursor_scope = "none"
completeness = "whole_view"
bounds = "message"
liveness = "transport"
failure = "grpc_status"
compatibility = "version_range"

[[stream]]
id = "vibesys.orchestrator.v1.OrchestratorService/WatchHostCost"
owner = "proto/vibesys/orchestrator/v1/service.proto"
delivery = "replacement"
initial = "current_view"
ordering = "stream_order"
resume = "restart"
cursor_scope = "none"
completeness = "whole_view"
bounds = "message"
liveness = "transport"
failure = "grpc_status"
compatibility = "version_range"
