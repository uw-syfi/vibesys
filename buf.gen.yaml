version: v2
clean: true
inputs:
  # vibesys-cli's contract has its own template (buf.gen.cli.yaml) and only Go bindings.
  - directory: proto
    exclude_paths: [proto/vibesys/cli]
managed:
  enabled: true
  # check_schema_hashes requires embedded descriptors to retain source options.
  disable:
    - path: vibesys
  override:
    - file_option: go_package
      path: buf/validate/validate.proto
      value: buf.build/gen/go/bufbuild/protovalidate/protocolbuffers/go/buf/validate
plugins:
  - local: protoc-gen-py
    strategy: all
    out: libs/vs-proto/src/vs_proto/_generated
  - local: clients/node_modules/.bin/protoc-gen-es
    strategy: all
    out: clients/libs/proto/src/generated
    opt: [target=ts, import_extension=js]
  - local: [go, -C, gateway, tool, protoc-gen-go]
    strategy: all
    out: gateway/gen
    opt: paths=source_relative
  - local: [go, -C, gateway, tool, protoc-gen-go-grpc]
    strategy: all
    out: gateway/gen
    opt: paths=source_relative
