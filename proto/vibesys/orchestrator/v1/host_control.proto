syntax = "proto3";
package vibesys.orchestrator.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/uw-syfi/vibesys/orchestrator/gen/vibesys/orchestrator/v1;orchestratorv1";

// HostControlService is the one contract every host of every release answers, so any client can ask
// any host what it is and ask it to stop. It is served always, even when the host cannot serve the
// orchestrator, and it is small and frozen on purpose: a change that breaks it makes a host that
// no client of another release can stop. Nothing is removed or renumbered; buf breaking holds it.
service HostControlService {
  // Identify says what the host is, whether it can serve, and whether stopping it is safe.
  rpc Identify(IdentifyRequest) returns (IdentifyResponse);
  // Stop ends the host. Sessions of live runs keep running, and the next host finds them.
  rpc Stop(StopRequest) returns (StopResponse);
}

message IdentifyRequest {
  // The caller's release version, or empty when it is a build of no release. The host decides how
  // the two relate, once, for every client.
  string client_release = 1 [(buf.validate.field).string.max_bytes = 128];
}

message IdentifyResponse {
  // The running host's release version, or "dev" for a build of no release.
  string release = 1 [(buf.validate.field).string = {min_len: 1, max_bytes: 128}];
  ReleaseRelation relation = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  google.protobuf.Timestamp started_at = 3 [(buf.validate.field).required = true];
  // Runs that have not reached their end. Stopping the host while it is not zero leaves them
  // without a host until the next one starts.
  uint32 live_runs = 4;
  // Every part the host starts a run with, as it is at this moment.
  repeated PartReadiness parts = 5 [(buf.validate.field).repeated.max_items = 16];
  oneof orchestrator {
    option (buf.validate.oneof).required = true;
    // This host serves the orchestrator.
    Serving serving = 6;
    // This host is up and answers here, and does not serve the orchestrator.
    Unserved unserved = 7;
  }
  // The digest of the HostConfig this host started with, or empty when it started with none. A client
  // compares it with the digest of the configuration now in the host's root.
  string config_digest = 8 [(buf.validate.field).string.max_bytes = 128];
  // The full API schema hash this host answers HostService with, for a client of that service to
  // tell, before its handshake fails, that it must replace the host.
  string api_schema_hash = 9 [(buf.validate.field).string.max_bytes = 128];
  // Connections open to the host other than the one asking: a desktop app, a client following a run.
  // A host with connected clients is not idle, so no client replaces it unasked. Zero from a host
  // older than this field.
  uint32 connected_clients = 10;
  // Which program a host of no release is, for telling two such builds apart: an opaque value, equal
  // only for the same program. Empty for a host of a release, whose release says that, and from a host
  // older than this field. A client compares it with the same value of the host it would start.
  string build_id = 11 [(buf.validate.field).string.max_bytes = 128];
}

// ReleaseRelation is how the host's release compares with the asking client's.
enum ReleaseRelation {
  RELEASE_RELATION_UNSPECIFIED = 0;
  RELEASE_RELATION_SAME = 1;
  RELEASE_RELATION_HOST_OLDER = 2;
  RELEASE_RELATION_HOST_NEWER = 3;
  // Either side is a build of no release, so the two cannot be ordered.
  RELEASE_RELATION_UNKNOWN = 4;
}

// HostPart is something the host starts a run with. The names do not say how it is implemented:
// a different program in the same role changes nothing here.
enum HostPart {
  HOST_PART_UNSPECIFIED = 0;
  HOST_PART_SESSION_HOLDER = 1;
  HOST_PART_SKILLS = 2;
  HOST_PART_JOB_TOOL = 3;
}

message PartReadiness {
  HostPart part = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  oneof state {
    option (buf.validate.oneof).required = true;
    PartReady ready = 2;
    PartProblem problem = 3;
  }
}

message PartReady {
  PartOrigin origin = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

enum PartOrigin {
  PART_ORIGIN_UNSPECIFIED = 0;
  // The release the host is installed in provides it.
  PART_ORIGIN_RELEASE = 1;
  // The operator chose it for this host, overriding the release.
  PART_ORIGIN_OPERATOR = 2;
}

message PartProblem {
  PartProblemReason reason = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // Display only: what is missing or wrong, and where.
  string detail = 2 [(buf.validate.field).string.max_bytes = 4096];
}

enum PartProblemReason {
  PART_PROBLEM_REASON_UNSPECIFIED = 0;
  // The host is in no release and the operator chose nothing.
  PART_PROBLEM_REASON_NO_RELEASE = 1;
  // The release lacks a file the part needs.
  PART_PROBLEM_REASON_RELEASE_INCOMPLETE = 2;
  // The operator's choice cannot be used.
  PART_PROBLEM_REASON_OPERATOR_CHOICE_REFUSED = 3;
}

message Serving {}

message Unserved {
  UnservedReason reason = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // The release of the process that holds the orchestrator, when it is another host and says.
  string held_by_release = 2 [(buf.validate.field).string.max_bytes = 128];
  // Display only.
  string detail = 3 [(buf.validate.field).string.max_bytes = 4096];
}

enum UnservedReason {
  UNSERVED_REASON_UNSPECIFIED = 0;
  // Another host process holds the orchestrator's state.
  UNSERVED_REASON_HELD_ELSEWHERE = 1;
  // The state cannot be opened here.
  UNSERVED_REASON_STATE_REFUSED = 2;
  // The host's configuration cannot be read. Only a start report says this: such a host never serves.
  UNSERVED_REASON_CONFIG_REFUSED = 3;
  // Another process held the orchestrator's state when this host started, and has since let go. This
  // host does not take it over; a host started now can.
  UNSERVED_REASON_HOLDER_GONE = 4;
}

message StopRequest {
  // Stop only when no run is live. A host with live runs answers refused instead.
  bool only_if_idle = 1;
}

message StopResponse {
  oneof outcome {
    option (buf.validate.oneof).required = true;
    Stopping stopping = 1;
    Busy refused = 2;
  }
}

// Stopping says the host is ending. It may close the connection before the caller reads this.
message Stopping {}

message Busy {
  uint32 live_runs = 1 [(buf.validate.field).uint32.gt = 0];
}

// HostLock is what a host process records in the lock file it holds for its whole life. A reader
// finds the process the lock belongs to only while the lock is held: a free lock means no host,
// whatever the record says.
message HostLock {
  uint32 pid = 1 [(buf.validate.field).uint32.gt = 0];
  string release = 2 [(buf.validate.field).string = {min_len: 1, max_bytes: 128}];
  // The root the process is the host of. A host holding its root's lock that finds the state directory
  // held by a host of the same root is watching a hand-over; one of another root is a refusal. Empty
  // from a host older than this field.
  string root = 3 [(buf.validate.field).string.max_bytes = 4096];
  // The machine the process runs on. A root on a shared disk is seen from other machines, where the
  // lock reads as held, the socket cannot be connected to and the process cannot be signalled. Empty
  // from a host older than this field.
  string machine = 4 [(buf.validate.field).string.max_bytes = 256];
}

// HostStartReport is what a starting host says, once, to whoever started it, on a pipe that the
// starter holds and the host's exit closes. A candidate that ends without saying anything failed
// before it could speak.
message HostStartReport {
  oneof outcome {
    option (buf.validate.oneof).required = true;
    // This candidate holds the root and accepts connections on its socket.
    Serving serving = 1;
    // Another process holds the root, and may not be accepting connections yet. This one has ended.
    AlreadyServed already_served = 2;
    // This candidate cannot serve, and has ended. Nothing is left running.
    Unserved refused = 3;
  }
}

message AlreadyServed {}
