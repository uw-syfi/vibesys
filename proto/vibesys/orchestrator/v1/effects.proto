syntax = "proto3";
package vibesys.orchestrator.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "vibesys/orchestrator/v1/orchestrator.proto";

option go_package = "github.com/uw-syfi/vibesys/orchestrator/gen/vibesys/orchestrator/v1;orchestratorv1";

// Effect is one request for I/O. It commits in the same transaction as the events that decided
// it, and a worker carries it out at least once, so its id must be enough to drop a repeat.
message Effect {
  // Stable across redelivery.
  string id = 1 [(buf.validate.field).string.min_len = 1];
  oneof body {
    option (buf.validate.oneof).required = true;
    LaunchSession launch_session = 10;
    StartTurn start_turn = 11;
    Steer steer = 12;
    Interrupt interrupt = 13;
    CloseSession close_session = 14;
    ArmTimer arm_timer = 15;
    ReleaseCheckouts release_checkouts = 16;
  }
}

// SessionRef names one session of one agent. The program holding a session refuses a stale one.
message SessionRef {
  string agent_id = 1 [(buf.validate.field).string.min_len = 1];
  uint32 session = 2 [(buf.validate.field).uint32.gt = 0];
}

// LaunchSession asks for a session of an agent. What else the session needs comes from the run and
// the host's configuration when the effect is carried out.
message LaunchSession {
  SessionRef session = 1 [(buf.validate.field).required = true];
  string run_id = 2 [(buf.validate.field).string.min_len = 1];
  AgentRole role = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  Harness harness = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string model = 5;
  string reasoning_effort = 6;
  // Set to continue the agent's last session instead of starting afresh. See SessionOpened.
  bytes resume_token = 7 [(buf.validate.field).bytes.max_len = 4096];
}

message StartTurn {
  SessionRef session = 1 [(buf.validate.field).required = true];
  string turn_id = 2 [(buf.validate.field).string.min_len = 1];
  // The typed message, kept as it is. The host renders it into words each time it sends the effect,
  // so a delivery that is retried sends the same words.
  Message message = 3 [(buf.validate.field).required = true];
}

message Steer {
  SessionRef session = 1 [(buf.validate.field).required = true];
  string turn_id = 2 [(buf.validate.field).string.min_len = 1];
  // The typed message, rendered when sent like StartTurn's.
  Message message = 3 [(buf.validate.field).required = true];
}

message Interrupt {
  SessionRef session = 1 [(buf.validate.field).required = true];
  string turn_id = 2 [(buf.validate.field).string.min_len = 1];
}

message CloseSession {
  SessionRef session = 1 [(buf.validate.field).required = true];
  // Kill the session without waiting for it. Its stop grace ran out, so nothing listens for more.
  bool force = 2;
}

// ReleaseCheckouts asks for the working copies the agents of an ended run made to be removed, except
// those that hold work git does not have. The answer comes back as the run's kept_checkouts.
message ReleaseCheckouts {
  string run_id = 1 [(buf.validate.field).string.min_len = 1];
}

// TimerKind says what a timer is for.
enum TimerKind {
  TIMER_KIND_UNSPECIFIED = 0;
  TIMER_KIND_RUN_DEADLINE = 1;
  // How long a session has to confirm a close.
  TIMER_KIND_STOP_GRACE = 2;
  // How long a session has to open before it is written off as failed to start.
  TIMER_KIND_LAUNCH_DEADLINE = 3;
  // How long a run's lead may sit idle with nothing outstanding before it is reminded.
  TIMER_KIND_LEAD_IDLE = 4;
}

// ArmTimer asks for a TimerFired at a time. A timer that outlives its reason fires harmlessly.
message ArmTimer {
  option (buf.validate.message).cel = {
    id: "arm_timer.session"
    message: "a stop grace and a launch deadline name a session; a run deadline and a lead idle timer do not"
    expression: "has(this.session) == (this.kind == 2 || this.kind == 3)"
  };

  TimerKind kind = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string run_id = 2 [(buf.validate.field).string.min_len = 1];
  // Set on a stop grace and a launch deadline.
  SessionRef session = 3;
  google.protobuf.Timestamp fire_at = 4 [(buf.validate.field).required = true];
}
