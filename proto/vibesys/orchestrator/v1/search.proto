syntax = "proto3";
package vibesys.orchestrator.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "vibesys/cli/v1/bound.proto";
import "vibesys/cli/v1/job.proto";
import "vibesys/cli/v1/plan.proto";
import "vibesys/cli/v1/result.proto";
import "vibesys/cli/v1/service.proto";

option go_package = "github.com/uw-syfi/vibesys/orchestrator/gen/vibesys/orchestrator/v1;orchestratorv1";

// SearchState is a whole, ephemeral view. Revisions are comparable only within
// one WatchRuns stream; a new stream starts a new revision scope.
message SearchState {
  string run_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 256
  }];
  uint64 revision = 2 [(buf.validate.field).uint64.gt = 0];
  SearchHealth health = 3 [(buf.validate.field).required = true];
  repeated vibesys.cli.v1.Job jobs = 4 [(buf.validate.field).repeated.max_items = 500];
  repeated vibesys.cli.v1.Result results = 5 [(buf.validate.field).repeated.max_items = 500];
  repeated vibesys.cli.v1.Judgment judgments = 6 [(buf.validate.field).repeated.max_items = 100];
  repeated vibesys.cli.v1.PromotionRecord promotions = 7 [(buf.validate.field).repeated.max_items = 200];
  repeated vibesys.cli.v1.Plan plans = 8 [(buf.validate.field).repeated.max_items = 200];
  vibesys.cli.v1.Head head = 9;
  repeated vibesys.cli.v1.JobTrouble troubles = 10 [(buf.validate.field).repeated.max_items = 500];
  uint32 unattributed_jobs = 11;
  bool truncated = 12;
  // The performance bounds that stand for the run, one entry per objective, by objective name: those
  // its agents declared, and those a person declared outside any run (RecordOrigin.run_id empty),
  // which stand for every run of the task.
  // Kept whole under the byte budget: a few small entries, bounded by construction.
  repeated ObjectiveBounds bounds = 13 [(buf.validate.field).repeated.max_items = 64];
}

// ObjectiveBounds is the performance bound the run's agents declared for one objective, with every
// earlier version of it, so a chart can draw the bound as it stood at each moment.
message ObjectiveBounds {
  option (buf.validate.message).cel = {
    id: "objective_bounds.versions_are_of_the_objective"
    message: "every version declares this objective, in the direction of the objective"
    expression: "this.versions.all(v, v.objective == this.objective && v.direction == this.direction)"
  };

  string objective = 1 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 256
  }];
  // Which way the objective improves, as the task declared it.
  vibesys.cli.v1.Direction direction = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // Every declaration for the objective in this run, oldest first. The last is the bound that
  // stands. When the run declared more versions than fit, the newest are kept and the state is
  // marked truncated.
  repeated vibesys.cli.v1.ObjectiveBound versions = 3 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 64
  }];
  // The head's value on the objective, the number percent_of_bound is a share of. Absent when the
  // run has no head, the head has no value for the objective, or the head measured the objective in
  // another direction than the bound's.
  optional double head_value = 4 [(buf.validate.field).double.finite = true];
  // How close the head is to the standing bound, in percent: 100 at the bound, and above 100 when
  // the head has gone past it, which says the bound was too modest. For an objective that is
  // maximized it is head_value over the bound, and for one that is minimized the bound over
  // head_value, so more is better for both. Absent when head_value is, and when either number is not
  // above zero. It takes the bound to be in the unit of the head's measurements, as a bound is
  // declared (ObjectiveBound.value); the orchestrator cannot check it, because a measurement keeps
  // no unit (the evaluator's unit is a label for people, never parsed), so a bound declared in
  // another unit gives a wrong percent. The version's unit is served for a reader to judge.
  optional double percent_of_bound = 5 [(buf.validate.field).double = {
    finite: true
    gt: 0
  }];
}

message SearchHealth {
  oneof state {
    option (buf.validate.oneof).required = true;
    google.protobuf.Timestamp live_since = 1;
    Unreadable unreadable = 2;
  }
}

message Unreadable {
  UnreadableReason reason = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  google.protobuf.Timestamp since = 2 [(buf.validate.field).required = true];
  // Display only.
  string detail = 3 [(buf.validate.field).string.max_bytes = 4096];
}

enum UnreadableReason {
  UNREADABLE_REASON_UNSPECIFIED = 0;
  UNREADABLE_REASON_NO_DAEMON = 1;
  UNREADABLE_REASON_START_FAILED = 2;
  UNREADABLE_REASON_CLI_NOT_INSTALLED = 3;
  UNREADABLE_REASON_CLIENT_TOO_OLD = 4;
  UNREADABLE_REASON_DAEMON_TOO_OLD = 5;
  UNREADABLE_REASON_STORE_OWNED_ELSEWHERE = 6;
  UNREADABLE_REASON_STORE_AWAY = 7;
  UNREADABLE_REASON_STREAM_LOST = 8;
  // The job service sent a message past the size bound; retrying the same read cannot fix it.
  UNREADABLE_REASON_MESSAGE_TOO_LARGE = 9;
  // The host asked for the job log and no job service answered, after starting one. A view that has
  // not been asked for yet is NO_DAEMON; this one has been tried, and says the read failed.
  UNREADABLE_REASON_NOT_ANSWERING = 10;
}
