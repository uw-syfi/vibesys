syntax = "proto3";
package vibesys.orchestrator.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "vibesys/cli/v1/bound.proto";
import "vibesys/cli/v1/job.proto";
import "vibesys/cli/v1/plan.proto";
import "vibesys/cli/v1/result.proto";
import "vibesys/cli/v1/service.proto";
import "vibesys/cli/v1/workstream.proto";

option go_package = "github.com/uw-syfi/vibesys/orchestrator/gen/vibesys/orchestrator/v1;orchestratorv1";

// SearchState is a whole, ephemeral view. Revisions are comparable only within
// one WatchRuns stream; a new stream starts a new revision scope.
message SearchState {
  string run_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 256
  }];
  uint64 revision = 2 [(buf.validate.field).uint64.gt = 0];
  SearchHealth health = 3 [(buf.validate.field).required = true];
  repeated vibesys.cli.v1.Job jobs = 4 [(buf.validate.field).repeated.max_items = 500];
  repeated vibesys.cli.v1.Result results = 5 [(buf.validate.field).repeated.max_items = 500];
  repeated vibesys.cli.v1.Judgment judgments = 6 [(buf.validate.field).repeated.max_items = 100];
  repeated vibesys.cli.v1.PromotionRecord promotions = 7 [(buf.validate.field).repeated.max_items = 200];
  repeated vibesys.cli.v1.Plan plans = 8 [(buf.validate.field).repeated.max_items = 200];
  vibesys.cli.v1.Head head = 9;
  repeated vibesys.cli.v1.JobTrouble troubles = 10 [(buf.validate.field).repeated.max_items = 500];
  uint32 unattributed_jobs = 11;
  bool truncated = 12;
  // The performance bounds that stand for the run, one entry per objective, by objective name: those
  // its agents declared, and those a person declared outside any run (RecordOrigin.run_id empty),
  // which stand for every run of the task.
  // Kept whole under the byte budget: a few small entries, bounded by construction.
  repeated ObjectiveBounds bounds = 13 [(buf.validate.field).repeated.max_items = 64];
  // Every measured candidate of the run on each objective, oldest first, with the points that set a new
  // best marked. Derived from the run's measure results, so a chart draws it and computes nothing.
  repeated ObjectiveSeries series = 14 [(buf.validate.field).repeated.max_items = 8];
  // The measured candidates of a task with two or more objectives, each with whether any other
  // measured candidate beats it. Absent for a task with fewer than two.
  Tradeoff tradeoff = 15;
  // The task's workstreams, by number. Those the run's ideas belong to are kept before the others,
  // and the newest of each go last; over the limit the state is marked truncated.
  repeated vibesys.cli.v1.Workstream workstreams = 16 [(buf.validate.field).repeated.max_items = 100];
  // One view for each plan in `plans`, in the same order: what a screen shows of an idea beyond the
  // plan's own record, derived here so that no screen works out a verdict, a count or a gain.
  repeated IdeaView ideas = 17 [(buf.validate.field).repeated.max_items = 200];
  // The run's ideas counted by workstream, ascending by workstream number, over every idea of the
  // run (IdeaView.in_run), including those the cap left out of `ideas`. Absent for a run with no
  // idea.
  repeated WorkstreamView workstream_views = 18 [(buf.validate.field).repeated.max_items = 101];
  // How many of the run's measured candidates (the points of `series`, counted once for each job)
  // name no plan: the baseline and the deliberate --no-plan measurements. `unattributed_jobs` is
  // another count, of jobs that no run claimed.
  uint32 unplanned = 19;
}

// IdeaVerdict is where an idea stands as a person reads it, derived from PlanStatus.
enum IdeaVerdict {
  IDEA_VERDICT_UNSPECIFIED = 0;
  // A plan that is open or chosen, and one whose status was never set (a plan saved before plans
  // had a status).
  IDEA_VERDICT_OPEN = 1;
  // A plan that won.
  IDEA_VERDICT_KEPT = 2;
  IDEA_VERDICT_REJECTED = 3;
  IDEA_VERDICT_PARKED = 4;
}

// ObjectiveGain is what an idea's candidates reached on one objective, against where the run began.
message ObjectiveGain {
  string metric = 1 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 256
  }];
  // The best value among the idea's measured candidates over the run's baseline, oriented so that
  // more than 1 is better whichever way the objective improves: best over baseline when it is
  // maximized, baseline over best when it is minimized. The baseline is the run's first measurement
  // of the objective (the series' first point). Absent entries: a gain is left out when either number
  // is not above zero, as a ratio of them would say nothing.
  double ratio = 2 [(buf.validate.field).double = {
    finite: true
    gt: 0
  }];
  // The best value itself, in the unit of the measurements (ObjectiveSeries.unit).
  double best_value = 3 [(buf.validate.field).double.finite = true];
  double baseline_value = 4 [(buf.validate.field).double.finite = true];
}

// IdeaView is what is derived of one plan for the run: see SearchState.ideas.
message IdeaView {
  uint32 plan_number = 1 [(buf.validate.field).uint32.gt = 0];
  IdeaVerdict verdict = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // The measure jobs of the run that name the plan, oldest first, which are the chart points of the
  // idea. Empty when nothing the run measured names it.
  repeated string candidate_job_ids = 3 [(buf.validate.field).repeated = {
    max_items: 200
    items: {
      string: {
        min_len: 1
        max_bytes: 256
      }
    }
  }];
  // One for each objective on which a linked candidate was measured, by metric name. Empty when
  // nothing linked was measured.
  repeated ObjectiveGain best = 4 [(buf.validate.field).repeated.max_items = 8];
  // The plan was made in this run, or a status change of it was (its recorded origin and
  // transitions: RecordOrigin.run_id equal to this run's). Never inferred from time or from the jobs
  // that overlapped it. A plan saved before its origin was recorded is not in any run.
  bool in_run = 5;
}

// WorkstreamView counts the run's ideas of one workstream.
message WorkstreamView {
  // 0 holds the ideas that name no workstream.
  uint32 number = 1;
  uint32 kept = 2;
  uint32 rejected = 3;
  uint32 open = 4;
  uint32 parked = 5;
  // For each objective, the best gain among the counted ideas, by metric name.
  repeated ObjectiveGain best = 6 [(buf.validate.field).repeated.max_items = 8];
}

// BoundUnitCheck says whether a declared bound is counted in the unit of the measurements it bounds.
// A unit is a label for people and nothing converts it, so the two are the same when their text is.
enum BoundUnitCheck {
  BOUND_UNIT_CHECK_UNSPECIFIED = 0;
  // Every measurement served against the bound is counted in the bound's unit.
  BOUND_UNIT_CHECK_MATCH = 1;
  // A measurement served against the bound is counted in another unit than the bound's: the bound
  // is unverified, and no share of it is served for that measurement.
  BOUND_UNIT_CHECK_MISMATCH = 2;
  // The unit of a measurement is not known (the task declares none, or the result was saved before
  // units were kept), or there is no measurement to check: nothing says the bound matches, and
  // nothing says it does not. A share of the bound is served all the same, so a reader must show it
  // as unverified.
  BOUND_UNIT_CHECK_UNKNOWN = 3;
}

// ObjectiveBounds is the performance bound the run's agents declared for one objective, with every
// earlier version of it, so a chart can draw the bound as it stood at each moment.
message ObjectiveBounds {
  option (buf.validate.message).cel = {
    id: "objective_bounds.versions_are_of_the_objective"
    message: "every version declares this objective, in the direction of the objective"
    expression: "this.versions.all(v, v.objective == this.objective && v.direction == this.direction)"
  };

  string objective = 1 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 256
  }];
  // Which way the objective improves, as the task declared it.
  vibesys.cli.v1.Direction direction = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // Every declaration for the objective in this run, oldest first. The last is the bound that
  // stands. When the run declared more versions than fit, the newest are kept and the state is
  // marked truncated.
  repeated vibesys.cli.v1.ObjectiveBound versions = 3 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 64
  }];
  // The head's value on the objective, the number percent_of_bound is a share of. Absent when the
  // run has no head, the head has no value for the objective, or the head measured the objective in
  // another direction than the bound's.
  optional double head_value = 4 [(buf.validate.field).double.finite = true];
  // How close the head is to the standing bound, in percent: 100 at the bound, and above 100 when
  // the head has gone past it, which says the bound was too modest. For an objective that is
  // maximized it is head_value over the bound, and for one that is minimized the bound over
  // head_value, so more is better for both. Absent when head_value is, and when either number is not
  // above zero, and when the head's unit is another than the bound's (unit_check says so).
  optional double percent_of_bound = 5 [(buf.validate.field).double = {
    finite: true
    gt: 0
  }];
  // The best the run measured on the objective, in the bound's direction: the value of the newest
  // point of the objective's series that set a best, which is where the series' best line ends. It
  // is not the head's. The head is the candidate the run last promoted, and for a task of several
  // objectives it is the best of one of them, so on the others head_value and best_value differ.
  // Absent when the run measured nothing on the objective, and when its newest measurement says
  // the objective improves the other way than the bound does.
  optional double best_value = 6 [(buf.validate.field).double.finite = true];
  // How close best_value is to the standing bound, in percent, defined as percent_of_bound is for
  // the head's value. Absent when best_value is, when either number is not above zero, and when the
  // best's unit is another than the bound's.
  optional double best_percent_of_bound = 7 [(buf.validate.field).double = {
    finite: true
    gt: 0
  }];
  // The unit head_value and best_value are counted in: the unit the measurements of the objective
  // record. Empty when it is unknown, and when the two are counted in different units, which
  // unit_check then says (the unit of the best is served first).
  string measured_unit = 8 [(buf.validate.field).string.max_bytes = 64];
  // Whether the standing bound's unit (the unit of the last version) is that of head_value and
  // best_value. MISMATCH when either is counted in another unit, else UNKNOWN when either is counted
  // in none that is known or neither exists, else MATCH. The bound's unit and measured_unit are both
  // served, so a reader names both when they differ.
  BoundUnitCheck unit_check = 9 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// ObjectiveSeries is the measured history of one objective of the run: one point for every measure
// job of the run that produced a value for it, in the order they were recorded. Nothing in it is a
// judgment of the framework: a point is a measurement, and `best_so_far` says only that its value is
// better than every earlier point's in the objective's direction.
message ObjectiveSeries {
  string objective = 1 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 256
  }];
  // Which way the objective improves, as the newest measurement of it says. A measurement that says
  // the other way (the task changed its mind) is left out, as a bound of the other way is.
  vibesys.cli.v1.Direction direction = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // Oldest first, by the time the measurement was recorded (the job's end when the result states
  // none). When the run has more than fit, the points that set a best are kept before the others,
  // and the oldest of each go first, and the state is marked truncated. So a cut series always
  // holds its newest best-so-far point, which is the best the run reached, and holds every
  // best-so-far point while there are at most 400 of them.
  repeated MeasuredPoint points = 3 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 400
  }];
  // What the points are counted in, as the task declares the objective (a label for people). Empty
  // when it is unknown: the task declares none, or a point of the series is of a result saved
  // before units were kept. A point counted in another unit than the newest known one is left out,
  // as one of the other direction is.
  string unit = 4 [(buf.validate.field).string.max_bytes = 64];
}

// MeasuredPoint is one measurement of one candidate on one objective.
message MeasuredPoint {
  // The measure job that produced it, which is also the identity of its result in `results`: that
  // result is there while the state keeps it, and a point whose result was left out is a point still.
  string job_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 256
  }];
  // The full commit measured.
  string commit = 2 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 256
  }];
  google.protobuf.Timestamp at = 3 [(buf.validate.field).required = true];
  // The headline number of the measurement on the objective, as the job service computed it.
  double value = 4 [(buf.validate.field).double.finite = true];
  // The point is better than every earlier measurement of the objective, in its direction, whether
  // or not that one is in `points`: the best so far steps here. The first measurement is always one,
  // and is in `points` unless the series was cut. The newest point marked is the best the run
  // reached, and every series has one.
  bool best_so_far = 5;
}

// Tradeoff is the measured candidates of a task that declares two or more objectives, placed on all
// of them at once. A candidate is on the frontier when no other measured candidate is at least as good
// on every objective and better on one; candidates with equal values are all on it.
message Tradeoff {
  option (buf.validate.message).cel = {
    id: "tradeoff.values_are_of_the_objectives"
    message: "every point has one value for each objective"
    expression: "this.points.all(p, size(p.values) == size(this.objectives))"
  };

  // The task's objectives in the order it declares them, each as the newest measurement says it.
  repeated TradeoffObjective objectives = 1 [(buf.validate.field).repeated = {
    min_items: 2
    max_items: 8
  }];
  // Candidates measured on every one of the objectives, oldest first. Over the limit the candidates
  // on the frontier are kept before the others, and the oldest of each go first, and the state is
  // marked truncated: a frontier candidate is left out only when no candidate off the frontier is
  // left.
  repeated TradeoffPoint points = 2 [(buf.validate.field).repeated.max_items = 400];
}

message TradeoffObjective {
  string name = 1 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 256
  }];
  vibesys.cli.v1.Direction direction = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

message TradeoffPoint {
  string job_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 256
  }];
  string commit = 2 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 256
  }];
  google.protobuf.Timestamp at = 3 [(buf.validate.field).required = true];
  // The candidate's value on each objective, in the order of `Tradeoff.objectives`.
  repeated double values = 4 [(buf.validate.field).repeated.items.double.finite = true];
  bool on_frontier = 5;
}

message SearchHealth {
  oneof state {
    option (buf.validate.oneof).required = true;
    google.protobuf.Timestamp live_since = 1;
    Unreadable unreadable = 2;
  }
}

message Unreadable {
  UnreadableReason reason = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  google.protobuf.Timestamp since = 2 [(buf.validate.field).required = true];
  // Display only.
  string detail = 3 [(buf.validate.field).string.max_bytes = 4096];
}

enum UnreadableReason {
  UNREADABLE_REASON_UNSPECIFIED = 0;
  UNREADABLE_REASON_NO_DAEMON = 1;
  UNREADABLE_REASON_START_FAILED = 2;
  UNREADABLE_REASON_CLI_NOT_INSTALLED = 3;
  UNREADABLE_REASON_CLIENT_TOO_OLD = 4;
  UNREADABLE_REASON_DAEMON_TOO_OLD = 5;
  UNREADABLE_REASON_STORE_OWNED_ELSEWHERE = 6;
  UNREADABLE_REASON_STORE_AWAY = 7;
  UNREADABLE_REASON_STREAM_LOST = 8;
  // The job service sent a message past the size bound; retrying the same read cannot fix it.
  UNREADABLE_REASON_MESSAGE_TOO_LARGE = 9;
  // The host asked for the job log and no job service answered, after starting one. A view that has
  // not been asked for yet is NO_DAEMON; this one has been tried, and says the read failed.
  UNREADABLE_REASON_NOT_ANSWERING = 10;
}
