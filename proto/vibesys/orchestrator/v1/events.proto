syntax = "proto3";
package vibesys.orchestrator.v1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "vibesys/orchestrator/v1/checkin.proto";
import "vibesys/orchestrator/v1/orchestrator.proto";
import "vibesys/orchestrator/v1/setup.proto";
import "vibesys/orchestrator/v1/tool_options.proto";

option go_package = "github.com/uw-syfi/vibesys/orchestrator/gen/vibesys/orchestrator/v1;orchestratorv1";

// RunChange is what a watcher of runs receives for one committed event: the public part of it. A
// client that folds these over a snapshot holds what a later snapshot would say.
message RunChange {
  // Global and gap-free across runs. A stream limited to one run skips the sequences of the others.
  uint64 sequence = 1 [(buf.validate.field).uint64.gt = 0];
  google.protobuf.Timestamp at = 2 [(buf.validate.field).required = true];
  // The run the change belongs to, for a client that follows one run on a stream of all of them. Empty
  // only on the receipt of a command refused before it reached a run.
  string run_id = 3;
  oneof body {
    option (buf.validate.oneof).required = true;
    Run run = 10;
    Agent agent = 11;
    Turn turn = 12;
    // The whole item, so a client replaces by id.
    Item item = 13;
    Message message = 14;
    Receipt receipt = 15;
    // A check-in made, or changed as its facts were worked out or its report was posted. The whole
    // check-in, so a client replaces by id.
    CheckIn check_in = 16;
    // A setting of the run changed while it ran.
    RunUpdated run_updated = 17;
  }
}

// RunUpdated is one committed change of a run's settings: every setting that changed in one UpdateRun,
// in the order of SettingChange. A setting the update left as it was is not in it.
message RunUpdated {
  string run_id = 1 [(buf.validate.field).string.min_len = 1];
  repeated SettingChange changes = 2 [(buf.validate.field).repeated.min_items = 1];
}

message SettingChange {
  oneof change {
    option (buf.validate.oneof).required = true;
    CostLimitChange cost_limit = 1;
    TimeLimitChange time_limit = 2;
    FanoutChange fanout = 3;
    LeadChange lead = 4;
  }
}

// CostLimitChange: an absent side is "no limit".
message CostLimitChange {
  optional double from = 1 [(buf.validate.field).double = {
    finite: true
    gt: 0
  }];
  optional double to = 2 [(buf.validate.field).double = {
    finite: true
    gt: 0
  }];
}

// TimeLimitChange: the total allowed, as StartRun.max_time; an absent side is "no limit".
message TimeLimitChange {
  google.protobuf.Duration from = 1 [(buf.validate.field).duration.gt = {seconds: 0}];
  google.protobuf.Duration to = 2 [(buf.validate.field).duration.gt = {seconds: 0}];
}

message FanoutChange {
  uint32 from = 1;
  uint32 to = 2 [(buf.validate.field).uint32.gte = 1];
}

enum LeadChangeState {
  LEAD_CHANGE_STATE_UNSPECIFIED = 0;
  // Asked for; it takes effect when the lead's current turn ends.
  LEAD_CHANGE_STATE_PENDING = 1;
  LEAD_CHANGE_STATE_APPLIED = 2;
}

message LeadChange {
  AgentSpec from = 1;
  AgentSpec to = 2 [(buf.validate.field).required = true];
  LeadChangeState state = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// Delta is progress on a running item. It is never stored and never reaches the decision core: the
// next item_updated for the same item replaces it.
message Delta {
  string agent_id = 1 [(buf.validate.field).string.min_len = 1];
  string item_id = 2 [(buf.validate.field).string.min_len = 1];
  oneof body {
    option (buf.validate.oneof).required = true;
    string text = 3;
    string command_output = 4;
  }
}

// AgentSpec says what to run an agent on. An absent harness takes the lead's. An absent model takes
// the first model the run allows on that harness. An absent effort takes the lead's on the lead's
// harness, and is the harness's default on another. A harness and model outside the run's
// allowance are refused.
message AgentSpec {
  Harness harness = 1 [(buf.validate.field).enum.defined_only = true];
  string model = 2;
  string reasoning_effort = 3;
}

message StartRun {
  string repository = 1 [(buf.validate.field).string.min_len = 1];
  string task = 2 [(buf.validate.field).string.min_len = 1];
  uint32 fanout_limit = 3 [(buf.validate.field).uint32.gte = 1];
  reserved 4;
  reserved "deadline";
  // The lead has nothing to inherit from, so its harness is required.
  AgentSpec lead = 5 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "start_run.lead.harness"
      message: "the lead needs a harness"
      expression: "this.harness != 0"
    }
  ];
  // The operator's steering text for the lead, such as a note about cost or which harnesses to
  // prefer. Empty when there is none; a template words the lead's first prompt around it.
  string brief = 6;
  // Agents the run may use besides the lead's own harness and model, which are always allowed.
  repeated AllowedAgent allow_agents = 7;
  // The most the run may cost in dollars. Absent when the run has no cost limit.
  optional double max_cost_usd = 8 [(buf.validate.field).double = {
    finite: true
    gt: 0
  }];
  // How long the run may take, counted from its start by the host, so that a client's clock is not
  // in it. Absent when the run has no time limit.
  google.protobuf.Duration max_time = 9 [(buf.validate.field).duration.gt = {seconds: 0}];
  // How often the run's lead is asked for a progress report while the run's work moves, counted by the
  // host. At least five minutes. Absent takes the default of one hour; zero is not "off", it is refused,
  // so a run that wants fewer reports sets a longer interval. The lead is asked only when work moved
  // since it last reported or was last asked, and a report it posts on its own restarts the interval.
  google.protobuf.Duration summary_every = 10 [(buf.validate.field).duration.gte = {seconds: 300}];
  // The eval place the run's evaluations go to, by name (ListEvalPlaces). Empty lets the host decide:
  // a task that needs no accelerator is left unpinned, one that has exactly one fitting place takes it,
  // and several fitting places refuse the start (REFUSAL_EVAL_PLACE_AMBIGUOUS).
  string eval_place = 11 [(buf.validate.field).string.pattern = "^([a-z0-9][a-z0-9_-]{0,62})?$"];
}

// CostLimitUpdate sets, changes or removes the cost limit.
message CostLimitUpdate {
  oneof change {
    option (buf.validate.oneof).required = true;
    // The new limit, in dollars.
    double set_usd = 1 [(buf.validate.field).double = {
      finite: true
      gt: 0
    }];
    // Remove the limit.
    bool remove = 2 [(buf.validate.field).bool.const = true];
  }
}

// TimeLimitUpdate sets, changes or removes the time limit.
message TimeLimitUpdate {
  oneof change {
    option (buf.validate.oneof).required = true;
    // The new total, counted as StartRun.max_time is.
    google.protobuf.Duration set = 1 [(buf.validate.field).duration.gt = {seconds: 0}];
    // Remove the limit.
    bool remove = 2 [(buf.validate.field).bool.const = true];
  }
}

// UpdateRun changes settings of a live run, all of them or none. A setting it does not name stays as
// it is. Lowering the fanout stops no agent: it only refuses new ones until the live ones are under it.
message UpdateRun {
  option (buf.validate.message).cel = {
    id: "update_run.not_empty"
    message: "name at least one setting to change"
    expression: "has(this.cost_limit) || has(this.time_limit) || has(this.fanout_limit) || has(this.lead)"
  };

  string run_id = 1 [(buf.validate.field).string.min_len = 1];
  CostLimitUpdate cost_limit = 2;
  TimeLimitUpdate time_limit = 3;
  optional uint32 fanout_limit = 4 [(buf.validate.field).uint32.gte = 1];
  // The lead's tool, model and effort from its next turn on. The harness is required.
  AgentSpec lead = 5 [(buf.validate.field).cel = {
    id: "update_run.lead.harness"
    message: "the lead needs a harness"
    expression: "this.harness != 0"
  }];
}

// BeginSetup starts a run in its setup phase: a chat with a lead that makes the run's task. It is
// listed with the runs and stopped by StopRun like any run. It holds the repository, like a run.
message BeginSetup {
  string repository = 1 [(buf.validate.field).string.min_len = 1];
  AgentSpec lead = 2 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "begin_setup.lead.harness"
      message: "the lead needs a harness"
      expression: "this.harness != 0"
    }
  ];
  string brief = 3;
  repeated AllowedAgent allow_agents = 4;
}

// CompleteSetup ends a run's setup phase and starts it optimizing the named task. The host refuses it
// unless its own derivation says every setup check passes (REFUSAL_SETUP_INCOMPLETE). The limits count
// from here: setup's spend and time are not in them.
message CompleteSetup {
  string run_id = 1 [(buf.validate.field).string.min_len = 1];
  string task = 2 [(buf.validate.field).string.min_len = 1];
  optional double max_cost_usd = 3 [(buf.validate.field).double = {
    finite: true
    gt: 0
  }];
  google.protobuf.Duration max_time = 4 [(buf.validate.field).duration.gt = {seconds: 0}];
  uint32 fanout_limit = 5 [(buf.validate.field).uint32.gte = 1];
  AgentSpec lead = 6 [
    (buf.validate.field).required = true,
    (buf.validate.field).cel = {
      id: "complete_setup.lead.harness"
      message: "the lead needs a harness"
      expression: "this.harness != 0"
    }
  ];
  string brief = 7;
  // As StartRun.eval_place.
  string eval_place = 8 [(buf.validate.field).string.pattern = "^([a-z0-9][a-z0-9_-]{0,62})?$"];
}

message StopRun {
  string run_id = 1 [(buf.validate.field).string.min_len = 1];
}

message SpawnAgent {
  string run_id = 1 [(buf.validate.field).string.min_len = 1];
  // Any role but the lead's.
  AgentRole role = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [
      0,
      1
    ]
  }];
  AgentSpec spec = 3;
  uint32 plan_number = 4;
  string brief = 5 [(buf.validate.field).string.min_len = 1];
}

// StopAgent is also the input of the stop_agent tool.
message StopAgent {
  option (mcp_tool) = {
    name: "stop_agent"
    description: "Stop one subagent of your run. It is asked to finish its turn, then its session closes."
  };

  string agent_id = 1 [
    (buf.validate.field).string.min_len = 1,
    (tool_field_doc) = "The subagent to stop."
  ];
}

// SendMessage is also the input of the send_message tool.
message SendMessage {
  option (mcp_tool) = {
    name: "send_message"
    description: "Send text to one agent of your run. It reaches the agent as steering if it is working, or starts its next turn if it is idle."
  };

  string agent_id = 1 [
    (buf.validate.field).string.min_len = 1,
    (tool_field_doc) = "The agent to tell."
  ];
  string text = 2 [
    (buf.validate.field).string.min_len = 1,
    (tool_field_doc) = "What to say."
  ];
}

message PostHandoff {
  Handoff handoff = 1 [(buf.validate.field).required = true];
}

message PostReport {
  Report report = 1 [(buf.validate.field).required = true];
}

// RequestCatchUp is the press of Catch me up. The host records a check-in for the viewer who pressed
// it, covering everything since that viewer's last check-in in the run, and works its facts out. When
// they are frozen, a run that can be asked is also asked for a report covering the window (the check-in's
// ask_message_id), worded from those facts. The viewer is not in the body: it is the call's metadata (see
// Viewer), and a call without it is refused. The receipt answers at once with the check-in's id and no
// message, since the lead is not asked yet, and a press while the viewer's last check-in is still being
// worked out answers with that one. Allowed on a run that is over.
message RequestCatchUp {
  string run_id = 1 [(buf.validate.field).string.min_len = 1];
}

// DeclareTask names the task the setup lead is making. Only the run's lead may send it, and only
// while the run is in setup; the latest name wins, and naming the task it already names changes
// nothing. It sets Run.setup_task, not Run.task.
message DeclareTask {
  string run_id = 1 [(buf.validate.field).string.min_len = 1];
  string task = 2 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.pattern = "^[A-Za-z0-9_-][A-Za-z0-9._-]{0,127}$"
  ];
}

// Command is what clients and agents ask for. It names no caller: the daemon adds who is asking
// from the connection or the agent's session, so that a caller cannot claim to be someone else.
message Command {
  // Idempotency key; the receipt is keyed on it.
  string id = 1 [(buf.validate.field).string.min_len = 1];
  oneof body {
    option (buf.validate.oneof).required = true;
    StartRun start_run = 10;
    StopRun stop_run = 11;
    SpawnAgent spawn_agent = 12;
    StopAgent stop_agent = 13;
    SendMessage send_message = 14;
    PostHandoff post_handoff = 15;
    PostReport post_report = 16;
    RequestCatchUp request_catch_up = 17;
    UpdateRun update_run = 18;
    BeginSetup begin_setup = 19;
    CompleteSetup complete_setup = 20;
    DeclareTask declare_task = 21;
  }
}

// Refusal says why a command was not carried out.
enum Refusal {
  REFUSAL_UNSPECIFIED = 0;
  REFUSAL_RUN_NOT_FOUND = 1;
  REFUSAL_AGENT_NOT_FOUND = 2;
  // The role table does not let this caller do this.
  REFUSAL_NOT_PERMITTED = 3;
  // The run is not in a status that allows this.
  REFUSAL_RUN_NOT_RUNNING = 4;
  REFUSAL_FANOUT_LIMIT = 5;
  // The lead is stopped by stopping its run.
  REFUSAL_AGENT_IS_LEAD = 6;
  // The agent's session is already over or closing.
  REFUSAL_AGENT_NOT_LIVE = 7;
  reserved 8;
  reserved "REFUSAL_DEADLINE_PASSED";
  // Another run that is not over already works in the repository. The receipt's run_id is that run.
  REFUSAL_REPOSITORY_IN_USE = 9;
  // The harness and model asked for are outside what the run may use. The receipt's allowed_agents
  // lists what is allowed.
  REFUSAL_AGENT_NOT_ALLOWED = 10;
  // A handoff has no body, or the body of another role than the one posting it.
  REFUSAL_HANDOFF_NOT_YOURS = 11;
  // The run reached its time limit: it starts no new agent.
  REFUSAL_TIME_LIMIT_REACHED = 12;
  // The run reached its cost limit: it starts no new agent.
  REFUSAL_COST_LIMIT_REACHED = 13;
  // A catch-up was asked for with no viewer: the call carried no vibesys-viewer-id and
  // vibesys-viewer-label metadata. A client that goes through the daemon is refused with an error
  // naming the field before this is ever decided; this is what the decision itself says.
  REFUSAL_NO_VIEWER = 14;
  // The host's policy forbids the model: it is outside the models the host allows, or no model could be
  // found for an unpinned choice on a host that allows only some. The receipt's model names it (empty
  // for an unpinned choice) and its allowed_models lists what the host allows.
  REFUSAL_MODEL_NOT_ALLOWED = 15;
  // The eval place named is not one the host has. The receipt's eval_places lists the places it has.
  REFUSAL_EVAL_PLACE_NOT_FOUND = 16;
  // The place named does not give the task's accelerator. The receipt's eval_places lists the ones
  // that do.
  REFUSAL_EVAL_PLACE_MISFIT = 17;
  // No place was named and several give the accelerator. The receipt's eval_places lists them.
  REFUSAL_EVAL_PLACE_AMBIGUOUS = 18;
  // CompleteSetup before every setup check passed. The receipt's unmet_checks lists the others.
  REFUSAL_SETUP_INCOMPLETE = 19;
  // CompleteSetup, or a setup-only command, for a run that is not in setup.
  REFUSAL_NOT_IN_SETUP = 20;
}

// Receipt is the answer to a command, and the same answer to each retry of it.
message Receipt {
  string command_id = 1 [(buf.validate.field).string.min_len = 1];
  reserved 2;
  reserved "command_digest";
  // Unspecified when the command was accepted.
  Refusal refusal = 3 [(buf.validate.field).enum.defined_only = true];
  // What the command made or acted on, where it did.
  string run_id = 4;
  string agent_id = 5;
  string message_id = 6;
  // Where the message stood when the command finished.
  Delivery delivery = 7 [(buf.validate.field).enum.defined_only = true];
  // The sequence of this receipt's event, the last one of the command.
  uint64 sequence = 8;
  // Set with REFUSAL_AGENT_NOT_ALLOWED: what the run may use, so the caller can ask again.
  repeated AllowedAgent allowed_agents = 9;
  // The check-in a RequestCatchUp made, or for a press while the viewer's last check-in is being worked
  // out, that one. The message the lead was asked with, if it was, is message_id.
  string check_in_id = 10;
  // Set with REFUSAL_MODEL_NOT_ALLOWED: the model refused, empty when the choice named none and none
  // could be found for it.
  string model = 11 [(buf.validate.field).string.max_bytes = 256];
  // Set with REFUSAL_MODEL_NOT_ALLOWED: the models the host allows, so the caller can ask again. Empty
  // when the host's policy could not be read, which allows nothing.
  repeated string allowed_models = 12 [(buf.validate.field).repeated.max_items = 256];
  // Set with the eval place refusals: the places the refusal names, as each says.
  repeated string eval_places = 13 [(buf.validate.field).repeated.max_items = 64];
  // Set with REFUSAL_SETUP_INCOMPLETE: the checks that have not passed.
  repeated SetupCheckId unmet_checks = 14 [(buf.validate.field).repeated.items.enum = {
    defined_only: true
    not_in: [0]
  }];
}
