syntax = "proto3";
package vibesys.orchestrator.v1;

import "buf/validate/validate.proto";
import "vibesys/cli/v1/env.proto";
import "vibesys/orchestrator/v1/orchestrator.proto";
import "vibesys/orchestrator/v1/tool_options.proto";

option go_package = "github.com/uw-syfi/vibesys/orchestrator/gen/vibesys/orchestrator/v1;orchestratorv1";

// ToolServerCredentials is what the stdio tool server an agent launches (vibesys-host mcp) reads
// from its environment: who it speaks for and how to reach the orchestrator as that agent. The host
// builds it when it opens a session and the session holder gives it to that tool server alone, in
// OpenSessionRequest.tools[].env. The token is in this message and nowhere else: not in the agent's
// own environment (AgentEnvironment), not in an argument, and not in a tool's arguments. Every
// field is required, and a value that breaks a rule is refused naming its variable.
message ToolServerCredentials {
  option (vibesys.cli.v1.env_namespace) = "VIBESYS_ORCHESTRATOR_";

  // Where the orchestrator serves agents, on a listener that takes agent credentials only: an
  // absolute path of a local listener today.
  string endpoint = 1 [
    (vibesys.cli.v1.env_name) = "VIBESYS_ORCHESTRATOR_SOCKET",
    (buf.validate.field).string.pattern = "^/[^\\x00]*$",
    (buf.validate.field).string.max_bytes = 4096
  ];
  // The agent the tool server acts as.
  string agent = 2 [
    (vibesys.cli.v1.env_name) = "VIBESYS_ORCHESTRATOR_AGENT",
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_bytes = 256
  ];
  // The agent's session number: one for the first, and one more for each resume.
  uint32 session = 3 [
    (vibesys.cli.v1.env_name) = "VIBESYS_ORCHESTRATOR_SESSION",
    (buf.validate.field).uint32.gte = 1
  ];
  // The session's secret, which the orchestrator checks on every call.
  string token = 4 [
    (vibesys.cli.v1.env_name) = "VIBESYS_ORCHESTRATOR_TOKEN",
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_bytes = 4096
  ];
  // The run the agent belongs to.
  string run = 5 [
    (vibesys.cli.v1.env_name) = "VIBESYS_ORCHESTRATOR_RUN",
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.max_bytes = 256
  ];
  // What the agent is for, which decides the tools it is offered.
  AgentRole role = 6 [
    (vibesys.cli.v1.env_name) = "VIBESYS_ORCHESTRATOR_ROLE",
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
}

// SpawnAgentInput is the input of the spawn_agent tool. The run is the caller's own and the server
// fills it in, so the agent is not offered it.
message SpawnAgentInput {
  option (mcp_tool) = {
    name: "spawn_agent"
    description: "Start a subagent in your run, with a brief for its first turn. It reports back with post_handoff. An empty harness takes yours. An empty model takes the first model the operator allowed on that harness; a harness and model the operator did not allow are refused, with the list of what is allowed. An empty effort takes yours."
  };

  AgentRole role = 1 [
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [
        0,
        1
      ]
    },
    (tool_field_doc) = "What the subagent is for."
  ];
  string brief = 2 [
    (buf.validate.field).string.min_len = 1,
    (tool_field_doc) = "Its first prompt."
  ];
  Harness harness = 3 [
    (buf.validate.field).enum.defined_only = true,
    (tool_field_doc) = "Optional. The agent CLI to run on."
  ];
  string model = 4 [(tool_field_doc) = "Optional model name."];
  string effort = 5 [(tool_field_doc) = "Optional reasoning effort."];
  uint32 plan_number = 6 [(tool_field_doc) = "Optional. The plan this agent works on."];
}

// DeclareTaskInput is the input of the declare_task tool, which only the lead has and only while the
// run is in its setup phase (a call at any other time is refused). The run is the caller's own and
// the server fills it in. The server sends DeclareTask with this name: the pattern is that message's
// (a test holds the two equal), a directory name under .vibesys/tasks.
message DeclareTaskInput {
  option (mcp_tool) = {
    name: "declare_task"
    description: "Name the task you are making, as soon as you choose its directory name under .vibesys/tasks. The operator sees the name and the host checks that task's files and jobs, so declare it before you write them. Call it again to rename; the latest name counts. Only available while the run is in setup."
  };

  string task = 1 [
    (buf.validate.field).string.min_len = 1,
    (buf.validate.field).string.pattern = "^[A-Za-z0-9_-][A-Za-z0-9._-]{0,127}$",
    (tool_field_doc) = "The task's directory name: letters, digits, dot, underscore and hyphen, not starting with a dot, at most 128 characters."
  ];
}

// ListAgentsInput is the input of the list_agents tool, which takes no argument.
message ListAgentsInput {
  option (mcp_tool) = {
    name: "list_agents"
    description: "List the agents of your run with their role, status and plan, so you can see who is working and who is done."
  };
}
