syntax = "proto3";
package vibesys.orchestrator.v1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "vibesys/orchestrator/v1/tool_options.proto";

option go_package = "github.com/uw-syfi/vibesys/orchestrator/gen/vibesys/orchestrator/v1;orchestratorv1";

// RunStatus is where a run is. ENDED and FAILED are final.
enum RunStatus {
  RUN_STATUS_UNSPECIFIED = 0;
  // The lead's session is opening.
  RUN_STATUS_STARTING = 1;
  RUN_STATUS_RUNNING = 2;
  // The run was told to stop and its agents are closing. stop_reason says why.
  RUN_STATUS_STOPPING = 3;
  RUN_STATUS_ENDED = 4;
  RUN_STATUS_FAILED = 5;
}

// RunStopReason says why a run left RUNNING. The final status follows from it.
enum RunStopReason {
  RUN_STOP_REASON_UNSPECIFIED = 0;
  RUN_STOP_REASON_OPERATOR = 1;
  // The run's time limit was reached, and the lead did not finish within the grace period after it
  // was told (or had already finished). Ends the run as ENDED.
  RUN_STOP_REASON_TIME_LIMIT = 2;
  // The lead failed or was lost and could not be resumed. Ends the run as FAILED.
  RUN_STOP_REASON_LEAD_GONE = 3;
  // The run's cost limit was reached: see RUN_STOP_REASON_TIME_LIMIT. Ends the run as ENDED.
  RUN_STOP_REASON_COST_LIMIT = 4;
}

// RunLimit is a limit an operator can put on a run.
enum RunLimit {
  RUN_LIMIT_UNSPECIFIED = 0;
  // How long the run may take, from its start.
  RUN_LIMIT_TIME = 1;
  // What the run may cost in dollars, as the finished turns of its agents report it.
  RUN_LIMIT_COST = 2;
}

enum AgentRole {
  AGENT_ROLE_UNSPECIFIED = 0;
  AGENT_ROLE_LEAD = 1;
  AGENT_ROLE_PLANNER = 2;
  AGENT_ROLE_WORKER = 3;
  AGENT_ROLE_JUDGE = 4;
  AGENT_ROLE_COMBINER = 5;
  AGENT_ROLE_PROFILER = 6;
}

// AgentStatus is where an agent's session is. ENDED, FAILED and LOST are final for the session;
// an agent whose capabilities allow it can be resumed into a new session.
enum AgentStatus {
  AGENT_STATUS_UNSPECIFIED = 0;
  // The session is opening, for the first time or to resume.
  AGENT_STATUS_LAUNCHING = 1;
  // A turn is running.
  AGENT_STATUS_ACTIVE = 2;
  // No turn is running and subagents of this agent are live, so a wake is expected.
  AGENT_STATUS_WAITING = 3;
  // No turn is running and nothing is expected.
  AGENT_STATUS_IDLE = 4;
  // The session closed.
  AGENT_STATUS_ENDED = 5;
  // The session reported a failure.
  AGENT_STATUS_FAILED = 6;
  // What held the session went away, or it never answered a close.
  AGENT_STATUS_LOST = 7;
}

// AgentStopStage is how far an agent's stop has come. An agent's status keeps saying what its
// session is doing while this says what is being done about it.
enum AgentStopStage {
  AGENT_STOP_STAGE_UNSPECIFIED = 0;
  AGENT_STOP_STAGE_NONE = 1;
  // An interrupt was asked for. The session closes when the turn ends.
  AGENT_STOP_STAGE_INTERRUPTING = 2;
  // A close was asked for and is not confirmed yet.
  AGENT_STOP_STAGE_CLOSING = 3;
}

// TurnTrigger is what started a turn.
enum TurnTrigger {
  TURN_TRIGGER_UNSPECIFIED = 0;
  TURN_TRIGGER_BRIEF = 1;
  TURN_TRIGGER_OPERATOR = 2;
  TURN_TRIGGER_HANDOFF = 3;
  TURN_TRIGGER_JOB_FINISHED = 4;
  // A wakeup the orchestrator scheduled: the lead is asked for a progress report (ReportDue).
  TURN_TRIGGER_SCHEDULE = 5;
  // A message from another agent.
  TURN_TRIGGER_MESSAGE = 6;
  // A subagent settled without a handoff.
  TURN_TRIGGER_SUBAGENT_SETTLED = 7;
  // The orchestrator reminded the agent of something it owes: a handoff, or a lead that has
  // gone quiet its report or next step.
  TURN_TRIGGER_REMINDER = 8;
}

// TurnStatus is where a turn is. All but RUNNING are final.
enum TurnStatus {
  TURN_STATUS_UNSPECIFIED = 0;
  TURN_STATUS_RUNNING = 1;
  TURN_STATUS_COMPLETED = 2;
  TURN_STATUS_INTERRUPTED = 3;
  TURN_STATUS_FAILED = 4;
}

// ItemStatus is where an item is. FINISHED and FAILED are final.
enum ItemStatus {
  ITEM_STATUS_UNSPECIFIED = 0;
  ITEM_STATUS_RUNNING = 1;
  ITEM_STATUS_FINISHED = 2;
  ITEM_STATUS_FAILED = 3;
}

// Harness is the agent CLI behind a session. Only what holds a session maps it to a provider name.
enum Harness {
  HARNESS_UNSPECIFIED = 0;
  HARNESS_CLAUDE_CODE = 1;
  HARNESS_CODEX = 2;
}

// Delivery is where a message is. CONSUMED and REJECTED are final.
enum Delivery {
  DELIVERY_UNSPECIFIED = 0;
  // Accepted, and waiting for the agent's next turn.
  DELIVERY_QUEUED = 1;
  // Sent into a running turn, and the session has not said whether it landed.
  DELIVERY_STEERED = 2;
  // The trigger of a turn that is running.
  DELIVERY_NEW_TURN = 3;
  // The agent has it: its steer landed, or its turn completed. A message to the operator is
  // consumed when recorded.
  DELIVERY_CONSUMED = 4;
  // It will not be delivered: rejection says why.
  DELIVERY_REJECTED = 5;
}

// Rejection says why a message was not delivered.
enum Rejection {
  REJECTION_UNSPECIFIED = 0;
  // The agent's session is over and it cannot be resumed.
  REJECTION_AGENT_GONE = 1;
  // Resuming the agent would go over the run's fan-out limit.
  REJECTION_FANOUT_LIMIT = 2;
  // The agent is being stopped.
  REJECTION_AGENT_STOPPING = 3;
  // The run is stopping or over.
  REJECTION_RUN_STOPPING = 4;
  // Every delivery attempt ended in an interrupted or failed turn.
  REJECTION_ATTEMPTS_EXHAUSTED = 5;
}

// StartFailureReason says why an agent's session never opened. A session opens only once its
// agent is installed, signed in, has its working directory and its plugin, and can reach its tools,
// within a time limit; the first of these that fails is the reason. The values name what failed for
// the user and nothing of how the session is run. The provider's own words are in end_detail.
enum StartFailureReason {
  // The session did not fail to start: it opened, or it is still opening.
  START_FAILURE_REASON_UNSPECIFIED = 0;
  // The agent program is not installed, or cannot be found.
  START_FAILURE_REASON_AGENT_NOT_INSTALLED = 1;
  // The agent is installed but its account is not signed in, or the sign-in was refused.
  START_FAILURE_REASON_NOT_SIGNED_IN = 2;
  // The vibesys plugin could not be installed or loaded for the agent.
  START_FAILURE_REASON_PLUGIN_UNAVAILABLE = 3;
  // The agent started without the tools the orchestrator gives it, so it could not do its work.
  START_FAILURE_REASON_TOOLS_UNAVAILABLE = 4;
  // The agent's working directory could not be created or entered.
  START_FAILURE_REASON_WORKING_DIRECTORY_UNAVAILABLE = 5;
  // The session did not open within the time allowed.
  START_FAILURE_REASON_TIMED_OUT = 6;
  // The session failed to start for a reason none of the others names.
  START_FAILURE_REASON_OTHER = 7;
  // The program that holds the session and this host cannot work together: they are of different
  // releases that do not share a protocol.
  START_FAILURE_REASON_INCOMPATIBLE_VERSIONS = 8;
  // The place where the host keeps its sessions is too long for a session to be reached there, so
  // none can start. A shorter root or state location fixes it.
  START_FAILURE_REASON_STATE_LOCATION_TOO_LONG = 9;
}

// ReportKind says what a report is for. A final report says the lead has finished what it was asked
// to do; a progress report is a note along the way. A waiter that wants the result waits for FINAL.
enum ReportKind {
  REPORT_KIND_UNSPECIFIED = 0;
  REPORT_KIND_PROGRESS = 1;
  REPORT_KIND_FINAL = 2;
}

// JobOutcome is how a vibesys-cli job finished.
enum JobOutcome {
  JOB_OUTCOME_UNSPECIFIED = 0;
  JOB_OUTCOME_SUCCEEDED = 1;
  JOB_OUTCOME_FAILED = 2;
  JOB_OUTCOME_CANCELLED = 3;
  JOB_OUTCOME_LOST = 4;
}

message Run {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  string repository = 2 [(buf.validate.field).string.min_len = 1];
  string task = 3 [(buf.validate.field).string.min_len = 1];
  RunStatus status = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string lead_agent_id = 5 [(buf.validate.field).string.min_len = 1];
  // How many non-lead agents may be live at once.
  uint32 fanout_limit = 6;
  // When the run reaches its time limit. Absent when the run has no time limit.
  google.protobuf.Timestamp deadline = 7;
  google.protobuf.Timestamp created_at = 8 [(buf.validate.field).required = true];
  // Set when the run left RUNNING.
  RunStopReason stop_reason = 9 [(buf.validate.field).enum.defined_only = true];
  google.protobuf.Timestamp ended_at = 10;
  reserved 11, 20;
  reserved "cli_location", "job_tool";
  // How many reports the run's lead has posted. The next report is numbered one more.
  uint32 reports_posted = 12;
  // Set while the run has nothing left that could move it: its lead is idle, no other agent is
  // working, no message waits and no job is running. It is the time that became true, and it is
  // cleared as soon as any of that changes. A lead that ended a turn with a provider wake-up looks
  // idle here too, which is why a run shows a time and not a status.
  google.protobuf.Timestamp stalled_since = 13;
  // How many jobs of this run, as the job tool reports them, are queued or running.
  uint32 active_jobs = 14;
  // How many reminders the orchestrator has sent the lead because the run stood still.
  uint32 lead_reminders = 15;
  // What every turn of every agent of the run has cost, so far.
  Usage usage = 16;
  // The lead's latest report is a final one and it has started no new work since (it has spawned no
  // agent, no job has started and it has posted no report): it has finished, so the run is not
  // stalled and the lead is not reminded, however it answers a question put to it.
  bool final_reported = 17;
  // The agents this run may spend on, set when it starts and never changed. A subagent is launched
  // only on one of these.
  repeated AllowedAgent allowed_agents = 18;
  // Working copies of the repository that agents made and that were not removed when the run ended
  // because they hold changes git does not have. Empty while the run is live, and for a run that left
  // none. The run's operator decides what becomes of them.
  repeated KeptCheckout kept_checkouts = 19;
  // The run failed and its lead never ran a turn: it never opened, usually because the host could
  // not start the agent. Such a run is a refused start more than a run, so a listing leaves it out
  // unless asked. False for every other run, and for runs recorded before this was known.
  bool never_opened = 21;
  // The most the run may cost in dollars. Absent when the run has no cost limit. The cost counted
  // is that of finished turns, so a run can pass the limit by what was in flight when it was reached.
  optional double max_cost_usd = 22 [(buf.validate.field).double = {
    finite: true
    gt: 0
  }];
  // Which limit the run has reached, and when. Unspecified while it has reached none. From then on
  // the lead has been told to finish, new agents are refused, and the run stops once the lead has
  // finished or the grace period has passed.
  RunLimit limit_reached = 23 [(buf.validate.field).enum.defined_only = true];
  google.protobuf.Timestamp limit_reached_at = 24;
  // How often the lead is asked for a progress report while the run's work moves (StartRun.summary_every,
  // or its default of one hour when the start did not say). Absent on a run recorded before the
  // schedule existed: such a run is never asked.
  google.protobuf.Duration summary_every = 25;
  // When the lead is next asked for a progress report. Set exactly while work has moved since the
  // lead last reported or was last asked, and the run is live with no limit reached and no final
  // report standing; it never falls before the previous report or request plus summary_every.
  // Absent otherwise: a quiet run is not asked, so the age of its latest report is the time that
  // passed since it, however long.
  google.protobuf.Timestamp next_summary_at = 26;
}

// KeptCheckout is one agent's working copy of the run's repository, left in place because removing
// it would lose work.
message KeptCheckout {
  string agent_id = 1 [(buf.validate.field).string.min_len = 1];
  // Where the working copy is: the client shows it so the operator can look at it, and remove it
  // when done.
  string location = 2 [(buf.validate.field).string.pattern = "^/[^\\x00]+$"];
}

// AllowedAgent is one harness and model a run may use. An empty model means the harness's own
// default model, and only that: naming another model on that harness is outside the allowance.
message AllowedAgent {
  Harness harness = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string model = 2;
}

message Agent {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  string run_id = 2 [(buf.validate.field).string.min_len = 1];
  // Empty for the lead.
  string parent_agent_id = 3;
  AgentRole role = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  Harness harness = 5 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string model = 6;
  string reasoning_effort = 7;
  // Zero when not tied to a plan.
  uint32 plan_number = 8;
  AgentStatus status = 10 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  reserved 11;
  reserved "resume_token";
  // Absent until the session opened, and for a session that can neither steer nor resume.
  Capabilities capabilities = 12;
  google.protobuf.Timestamp started_at = 13 [(buf.validate.field).required = true];
  google.protobuf.Timestamp ended_at = 14;
  // Counts this agent's sessions and fences them: a fact from an earlier session is dropped.
  uint32 session = 15 [(buf.validate.field).uint32.gt = 0];
  AgentStopStage stop_stage = 16 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // A handoff was posted and no turn has started since, so the agent owes the lead nothing.
  bool handed_off = 17;
  // Sessions in a row that this agent lost or failed without completing a turn.
  uint32 session_failures = 18;
  // Why the current session ended, when it was lost or failed: the launch error, for one that never
  // started. Empty while the session is live.
  string end_detail = 19 [(buf.validate.field).string.max_len = 1000];
  // Why the session never opened, when it was lost or failed while launching. Unspecified for a
  // session that opened, and while one is live. end_detail has the details.
  StartFailureReason start_failure_reason = 20 [(buf.validate.field).enum.defined_only = true];
  // The agent was reminded to post its handoff in this session, and is not reminded again.
  bool handoff_reminded = 21;
  // What the agent's finished turns have cost, across its sessions.
  Usage usage = 22;
}

// Capabilities are what a session can do. It reports them when it opens, so
// that the orchestrator never branches on a harness.
message Capabilities {
  reserved 1;
  reserved "streams_text";
  bool steers = 2;
  bool resumes = 3;
}

// Usage is what a turn has cost. Fields a provider does not report are absent, never zero.
message Usage {
  optional uint64 input_tokens = 1;
  optional uint64 cache_read_tokens = 2;
  optional uint64 cache_creation_tokens = 3;
  optional uint64 output_tokens = 4;
  optional uint64 reasoning_tokens = 5;
  optional double cost_usd = 6 [(buf.validate.field).double = {
    finite: true
    gte: 0
  }];
}

message Turn {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  string agent_id = 2 [(buf.validate.field).string.min_len = 1];
  // Starts at 1 for each agent and has no gaps.
  uint32 ordinal = 3 [(buf.validate.field).uint32.gt = 0];
  TurnTrigger trigger = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string trigger_message_id = 5 [(buf.validate.field).string.min_len = 1];
  TurnStatus status = 6 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  Usage usage = 7;
  google.protobuf.Timestamp started_at = 8 [(buf.validate.field).required = true];
  google.protobuf.Timestamp ended_at = 9;
}

message Item {
  // The session mints it, and repeats it for each update of the item.
  string id = 1 [(buf.validate.field).string.min_len = 1];
  string turn_id = 2 [(buf.validate.field).string.min_len = 1];
  string agent_id = 3 [(buf.validate.field).string.min_len = 1];
  // Starts at 1 for each agent and has no gaps. The orchestrator assigns it on first sight.
  uint32 ordinal = 4 [(buf.validate.field).uint32.gt = 0];
  ItemStatus status = 5 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  google.protobuf.Timestamp at = 6 [(buf.validate.field).required = true];
  oneof body {
    option (buf.validate.oneof).required = true;
    Text assistant = 10;
    Text reasoning = 11;
    Text prompt = 12;
    ToolCall tool = 13;
  }
}

message Text {
  string text = 1;
}

// ToolCall is one tool use, as a client shows it. The call is what the agent asked for, in the
// words of what a client does with it: a command, a file read, an edit, a search. A tool that is
// none of these is Other, with a name and text to show, so no call is lost and none is shown as
// the JSON the provider received. Which provider tool is which is the sidecar's mapping, in one
// place, so a client never knows a provider's tool or argument names.
message ToolCall {
  reserved 1 to 3;
  reserved "tool", "provider_call_id", "args_json";

  oneof call {
    option (buf.validate.oneof).required = true;
    ShellCall shell = 7;
    ReadCall read = 8;
    WriteCall write = 9;
    EditCall edit = 10;
    SearchCall search = 11;
    OtherCall other = 12;
  }
  string output = 4;
  // exit_code is unset when the tool has no exit code.
  optional int32 exit_code = 5;
  bool is_error = 6;
}

// ShellCall runs a command. The command is empty until the provider has said what it is.
message ShellCall {
  string command = 1;
}

// ReadCall reads one file; the target is its name as the agent gave it.
message ReadCall {
  string target = 1;
}

// WriteCall writes one whole file; the target is its name as the agent gave it.
message WriteCall {
  string target = 1;
}

// EditCall changes files in place; the targets are their names as the agent gave them.
message EditCall {
  repeated string targets = 1;
}

// SearchCall looks through files, by their names or their contents.
message SearchCall {
  string pattern = 1;
}

// OtherCall is any tool the messages above do not name. The name is the tool's own, for a client
// to show; the text is what it was asked, one argument to a line.
message OtherCall {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string text = 2;
}

// Handoff is what a finished subagent tells its lead, and the input of the post_handoff tool. The
// common fields say what the agent did; the body of its role says what the lead needs to act on
// it. The server checks that the body is the caller's own.
message Handoff {
  option (mcp_tool) = {
    name: "post_handoff"
    description: "Tell your lead what you did and finish. Call it once, last: your session closes when your turn ends and no mail waits for you. Fill in the body that is named for your role (worker, planner, judge, combiner or profiler) and no other."
  };

  reserved 2, 4 to 8;
  reserved "has_candidate", "commit", "parent_commit", "branch", "checks", "measurement";

  uint32 plan_number = 1 [(tool_field_doc) = "The plan you worked on."];
  string claim = 3 [
    (buf.validate.field).string.min_len = 1,
    (tool_field_doc) = "What you did, in one or two sentences."
  ];
  string learned = 9 [(tool_field_doc) = "What the lead should know."];
  string next = 10 [(tool_field_doc) = "What you would do next."];
  string open_items = 11 [(tool_field_doc) = "What is left undone."];
  // The body is the caller's role, spelled as the role is: AGENT_ROLE_WORKER is the field worker.
  oneof body {
    option (buf.validate.oneof).required = true;
    option (tool_oneof_doc) = "your role's body";
    WorkerHandoff worker = 20 [(tool_field_doc) = "Your result, if you are a worker."];
    PlannerHandoff planner = 21 [(tool_field_doc) = "Your plan, if you are a planner."];
    JudgeHandoff judge = 22 [(tool_field_doc) = "Your verdict, if you are a judge."];
    CombinerHandoff combiner = 23 [(tool_field_doc) = "Your combined commit, if you are a combiner."];
    ProfilerHandoff profiler = 24 [(tool_field_doc) = "Your findings, if you are a profiler."];
  }
}

// WorkerHandoff is a worker's result: a candidate commit, or why there is none.
message WorkerHandoff {
  oneof outcome {
    option (buf.validate.oneof).required = true;
    option (tool_oneof_doc) = "the outcome";
    Candidate candidate = 1 [(tool_field_doc) = "Give this if you produced a commit worth measuring."];
    NoCandidate no_candidate = 2 [(tool_field_doc) = "Give this if you produced no such commit."];
  }
}

// Candidate is a commit a worker offers for judging.
message Candidate {
  string commit = 1 [
    (buf.validate.field).string.min_len = 1,
    (tool_field_doc) = "The full SHA of the commit you produced."
  ];
  string parent_commit = 2 [
    (buf.validate.field).string.min_len = 1,
    (tool_field_doc) = "The full SHA it builds on."
  ];
  string branch = 3 [
    (buf.validate.field).string.min_len = 1,
    (tool_field_doc) = "The branch that holds it."
  ];
  string checks = 4 [
    (buf.validate.field).string.min_len = 1,
    (tool_field_doc) = "Which checks you ran and how they ended."
  ];
  string measurement = 5 [
    (buf.validate.field).string.min_len = 1,
    (tool_field_doc) = "What you measured: job ids and the comparison with the base, or why it is unmeasured."
  ];
}

// NoCandidate says a worker's turn ended without a commit worth measuring.
message NoCandidate {
  string blocker = 1 [
    (buf.validate.field).string.min_len = 1,
    (tool_field_doc) = "Why: the exact file, function, check or error that stopped you."
  ];
}

// PlannerHandoff is a planner's proposal.
message PlannerHandoff {
  string plan = 1 [
    (buf.validate.field).string.min_len = 1,
    (tool_field_doc) = "The path of the plan file you wrote."
  ];
  string confidence = 2 [(tool_field_doc) = "How sure you are, stated plainly."];
  string unestablished = 3 [(tool_field_doc) = "What you could not establish."];
  string deciding_measurement = 4 [(tool_field_doc) = "The measurement that would most change your view."];
}

// JudgeVerdict is what a judge found of a candidate's claim.
enum JudgeVerdict {
  JUDGE_VERDICT_UNSPECIFIED = 0;
  JUDGE_VERDICT_PASS = 1;
  JUDGE_VERDICT_FAIL = 2;
  JUDGE_VERDICT_UNMEASURED = 3;
}

// JudgeHandoff is a judge's verdict on one candidate.
message JudgeHandoff {
  string commit = 1 [
    (buf.validate.field).string.min_len = 1,
    (tool_field_doc) = "The full SHA of the candidate you judged."
  ];
  JudgeVerdict verdict = 2 [
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    },
    (tool_field_doc) = "pass if the claim holds, fail if it does not, unmeasured if it cannot be checked."
  ];
  string reasons = 3 [
    (buf.validate.field).string.min_len = 1,
    (tool_field_doc) = "The reasons, each tied to a file and line or a recorded number."
  ];
}

// CombinerHandoff is the commit a combiner made from several candidates.
message CombinerHandoff {
  string commit = 1 [
    (buf.validate.field).string.min_len = 1,
    (tool_field_doc) = "The full SHA of the combined commit."
  ];
  string branch = 2 [
    (buf.validate.field).string.min_len = 1,
    (tool_field_doc) = "The branch that holds it."
  ];
  string applied = 3 [
    (buf.validate.field).string.min_len = 1,
    (tool_field_doc) = "Each part you applied."
  ];
  string unapplied = 4 [(tool_field_doc) = "Each part, or piece of one, you could not apply, and why."];
  string checks = 5 [(tool_field_doc) = "Which checks you ran and how they ended."];
  string measurement = 6 [(tool_field_doc) = "Job ids and the comparison against the head and against the best part."];
}

// ProfilerHandoff is a profiler's answer to the question it was asked.
message ProfilerHandoff {
  string question = 1 [
    (buf.validate.field).string.min_len = 1,
    (tool_field_doc) = "The question, as it was asked."
  ];
  string revision = 2 [
    (buf.validate.field).string.min_len = 1,
    (tool_field_doc) = "The full SHA of the revision you looked at."
  ];
  string answer = 3 [
    (buf.validate.field).string.min_len = 1,
    (tool_field_doc) = "The direct answer, with the numbers."
  ];
  string evidence = 4 [(tool_field_doc) = "The paths of the captures, and the command that made each."];
  string unsupported = 5 [(tool_field_doc) = "The parts of the question the evidence does not answer, and what would."];
  string informs = 6 [(tool_field_doc) = "The decision this informs, and which way the answer points."];
}

// Report is what the lead tells the operator, and the input of the post_report tool.
message Report {
  option (mcp_tool) = {
    name: "post_report"
    description: "Send the operator a report. Use kind progress for a note along the way and kind final once, when you have finished what you were asked to do or cannot go on."
  };

  string headline = 1 [
    (buf.validate.field).string.min_len = 1,
    (tool_field_doc) = "One line."
  ];
  string changed = 2 [(tool_field_doc) = "What changed since the last report."];
  string in_flight = 3 [(tool_field_doc) = "What is running now."];
  string decisions = 4 [(tool_field_doc) = "What you decided on your own."];
  string open_for_user = 5 [(tool_field_doc) = "What needs the operator."];
  ReportKind kind = 6 [
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    },
    (tool_field_doc) = "progress for a note along the way; final for your last word."
  ];
  // Zero in a command. The orchestrator numbers the reports of a run from 1 in the order it
  // records them, so a reader can ask for those after the last one it saw.
  uint32 sequence = 7 [(tool_field_hidden) = true];
}

message JobFinished {
  string job_id = 1 [(buf.validate.field).string.min_len = 1];
  JobOutcome outcome = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // The agent that submitted the job, when the job says so.
  string submitted_by_agent_id = 3;
  string detail = 4;
}

// SubagentSettled tells the lead that a subagent stopped working without a handoff: it went idle,
// ended, failed or was lost. Without it the lead would wait for a handoff that never comes.
message SubagentSettled {
  string agent_id = 1 [(buf.validate.field).string.min_len = 1];
  AgentStatus status = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string detail = 3;
}

// HandoffReminder asks an agent that ended a turn without a handoff to post one. It carries no
// data: a template words it.
message HandoffReminder {}

// LeadIdleReminder tells a lead that its run has stood still, so that it acts or says why not.
message LeadIdleReminder {
  // How long the run has stood still.
  uint32 idle_seconds = 1;
  // How many subagents the lead has started in the run, and how many of them were workers and
  // judges. A template words the next step from them.
  uint32 subagents_started = 2;
  uint32 workers_started = 3;
  uint32 judges_started = 4;
}

// ReportDue asks a lead for a progress report: work has moved in its run since it last reported or was
// last asked, and summary_every has passed. The lead answers with post_report, kind progress. It carries
// the facts a template words; the lead decides what the report says.
message ReportDue {
  // The run's summary_every, in seconds.
  uint32 every_seconds = 1;
  // How many reports the lead has posted in the run so far, so that the words can tell a first report
  // from a later one.
  uint32 reports_posted = 2;
}

// RunLimitReached tells a lead that its run has reached a limit, so that it finishes: it posts its
// final report and starts nothing new.
message RunLimitReached {
  RunLimit limit = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // How long the run has been going.
  uint32 elapsed_seconds = 2;
  // What the run has cost so far, absent when no turn reported a cost.
  optional double spent_usd = 3;
  // The cost limit, absent when the run has none.
  optional double max_cost_usd = 4;
  // How long the run goes on after this message before it is stopped.
  uint32 grace_seconds = 5;
}

message Message {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  string run_id = 2 [(buf.validate.field).string.min_len = 1];
  // Empty for the operator or the orchestrator.
  string from_agent_id = 3;
  // Empty for the operator.
  string to_agent_id = 4;
  Delivery delivery = 5 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  google.protobuf.Timestamp at = 6 [(buf.validate.field).required = true];
  // Set when delivery is REJECTED.
  Rejection rejection = 7 [(buf.validate.field).enum.defined_only = true];
  // Turns started to deliver this message.
  uint32 attempts = 8;
  oneof body {
    option (buf.validate.oneof).required = true;
    string text = 10;
    Handoff handoff = 11;
    Report report = 12;
    JobFinished job_finished = 13;
    SubagentSettled subagent_settled = 14;
    // The first prompt of an agent. It carries data; a template renders it for the agent.
    string brief = 15;
    // The first prompt of a run's lead: the task, how many subagents may be live, and the
    // operator's steering text. Templates word it; the lead is not told the run's internals.
    LeadBrief lead_brief = 16;
    HandoffReminder handoff_reminder = 17;
    LeadIdleReminder lead_idle_reminder = 18;
    RunLimitReached run_limit_reached = 19;
    ReportDue report_due = 20;
  }
}

message LeadBrief {
  string task = 1 [(buf.validate.field).string.min_len = 1];
  uint32 fanout_limit = 2;
  // Empty when the operator gave none.
  string steering = 3;
}

// BuildVersions is what one build carries.
message BuildVersions {
  // The release version, or "dev". Display only: callers never compare it.
  string binary_version = 1;
  // The revision of this contract's behavior. It increases only when a change breaks a peer.
  uint32 protocol_version = 2;
  // The oldest protocol_version this build still serves.
  uint32 min_protocol_version = 3;
}

// Compatibility is the answer to a handshake, from the daemon's side.
enum Compatibility {
  COMPATIBILITY_UNSPECIFIED = 0;
  COMPATIBILITY_COMPATIBLE = 1;
  COMPATIBILITY_CLIENT_TOO_OLD = 2;
  COMPATIBILITY_DAEMON_TOO_OLD = 3;
}
