syntax = "proto3";

// What the orchestrator (the task's bench.py in the container vibesys starts),
// a phase pod (the same bench.py, in the cluster) and the task's request
// generator (a Python or Go front end: `GENERATOR generate` and `GENERATOR
// check`) exchange for one phase. The messages are here because the exchange
// crosses processes and languages and is kept as an artifact. See
// sdk/vibesys-evaluator/docs/spec.md ("Generator command line"). PhaseInput and
// PhaseOutput files are one binpb message each.
package vibesys.evaluator.v1;

import "buf/validate/validate.proto";
import "vibesys/evaluator/v1/loadgen.proto";

option go_package = "github.com/uw-syfi/vibesys/sdk/vibesys-evaluator/go/gen/vibesys/evaluator/v1;evaluatorv1";

// PhaseInput is everything a phase pod needs besides the task image.
message PhaseInput {
  // The sample's seed; the phase's streams derive from it and phase_index.
  uint64 sample_seed = 1;
  // 0 for the first phase of the sample, then 1, 2, ...
  uint32 phase_index = 2;
  LoadModel model = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // Closed loop.
  uint32 clients = 4;
  // Removed with the requests file: a stream does not run out.
  reserved 5;
  reserved "max_ops_per_sec";
  // Open loop.
  double rate = 6 [(buf.validate.field).double.finite = true];
  Arrivals arrivals = 7 [(buf.validate.field).enum.defined_only = true];
  double secs = 8 [(buf.validate.field).double = {
    gt: 0
    finite: true
  }];
  double warmup_secs = 9 [(buf.validate.field).double = {
    gte: 0
    finite: true
  }];
  // The writes of the sample's earlier phases, in the order they started.
  repeated HistoryEntry history = 10;
}

// HistoryEntry is one write a phase sent: what the task's `apply` receives as
// a Call when a later phase replays the sample's history.
message HistoryEntry {
  // The operation's name.
  string operation = 1 [(buf.validate.field).string.pattern = "^[a-z][a-z0-9_]{0,62}$"];
  // The Request's info, as a JSON object.
  string info_json = 2;
  int64 start_unix_nanos = 3;
  int64 end_unix_nanos = 4;
  // Every step answered with an expected status. A write that is not ok may
  // still have been applied.
  bool ok = 5;
  // The responses, with bodies (writes are always in the validation sample).
  repeated StepResult steps = 6;
}

// Violation is one check that failed, for the error message and artifacts.
message Violation {
  string operation = 1;
  uint64 index = 2;
  string message = 3 [(buf.validate.field).string.max_len = 2000];
}

// PhaseOutput is what a phase pod leaves for the orchestrator.
message PhaseOutput {
  PhaseSummary summary = 1;
  // Operations checked, and the checks that failed, in the measurement window.
  uint64 checked = 2;
  uint64 invalid = 3;
  // The first violations (at most 20), for the error record and artifacts.
  repeated Violation violations = 4 [(buf.validate.field).repeated.max_items = 20];
  // The writes this phase sent, to append to the sample's history.
  repeated HistoryEntry writes = 5;
  // Removed with the requests file: requests are generated during the phase
  // (PhaseSummary.generator).
  reserved 6;
  reserved "generate_secs";
  // Seconds spent checking the sample (after the window).
  double check_secs = 7;
}

// KeptOperation is what a generator remembers of one operation it generated
// for its own check: the front ends write one per operation in the validation
// sample and per write, length-delimited, into the --state directory that
// `generate` and `check` share. loadgen never reads it.
message KeptOperation {
  // The operation's position in the request stream, from 0.
  uint64 index = 1;
  // Index into RequestsHeader.operation_names.
  uint32 operation = 2;
  // The Request's info, as a JSON object.
  string info_json = 3;
  // In the validation sample (its response is checked); a write that is not
  // sampled is kept for the history only.
  bool sampled = 4;
}

// HistoryManifest is history.binpb in an accuracy history directory, one
// message (like PhaseInput): what the accuracy capture recorded besides the
// phases' own files. The directory holds, for each phase i from 0, the
// directory phase-<i>/ with loadgen's results.binpb (every body kept) and
// summary.binpb and the generator's kept.binpb (a KeptOperation for every
// operation), and the dataset file. See sdk/vibesys-evaluator/docs/spec.md
// ("Accuracy history").
message HistoryManifest {
  // The number of phases: directories phase-0 to phase-<phases - 1>.
  uint32 phases = 1 [(buf.validate.field).uint32.gte = 1];
  // The faults injected between phases, in the order they happened.
  repeated FaultEvent faults = 2;
  // The dataset file the generator read, relative to the directory; empty
  // when there is none.
  string dataset = 3 [(buf.validate.field).string.max_len = 256];
}

// FaultEvent is one fault the accuracy capture injected at a quiescent point
// between two phases: no operation was in flight from its start to its end.
message FaultEvent {
  // What was done, a task-level name such as "restart", "restart_all" or
  // "flush"; the task's oracle (check.Spec.Fault) gives it meaning.
  string kind = 1 [(buf.validate.field).string.pattern = "^[a-z][a-z0-9_]{0,62}$"];
  // What it hit: a Deployment, a pod, a command. For messages only.
  string target = 2 [(buf.validate.field).string.max_len = 1024];
  // When the action started and when it was complete (every replacement
  // serving), on the clock loadgen stamps its results with (the phase pod's).
  int64 start_unix_nanos = 3;
  int64 end_unix_nanos = 4;
  // The phase it follows.
  uint32 after_phase = 5;
}
