syntax = "proto3";
package vibesys.core.v1;

import "buf/validate/validate.proto";
import "vibesys/core/v1/common.proto";
import "vibesys/core/v1/leaves.proto";
import "vibesys/core/v1/agent_facts.proto";
import "vibesys/core/v1/contracts.proto";
import "vibesys/core/v1/control.proto";
import "vibesys/core/v1/vocabulary.proto";

option go_package = "github.com/uw-syfi/vibesys/gateway/gen/vibesys/core/v1;corev1";

enum ImportFormat {
  IMPORT_FORMAT_UNSPECIFIED = 0;
  IMPORT_FORMAT_MANIFEST = 1;
  IMPORT_FORMAT_PROJECT_STORE = 2;
  IMPORT_FORMAT_RUNTIME = 3;
  IMPORT_FORMAT_ENVELOPE = 4;
  IMPORT_FORMAT_FLOW = 5;
  IMPORT_FORMAT_PUBLICATIONS = 6;
  IMPORT_FORMAT_ROUND = 7;
  IMPORT_FORMAT_LEGACY_DYNAMIC = 8;
  IMPORT_FORMAT_CONTENT = 9;
  IMPORT_FORMAT_RECEIPT = 10;
  IMPORT_FORMAT_HYPOTHESES = 11;
  IMPORT_FORMAT_EVENTS = 12;
  IMPORT_FORMAT_SESSIONS = 13;
  IMPORT_FORMAT_CONTROL = 14;
}

// Permanent semantic import contract. Neither P2's store nor P3's log owns it.
// A source digest identifies the exact original bytes, including for JSON sources.
message ImportedFrom {
  string path = 1 [(buf.validate.field).string.min_len = 1];
  string sha256 = 2 [(buf.validate.field).string.pattern = "^[0-9a-f]{64}$"];
  string selector = 3 [(buf.validate.field).string.min_len = 1];
  ImportFormat format = 4 [(buf.validate.field).enum = {defined_only: true, not_in: 0}];
}

// Immutable task/config/source content only. Never contains a restart snapshot.
message ImportedContent {
  string sha256 = 1 [(buf.validate.field).string.pattern = "^[0-9a-f]{64}$"];
  bytes data = 2;
  string media_type = 3 [(buf.validate.field).string.min_len = 1];
}

message ImportedInput {
  string baseline_revision = 1 [(buf.validate.field).string.min_len = 1];
  string input_fingerprint = 2 [(buf.validate.field).string.min_len = 1];
  string objective = 3;
  repeated ImportedContent config = 4;
  string evaluator_digest = 5;
  string workload_digest = 6;
  string environment_digest = 7;
  repeated PureOption options = 8;
  repeated PureOption constraints = 9;
  ImportedTask task = 10;
}

// The original measurement contract, with no strategy state or live allowance.
message ImportedTask {
  ArtifactRef recipe = 1 [(buf.validate.field).required = true];
  repeated TaskStage stages = 2;
  repeated string measured = 3;
  double queue_allowance = 4 [(buf.validate.field).double = {finite: true, gte: 0}];
  optional string accuracy_stage = 5;
  optional string benchmark_stage = 6;
  repeated EvidenceKind accuracy_gated = 7 [(buf.validate.field).repeated.items.enum = {defined_only: true, not_in: 0}];
  double operation_seconds = 8 [(buf.validate.field).double = {finite: true, gt: 0}];
  repeated TaskObjective objectives = 9;
  double relative_noise = 10 [(buf.validate.field).double = {finite: true, gte: 0, lt: 1}];
  double base_staleness = 11 [(buf.validate.field).double = {finite: true, gt: 0}];
  uint32 runaway_evaluations = 12 [(buf.validate.field).uint32.gte = 1];
  repeated string profile_fields = 13;
}

message ImportedCandidate {
  RevisionRef revision = 1;
  // Git identity retained by formats predating RevisionRef, never a fabricated digest.
  optional string git_commit = 2 [(buf.validate.field).string.min_len = 1];
  repeated ArtifactRef artifacts = 3;
  option (buf.validate.message).cel = {
    id: "ImportedCandidate.identity", message: "revision or git_commit required",
    expression: "has(this.revision) || has(this.git_commit)"
  };
}

message ImportedMeasurement {
  // Current sources retain the complete shared immutable value, including acceptance.
  EvidenceRef evidence = 1;
  Sample sample = 2;
  // Old framework measurements retain their declared provenance and evidence reference.
  // They are not promoted to a Sample when measured-input/environment proof is absent.
  Reading historical_reading = 3;
  optional string historical_commit = 4 [(buf.validate.field).string.min_len = 1];
  optional string historical_artifact = 5 [(buf.validate.field).string.min_len = 1];
  option (buf.validate.message).cel = {
    id: "ImportedMeasurement.source", message: "exactly one measurement source required",
    expression: "(has(this.evidence) && !has(this.sample) && !has(this.historical_reading)) || (!has(this.evidence) && has(this.sample) && !has(this.historical_reading)) || (!has(this.evidence) && !has(this.sample) && has(this.historical_reading))"
  };
  option (buf.validate.message).cel = {
    id: "ImportedMeasurement.trusted", message: "evidence must retain trusted provenance",
    expression: "!has(this.evidence) || this.evidence.provenance == 1"
  };
}

message ImportedGuidance {
  string identity = 1 [(buf.validate.field).string.min_len = 1];
  string text = 2;
  ArtifactRef artifact = 3;
  bool delivered = 4;
  bool withdrawn = 5;
  bool possibly_read = 6;
  InputTarget target = 7;
  InputMode mode = 8 [(buf.validate.field).enum.defined_only = true];
  bool disposed = 9;
}

message ImportedUsage {
  string identity = 1 [(buf.validate.field).string.min_len = 1];
  string unit = 2 [(buf.validate.field).string.min_len = 1];
  oneof quantity {
    option (buf.validate.oneof).required = true;
    double amount = 3 [(buf.validate.field).double = {finite: true, gte: 0}];
    string count = 5 [(buf.validate.field).string.pattern = "^(0|[1-9][0-9]*)$"];
    bool unknown = 7 [(buf.validate.field).bool.const = true];
  }
  string refunded_count = 6 [(buf.validate.field).string.pattern = "^(0|[1-9][0-9]*)$"];
  optional string source_request = 4 [(buf.validate.field).string.min_len = 1];
}

// Retained obligations require inspection by the new epoch, never redispatch authority.
message ImportedExternalIdentity {
  string kind = 1 [(buf.validate.field).string.min_len = 1];
  string identity = 2 [(buf.validate.field).string.min_len = 1];
  optional string source_request = 3 [(buf.validate.field).string.min_len = 1];
  optional string owner = 4 [(buf.validate.field).string.min_len = 1];
}

message ImportedFact {
  repeated ImportedFrom imported_from = 1 [(buf.validate.field).repeated.min_items = 1];
  oneof value {
    option (buf.validate.oneof).required = true;
    ImportedInput input = 2;
    ImportedCandidate candidate = 3;
    ImportedMeasurement measurement = 4;
    ImportedGuidance guidance = 5;
    ImportedUsage usage = 6;
    ImportedExternalIdentity external_identity = 7;
    ImportedContent content = 8;
  }
}

message ImportedRunFacts {
  uint32 schema_version = 1 [(buf.validate.field).uint32.const = 1];
  string run_id = 2 [(buf.validate.field).string.min_len = 1];
  repeated ImportedFact facts = 3 [(buf.validate.field).repeated.min_items = 1];
}
