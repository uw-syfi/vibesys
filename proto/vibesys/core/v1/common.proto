syntax = "proto3";
package vibesys.core.v1;

import "buf/validate/validate.proto";
import "vibesys/core/v1/value_options.proto";

option go_package = "github.com/uw-syfi/vibesys/gateway/gen/vibesys/core/v1;corev1";


// Run status lifecycle contract.
enum RunStatus {
  RUN_STATUS_UNSPECIFIED = 0;
  RUN_STATUS_RUNNING = 1;
  RUN_STATUS_PAUSED = 2;
  RUN_STATUS_CLOSING = 3;
  RUN_STATUS_TERMINAL = 4;
  RUN_STATUS_BLOCKED = 5;
  RUN_STATUS_DRAINING = 6;
  RUN_STATUS_PARKED = 7;
}

// Who paused the run, which decides what may end the pause.
enum PauseOwner {
  PAUSE_OWNER_UNSPECIFIED = 0;
  PAUSE_OWNER_OPERATOR = 1;
  PAUSE_OWNER_QUOTA = 2;
}

// How a stop treats work in flight: let it finish, or cancel it.
enum StopMode {
  STOP_MODE_UNSPECIFIED = 0;
  STOP_MODE_DRAIN = 1;
  STOP_MODE_CANCEL = 2;
}

enum ResumeWhen {
  option (core_enum) = {literal: true, inline: true};
  RESUME_WHEN_UNSPECIFIED = 0;
  RESUME_WHEN_NOW = 1;
  RESUME_WHEN_CAPACITY_RETURNS = 2;
}

// How an input reaches the turns of its target; interrupt metadata grants no refund authority.
//
// ``NEXT_TURN`` is reserved by the first matching turn and delivered to it once.
// ``INTERRUPT`` is first offered to a matching session turn that is running, and joins it
// when the provider takes it; otherwise, or once the provider takes it back, the next
// matching turn reserves it as a next-turn input. Delivery is at least once: an offer a
// crash leaves unresolved is offered again, and may reach the turn twice.
// ``STANDING`` is never reserved: every matching session turn dispatched while it is in force
// receives it, until it is withdrawn or its target ends.
enum InputMode {
  INPUT_MODE_UNSPECIFIED = 0;
  INPUT_MODE_NEXT_TURN = 1 [(core_member).spelling = "next-turn"];
  INPUT_MODE_INTERRUPT = 2;
  INPUT_MODE_STANDING = 3;
}

enum ControlAction {
  option (core_enum).literal = true;
  CONTROL_ACTION_UNSPECIFIED = 0;
  CONTROL_ACTION_PAUSE = 1;
  CONTROL_ACTION_RESUME = 2;
  CONTROL_ACTION_STOP = 3;
  CONTROL_ACTION_STEER = 4;
  CONTROL_ACTION_WITHDRAW = 5;
  CONTROL_ACTION_CANCEL_ATTEMPT = 6;
  CONTROL_ACTION_CANCEL_ITEM = 7;
  CONTROL_ACTION_SET_MAX_PARALLEL = 8;
  CONTROL_ACTION_PARK = 9;
}

// Canonical tagged identity; domains survive JSON union round trips.
message Identity {
  string root = 1 [(buf.validate.field).string = {min_len: 1, pattern: "^\\S+$"}, (core_field) = {constant_name: "IDENTITY_PATTERN", constant_rule: "pattern"}];
}

// Distinct run identity.
message RunId {
  option (core_value).base = "Identity";
  string root = 1 [(buf.validate.field).string = {min_len: 1, pattern: "^\\S+$"}];
  string kind = 2 [(buf.validate.field).string.const = "run"];
}

// Distinct attempt identity.
message AttemptId {
  option (core_value).base = "Identity";
  string root = 1 [(buf.validate.field).string = {min_len: 1, pattern: "^\\S+$"}];
  string kind = 2 [(buf.validate.field).string.const = "attempt"];
}

// Distinct item identity.
message ItemId {
  option (core_value).base = "Identity";
