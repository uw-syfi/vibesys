// Identity of one input occurrence, independent of content digest.
message InputId {
  option (core_value).base = "Identity";
  string root = 1 [(buf.validate.field).string = {min_len: 1, pattern: "^\\S+$"}];
  string kind = 2 [(buf.validate.field).string.const = "input"];
}

// Distinct evidence identity.
message EvidenceId {
  option (core_value).base = "Identity";
  string root = 1 [(buf.validate.field).string = {min_len: 1, pattern: "^\\S+$"}];
  string kind = 2 [(buf.validate.field).string.const = "evidence"];
