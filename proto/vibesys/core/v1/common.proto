message HostId {
  option (core_value).base = "Identity";
  string root = 1 [(buf.validate.field).string = {min_len: 1, pattern: "^\\S+$"}];
  string kind = 2 [(buf.validate.field).string.const = "host"];
}

// Schema ref lifecycle contract.
message SchemaRef {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  string version = 2 [(buf.validate.field).string.pattern = "^[1-9][0-9]*$", (core_field).integer = true];
}

// Artifact ref lifecycle contract.
message ArtifactRef {
  ArtifactId artifact_id = 1 [(buf.validate.field).required = true];
  string digest = 2 [(buf.validate.field).string.min_len = 1];
  SchemaRef schema_ref = 3;
}

// The owner of a scope is a run or an attempt, retaining its tagged JSON union.
message ScopeOwner {
  option (core_value) = {union: true, discriminator: "kind"};
  oneof owner {
    option (buf.validate.oneof).required = true;
    RunId run = 1;
    AttemptId attempt = 2;
  }
}

// Scope lifecycle contract.
message Scope {
  ScopeOwner owner = 1 [(buf.validate.field).required = true];
  string generation = 2 [(buf.validate.field).string.pattern = "^(0|[1-9][0-9]*)$", (core_field).integer = true];
}

// Invocation ref lifecycle contract.
message InvocationRef {
  SessionId session_id = 1 [(buf.validate.field).required = true];
  InvocationId invocation_id = 2 [(buf.validate.field).required = true];
  string generation = 3 [(buf.validate.field).string.pattern = "^(0|[1-9][0-9]*)$", (core_field).integer = true];
}

