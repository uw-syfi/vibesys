syntax = "proto3";
package vibesys.core.v1;

import "buf/validate/validate.proto";
import "vibesys/core/v1/value_options.proto";
import "vibesys/core/v1/common.proto";
import "vibesys/core/v1/vocabulary.proto";
import "vibesys/core/v1/leaves.proto";

option go_package = "github.com/uw-syfi/vibesys/gateway/gen/vibesys/core/v1;corev1";

enum EvidencePurpose {
  option (core_enum) = {literal: true, inline: true};
  EVIDENCE_PURPOSE_UNSPECIFIED = 0;
  EVIDENCE_PURPOSE_BASELINE = 1;
  EVIDENCE_PURPOSE_LOCAL_VALIDATION = 2 [(core_member).spelling = "local-validation"];
  EVIDENCE_PURPOSE_OFFICIAL = 3;
  EVIDENCE_PURPOSE_PROFILE = 4;
}

enum EvidenceProvenance {
  option (core_enum) = {literal: true, inline: true};
  EVIDENCE_PROVENANCE_UNSPECIFIED = 0;
  EVIDENCE_PROVENANCE_TRUSTED = 1;
  EVIDENCE_PROVENANCE_SELF_REPORT = 2 [(core_member).spelling = "self-report"];
}

// Immutable positive acceptance proof, without job lifecycle or admission state.
message EvidenceAcceptanceReceipt {
  RequestId source_request = 1 [(buf.validate.field).required = true];
  Scope scope = 2 [(buf.validate.field).required = true];
  string observation_sequence = 3 [(buf.validate.field).string.pattern = "^(0|[1-9][0-9]*)$", (core_field) = {integer: true, explicit: true}];
  ObservationStatus status = 4 [(buf.validate.field).enum = {defined_only: true, in: [1, 2, 3, 4, 5]}];
}

message EvidenceRef {
  option (buf.validate.message).cel = {id: "EvidenceRef.acceptance", message: "acceptance_receipt: source, scope, sequence and status must match evidence", expression: "!has(this.acceptance_receipt) || (this.acceptance_receipt.source_request == this.source_request && this.acceptance_receipt.scope == this.scope && this.acceptance_receipt.observation_sequence == this.observation_sequence && this.acceptance_receipt.status == this.status)"};
  EvidenceId evidence_id = 1 [(buf.validate.field).required = true];
  EvidenceKind kind = 2 [(buf.validate.field).enum = {defined_only: true, not_in: 0}];
  EvidencePurpose purpose = 3 [(buf.validate.field).enum = {defined_only: true, not_in: 0}];
  Scope scope = 4 [(buf.validate.field).required = true];
  RequestId source_request = 5 [(buf.validate.field).required = true];
  RevisionRef candidate = 6 [(buf.validate.field).required = true];
  string observation_sequence = 7 [(buf.validate.field).string.pattern = "^(0|[1-9][0-9]*)$", (core_field) = {integer: true, explicit: true}];
  string evaluator_digest = 8 [(core_field).explicit = true];
  string workload_digest = 9 [(core_field).explicit = true];
  string environment_digest = 10 [(core_field).explicit = true];
  EvidenceProvenance provenance = 11 [(buf.validate.field).enum = {defined_only: true, not_in: 0}];
  ObservationStatus status = 12 [(buf.validate.field).enum = {defined_only: true, not_in: 0}];
  repeated ArtifactRef artifacts = 13;
  EvidenceAcceptanceReceipt acceptance_receipt = 14;
  RequestId reused_from = 15 [(core_field).omit_unset = true];
  Reading reading = 16 [(core_field).omit_unset = true];
  optional string unmet_requirement = 17 [(core_field).omit_unset = true];
}
