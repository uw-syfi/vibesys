syntax = "proto3";

package vibesys.store.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "vibesys/store/v1/agent_attrs.proto";
import "vibesys/store/v1/content.proto";
import "vibesys/store/v1/epoch.proto";
import "vibesys/store/v1/lifecycle.proto";
import "vibesys/store/v1/record.proto";
import "vibesys/store/v1/span.proto";

option go_package = "github.com/uw-syfi/vibesys/gateway/gen/vibesys/store/v1;storev1";

// Writer-computed dashboard projection. Absence of committed_seq retains the
// phase 1 rule: every complete record is committed. A present zero commits none.
message RunHead {
  option (buf.validate.message).cel = {
    id: "run_head.chart_points"
    message: "chart_points must contain at most 256 points"
    expression: "this.chart_points.size() <= 256"
  };
  option (buf.validate.message).cel = {
    id: "run_head.lifecycle"
    message: "head has either a lifecycle or an explicitly awaiting epoch"
    expression: "has(this.lifecycle) != this.awaiting_lifecycle && (!this.awaiting_lifecycle || (this.epoch > 0u && has(this.committed_seq)))"
  };
  Lifecycle lifecycle = 1;
  string strategy = 2 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 65536
  }];
  HeadlineObjective objective = 3;
  map<string, uint64> span_counts = 4 [(buf.validate.field).map.keys.string = {
    min_len: 1
    max_bytes: 65536
  }];
  TokenUsage usage = 5;
  repeated MetricPoint chart_points = 6;
  bool needs_user = 7;
  optional uint64 committed_seq = 8;
  RunProcess process = 9;
  // The current epoch header is committed, but its first lifecycle record is not.
  bool awaiting_lifecycle = 10;
  // Canonical writer epoch, derived from run.log independently of process metadata.
  uint32 epoch = 11;
}

// Values are absent until reported. The declaration supplies unit and direction.
message HeadlineObjective {
  MetricSeriesDecl series = 1 [(buf.validate.field).required = true];
  optional double best_value = 2 [(buf.validate.field).double.finite = true];
  optional double input_value = 3 [(buf.validate.field).double.finite = true];
}

// Informational process identity, never a substitute for probing run.lock.
message RunProcess {
  uint32 pid = 1 [(buf.validate.field).uint32.gt = 0];
  uint32 epoch = 2 [(buf.validate.field).uint32.gt = 0];
  google.protobuf.Timestamp started_at = 3 [(buf.validate.field).required = true];
}

// Immutable skeleton through through_seq. log_offset is the byte immediately
// after that record in run.log, including magic and framing. It lets readers
// seek without parsing old records. The gateway reads only these two headers;
// it passes the entire encoded keyframe through without interpreting its body.
message Keyframe {
  uint64 through_seq = 1 [(buf.validate.field).uint64.gt = 0];
  uint64 log_offset = 2 [(buf.validate.field).uint64 = {
    gte: 8
    lte: 9223372036854775807
  }];
  map<string, SpanHistory> spans = 3;
  repeated MetricHistory metrics = 4;
  repeated StreamRef streams = 5;
  repeated EpochVersion epochs = 6;
  repeated LifecycleVersion lifecycles = 7;
}

message SpanHistory {
  repeated SpanVersion versions = 1;
}

message SpanVersion {
  uint64 seq = 1 [(buf.validate.field).uint64.gt = 0];
  Span span = 2 [(buf.validate.field).required = true];
}

message MetricHistory {
  string series = 1 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 65536
  }];
  repeated MetricVersion points = 2;
}

message MetricVersion {
  uint64 seq = 1 [(buf.validate.field).uint64.gt = 0];
  MetricPoint point = 2 [(buf.validate.field).required = true];
}

// A stored keyframe carries epoch.descriptors inline. The gateway replaces them
// with descriptors_sha256 on the wire (SkeletonResponse.descriptor_sets), since
// every epoch of a run usually repeats one set. Exactly one of the two names the
// descriptors of an epoch that has any. The wire form is not valid under the
// EpochStarted descriptor rules until a reader has restored them.
message EpochVersion {
  option (buf.validate.message).cel = {
    id: "epoch_version.descriptors_once"
    message: "descriptors are inline or addressed by hash, not both"
    expression: "this.descriptors_sha256 == '' || !has(this.epoch.descriptors)"
  };
  uint64 seq = 1 [(buf.validate.field).uint64.gt = 0];
  EpochStarted epoch = 2 [(buf.validate.field).required = true];
  string descriptors_sha256 = 3 [(buf.validate.field).string.pattern = "^([0-9a-f]{64})?$"];
}

message LifecycleVersion {
  uint64 seq = 1 [(buf.validate.field).uint64.gt = 0];
  Lifecycle lifecycle = 2 [(buf.validate.field).required = true];
}
