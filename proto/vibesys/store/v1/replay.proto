syntax = "proto3";
package vibesys.store.v1;

import "buf/validate/validate.proto";
import "google/protobuf/any.proto";
import "google/protobuf/descriptor.proto";
import "vibesys/store/v1/agent_attrs.proto";

option go_package = "github.com/uw-syfi/vibesys/gateway/gen/vibesys/store/v1;storev1";

// Every prompt-context field declares whether it changes semantic input or policy.
enum ReplayFieldKind {
  REPLAY_FIELD_KIND_UNSPECIFIED = 0;
  REPLAY_FIELD_KIND_IDENTITY = 1;
  REPLAY_FIELD_KIND_POLICY = 2;
}
extend google.protobuf.MessageOptions {
  // Contexts classify their own fields. Shared facts inherit the classification
  // of the enclosing context field and need no replay-specific annotations.
  bool replay_context = 51102;
}
extend google.protobuf.FieldOptions {
  ReplayFieldKind replay_field = 51100;
  // Only repeated fields may be sets. The writer sorts and deduplicates them.
  bool replay_set = 51101;
}

// Names are semantic, never source locations or live collection positions.
message OperationKey {
  string operation = 1 [(buf.validate.field).string.min_len = 1];
  repeated KeyComponent scope = 2;
}
enum KeyComponentKind {
  KEY_COMPONENT_KIND_UNSPECIFIED = 0;
  KEY_COMPONENT_KIND_PARENT = 1;
  KEY_COMPONENT_KIND_ITEM = 2;
  KEY_COMPONENT_KIND_SAMPLE = 3;
  KEY_COMPONENT_KIND_REVISION = 4;
  KEY_COMPONENT_KIND_RECORDED_POSITION = 5;
}
message KeyComponent {
  KeyComponentKind kind = 1 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  string value = 2 [(buf.validate.field).string.min_len = 1];
}

// All historical budget arithmetic reads this observation's value during replay.
message ReplayAllowance {
  uint64 iterations = 1;
  uint64 capacity = 2;
  double remaining = 3 [(buf.validate.field).double = {gte: 0, finite: true}];
  // Absent dimensions are explicitly unbounded. Remaining is retained prompt
  // context; executable resource admission uses these named bounds.
  ReplayResources resources = 4;
}

message ReplayResources {
  optional double money_usd = 1 [(buf.validate.field).double = {gte: 0, finite: true}];
  optional uint64 input_tokens = 2;
  optional uint64 output_tokens = 3;
}
message ReplayPolicy {
  string role = 1;
  string template = 2;
  bytes content = 3;
  string reply_type = 4 [(buf.validate.field).string.min_len = 1];
  // Derived by the writer from the reachable retained reply descriptors.
  optional bytes reply_schema_digest = 5 [(buf.validate.field).bytes.len = 32];
  // The writer retains the complete typed request, including policy fields that
  // do not enter identity. Executors never decode the canonical identity framing.
  // Absent only in recorder prototypes predating typed request retention.
  google.protobuf.Any request = 6;
  // An upper bound enforced by the execution owner. A bounded epoch rejects
  // external requests that omit a bound for a constrained dimension. Free
  // operations explicitly reserve zero.
  ReplayResources reservation = 7;
}

// Immutable execution metadata, separate from mutable span labels. Outcome Any
// is decoded with the epoch's retained descriptors, never the current reply type.
message OperationReplay {
  option (buf.validate.message).cel = {
    id: "operation_replay.reply_schema"
    message: "recorded operations require the writer's reply schema proof"
    expression: "has(this.policy) && has(this.policy.reply_schema_digest)"
  };
  option (buf.validate.message).cel = {
    id: "operation_replay.acceptance"
    message: "an outcome requires its immutable acceptance sequence"
    expression: "has(this.outcome) == has(this.accepted_sequence)"
  };
  OperationKey key = 1 [(buf.validate.field).required = true];
  uint32 encoding_version = 2 [(buf.validate.field).uint32.const = 1];
  bytes identity = 3 [(buf.validate.field).bytes.min_len = 1];
  bytes identity_digest = 4 [(buf.validate.field).bytes.len = 32];
  bytes dependencies = 5 [(buf.validate.field).bytes.len = 32];
  ReplayPolicy policy = 6 [(buf.validate.field).required = true];
  google.protobuf.Any outcome = 7;
  // seq and clock come exclusively from the accepting Record envelope.
  bool paid = 8;
  optional double cost_usd = 9 [(buf.validate.field).double = {gte: 0, finite: true}];
  ReplayAllowance allowance = 10 [(buf.validate.field).required = true];
  // Later span updates retain this sequence; they are not new acceptances.
  optional uint64 accepted_sequence = 11 [(buf.validate.field).uint64.gt = 0];
  // New physical execution records retain the winner by child span identity.
  optional string accepted_child = 12 [(buf.validate.field).string.min_len = 1];
}

// A child is execution evidence, never another semantic operation.
message ReplayPhysical {
  string logical = 1 [(buf.validate.field).string.min_len = 1];
  string external_id = 2 [(buf.validate.field).string.min_len = 1];
  string host_incarnation = 3 [(buf.validate.field).string.min_len = 1];
  double deadline = 4 [(buf.validate.field).double = {gte: 0, finite: true}];
  uint64 ordinal = 5;
  optional uint64 withdrawn_sequence = 6 [(buf.validate.field).uint64.gt = 0];
}

// The environment records every writable grant before execution, including
// tool/build jobs and grants belonging to other runs. Closing this ledger
// forbids further grants in the execution domain; it does not prove death.
message WriterBacking {
  string environment = 1 [(buf.validate.field).string.min_len = 1];
  string identity = 2 [(buf.validate.field).string.min_len = 1];
  uint64 generation = 3;
  string authority = 4 [(buf.validate.field).string.min_len = 1];
}
message WriterIdentity {
  string run_id = 1 [(buf.validate.field).string.min_len = 1];
  string host_incarnation = 2 [(buf.validate.field).string.min_len = 1];
  string physical_id = 3 [(buf.validate.field).string.min_len = 1];
  // An immutable execution-domain ID, never a reusable container name.
  string domain_id = 4 [(buf.validate.field).string.min_len = 1];
}
message WriterManifest {
  option (buf.validate.message).cel = {
    id: "writer_manifest.unique"
    message: "writer physical identities must be unique"
    expression: "this.writers.map(x, x.physical_id).unique()"
  };
  WriterBacking backing = 1 [(buf.validate.field).required = true];
  repeated WriterIdentity writers = 2;
  bool closed = 3;
}
message WriterTerminationProof {
  option (buf.validate.message).cel = {
    id: "writer_proof.closed"
    message: "termination proof needs a closed manifest and every domain verified absent"
    expression: "has(this.manifest) && this.manifest.closed && this.manifest.writers.all(x, x.domain_id in this.absent_domains) && this.absent_domains.all(x, this.manifest.writers.exists(w, w.domain_id == x))"
  };
  WriterManifest manifest = 1 [(buf.validate.field).required = true];
  repeated string absent_domains = 2 [(buf.validate.field).repeated.unique = true];
}
enum WriterReconciliationStatus {
  WRITER_RECONCILIATION_STATUS_UNSPECIFIED = 0;
  WRITER_RECONCILIATION_STATUS_PROVEN_STOPPED = 1;
  WRITER_RECONCILIATION_STATUS_PENDING = 2;
  WRITER_RECONCILIATION_STATUS_UNKNOWN = 3;
  WRITER_RECONCILIATION_STATUS_UNSUPPORTED = 4;
}
message WriterReconciliation {
  option (buf.validate.message).cel = {
    id: "writer_reconciliation.proof"
    message: "only ProvenStopped carries termination proof"
    expression: "(this.status == 1) == has(this.proof)"
  };
  WriterManifest manifest = 1 [(buf.validate.field).required = true];
  WriterReconciliationStatus status = 2 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  WriterTerminationProof proof = 3;
  string detail = 4;
}
message WriterRegistryState {
  WriterManifest manifest = 1 [(buf.validate.field).required = true];
  WriterTerminationProof proof = 2;
}

// Timer-only progress is an observation, not a keyed paid operation.
message ReplayClock {
  ReplayAllowance allowance = 1 [(buf.validate.field).required = true];
}

message ReplayNotice {
  option (buf.validate.message).cel = {
    id: "replay_notice.paid_results"
    message: "unused entries must identify accepted paid results"
    expression: "this.unused.all(x, x.paid && has(x.outcome))"
  };
  string id = 1 [(buf.validate.field).string.min_len = 1];
  repeated OperationReplay unused = 2 [(buf.validate.field).repeated.min_items = 1];
  repeated OperationKey pending = 3;
}
message ReplayAcknowledgement {
  // A launch without a preceding unacknowledged notice still records its id.
  optional string notice_id = 1 [(buf.validate.field).string.min_len = 1];
  string launch_request_id = 2 [(buf.validate.field).string.min_len = 1];
}

// A surviving observation can complete its operation after a writer crash.
// Recording this does not itself deliver an answer to a continuation.
message ReplayObservation {
  option (buf.validate.message).cel = {
    id: "replay_observation.usage_cost"
    message: "reported usage cost must agree with observation cost"
    expression: "!has(this.usage) || !has(this.usage.cost_usd) || (has(this.cost_usd) && this.cost_usd == this.usage.cost_usd)"
  };
  google.protobuf.Any outcome = 1 [(buf.validate.field).required = true];
  bool paid = 2;
  optional double cost_usd = 3 [(buf.validate.field).double = {gte: 0, finite: true}];
  TokenUsage usage = 4;
}

// Earlier answers remain usable when only prompts or limits change.
message ReplayPolicyDrift {
  uint64 results = 1 [(buf.validate.field).uint64.gt = 0];
  repeated string roles = 2;
  repeated string templates = 3;
}
