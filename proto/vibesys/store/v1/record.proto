syntax = "proto3";

package vibesys.store.v1;

import "buf/validate/validate.proto";
import "google/protobuf/descriptor.proto";
import "google/protobuf/timestamp.proto";
import "vibesys/store/v1/content.proto";
import "vibesys/store/v1/chat.proto";
import "vibesys/store/v1/epoch.proto";
import "vibesys/store/v1/intent.proto";
import "vibesys/store/v1/lifecycle.proto";
import "vibesys/store/v1/notice.proto";
import "vibesys/store/v1/span.proto";
import "vibesys/store/v1/replay.proto";

option go_package = "github.com/uw-syfi/vibesys/gateway/gen/vibesys/store/v1;storev1";

// Record is the append-only run log envelope. Store changes are additive only.
// A run.log starts with the eight-byte magic VSRLOG01. Each record then has
// a uvarint payload length, a four-byte little-endian CRC32C of the payload,
// and the payload: one encoded vibesys.store.v1.Record, at most 1 MiB.
// Writers and readers enforce the encoded byte cap. Content above 64 KiB is
// attached as a blob; truncation is never a valid way to meet either cap.
message Record {
  // Phase 1 records keep their validation behavior during the seven-day bridge.
  option (buf.validate.message).cel = {
    id: "record.identity"
    message: "seq, epoch and at are required for typed records"
    expression: "!(has(this.lifecycle) || has(this.span) || has(this.metric) || has(this.stream) || has(this.blob) || has(this.intent) || has(this.notice) || has(this.chat) || has(this.declaration_amended)) || (this.seq > 0u && this.epoch > 0u && has(this.at))"
  };
  option (buf.validate.message).cel = {
    id: "record.epoch_started"
    message: "epoch_started epoch must match epoch and seq and at must be present for a typed header"
    expression: "!has(this.epoch_started) || !has(this.epoch_started.run) || (this.epoch == this.epoch_started.epoch && this.seq > 0u && has(this.at))"
  };
  option (buf.validate.message).cel = {
    id: "record.declaration_amended"
    message: "declaration amendment must name the containing epoch"
    expression: "!has(this.declaration_amended) || this.declaration_amended.epoch == this.epoch"
  };
  uint64 seq = 1;
  google.protobuf.Timestamp at = 2;
  uint32 epoch = 3;
  // Monotone run seconds, excluding downtime between epochs. Absent in older logs.
  optional double clock = 18 [(buf.validate.field).double = {
    gte: 0
    finite: true
  }];
  // A timer-only boundary uses the enclosing Record.clock and serial sequence.
  optional ReplayClock replay_clock = 21;
  oneof body {
    option (buf.validate.oneof).required = true;
    EpochStarted epoch_started = 4;
    LegacyEvent legacy_event = 5 [deprecated = true];
    Lifecycle lifecycle = 11;
    SpanRecord span = 12;
    MetricPoint metric = 13;
    StreamRef stream = 14;
    BlobAttached blob = 15;
    IntentState intent = 16;
    Notice notice = 17;
    ChatRecord chat = 19;
    // A declaration grows inside the current epoch; this never opens an epoch.
    EpochStarted declaration_amended = 20;
  }
}

// EpochStarted identifies the writer and schemas for one run epoch.
// DeclarationAmended records may extend kinds and series for the same epoch.
// Repeated epoch_started headers are readable legacy amendments.
message EpochStarted {
  // A run description identifies the typed header. Phase 1 headers have none.
  option (buf.validate.message).cel = {
    id: "epoch.identity"
    message: "run_id, epoch, tree_hash and vibesys_version are required for a typed run header"
    expression: "!has(this.run) || (this.run_id != '' && this.epoch > 0u && (this.tree_hash != '' || (has(this.provenance_known) && !this.provenance_known)) && this.vibesys_version != '')"
  };
  option (buf.validate.message).cel = {
    id: "epoch.span_kinds"
    message: "span_kinds must have unique kind names and descriptors when nonempty"
    expression: "this.span_kinds.all(x, this.span_kinds.filter(y, y.kind == x.kind).size() == 1) && (this.span_kinds.size() == 0 || (has(this.descriptors) && this.descriptors.file.size() > 0))"
  };
  option (buf.validate.message).cel = {
    id: "epoch.run_detail_descriptors"
    message: "descriptors are required for run detail"
    expression: "!has(this.run) || !has(this.run.detail) || (has(this.descriptors) && this.descriptors.file.size() > 0)"
  };
  option (buf.validate.message).cel = {
    id: "epoch.series"
    message: "series must have unique names"
    expression: "this.series.all(x, this.series.filter(y, y.name == x.name).size() == 1)"
  };
  option (buf.validate.message).cel = {
    id: "epoch.objectives"
    message: "run objectives must name series declared with the same direction and objective role"
    expression: "!has(this.run) || this.run.objectives.all(o, this.series.exists(s, s.name == o.series && s.direction == o.direction && s.role == 1))"
  };
  option (buf.validate.message).cel = {
    id: "epoch.schema_hashes"
    message: "api_schema_hash and store_schema_hash must be lowercase SHA-256 for a typed header"
    expression: "!has(this.run) || (this.api_schema_hash.matches('^[0-9a-f]{64}$') && this.store_schema_hash.matches('^[0-9a-f]{64}$'))"
  };
  option (buf.validate.message).cel = {
    id: "epoch.project_root"
    message: "project_root must be an absolute path"
    expression: "!has(this.project_root) || this.project_root.startsWith('/')"
  };
  string run_id = 1;
  uint32 epoch = 2;
  string tree_hash = 3;
  bool dirty = 4;
  string api_schema_hash = 5;
  string store_schema_hash = 6;
  // Existing checkout fields stay authoritative; no duplicate Checkout message.
  string vibesys_version = 7 [(buf.validate.field).string.max_bytes = 65536];
  RunDescription run = 8;
  repeated SpanKindDecl span_kinds = 9;
  repeated MetricSeriesDecl series = 10;
  google.protobuf.FileDescriptorSet descriptors = 11;
  // False explicitly records that the journal has no checkout fingerprint.
  // Absence preserves the validation of previously published typed headers.
  optional bool provenance_known = 12;
  // Present only for keyed epochs. Retain this writer encoding indefinitely.
  optional uint32 identity_encoding_version = 13 [(buf.validate.field).uint32.const = 1];
  optional ReplayAllowance initial_allowance = 14;
  optional ReplayAcknowledgement replay_acknowledgement = 15;
  // Canonical absolute directory recorded when the run is created. Windows,
  // controls and resume read this and no path the client remembered. Absence
  // on older logs means the run has no recorded root.
  optional string project_root = 16 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 4096
  }];
}

// LegacyEvent is an interim bridge carrying one current JSONL run event verbatim.
// Retained for the seven-day read window after phase 2 lands. Its field
// number must be reserved after removal; existing store records remain readable.
message LegacyEvent {
  option deprecated = true;
  string json = 1;
}
