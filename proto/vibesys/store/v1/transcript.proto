syntax = "proto3";

package vibesys.store.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";
import "vibesys/store/v1/content.proto";

option go_package = "github.com/uw-syfi/vibesys/gateway/gen/vibesys/store/v1;storev1";

// Transcript streams contain uvarint-length-prefixed TranscriptEntry messages.
// Large content is immutable and fetched through its BlobRef, never truncated.
message TranscriptEntry {
  oneof entry {
    option (buf.validate.oneof).required = true;
    TranscriptText text = 1;
    TranscriptToolCall tool_call = 2;
    TranscriptToolResult tool_result = 3;
  }
  // When the event this entry records happened. Absent in entries written before the field existed.
  // A simulated run's clock starts at the epoch, so no floor is enforced here; a reader treats the
  // epoch itself as no time.
  google.protobuf.Timestamp at = 4;
}

enum TranscriptChannel {
  TRANSCRIPT_CHANNEL_UNSPECIFIED = 0;
  TRANSCRIPT_CHANNEL_ASSISTANT = 1;
  TRANSCRIPT_CHANNEL_ANALYSIS = 2;
  TRANSCRIPT_CHANNEL_DIAGNOSTIC = 3;
  TRANSCRIPT_CHANNEL_PROMPT = 4;
}

// Exactly one representation, including an explicitly present empty string.
message TranscriptContent {
  oneof value {
    option (buf.validate.oneof).required = true;
    string inline = 1 [(buf.validate.field).string.max_bytes = 65536];
    BlobRef blob = 2;
  }
}

message TranscriptText {
  TranscriptChannel channel = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  TranscriptContent content = 2 [(buf.validate.field).required = true];
}

message TranscriptToolCall {
  string tool = 1 [(buf.validate.field).string.max_bytes = 65536];
  optional string call_id = 2 [(buf.validate.field).string.max_bytes = 65536];
  // JSON until tool argument schemas are available at the provider boundary.
  TranscriptContent arguments_json = 3 [(buf.validate.field).required = true];
}

message TranscriptToolResult {
  string tool = 1 [(buf.validate.field).string.max_bytes = 65536];
  optional string call_id = 2 [(buf.validate.field).string.max_bytes = 65536];
  bool is_error = 3;
  // The text the agent was shown.
  TranscriptContent content = 4 [(buf.validate.field).required = true];
  // Field 5 carried the result as a JSON string (a Pydantic dump); records written with it stay
  // readable, a reader skips it and shows `content`.
  reserved 5;
  reserved "payload_json";
  // What the tool returned beside its text. Absent for a result with none and for one written before
  // this field existed. A reader that does not know the case shows `content` alone.
  oneof payload {
    TranscriptCommandResult command = 6;
    // A JSON object or array, as JSON text.
    TranscriptContent json = 7;
  }
}

// A command's result in parts, as the tool reported them.
message TranscriptCommandResult {
  TranscriptContent stdout = 1 [(buf.validate.field).required = true];
  TranscriptContent stderr = 2 [(buf.validate.field).required = true];
  // Absent when the tool has no exit status.
  optional int32 exit_code = 3;
  // Absent when the tool did not time itself.
  optional double duration_seconds = 4 [(buf.validate.field).double = {
    gte: 0
    finite: true
  }];
}
