syntax = "proto3";
package vibesys.store.v1;
import "buf/validate/validate.proto";
import "vibesys/store/v1/content.proto";
import "vibesys/store/v1/intent.proto";
option go_package = "github.com/uw-syfi/vibesys/gateway/gen/vibesys/store/v1;storev1";

// Session-local records. A proposal is data, never an admitted run intent.
message ChatRecord {
  oneof event {
    option (buf.validate.oneof).required = true;
    ChatSessionCreated created = 1;
    ChatMessage message = 2;
    ChatToken token = 3;
    ChatSteerProposed proposed_steer = 4;
  }
}
message ChatSessionCreated {
  string id = 1 [(buf.validate.field).string = {pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$", max_bytes: 65536}];
  string title = 2 [(buf.validate.field).string.max_bytes = 65536];
  string provider = 3 [(buf.validate.field).string = {min_len: 1, max_bytes: 65536}];
  string model = 4 [(buf.validate.field).string = {min_len: 1, max_bytes: 65536}];
}
enum ChatRole {
  CHAT_ROLE_UNSPECIFIED = 0;
  CHAT_ROLE_USER = 1;
  CHAT_ROLE_ASSISTANT = 2;
}
message ChatMessage {
  string request_id = 1 [(buf.validate.field).string = {pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$", max_bytes: 65536}];
  ChatRole role = 2 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  oneof content {
    option (buf.validate.oneof).required = true;
    string text = 3 [(buf.validate.field).string.max_bytes = 65536];
    BlobRef blob = 4;
  }
  bool failed = 5;
}
message ChatToken {
  string request_id = 1 [(buf.validate.field).string = {pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$", max_bytes: 65536}];
  string text = 2 [(buf.validate.field).string = {min_len: 1, max_bytes: 65536}];
}
message ChatSteerProposed {
  string id = 1 [(buf.validate.field).string = {min_len: 1, max_bytes: 65536}];
  string request_id = 2 [(buf.validate.field).string = {pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$", max_bytes: 65536}];
  string text = 3 [(buf.validate.field).string = {min_len: 1, max_bytes: 65536}];
  SteerTarget target = 4 [(buf.validate.field).required = true];
  SteerMode mode = 5 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
}
