syntax = "proto3";

package vibesys.store.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/uw-syfi/vibesys/gateway/gen/vibesys/store/v1;storev1";

message AgentTurnAttrs {
  string agent = 1 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 65536
  }];
  string role = 2 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 65536
  }];
  optional string model = 3 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 65536
  }];
  repeated string started_by = 4 [(buf.validate.field).repeated.items.string = {
    min_len: 1
    max_bytes: 65536
  }];
  string stage = 5 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 65536
  }];
  optional uint32 attempt = 6;
  optional string provider = 7 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 65536
  }];
  optional string reasoning_effort = 8 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 65536
  }];
  optional string harness_version = 9 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 65536
  }];
  optional TokenUsage usage = 10;
  string reply_json = 11 [(buf.validate.field).string.max_bytes = 65536];
  optional uint64 transcript_length = 12;
}

message TokenUsage {
  optional uint64 input = 1;
  optional uint64 cache_read = 2;
  optional uint64 cache_creation = 3;
  optional uint64 output = 4;
  optional uint64 reasoning = 5;
  optional double cost_usd = 6 [(buf.validate.field).double = {
    gte: 0
    finite: true
  }];
  optional uint64 duration_ms = 7;
}
