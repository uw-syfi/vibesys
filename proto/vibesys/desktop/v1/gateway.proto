syntax = "proto3";
package vibesys.desktop.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/uw-syfi/vibesys/gateway/gen/vibesys/desktop/v1;desktopv1";

enum DesktopGatewayKind {
  DESKTOP_GATEWAY_KIND_UNSPECIFIED = 0;
  DESKTOP_GATEWAY_KIND_UNARY = 1;
  DESKTOP_GATEWAY_KIND_STREAM = 2;
}

// Electron routes this message as protobuf bytes. The preload owns the port,
// while the caller owns decoding and cancellation; neither transports JSON.
message DesktopGatewayRequest {
  DesktopGatewayKind kind = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string host = 2 [(buf.validate.field).string.pattern = "^(local|ssh:[A-Za-z0-9_.@:][A-Za-z0-9_.@:-]{0,254})$"];
  string method = 3 [(buf.validate.field).string = {
    max_bytes: 1024
    pattern: "^/[A-Za-z][A-Za-z0-9_.]*/[A-Za-z][A-Za-z0-9_]*$"
  }];
  bytes bytes = 4 [(buf.validate.field).bytes.max_len = 16777216];
}
enum DesktopLinkProblem {
  DESKTOP_LINK_PROBLEM_UNSPECIFIED = 0;
  DESKTOP_LINK_PROBLEM_AUTH = 1;
  DESKTOP_LINK_PROBLEM_LINK = 2;
  DESKTOP_LINK_PROBLEM_CAPACITY = 3;
}

// Why the main process refused a call for good: no retry and no redial changes it, so the window
// shows it and does not try again. The end's `error` says which platform, method or version.
enum DesktopRefusal {
  DESKTOP_REFUSAL_UNSPECIFIED = 0;
  // The window asked for a method the app does not allow.
  DESKTOP_REFUSAL_METHOD_NOT_AVAILABLE = 1;
  // The host's operating system or CPU is one no host program is built for.
  DESKTOP_REFUSAL_UNSUPPORTED_PLATFORM = 2;
  // This build of the app holds no host program for the host's platform, so it cannot provision one.
  DESKTOP_REFUSAL_HOST_PROGRAM_MISSING = 3;
  // The request breaks its schema, so it can never be answered as sent.
  DESKTOP_REFUSAL_INVALID_REQUEST = 4;
}

message DesktopGatewayEnd {
  optional string error = 1 [(buf.validate.field).string.max_bytes = 65536];
  // The gRPC status code when the gateway refused the call, so a typed refusal
  // (not found, unavailable) is not flattened into a retryable disconnect.
  optional int32 status = 2 [(buf.validate.field).int32 = {gte: 0, lte: 16}];
  optional DesktopLinkProblem link_problem = 3 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  // Set when the app itself refused the call for good (never with a status or a link problem).
  optional DesktopRefusal refusal = 4 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
}
message DesktopGatewayReply {
  oneof body {
    option (buf.validate.oneof).required = true;
    bytes bytes = 1 [(buf.validate.field).bytes.max_len = 16777216];
    DesktopGatewayEnd end = 2;
  }
}
