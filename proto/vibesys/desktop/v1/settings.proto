syntax = "proto3";

package vibesys.desktop.v1;

import "buf/validate/validate.proto";
import "google/protobuf/descriptor.proto";
import "vibesys/host/v1/operations.proto";

option go_package = "github.com/uw-syfi/vibesys/gateway/gen/vibesys/desktop/v1;desktopv1";

// An import-only alias from a retained JSON format. It is never a writer key.
extend google.protobuf.FieldOptions {
  string retained_json_key = 50120;
}

// Desktop-owned data. The original JSON files are read-only import sources.
message DesktopHostSettings {
  // Unset until the person sets a checkout; a host can be saved without one.
  string checkout = 1 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      min_len: 1
      max_len: 1024
      pattern: "^(~$|/|~/)[^\\x00\\r\\n]*$"
    }
  ];
  reserved 2;
  reserved "run_transport_v2";
  // What an ssh command added beyond the destination; absent for an alias of the person's ssh config.
  optional DesktopSshOptions ssh = 3;
}

// The options of a pasted ssh command, held beside the saved host: the host key names the
// destination (`ssh:[user@]host`), these are the rest. Each is passed to ssh as the flag of the
// same name (-p, -J, -i) and never joined into a shell string.
message DesktopSshOptions {
  optional uint32 port = 1 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 65535
  }];
  // A comma-separated ProxyJump list; it cannot start with a dash, which ssh would read as a flag.
  string jump = 2 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      max_len: 512
      pattern: "^[A-Za-z0-9_.@:\\[][A-Za-z0-9_.@:,\\[\\]-]*$"
    }
  ];
  string identity_file = 3 [
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE,
    (buf.validate.field).string = {
      max_len: 1024
      pattern: "^[^\\x00\\r\\n-][^\\x00\\r\\n]*$"
    }
  ];
}

// The window's requests about the machines (hosts) it can reach, answered by the main process,
// which reads the person's ssh config and keeps the saved hosts.
message DesktopMachineRestore {
  string host = 1 [(buf.validate.field).string.pattern = "^ssh:[A-Za-z0-9_.@:][A-Za-z0-9_.@:-]{0,254}$"];
  DesktopHostSettings settings = 2 [(buf.validate.field).required = true];
}

message DesktopMachineRequest {
  oneof op {
    option (buf.validate.oneof).required = true;
    // The ssh config aliases that match what the person typed so far.
    string match = 1 [(buf.validate.field).string.max_len = 512];
    // An alias or a pasted ssh command: it is parsed, never run.
    string add = 2 [(buf.validate.field).string = {
      min_len: 1
      max_len: 4096
      pattern: "^[^\\x00]*$"
    }];
    string remove = 3 [(buf.validate.field).string.pattern = "^ssh:[A-Za-z0-9_.@:][A-Za-z0-9_.@:-]{0,254}$"];
    // Puts back what a remove took.
    DesktopMachineRestore restore = 4;
  }
}

message DesktopMachineMatches {
  repeated string aliases = 1 [(buf.validate.field).repeated.max_items = 50];
}

message DesktopMachineAdded {
  string host = 1 [(buf.validate.field).string.pattern = "^ssh:[A-Za-z0-9_.@:][A-Za-z0-9_.@:-]{0,254}$"];
  // False when the host was already saved: nothing changed and the caller selects it.
  bool created = 2;
}

message DesktopMachineRemoved {
  DesktopMachineRestore undo = 1 [(buf.validate.field).required = true];
}

// A request that cannot be served, with the reason the person reads (it names the offending flag).
message DesktopMachineRefused {
  string reason = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 1024
  }];
}

message DesktopMachineReply {
  oneof result {
    option (buf.validate.oneof).required = true;
    DesktopMachineMatches matches = 1;
    DesktopMachineAdded added = 2;
    DesktopMachineRemoved removed = 3;
    DesktopMachineRefused refused = 4;
  }
}

message DesktopHosts {
  uint32 version = 1 [(buf.validate.field).uint32.const = 1];
  map<string, DesktopHostSettings> hosts = 2 [(buf.validate.field).map = {
    max_pairs: 10000
    keys: {
      string: {pattern: "^(local|ssh:[A-Za-z0-9_.@:][A-Za-z0-9_.@:-]{0,254})$"}
    }
  }];
}

// Read-only decoder for the settings written before the single-transport cutover.
message RetainedDesktopHostSettings {
  string checkout = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 1024
    pattern: "^(~$|/|~/)[^\\x00\\r\\n]*$"
  }];
  // Read-only historical field; projections discard it and writers never emit it.
  optional bool discarded_selection = 2 [(retained_json_key) = "runTransportV2"];
}

message RetainedDesktopHosts {
  uint32 version = 1 [(buf.validate.field).uint32.const = 1];
  map<string, RetainedDesktopHostSettings> hosts = 2 [(buf.validate.field).map = {
    max_pairs: 10000
    keys: {
      string: {pattern: "^(local|ssh:[A-Za-z0-9_.@:][A-Za-z0-9_.@:-]{0,254})$"}
    }
  }];
}

enum DesktopAppearanceMode {
  DESKTOP_APPEARANCE_MODE_UNSPECIFIED = 0;
  DESKTOP_APPEARANCE_MODE_SYSTEM = 1;
  DESKTOP_APPEARANCE_MODE_LIGHT = 2;
  DESKTOP_APPEARANCE_MODE_DARK = 3;
}

enum DesktopTheme {
  DESKTOP_THEME_UNSPECIFIED = 0;
  DESKTOP_THEME_PAPER = 1;
  DESKTOP_THEME_MIST = 2;
  DESKTOP_THEME_SAND = 3;
  DESKTOP_THEME_INK = 4;
  DESKTOP_THEME_MIDNIGHT = 5;
  DESKTOP_THEME_TERMINAL = 6;
}

message DesktopAppearance {
  DesktopAppearanceMode mode = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  DesktopTheme light = 2 [(buf.validate.field).enum = {
    in: [
      1,
      2,
      3
    ]
  }];
  DesktopTheme dark = 3 [(buf.validate.field).enum = {
    in: [
      4,
      5,
      6
    ]
  }];
}

message DesktopRunRef {
  string host = 1 [(buf.validate.field).string.pattern = "^(local|ssh:[A-Za-z0-9_.@:][A-Za-z0-9_.@:-]{0,254})$"];
  string run_id = 2 [(buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9._-]{0,127}$"];
}

// Who this install of the app is to the hosts it calls: an id that stays the same for the install and
// a name to show. The main process stamps both on every call to a host as metadata
// (vibesys-viewer-id and vibesys-viewer-label), where they say whose check-ins a host keeps for Catch
// me up; nothing authenticates them and they grant nothing. The label travels as an HTTP/2 header
// value, so it is printable ASCII with no space at either end (a header value does not keep one).
message DesktopViewer {
  string id = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9._-]{1,128}$"];
  string label = 2 [(buf.validate.field).string.pattern = "^[!-~]([ -~]{0,126}[!-~])?$"];
}

message DesktopPreferences {
  uint32 version = 1 [(buf.validate.field).uint32.const = 1];
  DesktopAppearance appearance = 2 [(buf.validate.field).required = true];
  optional bool notifications_enabled = 3 [(buf.validate.field).required = true];
  repeated DesktopRunRef archived = 4 [(buf.validate.field).repeated.max_items = 100000];
  // Absent until the app first runs a version that has one; the main process then makes and saves it.
  optional DesktopViewer viewer = 5;
}

message DesktopRunStart {
  vibesys.host.v1.StartRunHarness harness = 1;
  vibesys.host.v1.StartRunOptions options = 2 [(buf.validate.field).required = true];
  repeated vibesys.host.v1.StartRunAgent agents = 3 [(buf.validate.field).repeated.max_items = 32];
  vibesys.host.v1.StartRunMeasure measure_on = 4 [(buf.validate.field).required = true];
  repeated string args = 5 [(buf.validate.field).repeated = {
    max_items: 256
    items: {
      string: {
        max_bytes: 4096
        pattern: "^[^\\r\\n\\x00]*$"
      }
    }
  }];
}

message DesktopRecentRun {
  DesktopRunRef run = 1 [(buf.validate.field).required = true];
  string project = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 1024
    pattern: "^(~$|/|~/)[^\\x00\\r\\n]*$"
  }];
  optional string task = 3 [(buf.validate.field).string.pattern = "^[a-z0-9][a-z0-9._-]{0,127}$"];
  optional string instance_id = 4 [(buf.validate.field).string.pattern = "^[0-9a-f]{12}$"];
  double attached_at = 5 [(buf.validate.field).double = {
    gte: 0
    finite: true
  }];
  DesktopRunStart start = 6;
}

// Unreadable historical entries are retained as evidence, never interpreted as
// current settings. Their original source file also remains unchanged.
message DesktopRetainedRecentEntry {
  uint32 after = 1;
  bytes original_json = 2 [(buf.validate.field).bytes = {
    min_len: 1
    max_len: 1048576
  }];
}

message DesktopRecent {
  uint32 version = 1 [(buf.validate.field).uint32.const = 1];
  repeated DesktopRecentRun runs = 2 [(buf.validate.field).repeated.max_items = 100000];
  repeated DesktopRetainedRecentEntry retained = 3 [(buf.validate.field).repeated.max_items = 100000];
}
