syntax = "proto3";

package vibesys.api.v1;

import "buf/validate/validate.proto";
import "vibesys/store/v1/intent.proto";

option go_package = "github.com/uw-syfi/vibesys/gateway/gen/vibesys/api/v1;apiv1";

// The caller takes checkout from the host's saved configuration. Carrying it on
// each call lets a stateless gateway immediately follow a checkout change.
message HostCallRequest {
  string checkout = 1 [(buf.validate.field).string = {min_len: 1, max_bytes: 4096}];
  oneof method {
    option (buf.validate.oneof).required = true;
    PostIntentRequest post_intent = 2;
    RelaunchRequest relaunch = 3;
  }
}

// Both pipes carry the envelope, including a configuration_failed result on
// command failure. Transport failures use the same result shape.
message HostCallResponse {
  oneof result {
    option (buf.validate.oneof).required = true;
    PostIntentResponse post_intent = 1;
    ConfigurationFailed configuration_failed = 2;
    RelaunchResponse relaunch = 3;
  }
}

message ConfigurationFailed {
  string code = 1 [(buf.validate.field).string = {min_len: 1, max_bytes: 65536}];
  string stage = 2 [(buf.validate.field).string = {min_len: 1, max_bytes: 65536}];
  string message = 3 [(buf.validate.field).string = {min_len: 1, max_bytes: 65536}];
  int32 exit_code = 4;
  string stderr = 5 [(buf.validate.field).string.max_bytes = 65536];
}

message PostIntentRequest {
  string project_root = 1 [(buf.validate.field).string = {min_len: 1, max_bytes: 4096}];
  string run_id = 2 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$"];
  string request_id = 3 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"];
  oneof intent {
    option (buf.validate.oneof).required = true;
    PauseIntent pause = 4;
    ParkIntent park = 5;
    ResumeIntent resume = 6;
    StopIntent stop = 7;
    SteerIntent steer = 8;
    WithdrawIntent withdraw = 9;
    CancelAttemptIntent cancel_attempt = 10;
    CancelItemIntent cancel_item = 11;
    SetParallelismIntent set_parallelism = 12;
  }
}

// Posting acknowledges durable admission only. Applied/refused comes from the
// run's IntentState record, never from subprocess success.
message PostIntentResponse {
  string request_id = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"];
  bool ordered_reader = 2;
}
message PauseIntent {}
// Reserved in the command surface; refused until the existing inbox supports it.
message ParkIntent {}
message ResumeIntent {
  option (buf.validate.message).cel = {
    id: "resume.mode"
    message: "fallback resumes now; it cannot wait for capacity to return"
    expression: "!this.fallback || this.when != 2"
  };
  bool fallback = 1;
  ResumeWhen when = 2 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
}
enum ResumeWhen {
  RESUME_WHEN_UNSPECIFIED = 0;
  RESUME_WHEN_NOW = 1;
  RESUME_WHEN_CAPACITY_RETURNS = 2;
}
message StopIntent {
  StopMode mode = 1 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
}
enum StopMode {
  STOP_MODE_UNSPECIFIED = 0;
  STOP_MODE_DRAIN = 1;
  STOP_MODE_CANCEL = 2;
}
message SteerIntent {
  string text = 1 [(buf.validate.field).string = {min_len: 1, max_bytes: 65536}];
  vibesys.store.v1.SteerTarget target = 2 [(buf.validate.field).required = true];
  vibesys.store.v1.SteerMode mode = 3 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
}
message WithdrawIntent {
  string withdraws = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9._-]{0,127}$"];
}
message CancelAttemptIntent {
  string attempt = 1 [(buf.validate.field).string = {min_len: 1, max_len: 256, pattern: "^[^\\s]+$"}];
}
message CancelItemIntent {
  string item = 1 [(buf.validate.field).string = {min_len: 1, max_len: 256, pattern: "^[^\\s]+$"}];
}
message SetParallelismIntent {
  uint32 max_parallel = 1 [(buf.validate.field).uint32.gte = 1];
}

// The observed epoch fences retries. Reconcile an uncertain call through
// Skeleton before retrying; it must never start a second new epoch silently.
message RelaunchRequest {
  string project_root = 1 [(buf.validate.field).string = {min_len: 1, max_bytes: 4096}];
  string run_id = 2 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_-]{0,127}$"];
  uint64 expected_epoch = 3 [(buf.validate.field).uint64.gte = 1];
}
message RelaunchResponse {
  oneof outcome {
    option (buf.validate.oneof).required = true;
    uint64 epoch = 1 [(buf.validate.field).uint64.gte = 1];
    RelaunchRefusal refusal = 2 [(buf.validate.field).enum = {defined_only: true, not_in: [0]}];
  }
}
enum RelaunchRefusal {
  RELAUNCH_REFUSAL_UNSPECIFIED = 0;
  RELAUNCH_REFUSAL_LOCKED = 1;
  RELAUNCH_REFUSAL_ENDED = 2;
  RELAUNCH_REFUSAL_CHECKOUT_MISSING = 3;
  RELAUNCH_REFUSAL_EPOCH_CHANGED = 4;
}
