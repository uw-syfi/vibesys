syntax = "proto3";

package vibesys.api.v1;

import "buf/validate/validate.proto";
import "vibesys/host/v1/failure.proto";
import "vibesys/host/v1/operations.proto";

option go_package = "github.com/uw-syfi/vibesys/gateway/gen/vibesys/api/v1;apiv1";

// Generated by scripts/generate_proto.sh; do not edit.
// One registered read. Budgets and pairing stay in the operation registry.
message ReadRequest {
  string checkout = 1 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 4096
  }];
  oneof method {
    option (buf.validate.oneof).required = true;
    vibesys.host.v1.ListTasksRequest list_tasks = 10;
    vibesys.host.v1.ListHarnessesRequest list_harnesses = 11;
    vibesys.host.v1.ListExamplesRequest list_examples = 12;
    vibesys.host.v1.GetTaskGoalRequest get_task_goal = 13;
    vibesys.host.v1.DescribeMachineRequest describe_machine = 14;
    vibesys.host.v1.ListComputeRequest list_compute = 15;
    vibesys.host.v1.PreflightRunRequest preflight_run = 16;
    vibesys.host.v1.InspectCandidateRequest inspect_candidate = 17;
    vibesys.host.v1.CompletePathsRequest complete_paths = 18;
    vibesys.host.v1.InspectDestinationRequest inspect_destination = 23;
    vibesys.host.v1.ListSavedRunsRequest list_saved_runs = 37;
  }
}

// The matching read result, or a typed failure. Tag 2 stays reserved for failure.
message ReadResponse {
  oneof result {
    option (buf.validate.oneof).required = true;
    vibesys.host.v1.OperationFailure failure = 2;
    vibesys.host.v1.ListTasksResponse list_tasks = 10;
    vibesys.host.v1.ListHarnessesResponse list_harnesses = 11;
    vibesys.host.v1.ListExamplesResponse list_examples = 12;
    vibesys.host.v1.GetTaskGoalResponse get_task_goal = 13;
    vibesys.host.v1.DescribeMachineResponse describe_machine = 14;
    vibesys.host.v1.ListComputeResponse list_compute = 15;
    vibesys.host.v1.PreflightRunResponse preflight_run = 16;
    vibesys.host.v1.InspectCandidateResponse inspect_candidate = 17;
    vibesys.host.v1.CompletePathsResponse complete_paths = 18;
    vibesys.host.v1.InspectDestinationResponse inspect_destination = 23;
    vibesys.host.v1.ListSavedRunsResponse list_saved_runs = 37;
  }
}
