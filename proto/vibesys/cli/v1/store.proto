syntax = "proto3";
package vibesys.cli.v1;

import "buf/validate/validate.proto";
import "vibesys/cli/v1/bound.proto";
import "vibesys/cli/v1/event.proto";
import "vibesys/cli/v1/frontier.proto";
import "vibesys/cli/v1/job.proto";
import "vibesys/cli/v1/plan.proto";
import "vibesys/cli/v1/promote.proto";
import "vibesys/cli/v1/result.proto";
import "vibesys/cli/v1/workstream.proto";

option go_package = "github.com/uw-syfi/vibesys/cli/gen/vibesys/cli/v1;cliv1";

// The files of a store on disk. Each file is the protojson of one of these messages, written with
// the proto field names, and read with unknown fields refused. The stored form is therefore
// generated from this file and never described by hand: a record that does not decode as its
// message here is damaged or from another version, and the store says so.
//
// Every file starts with `format`, the version of the layout and of every record in it. A program
// reads files of its own version and refuses any other. A file of an older version is not
// migrated: the store is thrown away.
//
// Versions: 1 was a hand-written encoding that no release wrote. 2 is protojson of these messages.
// Submitters are additive in format 2; old writers reject jobs containing the new field. Format 6
// adds a plan's origin, transitions and workstream, and the bounds/ and workstreams/ directories: a
// program that reads up to format 5 refuses a store of format 6, so it never opens one and ignores
// what it holds that the program does not know.

// FormatFile is the `format` file of a store, and the part of every other file that is read first,
// so that a file of another version is reported as that and not as a record with unknown fields.
message FormatFile {
  int32 format = 1 [(buf.validate.field).int32.gt = 0];
}

// JobFile is jobs/<job>.json: one job, replaced whole on each change.
message JobFile {
  int32 format = 1 [(buf.validate.field).int32.gt = 0];
  Job job = 2 [(buf.validate.field).required = true];
}

// ResultFile is results/<job>.json: the result a job saved, with its place in the order of saving.
message ResultFile {
  int32 format = 1 [(buf.validate.field).int32.gt = 0];
  uint64 seq = 2;
  Result result = 3 [(buf.validate.field).required = true];
}

// PlanFile is plans/<number>.json: one plan, replaced whole on each change.
message PlanFile {
  int32 format = 1 [(buf.validate.field).int32.gt = 0];
  Plan plan = 2 [(buf.validate.field).required = true];
}

// WorkstreamFile is workstreams/<number>.json: one workstream, replaced whole on each change.
message WorkstreamFile {
  int32 format = 1 [(buf.validate.field).int32.gt = 0];
  Workstream workstream = 2 [(buf.validate.field).required = true];
}

// PromotionFile is promotions/<n>.json: the nth promotion.
message PromotionFile {
  int32 format = 1 [(buf.validate.field).int32.gt = 0];
  uint64 seq = 2 [(buf.validate.field).uint64.gt = 0];
  Promotion promotion = 3 [(buf.validate.field).required = true];
}

// BoundFile is bounds/<seq>.json: the declared bound at that place in the task's log of bounds. A
// bound is written once and never replaced. A store made before bounds existed has no such
// directory, and is read as having none.
message BoundFile {
  int32 format = 1 [(buf.validate.field).int32.gt = 0];
  ObjectiveBound bound = 2 [(buf.validate.field).required = true];
}

// FrontierFile is frontier/<n>.json: the task's frontier after its nth change, whole. The frontier is
// the last of them, and a store with none has an empty frontier.
message FrontierFile {
  int32 format = 1 [(buf.validate.field).int32.gt = 0];
  uint64 seq = 2;
  repeated FrontierMember members = 3;
}

// EventFile is runs/<run>/<n>.json: the nth event of a run.
message EventFile {
  int32 format = 1 [(buf.validate.field).int32.gt = 0];
  Event event = 2 [(buf.validate.field).required = true];
}

// OwnerFile is .owner: who owns the store. generation counts the owners the store has had, so that
// no two owners have the same record, not even the same process opening it twice.
message OwnerFile {
  int32 format = 1 [(buf.validate.field).int32.gt = 0];
  uint64 generation = 2 [(buf.validate.field).uint64.gt = 0];
  string host = 3;
  // The owner's runtime directory, where its supervisors can be reached.
  string dir = 4;
  int64 pid = 5;
  // The running jobs whose runs were given up, by job id.
  repeated string given_up = 6;
}

// TaskFile is an entry of the per-user index of stores: tasks/<hash>.json.
message TaskFile {
  int32 format = 1 [(buf.validate.field).int32.gt = 0];
  string repository = 2 [(buf.validate.field).string.pattern = "^/"];
  string task = 3 [(buf.validate.field).string.pattern = "^[A-Za-z0-9_-][A-Za-z0-9._-]{0,127}$"];
}
