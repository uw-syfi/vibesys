syntax = "proto3";
package vibesys.cli.v1;

import "buf/validate/validate.proto";
import "google/protobuf/descriptor.proto";

option go_package = "github.com/uw-syfi/vibesys/cli/gen/vibesys/cli/v1;cliv1";

// The environment variables VibeSys hands a process are fields of messages. A field's env_name is
// the variable it travels in, and cli/envcodec is the one encoder and decoder: it writes a message
// as variable names and values and reads one back, then holds the result to this file's protovalidate
// rules, so a bad value is refused naming its variable. No other code reads or writes a VIBESYS_*
// variable (scripts/check_boundaries.py).
//
// A string field is its value; an unsigned integer field is its decimal digits; an enum field is the
// name of its value without the enum's prefix, in lower case (AGENT_ROLE_LEAD of AgentRole is
// "lead"); a repeated string field is its elements separated by commas, so an element holds no
// comma. A field at its zero value, or a list with no element, is not set. The decoder reads a variable that is unset or empty
// as the zero value, and the rules say whether that is allowed.
extend google.protobuf.FieldOptions {
  // The environment variable this field is carried in.
  string env_name = 50100;
}

extend google.protobuf.MessageOptions {
  // The prefix of the variable names this message owns. A variable with this prefix in the
  // environment that no field of the message names is reported by the decoder as unknown, so a
  // misspelled name does not pass for a missing one. The decoder reports and does not refuse: the
  // environment is inherited, and a name in the prefix can belong to a setting of another program.
  string env_namespace = 50100;
}

// AgentContext is what vibesys-cli reads as the defaults of its context flags, and what the
// orchestrator gives every agent it launches. A field left empty is not set in the agent's
// environment, and the program resolves it as it would without the orchestrator.
message AgentContext {
  // The git repository the run works on (--repo): an absolute path, or empty for the directory the
  // command runs in.
  string repository = 1 [
    (env_name) = "VIBESYS_REPO",
    (buf.validate.field).string.max_bytes = 4096
  ];
  // The task the jobs belong to (--task).
  string task = 2 [
    (env_name) = "VIBESYS_TASK",
    (buf.validate.field).string.max_bytes = 256
  ];
  // The id of the optimization run (--run). Its presence also selects the orchestrator harness
  // reference of the skills, which read it from the shell.
  string run_id = 3 [
    (env_name) = "VIBESYS_RUN",
    (buf.validate.field).string.max_bytes = 256
  ];
  // The agent harness, such as claude-code (--harness).
  string harness = 4 [
    (env_name) = "VIBESYS_HARNESS",
    (buf.validate.field).string.pattern = "^[a-z0-9-]*$",
    (buf.validate.field).string.max_bytes = 64
  ];
  // The agent making the call (--agent).
  string agent = 5 [
    (env_name) = "VIBESYS_AGENT",
    (buf.validate.field).string.max_bytes = 256
  ];
}

// OperatorContext is what an operator chooses for the jobs of the agents they start. The
// orchestrator sets placement to the run's eval place when the run names one; an unpinned run sets
// nothing, and the agent keeps what the environment it was started in names.
message OperatorContext {
  // The one placement of the operator config a docker job may run on (--placement), or empty for
  // any that gives what the task needs.
  string placement = 1 [
    (env_name) = "VIBESYS_PLACEMENT",
    (buf.validate.field).string.max_bytes = 256
  ];
}

// SkillEnvironment is what the skills' shell commands read. vibesys-cli does not.
message SkillEnvironment {
  // The vibesys-cli the orchestrator chose for its agents: an absolute path, run as "$VIBESYS_CLI".
  string cli = 1 [
    (env_name) = "VIBESYS_CLI",
    (buf.validate.field).string.pattern = "^(/[^\\x00]*)?$"
  ];
}

// JobEnvironment is what a job's commands may read about the job they run in. A command that reads
// none of it works as it does without VibeSys. A field that does not apply to a job is not set, and
// the rules require none: the program that needs one says which is missing.
message JobEnvironment {
  // Where the job keeps files that stay with the job after it ends: an absolute location, empty
  // when the job keeps none.
  string artifacts = 1 [
    (env_name) = "VIBESYS_ARTIFACTS_DIR",
    (buf.validate.field).string.pattern = "^(/[^\\x00]*)?$",
    (buf.validate.field).string.max_bytes = 4096
  ];
  // Where the job keeps files between runs of the same task image: an absolute location, empty when
  // the job has none.
  string cache = 2 [
    (env_name) = "VIBESYS_CACHE_DIR",
    (buf.validate.field).string.pattern = "^(/[^\\x00]*)?$",
    (buf.validate.field).string.max_bytes = 4096
  ];
  // The address of the candidate's server, for a command that sends it requests: an http or https URL.
  string service_url = 3 [
    (env_name) = "VIBESYS_SERVICE_URL",
    (buf.validate.field).string.pattern = "^(https?://[^\\s]+)?$",
    (buf.validate.field).string.max_bytes = 2048
  ];
  // The longest the job may run, in seconds. The job is stopped when it passes it; a command that
  // keeps something outside the job, such as a deployment, uses it to know when that is left over.
  // Zero when the job has no limit.
  uint32 timeout_seconds = 4 [
    (env_name) = "VIBESYS_JOB_TIMEOUT_SECONDS",
    (buf.validate.field).uint32.lte = 31536000
  ];
  // The names of the read-only data sets the job may read, each a name in the operator's
  // configuration.
  repeated string mounts = 5 [
    (env_name) = "VIBESYS_MOUNTS",
    (buf.validate.field).repeated.max_items = 64,
    (buf.validate.field).repeated.unique = true,
    (buf.validate.field).repeated.items.string.pattern = "^[a-z0-9][a-z0-9_-]{0,62}$"
  ];
}

// KubernetesEnvironment is what a job that needs a Kubernetes cluster is given: the cluster's
// credentials, the registry it pulls images from, and the service that builds images for it. A job
// without the need gets none of it.
message KubernetesEnvironment {
  // The cluster's credentials, in the form kubectl and the client libraries read: an absolute
  // location.
  string kubeconfig = 1 [
    (env_name) = "KUBECONFIG",
    (buf.validate.field).string.pattern = "^(/[^\\x00]*)?$",
    (buf.validate.field).string.max_bytes = 4096
  ];
  // The registry the cluster pulls images from.
  string registry = 2 [
    (env_name) = "VIBESYS_K8S_REGISTRY",
    (buf.validate.field).string.pattern = "^[A-Za-z0-9._:/@+-]*$",
    (buf.validate.field).string.max_bytes = 512
  ];
  // The address of the service that builds images the registry holds.
  string builder = 3 [
    (env_name) = "VIBESYS_K8S_BUILDER",
    (buf.validate.field).string.pattern = "^[A-Za-z0-9._:/@+-]*$",
    (buf.validate.field).string.max_bytes = 512
  ];
}

// JobToolPlace is which daemon a vibesys-cli serves. The orchestrator gives it to every agent it
// launches, so that the agent's job tool reaches the daemon the host chose and only that one, whatever
// else its environment says. Nothing else of the agent's environment is rewritten for this.
message JobToolPlace {
  // The tool's runtime directory, as `daemon ensure --json` named it: an absolute path, or empty for
  // the one the tool resolves for this user. It records where its daemon keeps state
  // (DaemonPlaces), so a daemon started here needs no other variable.
  string runtime_directory = 1 [
    (env_name) = "VIBESYS_CLI_RUNTIME_DIR",
    (buf.validate.field).string.pattern = "^(/[^\\x00]*)?$"
  ];
}
