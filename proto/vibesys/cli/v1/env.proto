syntax = "proto3";
package vibesys.cli.v1;

import "buf/validate/validate.proto";
import "google/protobuf/descriptor.proto";

option go_package = "github.com/uw-syfi/vibesys/cli/gen/vibesys/cli/v1;cliv1";

// The environment variables VibeSys hands a process are fields of messages. A field's env_name is
// the variable it travels in, and cli/envcodec is the one encoder and decoder: it writes a message
// as variable names and values and reads one back, then holds the result to this file's protovalidate
// rules, so a bad value is refused naming its variable. No other code reads or writes a VIBESYS_*
// variable (scripts/check_boundaries.py).
//
// A string field is its value; an unsigned integer field is its decimal digits; an enum field is the
// name of its value without the enum's prefix, in lower case (AGENT_ROLE_LEAD of AgentRole is
// "lead"). A field at its zero value is not set. The decoder reads a variable that is unset or empty
// as the zero value, and the rules say whether that is allowed.
extend google.protobuf.FieldOptions {
  // The environment variable this field is carried in.
  string env_name = 50100;
}

extend google.protobuf.MessageOptions {
  // The prefix of the variable names this message owns. A variable with this prefix in the
  // environment that no field of the message names is reported by the decoder as unknown, so a
  // misspelled name does not pass for a missing one. The decoder reports and does not refuse: the
  // environment is inherited, and a name in the prefix can belong to a setting of another program.
  string env_namespace = 50100;
}

// AgentContext is what vibesys-cli reads as the defaults of its context flags, and what the
// orchestrator gives every agent it launches. A field left empty is not set in the agent's
// environment, and the program resolves it as it would without the orchestrator.
message AgentContext {
  // The git repository the run works on (--repo): an absolute path, or empty for the directory the
  // command runs in.
  string repository = 1 [
    (env_name) = "VIBESYS_REPO",
    (buf.validate.field).string.max_bytes = 4096
  ];
  // The task the jobs belong to (--task).
  string task = 2 [
    (env_name) = "VIBESYS_TASK",
    (buf.validate.field).string.max_bytes = 256
  ];
  // The id of the optimization run (--run). Its presence also selects the orchestrator harness
  // reference of the skills, which read it from the shell.
  string run_id = 3 [
    (env_name) = "VIBESYS_RUN",
    (buf.validate.field).string.max_bytes = 256
  ];
  // The agent harness, such as claude-code (--harness).
  string harness = 4 [
    (env_name) = "VIBESYS_HARNESS",
    (buf.validate.field).string.pattern = "^[a-z0-9-]*$",
    (buf.validate.field).string.max_bytes = 64
  ];
  // The agent making the call (--agent).
  string agent = 5 [
    (env_name) = "VIBESYS_AGENT",
    (buf.validate.field).string.max_bytes = 256
  ];
}

// OperatorContext is what an operator chooses for the jobs of the agents they start. The
// orchestrator does not set it: an agent inherits it from the environment it was started in.
message OperatorContext {
  // The one placement of the operator config a docker job may run on (--placement), or empty for
  // any that gives what the task needs.
  string placement = 1 [
    (env_name) = "VIBESYS_PLACEMENT",
    (buf.validate.field).string.max_bytes = 256
  ];
}

// SkillEnvironment is what the skills' shell commands read. vibesys-cli does not.
message SkillEnvironment {
  // The vibesys-cli the orchestrator chose for its agents: an absolute path, run as "$VIBESYS_CLI".
  string cli = 1 [
    (env_name) = "VIBESYS_CLI",
    (buf.validate.field).string.pattern = "^(/[^\\x00]*)?$"
  ];
}
