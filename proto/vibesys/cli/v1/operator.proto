syntax = "proto3";
package vibesys.cli.v1;

import "buf/validate/validate.proto";

option go_package = "github.com/uw-syfi/vibesys/cli/gen/vibesys/cli/v1;cliv1";

// OperatorConfig is the operator config, cli.toml: the settings of the machines that run
// vibesys-cli's jobs, which belong to whoever runs the CLI and never to a task. The TOML file is
// decoded into this message by its field names, an enum value is written as its name without the
// prefix in lower case, and a key this message has no field for is refused, naming the key.
//
// A file names its placements under [placements.<name>]. A file of the earlier shape, with
// [docker], [remote] and [slurm] at the top, names one placement and is read as the placement
// "default"; a file holds one shape or the other, never both. No file is the one placement
// "default" of kind local, with no resource.
message OperatorConfig {
  // The placements, by name: where a docker job's container can run.
  map<string, Placement> placements = 1 [(buf.validate.field).map.keys.string.pattern = "^[a-z0-9][a-z0-9_-]{0,62}$"];

  // The earlier shape.
  LegacyDocker docker = 2;
  RemoteSettings remote = 3;
  SlurmSettings slurm = 4;

  // How the daemon shares the placements between jobs.
  Scheduler scheduler = 5;

  // How long a job's commands get to clean up after a cancel or the time limit asks them to
  // terminate (SIGTERM), before they are killed, for the host and for every placement. A command
  // that traps SIGTERM can remove what it made outside the machine, such as a Kubernetes
  // namespace. At most 240 seconds, which the daemon's wait for a stopped command outlasts. Unset means 30 seconds.
  optional double stop_grace_seconds = 6 [(buf.validate.field).double = {
    gte: 0.001
    lte: 240
  }];
}

// Scheduler is how the daemon shares the placements between the jobs that wait.
message Scheduler {
  // The policy that orders the jobs that wait, by the name the daemon's wiring gives it. Unset means
  // fifo.
  optional string policy = 1 [(buf.validate.field).string.min_len = 1];
  // How many jobs run at once on the one placement of the earlier shape. A file with placements sets
  // max_jobs on each placement instead.
  optional uint32 max_jobs = 2 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 1024
  }];
}

// PlacementKind is where a placement's Docker engine runs containers.
enum PlacementKind {
  PLACEMENT_KIND_UNSPECIFIED = 0;
  // The Docker engine of this machine.
  PLACEMENT_KIND_LOCAL = 1;
  // The Docker engine of another machine, reached by running docker over ssh.
  PLACEMENT_KIND_SSH = 2;
  // SSH, with every container, and every image build, inside an allocation of the machine's Slurm.
  PLACEMENT_KIND_SLURM = 3;
  // A Slurm cluster reached through a login node over ssh, whose compute nodes run Apptainer and no
  // Docker: images are built by this machine's Docker, copied to the cluster and converted there, and
  // every run's containers are processes of one batch allocation.
  PLACEMENT_KIND_APPTAINER = 4;
}

// Placement is one place a docker job's container can run, and what it gives the container.
message Placement {
  PlacementKind kind = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // How many jobs may run on the placement at once. Zero means one.
  uint32 max_jobs = 2 [(buf.validate.field).uint32.lte = 1024];
  // The machine, for the ssh and slurm kinds.
  RemoteSettings remote = 3;
  // How an allocation is asked for, for the slurm kind.
  SlurmSettings slurm = 4;
  // What the placement gives every container it runs.
  Resources resources = 5;
  // How a batch allocation is submitted and Apptainer run, for the apptainer kind.
  ApptainerSettings apptainer = 6;
}

// RemoteSettings is the machine the engine runs on, for the ssh and slurm kinds, and the login node
// of the cluster for the apptainer kind, where remote_workspace_root is on the file system the
// compute nodes share.
message RemoteSettings {
  // An ssh destination or an alias of the user's ssh config, without options or whitespace.
  string host = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9][A-Za-z0-9_.@-]*$"];
  // The programs, with arguments, that reach it. Unset means ssh and rsync.
  repeated string ssh_command = 2 [(buf.validate.field).repeated.items.string.min_len = 1];
  repeated string rsync_command = 3 [(buf.validate.field).repeated.items.string.min_len = 1];
  // An absolute directory there, not /, that holds the copies of runs' directories and the caches.
  string remote_workspace_root = 4 [(buf.validate.field).string.pattern = "^/.*[^/].*$"];
}

// SlurmSettings is how an allocation is asked for: with srun for the slurm kind, and with the submit
// command of [apptainer] for the apptainer kind, which takes no srun_arguments.
message SlurmSettings {
  string partition = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9=,:._/+-]*$"];
  // What a measured container asks for; a build asks for no GRES.
  string gres = 2 [(buf.validate.field).string.pattern = "^[A-Za-z0-9=,:._/+-]*$"];
  // When set, what an unmeasured container asks for instead of gres, such as a shard of a GPU.
  string shared_gres = 3 [(buf.validate.field).string.pattern = "^[A-Za-z0-9=,:._/+-]*$"];
  // Gives a measured container, a benchmark sample, the whole node. Unset means true.
  optional bool exclusive = 4;
  // How many CPUs a build or an unmeasured container asks for. Unset means 8.
  optional int32 cpus = 5 [(buf.validate.field).int32.gte = 1];
  // The memory a build or an unmeasured container asks for, a size both Slurm and Docker read the
  // same way, such as 32G.
  string memory = 6 [(buf.validate.field).string.pattern = "^([1-9][0-9]*[KMGT])?$"];
  // Passed to srun as they are, after the ones above. Each is an option.
  repeated string srun_arguments = 7 [(buf.validate.field).repeated.items.string.pattern = "^-"];
  // The pause between two reads of a job's state, and the bound on the wait for an allocation.
  // Zero means the default.
  double poll_interval_seconds = 8 [(buf.validate.field).double.gte = 0];
  double queue_timeout_seconds = 9 [(buf.validate.field).double.gte = 0];
}

// ContainerRuntime is what runs a container of the apptainer kind on a compute node.
enum ContainerRuntime {
  CONTAINER_RUNTIME_UNSPECIFIED = 0;
  // Apptainer: this machine's apptainer converts each image to a SIF, which the nodes' apptainer
  // runs.
  CONTAINER_RUNTIME_APPTAINER = 1;
  // Slurm's Pyxis plugin and Enroot: each image's root file system (docker export) is streamed to
  // the login node, which makes an Enroot squashfs of it with sqfstar, and each process is a step of
  // srun --container-image.
  CONTAINER_RUNTIME_PYXIS = 2;
}

// ApptainerSettings is how the apptainer kind makes an allocation and runs a container in it.
message ApptainerSettings {
  // The program, with its arguments, that submits a batch job on the login node: sbatch, or a site's
  // wrapper of it that takes sbatch's arguments. Unset means sbatch.
  repeated string submit_command = 1 [(buf.validate.field).repeated.items.string.min_len = 1];
  // Passed to the submit command after the options the CLI sets, such as an account (--account=x) or
  // a QOS a site requires on every job. Each is an option.
  repeated string submit_arguments = 2 [(buf.validate.field).repeated.items.string.pattern = "^-"];
  // The apptainer program of the compute nodes, which runs the SIFs. Unset means apptainer. Only for
  // the apptainer runtime.
  string program = 3 [(buf.validate.field).string.pattern = "^[A-Za-z0-9_./+-]*$"];
  // The absolute directory of this machine where an image is converted to a SIF by this machine's
  // apptainer (on the daemon's PATH): the archive, the image unpacked (APPTAINER_TMPDIR) and the
  // SIF. Unset means apptainer/ under the user's cache directory. Only for the apptainer runtime.
  string local_scratch_dir = 4 [(buf.validate.field).string.pattern = "^(/.*[^/])?$"];
  // The bound on converting one image and copying its SIF to the cluster, or on streaming its root
  // file system to the login node and making its squashfs there. Zero means an hour.
  double convert_timeout_seconds = 5 [(buf.validate.field).double.gte = 0];
  // What runs the containers on the compute nodes. Unset means apptainer.
  ContainerRuntime runtime = 6 [(buf.validate.field).enum.defined_only = true];
  // When set, allocations are reused: a container's allocation is kept when the container is
  // removed, for the next container of the scope (of this job or a later one) to claim, and it ends
  // once it has been idle, claimed by no container, for this long. Each allocation then asks for the
  // whole node (gres and exclusive) whatever it runs. Zero means no reuse: each container has an
  // allocation of its own, cancelled with it.
  double idle_release_seconds = 7 [(buf.validate.field).double.gte = 0];
  // The time limit of a reused allocation, at most the partition's: a container claims only an
  // allocation with its own limit and 10 minutes left. Zero means a day. Only with
  // idle_release_seconds.
  double allocation_limit_seconds = 8 [(buf.validate.field).double.gte = 0];
}

// Resources are what a placement gives every container it runs, by kind (ResourceKind). Each kind
// is a table of its own: [placements.<name>.resources.<kind>].
message Resources {
  GpuResource gpu = 1;
  KubernetesResource kubernetes = 2;
  // Read-only directories of the engine's machine, by name: a container sees each at
  // /vibesys/mounts/<name>. An empty table gives none.
  map<string, string> mounts = 3 [
    (buf.validate.field).map.keys.string.pattern = "^[a-z0-9][a-z0-9_-]{0,62}$",
    (buf.validate.field).map.values.string.pattern = "^/[^:,\"\\n\\r]*$"
  ];
  RocmResource rocm = 4;
}

// RocmResource passes the machine's AMD GPUs into the container, for tasks of the rocm backend: the
// kernel driver's devices (/dev/kfd and /dev/dri) and the video group under docker, and --rocm under
// Apptainer. An empty table gives them. A variable Slurm sets to name the GPUs it assigned
// (ROCR_VISIBLE_DEVICES, HIP_VISIBLE_DEVICES, GPU_DEVICE_ORDINAL, CUDA_VISIBLE_DEVICES) is passed on
// when it is set.
message RocmResource {}

// GpuResource passes GPUs into the container.
message GpuResource {
  // A docker --gpus value, such as "all" or "device=0,1".
  string devices = 1 [(buf.validate.field).string.pattern = "^[A-Za-z0-9=,:._/+-]+$"];
  // When set, the container runtime that passes the devices instead of --gpus, with the devices in
  // the runtime's variable.
  string runtime = 2 [(buf.validate.field).string.pattern = "^[a-z0-9._-]*$"];
}

// KubernetesResource gives the container a Kubernetes cluster: its kubeconfig, read-only, at the
// path KUBECONFIG names, the network that reaches the cluster, and the addresses of the registry
// and the image builder the cluster's images go through.
message KubernetesResource {
  // An absolute path on the engine's machine of the kubeconfig file.
  string kubeconfig = 1 [(buf.validate.field).string.pattern = "^/[^:,\"\\n\\r]*$"];
  // The image registry the cluster pulls from, such as localhost:5001. The container gets it as
  // VIBESYS_K8S_REGISTRY; empty sets nothing.
  string registry = 2 [(buf.validate.field).string.pattern = "^[A-Za-z0-9._:/@+-]*$"];
  // The image builder's address, such as tcp://127.0.0.1:1234. The container gets it as
  // VIBESYS_K8S_BUILDER; empty sets nothing.
  string builder = 3 [(buf.validate.field).string.pattern = "^[A-Za-z0-9._:/@+-]*$"];
  // The container's network mode (docker run --network), such as "host" for a cluster whose API
  // server listens on the machine's loopback address. Empty leaves the engine's default.
  string network = 4 [(buf.validate.field).string.pattern = "^([A-Za-z0-9][A-Za-z0-9_.-]*)?$"];
}

// LegacyDocker is the [docker] section of the earlier shape.
message LegacyDocker {
  // Unspecified means local.
  PlacementKind placement = 1 [(buf.validate.field).enum.defined_only = true];
  // A docker --gpus value; empty passes none.
  string gpus = 2 [(buf.validate.field).string.pattern = "^[A-Za-z0-9=,:._/+-]*$"];
  // When set, passes the GPUs with this runtime instead of --gpus. It needs gpus.
  string runtime = 3 [(buf.validate.field).string.pattern = "^[a-z0-9._-]*$"];
  map<string, string> mounts = 4 [
    (buf.validate.field).map.keys.string.pattern = "^[a-z0-9][a-z0-9_-]{0,62}$",
    (buf.validate.field).map.values.string.pattern = "^/[^:,\"\\n\\r]*$"
  ];
}
