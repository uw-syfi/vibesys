syntax = "proto3";
package vibesys.cli.v1;

import "buf/validate/validate.proto";
import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";
import "vibesys/cli/v1/environment.proto";

option go_package = "github.com/uw-syfi/vibesys/cli/gen/vibesys/cli/v1;cliv1";

// The task manifest, vibesys.input.toml, of task schema 0.2: a task of two images, the trusted task
// image and the agent's candidate image, or, without [candidate], a task of one image. vibesys-cli decodes the TOML file into TaskManifestV02 by
// its field names, refuses a key this message has no field for, naming the key, and holds the
// message to its protovalidate rules. This file is the only definition of the schema; the Go types
// are generated from it.
//
// Schema versions are MAJOR.MINOR strings, `version = "0.2"`. The single-image format of the
// earlier tasks is "0.1", which vibesys-cli still reads with its own reader (it has no message here
// yet). How the schema evolves (scripts/check_task_schema.py holds a change to these rules against
// the merge base, beside buf breaking, which already refuses a renamed or removed field):
//
// - Every manifest message carries the schema version it is (task_schema), and every field of it
//   and of the messages it holds the minor version that introduced the field
//   (task_schema_since_minor). The reader dispatches on the version a file declares.
// - While the major version is 0, any minor version may be incompatible: each 0.x version is a
//   message of its own (TaskManifestV02, with its sections TaskCandidateV02 and so on), and a reader
//   accepts exactly the 0.x versions it has messages for. A pre-1.0 format may change freely,
//   including an existing 0.x message; the check below does not hold it.
// - From 1.0 on, a minor version adds optional keys or sections and nothing else. A field added
//   since the base declares the message's current minor version, and adding one raises that minor
//   version by one. A manifest that declares M.N may set only the keys of M.0 to M.N, so the version
//   a task declares is the one it needs. An existing field's protovalidate rules do not change: a
//   tightening needs a new major version, and a loosening a reviewed waiver.
// - A major version is an incompatible change: a key removed or renamed, or a meaning changed. It is
//   a new message beside the old one (TaskManifestV1, TaskManifestV2), never an edit of it.

// TaskSchema is the schema version a manifest message is: its major version, and the newest minor
// version its fields belong to.
message TaskSchema {
  uint32 major = 1;
  uint32 minor = 2;
}

extend google.protobuf.MessageOptions {
  // The schema version of a manifest message: for major 0 the one version it is, and from 1.0 on
  // the newest minor version its fields belong to.
  TaskSchema task_schema = 51001;
}

extend google.protobuf.FieldOptions {
  // The minor version, of its message's major version, that introduced the field. A manifest that
  // declares an earlier minor version is refused when it sets the field, naming the key and the
  // minor version it needs.
  optional uint32 task_schema_since_minor = 51002;
}

// TaskManifestV02 is vibesys.input.toml of schema 0.2. The task's own Dockerfile, beside the manifest,
// builds the task image: the judge and the load generator, which the candidate cannot change. The
// candidate's Dockerfile, in the candidate's commit, builds the image its server runs in. The task
// container reaches the candidate only over HTTP, at VIBESYS_SERVICE_URL.
//
// It has every key of the single-image format 0.1, with the same meaning, except [evaluator] and the
// entrypoint and args of a command, which it refuses by name; and it adds an optional [candidate]. The
// sections 0.1 accepts without reading them are accepted the same way here, and so is [profile].
message TaskManifestV02 {
  option (task_schema) = {
    major: 0
    minor: 2
  };

  // The schema version, "0.2".
  string version = 1 [
    (task_schema_since_minor) = 2,
    (buf.validate.field).string.pattern = "^0\\.2$"
  ];
  // The compute stack the candidate targets, at most one: cpu (the default), cuda or rocm.
  repeated string backends = 2 [
    (task_schema_since_minor) = 2,
    (buf.validate.field).repeated.max_items = 1
  ];
  // The scored metric of a protocol 2 benchmark. Empty scores the first objective of
  // objectives.toml.
  string metric = 3 [
    (task_schema_since_minor) = 2,
    (buf.validate.field).string.max_len = 256
  ];
  // The candidate's image and server. Optional: a manifest without it is a task of one image, whose
  // commands run in the task image and own the system under test, as in 0.1.
  TaskCandidateV02 candidate = 4 [(task_schema_since_minor) = 2];
  // The check: run in the task container against the candidate's server; exit 0 passes. [check] is
  // the same section by its other name; a manifest has one of them.
  TaskCommandV02 accuracy = 5 [(task_schema_since_minor) = 2];
  // The benchmark: run in the task container against the candidate's server, once per sample.
  // [measure] is the same section by its other name; a manifest has one of them.
  TaskBenchmarkV02 benchmark = 6 [(task_schema_since_minor) = 2];
  // Retired: once the standard profile load of the profile job, which a command job in the task's
  // image replaced (submit command --image harness --wrap). Accepted, held to its shape, and not read,
  // so a manifest written for it still loads.
  TaskCommandV02 profile = 7 [(task_schema_since_minor) = 2];
  // What the task needs of the placement a job runs on.
  TaskEnvironmentV02 environment = 8 [(task_schema_since_minor) = 2];
  // A build, run in the task container from the checkout's root before the check.
  TaskBuildV02 build = 9 [(task_schema_since_minor) = 2];
  // [accuracy] by its other name.
  TaskCommandV02 check = 10 [(task_schema_since_minor) = 2];
  // [benchmark] by its other name.
  TaskBenchmarkV02 measure = 11 [(task_schema_since_minor) = 2];
  // The agent loop's metadata, which the optimize skill reads to choose its domain plugins.
  TaskAgentV02 agent = 12 [(task_schema_since_minor) = 2];

  // The sections below are the Python product's: vibesys-cli accepts them, as 0.1 does, without
  // reading them, so their keys are not held here.
  google.protobuf.Struct profile_guided = 13 [(task_schema_since_minor) = 2];
  google.protobuf.Struct resources = 14 [(task_schema_since_minor) = 2];
  google.protobuf.Struct workspace = 15 [(task_schema_since_minor) = 2];
  google.protobuf.Struct plan = 16 [(task_schema_since_minor) = 2];
  // `[catalogue]` is held as data here, because a field's type cannot change under buf breaking. Its
  // definition is TaskCatalogueV02, which the reader decodes it into (task.Catalogue) and refuses a
  // table that does not meet, naming the key.
  google.protobuf.Struct catalogue = 17 [(task_schema_since_minor) = 2];
  repeated google.protobuf.Struct comparison = 18 [(task_schema_since_minor) = 2];
  // A server of the task's own image that a job starts once and runs its samples against, instead
  // of each sample starting it. Optional: a manifest without it starts nothing between commands.
  // Only a task of one image has it: a task with [candidate] starts its candidate's server for
  // each command.
  TaskServiceV02 service = 19 [(task_schema_since_minor) = 2];
}

// TaskDomain is what an example task optimizes. A task names one as the value's name without its
// prefix, in lower case, with a hyphen for each underscore (domain = "llm-serving").
enum TaskDomain {
  TASK_DOMAIN_UNSPECIFIED = 0;
  TASK_DOMAIN_LLM_SERVING = 1;
  TASK_DOMAIN_DATA_STRUCTURES = 2;
  TASK_DOMAIN_DATABASES = 3;
  TASK_DOMAIN_MICROSERVICES = 4;
}

// ModelMaker is who made a served model; OTHER is a maker with no entry yet.
enum ModelMaker {
  MODEL_MAKER_UNSPECIFIED = 0;
  MODEL_MAKER_META = 1;
  MODEL_MAKER_QWEN = 2;
  MODEL_MAKER_DEEPSEEK = 3;
  MODEL_MAKER_ZHIPU = 4;
  MODEL_MAKER_MOONSHOT = 5;
  MODEL_MAKER_AI2 = 6;
  MODEL_MAKER_OPENAI = 7;
  MODEL_MAKER_OTHER = 8;
}

// TaskCatalogueV02 is the definition of the `[catalogue]` table, held in TaskManifestV02.catalogue as data: the facts a client words a task by. A key it has no
// field for is refused by name. There is no variant: a client shows the task's folder name.
message TaskCatalogueV02 {
  option (buf.validate.message).cel = {
    id: "catalogue.model_matches_domain"
    expression: "(this.domain == 1) == has(this.model) ? '' : 'domain: model is required for llm-serving and only for it'"
  };
  option (buf.validate.message).cel = {
    id: "catalogue.workload_matches_domain"
    expression: "(this.domain == 2) == has(this.workload) ? '' : 'domain: workload is required for data-structures and only for it'"
  };

  TaskDomain domain = 1 [
    (task_schema_since_minor) = 2,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
  TaskHardwareV02 hardware = 2 [
    (task_schema_since_minor) = 2,
    (buf.validate.field).required = true
  ];
  // Required for, and only for, llm-serving.
  TaskServedModelV02 model = 3 [(task_schema_since_minor) = 2];
  // Required for, and only for, data-structures.
  TaskWorkloadV02 workload = 4 [(task_schema_since_minor) = 2];
}

// TaskHardwareV02 is the hardware a task targets: `count` of `accelerator`, as a person would say it.
message TaskHardwareV02 {
  // The display name, for example "NVIDIA H100" or "CPU".
  string accelerator = 1 [
    (task_schema_since_minor) = 2,
    (buf.validate.field).string = {
      min_len: 1
      max_bytes: 80
    }
  ];
  uint32 count = 2 [
    (task_schema_since_minor) = 2,
    (buf.validate.field).uint32 = {
      gte: 1
      lte: 4096
    }
  ];
  AcceleratorVendor vendor = 3 [
    (task_schema_since_minor) = 2,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
}

// TaskServedModelV02 is the model an LLM-serving task serves.
message TaskServedModelV02 {
  string name = 1 [
    (task_schema_since_minor) = 2,
    (buf.validate.field).string = {
      min_len: 1
      max_bytes: 80
    }
  ];
  ModelMaker maker = 2 [
    (task_schema_since_minor) = 2,
    (buf.validate.field).enum = {
      defined_only: true
      not_in: [0]
    }
  ];
}

// TaskWorkloadV02 is the workload a data-structure task drives.
message TaskWorkloadV02 {
  string name = 1 [
    (task_schema_since_minor) = 2,
    (buf.validate.field).string = {
      min_len: 1
      max_bytes: 80
    }
  ];
  string description = 2 [
    (task_schema_since_minor) = 2,
    (buf.validate.field).string = {
      min_len: 1
      max_bytes: 400
    }
  ];
}

// TaskCard is what a client shows of a task. The daemon builds it from the task's files, which it
// alone reads, so a card is attested by the host and never sent by a client. Without [catalogue] the
// domain is unspecified and only the task, the heading and the objectives are set.
message TaskCard {
  // The task's name, as `--task` and a run name it.
  string task = 1 [(buf.validate.field).string = {
    min_len: 1
    max_bytes: 256
  }];
  TaskDomain domain = 2 [(buf.validate.field).enum.defined_only = true];
  // Absent without [catalogue.hardware].
  AcceleratorNeed hardware = 3;
  // The hardware as the task authored it, for example "AMD MI300X"; shown when the model is OTHER.
  string hardware_name = 4 [(buf.validate.field).string.max_bytes = 80];
  // LLM-serving tasks: the served model.
  string model_name = 5 [(buf.validate.field).string.max_bytes = 80];
  ModelMaker model_maker = 6 [(buf.validate.field).enum.defined_only = true];
  // Data-structure tasks: the workload.
  string workload_name = 7 [(buf.validate.field).string.max_bytes = 80];
  string workload_description = 8 [(buf.validate.field).string.max_bytes = 400];
  repeated CardObjective objectives = 9 [(buf.validate.field).repeated.max_items = 16];
  // The first heading of the task's OBJECTIVE.md; empty without one.
  string heading = 10 [(buf.validate.field).string.max_bytes = 200];
}

// CardObjective is one objective of a task, as a client lists it.
message CardObjective {
  string name = 1 [(buf.validate.field).string.min_len = 1];
  TaskObjectiveDirection direction = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string unit = 3 [(buf.validate.field).string.max_bytes = 64];
}

// TaskCandidateV02 is how the candidate's image is built from its commit, and how its server starts.
message TaskCandidateV02 {
  // The Dockerfile, a path in the candidate's checkout.
  string dockerfile = 1 [
    (task_schema_since_minor) = 2,
    (buf.validate.field).string.min_len = 1
  ];
  // The build context, a directory in the candidate's checkout. A .dockerignore in it is honored.
  string context = 2 [
    (task_schema_since_minor) = 2,
    (buf.validate.field).string.min_len = 1
  ];
  // The server, run in the candidate container from the checkout's root. ${PROJECT_ROOT} is the
  // checkout's root and ${PORT} the port the CLI chose for the job.
  repeated string serve = 3 [
    (task_schema_since_minor) = 2,
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.items.string.min_len = 1
  ];
  // The HTTP path polled on 127.0.0.1:${PORT} until it answers 2xx.
  string ready = 4 [
    (task_schema_since_minor) = 2,
    (buf.validate.field).string.pattern = "^/[^\\s]*$"
  ];
  // How long the server may take to become ready.
  uint32 startup_timeout_seconds = 5 [
    (task_schema_since_minor) = 2,
    (buf.validate.field).uint32 = {
      gte: 1
      lte: 86400
    }
  ];
  // The images the candidate's Dockerfile may start FROM, by the exact reference its first FROM
  // names. Empty allows any base.
  repeated string allowed_bases = 6 [
    (task_schema_since_minor) = 2,
    (buf.validate.field).repeated.items.string.min_len = 1
  ];
}

// TaskServiceV02 is [service]: the job-scoped server of a task of one image. A measure job starts it
// once, in a container of the task's image of its own, after the check, and runs every sample in a
// container beside it, which reaches it over HTTP at VIBESYS_SERVICE_URL. Before every sample that
// runs on a server an earlier command of the job used, the reset runs; a reset that fails fails the
// sample. A server that ended between two samples is started again, and the result records which
// samples ran on a server that was started for them, reused or restarted. The server ends with the
// job, however the job ends.
message TaskServiceV02 {
  // The server, run in the task's image from the checkout's root. ${PROJECT_ROOT} is the checkout's
  // root and ${PORT} the port the CLI chose for it, which the command must name.
  repeated string command = 1 [
    (task_schema_since_minor) = 2,
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.items.string.min_len = 1
  ];
  // The HTTP path polled on 127.0.0.1:${PORT} until it answers 2xx.
  string ready = 2 [
    (task_schema_since_minor) = 2,
    (buf.validate.field).string.pattern = "^/[^\\s]*$"
  ];
  // How long the server may take to become ready.
  uint32 startup_timeout_seconds = 3 [
    (task_schema_since_minor) = 2,
    (buf.validate.field).uint32 = {
      gte: 1
      lte: 86400
    }
  ];
  // The reset: a command of the task container, run against the server before every sample that
  // reuses it, which flushes what an earlier command left (such as a prefix cache) and confirms the
  // server is idle and healthy. Exit 0 lets the sample run.
  TaskCommandV02 reset = 4 [
    (task_schema_since_minor) = 2,
    (buf.validate.field).required = true
  ];
  // Whether the check runs against the server too. False, the default, runs the check as a task
  // without [service] runs it, and the server starts after it. True starts the server before the
  // check, in a check job as in a measure job, and a measure job's samples then reuse the server the
  // check ran against.
  bool share_with_accuracy = 5 [(task_schema_since_minor) = 2];
}

// TaskCommandV02 is a command of the task container, run from the checkout's root.
message TaskCommandV02 {
  repeated string command = 1 [
    (task_schema_since_minor) = 2,
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.items.string.min_len = 1
  ];
  // The command's time limit. Zero means 30 minutes.
  uint32 timeout_seconds = 2 [
    (task_schema_since_minor) = 2,
    (buf.validate.field).uint32.lte = 604800
  ];
}

// TaskBuildV02 is the build: its program is a name or a path in the checkout, never absolute.
message TaskBuildV02 {
  repeated string command = 1 [
    (task_schema_since_minor) = 2,
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.items.string.min_len = 1
  ];
  uint32 timeout_seconds = 2 [
    (task_schema_since_minor) = 2,
    (buf.validate.field).uint32.lte = 604800
  ];
}

// TaskBenchmarkV02 is the benchmark. With result_protocol = 2 it writes evaluator result protocol 2
// records to the path the CLI appends after --vs-output; otherwise [benchmark.result] says which flag
// takes the path of the JSON file it writes, and which field of it is the metric.
message TaskBenchmarkV02 {
  repeated string command = 1 [
    (task_schema_since_minor) = 2,
    (buf.validate.field).repeated.min_items = 1,
    (buf.validate.field).repeated.items.string.min_len = 1
  ];
  uint32 timeout_seconds = 2 [
    (task_schema_since_minor) = 2,
    (buf.validate.field).uint32.lte = 604800
  ];
  // The result protocol, 2, when the benchmark speaks it.
  optional uint32 result_protocol = 3 [
    (task_schema_since_minor) = 2,
    (buf.validate.field).uint32.const = 2
  ];
  TaskResultV02 result = 4 [(task_schema_since_minor) = 2];
  // Whether a measurement needs a passing check first. Only true is supported: a measurement is
  // saved only after its check passed.
  optional bool requires_accuracy = 5 [(task_schema_since_minor) = 2];
}

// TaskResultV02 is [benchmark.result]: the JSON file a benchmark of no result protocol writes.
message TaskResultV02 {
  // The flag the CLI passes the file's path after.
  string json_argument = 1 [(task_schema_since_minor) = 2];
  // The field of the file that is the metric.
  string metric = 2 [(task_schema_since_minor) = 2];
}

// TaskEnvironmentV02 is what the task needs of the placement a job runs on. For a task of two
// images, gpu is given to the candidate's container only, mounts to both containers read-only, and
// kubernetes to the task's container only.
message TaskEnvironmentV02 {
  // The resources a placement must give the containers, each once: gpu, kubernetes, mounts.
  repeated string needs = 1 [
    (task_schema_since_minor) = 2,
    (buf.validate.field).repeated.unique = true
  ];
  // The candidate is a container topology and needs a Docker daemon of its own.
  bool docker_in_docker = 2 [(task_schema_since_minor) = 2];
  // A Modal environment, which vibesys-cli cannot honor and refuses, as 0.1 does.
  google.protobuf.Struct modal = 3 [(task_schema_since_minor) = 2];
}

// TaskAgentV02 is [agent]: what the agent loop optimizes.
message TaskAgentV02 {
  // The domain, which chooses the domain plugins.
  string domain = 1 [
    (task_schema_since_minor) = 2,
    (buf.validate.field).string.min_len = 1
  ];
  // How the evaluator reaches the candidate: inprocess or service. Empty leaves it to the flag.
  string interface = 2 [
    (task_schema_since_minor) = 2,
    (buf.validate.field).string.pattern = "^(inprocess|service)?$"
  ];
}

// TaskObjectiveDirection is the way an objective improves.
enum TaskObjectiveDirection {
  TASK_OBJECTIVE_DIRECTION_UNSPECIFIED = 0;
  // Larger is better, written `direction = "max"`.
  TASK_OBJECTIVE_DIRECTION_MAX = 1;
  // Smaller is better, written `direction = "min"`.
  TASK_OBJECTIVE_DIRECTION_MIN = 2;
}

// TaskObjectives is objectives.toml, beside a task's manifest, of every task schema: what a
// benchmark's result is judged on. vibesys-cli decodes the TOML file into it by its field names,
// refuses a key this message has no field for, naming the key, and holds it to its protovalidate
// rules. A task with [pareto] and more than one objective is judged on all of them together; any
// other task is judged on the one metric it scores. A task with no file has no objectives, and its
// manifest must then say what it measures.
message TaskObjectives {
  option (buf.validate.message).cel = {
    id: "objectives.names_unique"
    expression: "this.objective.filter(o, this.objective.filter(p, p.name == o.name).size() > 1).size() == 0 ? '' : 'objective \"' + this.objective.filter(o, this.objective.filter(p, p.name == o.name).size() > 1)[0].name + '\" is declared twice'"
  };
  option (buf.validate.message).cel = {
    id: "objectives.noise_needs_pareto"
    expression: "!this.objective.exists(o, has(o.relative_noise)) || (has(this.pareto) && this.objective.size() > 1) ? '' : 'objective \"' + this.objective.filter(o, has(o.relative_noise))[0].name + '\": relative_noise needs a [pareto] section and more than one objective'"
  };

  // The objectives, each `[[objective]]`, in the order the file lists them. The first is the one a
  // protocol 2 benchmark scores unless the manifest names another.
  repeated TaskObjective objective = 1;
  // `[pareto]`: the task is judged on every objective together.
  TaskPareto pareto = 2;
}

// TaskObjective is one `[[objective]]`: a measured quantity and the way it improves.
message TaskObjective {
  option (buf.validate.message).cel = {
    id: "objective.relative_noise_range"
    expression: "!has(this.relative_noise) || (!this.relative_noise.isNan() && this.relative_noise >= 0.0 && this.relative_noise < 1.0) ? '' : 'objective \"' + this.name + '\": relative_noise must be at least 0 and less than 1, got ' + string(this.relative_noise)"
  };

  // The name of the quantity: the field of the benchmark's result, or the series of a protocol 2
  // record.
  string name = 1 [(buf.validate.field).string.min_len = 1];
  TaskObjectiveDirection direction = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // The relative change below which two measurements of this objective are one, for this objective
  // alone, instead of the [pareto] floor. Zero declares no floor. Absent takes the [pareto] floor.
  optional double relative_noise = 3;
  // What the quantity is counted in, such as "tok/s" or "ms": a label for people, which nothing
  // converts. Every measurement of the objective records it, so a bound declared for the objective
  // can be checked against the unit of the numbers it bounds. Absent declares none, and the
  // measurements then have an unknown unit. One line, without whitespace at its edges.
  string unit = 4 [(buf.validate.field).string = {
    max_bytes: 64
    pattern: "^([^\\s](.*[^\\s])?)?$"
  }];
}

// TaskPareto is `[pareto]`.
message TaskPareto {
  // The relative change below which two measurements of an objective are one, unless the objective
  // declares its own. At least 0 and less than 1.
  double relative_noise = 1 [(buf.validate.field).double = {
    finite: true
    gte: 0
    lt: 1
  }];
}
