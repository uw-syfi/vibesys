syntax = "proto3";
package vibesys.cli.v1;

import "vibesys/cli/v1/environment.proto";
import "vibesys/cli/v1/result.proto";

option go_package = "github.com/uw-syfi/vibesys/cli/gen/vibesys/cli/v1;cliv1";

// VerdictKind is the outcome of comparing a commit's samples with a base's.
enum VerdictKind {
  VERDICT_KIND_UNSPECIFIED = 0;
  VERDICT_KIND_BETTER = 1;
  VERDICT_KIND_WORSE = 2;
  VERDICT_KIND_WITHIN_NOISE = 3;
  VERDICT_KIND_INCONCLUSIVE = 4;
  // The overall verdict of a multi-objective comparison that is better on some objective and worse
  // on another. A single metric is never a tradeoff.
  VERDICT_KIND_TRADEOFF = 5;
}

// InconclusiveReason says why a comparison reached no verdict.
enum InconclusiveReason {
  INCONCLUSIVE_REASON_UNSPECIFIED = 0;
  // A side has fewer than 3 samples and the task declares no noise floor.
  INCONCLUSIVE_REASON_TOO_FEW_SAMPLES = 1;
  // The samples show no noise to test against: both sides are constant, or the candidate's mean is
  // zero so the ratio's noise is zero.
  INCONCLUSIVE_REASON_CONSTANT_SAMPLES = 2;
  // The sides measured different metrics.
  INCONCLUSIVE_REASON_METRIC_MISMATCH = 3;
  // The sides were measured under different task versions.
  INCONCLUSIVE_REASON_TASK_VERSION_MISMATCH = 4;
}

// Verdict is a pure function of the two sample sets, the metric's direction and the task's declared
// noise floor: the same samples always give the same verdict. Without a declared floor it is Welch's
// t test at 95% and needs at least 3 samples a side; with one, a difference must exceed 2 noises.
message Verdict {
  VerdictKind kind = 1;
  // Set only when kind is INCONCLUSIVE.
  InconclusiveReason reason = 2;
  uint32 candidate_samples = 3;
  uint32 base_samples = 4;
  double candidate_mean = 5;
  double base_mean = 6;
  // candidate_mean / base_mean, raw: not oriented by the metric's direction, and never rounded.
  double ratio = 7;
  // One standard error of the ratio. The verdict compares the gain against a multiple of it.
  double noise = 8;
}

// ObjectiveVerdict is the verdict on one objective of a multi-objective comparison: the comparison of
// that objective's samples alone, with its numbers.
message ObjectiveVerdict {
  Metric metric = 1;
  Verdict verdict = 2;
}

// Comparison is a verdict with what it compared.
message Comparison {
  string commit = 1;
  string against = 2;
  // For a single-metric task, the verdict on its metric. For a multi-objective (Pareto) task, the
  // overall verdict of `objectives`: BETTER when better on some objective and worse on none, WORSE
  // when worse on some and better on none, TRADEOFF when better on one and worse on another,
  // WITHIN_NOISE when within noise on all, and INCONCLUSIVE with the first inconclusive objective's
  // reason when any is. Only its kind, reason and sample counts are set then: its means, ratio and
  // noise are zero, and each objective's are in `objectives`.
  Verdict verdict = 3;
  // The one environment both sides were measured in. A comparison across environments is refused,
  // not given a verdict.
  EnvironmentFingerprint environment = 4;
  // The verdict on each objective of a multi-objective task, in the order the task declares them.
  // Empty for a single-metric task.
  repeated ObjectiveVerdict objectives = 5;
}
