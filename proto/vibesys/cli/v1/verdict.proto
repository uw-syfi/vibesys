syntax = "proto3";
package vibesys.cli.v1;

import "vibesys/cli/v1/environment.proto";
import "vibesys/cli/v1/result.proto";

option go_package = "github.com/uw-syfi/vibesys/cli/gen/vibesys/cli/v1;cliv1";

// VerdictKind is the outcome of comparing a commit's samples with a base's.
enum VerdictKind {
  VERDICT_KIND_UNSPECIFIED = 0;
  VERDICT_KIND_BETTER = 1;
  VERDICT_KIND_WORSE = 2;
  VERDICT_KIND_WITHIN_NOISE = 3;
  VERDICT_KIND_INCONCLUSIVE = 4;
  // The overall verdict of a multi-objective comparison that is better on some objective and worse
  // on another. A single metric is never a tradeoff.
  VERDICT_KIND_TRADEOFF = 5;
}

// InconclusiveReason says why a comparison reached no verdict.
enum InconclusiveReason {
  INCONCLUSIVE_REASON_UNSPECIFIED = 0;
  // A side has fewer than 3 samples and the task declares no noise floor.
  INCONCLUSIVE_REASON_TOO_FEW_SAMPLES = 1;
  // The samples show no noise to test against: both sides are constant, or the candidate's mean is
  // zero so the ratio's noise is zero.
  INCONCLUSIVE_REASON_CONSTANT_SAMPLES = 2;
  // The sides measured different metrics.
  INCONCLUSIVE_REASON_METRIC_MISMATCH = 3;
  // The sides were measured under different task versions.
  INCONCLUSIVE_REASON_TASK_VERSION_MISMATCH = 4;
}

// VerdictBound is the bar that decided a conclusive verdict.
enum VerdictBound {
  // The verdict is inconclusive, or was saved before verdicts named their bound.
  VERDICT_BOUND_UNSPECIFIED = 0;
  // The noise test: the gain against a multiple of the noise.
  VERDICT_BOUND_NOISE = 1;
  // The objective's declared min_gain. A better verdict names it when min_gain was the higher bar,
  // and a within-noise one when the gain passed the noise test but not min_gain.
  VERDICT_BOUND_MIN_GAIN = 2;
}

// SigmaSource is what set the relative variation of one run that a verdict's noise rests on.
enum SigmaSource {
  // The verdict is inconclusive for want of comparable numbers, or was saved before verdicts named
  // their sigma.
  SIGMA_SOURCE_UNSPECIFIED = 0;
  // The task's declared relative_noise: it was at least the spread the runs showed.
  SIGMA_SOURCE_DECLARED_FLOOR = 1;
  // The spread the runs showed: above the declared relative_noise, or the task declares none.
  SIGMA_SOURCE_OBSERVED_SPREAD = 2;
}

// Verdict is a pure function of the two sample sets, the metric's direction and the task's declared
// noise floor and minimum gain: the same samples always give the same verdict. Without a declared
// floor it is Welch's t test at 95% and needs at least 3 samples a side; with one, a difference must
// exceed 2 noises, at any sample count. A declared min_gain also holds a better verdict to a gain
// above it.
message Verdict {
  VerdictKind kind = 1;
  // Set only when kind is INCONCLUSIVE.
  InconclusiveReason reason = 2;
  uint32 candidate_samples = 3;
  uint32 base_samples = 4;
  double candidate_mean = 5;
  double base_mean = 6;
  // candidate_mean / base_mean, raw: not oriented by the metric's direction, and never rounded.
  double ratio = 7;
  // One standard error of the ratio. The verdict compares the gain against a multiple of it.
  double noise = 8;
  // The noise floor the task declared and the comparison used (relative_noise), zero for none.
  double relative_noise = 9;
  // The smallest relative gain the task declared to count as better (min_gain), zero for none.
  double min_gain = 10;
  // The bar that decided a conclusive verdict; unspecified for an inconclusive one.
  VerdictBound decided_by = 11;
  // How many noises a gain had to exceed: 2 under a declared relative_noise, else the Student-t
  // quantile for the samples' degrees of freedom. Zero for an inconclusive verdict.
  double critical = 12;
  // The relative gain the bar that decided the verdict stands at: critical times noise when decided_by
  // is NOISE, min_gain when it is MIN_GAIN. A better verdict's gain exceeded it, a worse one's fell
  // below its negative, and a within-noise one's did neither (or, decided by MIN_GAIN, exceeded the
  // noise bar but not it). Zero for an inconclusive verdict.
  double threshold = 13;
  // What set the noise: the declared relative_noise or the observed spread.
  SigmaSource sigma_source = 14;
  // The pooled relative deviation of one run from its own side's mean, as the runs showed it: zero
  // with two runs or fewer in all. It is the sigma when sigma_source is OBSERVED_SPREAD under a
  // declared relative_noise; without one, Welch's test weighs each side's own spread instead.
  double observed_spread = 15;
  // For a within-noise verdict whose gain is positive: the smallest number of samples a side at which
  // the same means and the same sigma would clear the bar and read better. Zero when no count
  // would (the gain does not exceed min_gain, or the count does not fit), and for any other verdict.
  uint32 samples_to_decide = 16;
}

// ObjectiveVerdict is the verdict on one objective of a multi-objective comparison: the comparison of
// that objective's samples alone, with its numbers.
message ObjectiveVerdict {
  Metric metric = 1;
  Verdict verdict = 2;
}

// Comparison is a verdict with what it compared.
message Comparison {
  string commit = 1;
  string against = 2;
  // For a single-metric task, the verdict on its metric. For a multi-objective (Pareto) task, the
  // overall verdict of `objectives`: BETTER when better on some objective and worse on none, WORSE
  // when worse on some and better on none, TRADEOFF when better on one and worse on another,
  // WITHIN_NOISE when within noise on all, and INCONCLUSIVE with the first inconclusive objective's
  // reason when any is. Only its kind, reason and sample counts are set then: its means, ratio and
  // noise are zero, and each objective's are in `objectives`.
  Verdict verdict = 3;
  // The one environment both sides were measured in. A comparison across environments is refused,
  // not given a verdict.
  EnvironmentFingerprint environment = 4;
  // The verdict on each objective of a multi-objective task, in the order the task declares them.
  // Empty for a single-metric task.
  repeated ObjectiveVerdict objectives = 5;
}
