syntax = "proto3";
package vibesys.cli.v1;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

option go_package = "github.com/uw-syfi/vibesys/cli/gen/vibesys/cli/v1;cliv1";

// EnvironmentKind is where a job's commands run.
enum EnvironmentKind {
  ENVIRONMENT_KIND_UNSPECIFIED = 0;
  ENVIRONMENT_KIND_HOST = 1;
  ENVIRONMENT_KIND_DOCKER = 2;
}

// BackendKind is the compute stack a task targets. It is closed: a new stack is a contract change.
enum BackendKind {
  BACKEND_KIND_UNSPECIFIED = 0;
  BACKEND_KIND_CPU = 1;
  BACKEND_KIND_CUDA = 2;
  BACKEND_KIND_ROCM = 3;
  BACKEND_KIND_METAL = 4;
  BACKEND_KIND_TRAINIUM = 5;
}

// AcceleratorVendor is who makes an accelerator. It is closed: a new vendor is a contract change, like
// BackendKind. A task names one in vibesys.input.toml as the value's name without its prefix, in lower
// case ([catalogue.hardware] vendor = "nvidia").
enum AcceleratorVendor {
  ACCELERATOR_VENDOR_UNSPECIFIED = 0;
  ACCELERATOR_VENDOR_NVIDIA = 1;
  ACCELERATOR_VENDOR_AMD = 2;
  ACCELERATOR_VENDOR_AWS = 3;
  ACCELERATOR_VENDOR_APPLE = 4;
  // No accelerator: the task and the place need only a processor.
  ACCELERATOR_VENDOR_CPU = 5;
}

// AcceleratorModel is which device of a vendor. It is closed. OTHER is a device with no entry yet: it
// is shown by the name it reported, and it never fits a need that names a model.
enum AcceleratorModel {
  ACCELERATOR_MODEL_UNSPECIFIED = 0;
  ACCELERATOR_MODEL_MI210 = 1;
  ACCELERATOR_MODEL_MI300A = 2;
  ACCELERATOR_MODEL_MI300X = 3;
  ACCELERATOR_MODEL_MI325X = 4;
  ACCELERATOR_MODEL_H100 = 5;
  ACCELERATOR_MODEL_B200 = 6;
  ACCELERATOR_MODEL_L4 = 7;
  ACCELERATOR_MODEL_A100 = 8;
  ACCELERATOR_MODEL_TRAINIUM2 = 9;
  ACCELERATOR_MODEL_APPLE_SILICON = 10;
  ACCELERATOR_MODEL_MI250 = 11;
  ACCELERATOR_MODEL_OTHER = 99;
}

// AcceleratorNeed is what a task wants of the place that evaluates it. Precedence of the fit rule, which
// the orchestrator's fit function states once: a place whose hardware is unknown or unreadable fits
// nothing, a CPU need included; an offer whose model is OTHER fits nothing, since a device the registry
// does not know cannot be shown to be the one wanted; otherwise a need fits an offer when the vendor is
// the same, the offer has at least `count` devices, and the model is the same or the need names none:
// a need of "NVIDIA GPU" (model unspecified) fits any known device of that vendor. A CPU need fits any
// place with a known state. The model must be a device of the vendor (see the rule below).
message AcceleratorNeed {
  option (buf.validate.message).cel = {
    id: "accelerator_need.model_of_vendor"
    message: "the model is not a device of the vendor (a CPU need names no model)"
    expression: "this.model == 0 ? true : this.model == 99 ? this.vendor != 5 : this.model in [1, 2, 3, 4, 11] ? this.vendor == 2 : this.model in [5, 6, 7, 8] ? this.vendor == 1 : this.model == 9 ? this.vendor == 3 : this.model == 10 ? this.vendor == 4 : false"
  };

  AcceleratorVendor vendor = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  // Unspecified: any model of the vendor.
  AcceleratorModel model = 2 [(buf.validate.field).enum.defined_only = true];
  uint32 count = 3 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 4096
  }];
}

// AcceleratorOffer is what a place gives: `count` devices of one model.
message AcceleratorOffer {
  option (buf.validate.message).cel = {
    id: "accelerator_offer.model_of_vendor"
    message: "the model is not a device of the vendor, or is missing"
    expression: "this.model != 0 && (this.model == 0 ? true : this.model == 99 ? this.vendor != 5 : this.model in [1, 2, 3, 4, 11] ? this.vendor == 2 : this.model in [5, 6, 7, 8] ? this.vendor == 1 : this.model == 9 ? this.vendor == 3 : this.model == 10 ? this.vendor == 4 : false)"
  };

  AcceleratorVendor vendor = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  AcceleratorModel model = 2 [(buf.validate.field).enum.defined_only = true];
  uint32 count = 3 [(buf.validate.field).uint32 = {
    gte: 1
    lte: 4096
  }];
  // The device as it reported itself, for a client to show beside an OTHER model.
  string device_name = 4 [(buf.validate.field).string.max_bytes = 128];
}

// ResourceKind is something a placement can give a job's container, and a task can need. It is
// closed: a new kind is a contract change. A task names one in vibesys.input.toml as the value's
// name without its prefix, in lower case ([environment] needs = ["kubernetes"]).
enum ResourceKind {
  RESOURCE_KIND_UNSPECIFIED = 0;
  // GPUs passed into the container.
  RESOURCE_KIND_GPU = 1;
  // Access to a Kubernetes cluster: its kubeconfig, the network that reaches it, and the addresses
  // of the registry and image builder it pulls from.
  RESOURCE_KIND_KUBERNETES = 2;
  // Read-only directories of the engine's machine.
  RESOURCE_KIND_MOUNTS = 3;
  // AMD GPUs passed into the container, through the ROCm kernel driver.
  RESOURCE_KIND_ROCM = 4;
}

// EnvironmentFingerprint identifies the environment a result was taken in. Two results are
// comparable, and a check pass is reusable, only when their fingerprints are equal, and the cache
// key takes the fingerprint as equality compares it. A docker environment is its kind, backend and
// image digest: the image pins every program a job runs, so where its container ran is no part of
// it. A host environment is its kind, backend and facts.
message EnvironmentFingerprint {
  EnvironmentKind kind = 1;
  BackendKind backend = 2;
  // The exact image digest ("sha256:..."), set for the docker environment and empty for host.
  string image_digest = 3;
  // Facts the environment pinned, by name: operating system, architecture, toolchain versions.
  // A host environment's facts identify it: equality is over the whole map, so the names it reports
  // are part of its contract. A docker environment's facts say where its container ran, for
  // diagnosis, and take no part in equality or the cache key: the machine, the placement of the
  // operator config ("placement") and what identifies each resource attached to it (such as
  // "gpu_model" or "kubernetes_server"). Placements are interchangeable, so results taken on
  // different placements are compared and reused.
  map<string, string> facts = 4;
}

// MachineFacts describes the machine a result was taken on.
message MachineFacts {
  string host_id = 1;
  string os = 2;
  string arch = 3;
  string cpu_model = 4;
  uint32 logical_cpus = 5;
  uint64 memory_bytes = 6;
}

// MachineLoad is the machine's load when it was sampled. The CLI reports it and never acts on it:
// load from outside VibeSys is neither detected nor prevented.
message MachineLoad {
  google.protobuf.Timestamp sampled_at = 1;
  double load_average_1m = 2;
  // The fraction of CPU time spent busy, from 0 to 1, over the sampling interval.
  double cpu_busy_fraction = 3;
  uint64 memory_available_bytes = 4;
}
