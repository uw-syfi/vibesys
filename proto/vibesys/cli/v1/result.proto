syntax = "proto3";
package vibesys.cli.v1;

import "buf/validate/validate.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "vibesys/cli/v1/environment.proto";

option go_package = "github.com/uw-syfi/vibesys/cli/gen/vibesys/cli/v1;cliv1";

// Direction says which way a metric improves.
enum Direction {
  DIRECTION_UNSPECIFIED = 0;
  DIRECTION_MAXIMIZE = 1;
  DIRECTION_MINIMIZE = 2;
}

message Metric {
  string name = 1;
  Direction direction = 2;
  // What the metric is counted in, such as "tok/s" or "ms", as the task's objectives.toml declares
  // it (TaskObjective.unit). A label for people: nothing converts it. Empty when the task declares
  // none, and in a result saved before units were kept: the unit is then unknown, which no reader
  // may take for a match with any other unit.
  string unit = 3 [(buf.validate.field).string.max_bytes = 64];
}

// Observation is a named series of auxiliary readings, such as latency, kept beside the scored
// metric. It is part of a verdict only when it is an objective of a multi-objective task.
message Observation {
  string name = 1;
  repeated double values = 2;
  // The headline number of the values: their mean, the number compare weighs for an objective, as
  // MeasureResult.value is for the scored metric. The daemon computes it, so no reader recomputes
  // it. Absent when there are no values, and from a daemon or a saved result older than this field.
  optional double value = 3;
  // What the series is counted in, as Metric.unit says it for an objective. Empty when unknown.
  string unit = 4 [(buf.validate.field).string.max_bytes = 64];
}

// Objectives is what a measurement of a multi-objective (Pareto) task is judged on: a task whose
// objectives.toml has a [pareto] section and more than one objective.
message Objectives {
  // Every objective, in the order the task declares them. The scored metric is one of them; the
  // samples of each other one are the observation of its name.
  repeated Metric metrics = 1;
  // The task's [pareto] relative_noise, the noise floor every objective is compared under. Zero
  // means none.
  double relative_noise = 2;
  // The objectives that declare a relative_noise of their own, which overrides the one above for
  // that objective (zero is a floor of none). An objective absent here uses relative_noise. Each
  // names an objective of metrics, once.
  repeated ObjectiveNoise noise = 3;
}

// ObjectiveNoise is the noise floor one objective is compared under, set in the task's
// objectives.toml as that objective's relative_noise.
message ObjectiveNoise {
  string name = 1;
  double relative_noise = 2;
}

// CheckResult is a passed correctness check. A failed check saves no result: its job is `failed`
// and its output is in the job's logs.
message CheckResult {
  google.protobuf.Duration duration = 1;
}

// TraceResult is a trace job whose [trace] command exited 0: where its reports are. A failed trace
// saves no result.
message TraceResult {
  // The artifacts directory of the trace command, relative to the repository's root when it is
  // inside it (the job's artifacts directory in the state directory, then the command's own, such
  // as 03-trace) and absolute otherwise.
  string artifacts_dir = 1 [(buf.validate.field).string.min_len = 1];
  // The names of the entries directly under the trace/ directory of artifacts_dir, sorted, such as
  // report.txt and tree.txt. Empty when the command left no trace/ directory.
  repeated string files = 2 [(buf.validate.field).repeated.max_items = 1024];
  // How long the trace command ran.
  google.protobuf.Duration duration = 3;
}

// MeasureResult is the official measurement of a commit.
message MeasureResult {
  option (buf.validate.message).cel = {
    id: "measure.sample_services_per_sample"
    expression: "this.sample_services.size() == 0 || this.sample_services.size() == this.samples.size() ? '' : 'sample_services has ' + string(this.sample_services.size()) + ' entries for ' + string(this.samples.size()) + ' samples'"
  };

  Metric metric = 1;
  // The scored metric's samples, in the order they were taken.
  repeated double samples = 2;
  repeated Observation observations = 3;
  // The check pass this measurement relies on, whether it ran in the same job or was reused.
  string check_job_id = 4;
  // The headline number of the measurement: the aggregate of the samples that compare uses (their
  // mean). The daemon computes it, so no reader recomputes it.
  double value = 5;
  // Set for a measurement of a multi-objective task, and absent otherwise.
  Objectives objectives = 6;
  // For a task with a job-scoped server ([service] in its manifest), the server each sample ran on,
  // in the order of samples: one per sample. Empty for any other task, and in a result saved before
  // this field; a measurement that pools both has SAMPLE_SERVICE_UNSPECIFIED for the samples of the
  // results that recorded none.
  repeated SampleService sample_services = 7 [(buf.validate.field).repeated.items.enum.defined_only = true];
}

// SampleService is the server a sample of a task with a job-scoped server ran on. A sample that is
// the first command on its server ran on a server that nothing had used yet; any other ran on one
// that earlier commands of the job used, after the task's reset.
enum SampleService {
  // The sample ran on no job-scoped server, or its result does not say.
  SAMPLE_SERVICE_UNSPECIFIED = 0;
  // The first command on the server the job started.
  SAMPLE_SERVICE_STARTED = 1;
  // A server an earlier command of the job used, after the task's reset.
  SAMPLE_SERVICE_REUSED = 2;
  // The first command on a server the job started again, because the one an earlier command used
  // had ended.
  SAMPLE_SERVICE_RESTARTED = 3;
}

// Measurement is a commit's measurements of one kind pooled into one: a measure job that tops up
// an earlier one adds its samples to the same measurement, as compare counts them.
message Measurement {
  string commit = 1;
  string task_version = 2;
  EnvironmentFingerprint environment = 3;
  // The measure jobs pooled, oldest first.
  repeated string job_ids = 4;
  // Every job's samples and observations in the jobs' order, their headline value, and the
  // newest job's check.
  MeasureResult measure = 5;
}

// Result is one saved outcome of a job. A result is immutable once saved.
message Result {
  // The job that produced it, which is also the result's identity.
  string job_id = 1;
  // The cache key it answers.
  string key = 2;
  string task = 3;
  string task_version = 4;
  // The full commit the result was taken from.
  string commit = 5;
  uint32 schema_version = 6;
  EnvironmentFingerprint environment = 7;
  MachineFacts machine = 8;
  MachineLoad load = 9;
  google.protobuf.Timestamp recorded_at = 10;
  oneof outcome {
    CheckResult check = 11;
    MeasureResult measure = 12;
    TraceResult trace = 14;
  }
  // For a task of two images, the exact digest of the candidate's image the commands ran against.
  // It is recorded and never part of the key: a dependency the candidate changes is part of the
  // candidate, as its code is.
  string candidate_image = 13;
}
