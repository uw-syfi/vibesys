  }];
  // Bucket `i` is `[edges[i], edges[i + 1])`. Strictly increasing. Whole seconds between 1970
  // and the end of year 9999, the range a host's calendar can hold.
  repeated google.protobuf.Timestamp edges = 3 [(buf.validate.field).repeated = {
    min_items: 2
    max_items: 100
    items: {
      timestamp: {
        gte: {seconds: 0}
        lte: {seconds: 253402300799}
      }
    }
  }];
  google.protobuf.Timestamp now = 4 [(buf.validate.field) = {
    required: true
    timestamp: {
      gte: {seconds: 0}
      lte: {seconds: 253402300799}
    }
  }];
}

