  UsageLimitsStatus status = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  optional UsageAccountLimits limits = 3;
  // Why the last read failed, when it did; set with `STALE` and with `UNAVAILABLE`.
  optional UsageLimitsUnavailable unavailable = 4 [(buf.validate.field).enum.defined_only = true];
}

message UsageLimitsResponse {
  string request_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  repeated UsageProviderLimits providers = 2 [(buf.validate.field).repeated.max_items = 8];
  google.protobuf.Timestamp read_at = 3 [(buf.validate.field).required = true];
}

// Replace the prices a person set on this host. The book is saved whole, against the revision it
// was read at: when the host's revision has moved the host changes nothing and answers with its
// book, so two clients editing at once cannot overwrite each other unseen. A request that equals
// the host's book is saved already and changes nothing, so a retry after an unknown outcome is
// safe.
message UsagePricesSaveRequest {
  option (buf.validate.message).cel = {
    id: "usage_prices_save.distinct"
    message: "a model is overridden once and aliased once"
    expression: "this.overrides.map(o, o.model).unique() && this.aliases.map(a, a.from).unique()"
  };
  string request_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  uint64 base_revision = 2;
  repeated UsageRateOverride overrides = 3 [(buf.validate.field).repeated.max_items = 256];
  repeated UsageAlias aliases = 4 [(buf.validate.field).repeated.max_items = 256];
}
message UsagePricesSaveResponse {
  string request_id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
  // The host's book after the request: the saved one, or the one that moved.
  UsagePriceBook prices = 2 [(buf.validate.field).required = true];
  bool saved = 3;
}
