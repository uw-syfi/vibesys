  optional uint32 ideas = 1;
  optional double adopted_ratio = 2 [(buf.validate.field).double.finite = true];
  optional double best_so_far_ratio = 3 [(buf.validate.field).double.finite = true];
  optional double duration_s = 4 [(buf.validate.field).double = {
    finite: true
    gte: 0
  }];
