# Each library exposes only its `api` subpackage and its submodules. External
# modules must import through that surface, never from the package root or
# internal modules. Tests are outside tach scope.
[[interfaces]]
expose = ["api", "api\\..*"]
from = ["vs_agent"]

[[interfaces]]
expose = ["api", "api\\..*"]
from = ["vs_evaluator_protocol"]

[[interfaces]]
expose = ["api", "api\\..*"]
from = ["vs_github"]

[[interfaces]]
expose = ["api", "api\\..*"]
from = ["vs_issue_tracker"]

[[interfaces]]
expose = ["api", "api\\..*"]
from = ["vs_loop_state"]

[[interfaces]]
expose = ["api", "api\\..*"]
from = ["vs_project"]

[[interfaces]]
expose = ["api", "api\\..*"]
from = ["vs_prompts"]

[[interfaces]]
expose = ["api", "api\\..*"]
from = ["vs_runtime"]

[[interfaces]]
expose = ["ResumeRef", "RoundSummary", "RunRequest", "RunResult", "RunStatus", "RunView"]
from = ["vibesys.run.contracts"]

[[interfaces]]
expose = ["agent_options", "evolve", "evolve\\..*", "gates", "hypothesis", "hypothesis\\..*", "issue_queue", "issue_queue\\..*", "metrics", "multi", "multi\\..*", "profile_focus", "profile_focus\\..*", "profilers", "review", "single", "single\\..*"]
from = ["vibesys.orchestration"]

[[interfaces]]
expose = ["AgentInput", "BenchmarkCommand", "BenchmarkResult", "EnvironmentInput", "EVALUATOR_SRC_DIRNAME", "EvaluatorInput", "InputBundle", "InputCommand", "InputManifest", "InputSynthesisError", "MANIFEST_NAME", "ModalEnvironmentInput", "PROTOCOL_OUTPUT_FLAG", "ProfileGuidedInput", "SynthesizedInputSpec", "WorkspaceInput", "WorkspaceSource", "benchmark_output_argument", "load_input_bundle", "load_project_task", "render_input_manifest", "synthesize_input_bundle"]
from = ["vibesys.inputs"]

[[interfaces]]
expose = ["OrchestrationResumeDecision", "skills", "steering"]
from = ["vibesys.orchestration"]

[[interfaces]]
expose = ["api", "api\\..*"]
from = ["vs_sandbox"]

[[modules]]
path = "vibesys.orchestration.resume"
layer = "orchestration_host"
depends_on = ["vs_project", "vibesys.errors", "vs_runtime"]

[[modules]]
path = "vibesys.orchestration.steering"
