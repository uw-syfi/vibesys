[[modules]]
path = "server.runtime"
depends_on = ["server.read_model", "server.settings", "server.chat", "server.events", "server.execution", "server.journal", "vibesys", "vibesys.api", "vibesys.render", "vibesys.run", "server.integration", "server.api", "server.controller", "server.transport", "server.diagnostics"]

[[modules]]
path = "server.settings"
