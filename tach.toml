# Architecture ratchet: freezes the Python module graph as of today.
# `uv run tach check` fails if any module gains a dependency not listed here.
# To add an edge on purpose, edit `depends_on` in the same PR so a reviewer sees
# it. The goal is to only ever remove edges. `tach sync` regenerates
# `depends_on` from the code; review its diff before committing.
#
# Scope: src/ (entrypoints, server, vibesys) and every libs/*/src. sdk/ is out.
# Tach is the single boundary tool; there is no other import checker.
#
# Modeling: `vibesys` is a module whose children (`vibesys.agents`, ...) are
# also modules. tach assigns each file to its deepest module, so `vibesys` means
# the top-level vibesys/*.py files (config, context, schemas, ...). `server` is
# modeled the same way: `server.api`, `server.runtime`, ... are modules, and
# bare `server` is its package `__init__`.
#
# Cycles are forbidden (`forbid_circular_dependencies = true`). The `vibesys`
# core modules are ordered by their explicit edges, bottom to top: `vibesys`
# (top-level vibesys/*.py: config, schemas, ...); then backends, evaluators,
# prompts, render, skypilot; then domains; then sandbox; then run; then
# `vibesys.context` (per-run lifecycle context, imported only by loops and
# entrypoints); then loops; `vibesys.api` is the facade on top. Do not add an
# upward edge; move the shared code down instead.
#
# Tach `layers` are not used. Every edge is listed, including those of
# `entrypoints` and each `server.*` module. Order is enforced by the explicit
# edges: `server.runtime` sits on top, then transport, api, integration, chat,
# controller, execution, journal, events, diagnostics at the bottom; a lower
# module must not list a higher one. `entrypoints` is the composition root: it reaches core only
# through the `vibesys.api` facade, for both the server path and the headless
# path, so it lists no core-internal module. Upward imports (core importing
# server/entrypoints, server importing entrypoints) fail because the edge is
# undeclared.
#
# Libs form a DAG by review: every lib edge is explicit here. The edges are
# `vs_project` -> `vs_loop_state`, `vs_agent` -> {`vs_sandbox`,
# `vs_loop_state`, `vs_project`}, and `vs_issue_tracker` -> `vs_github` for its
# GitHub-backed tracker and progress-log implementations.
# `vs_runtime` owns the run mechanisms and depends only on lower mechanism
# libraries. Reject any upward lib-to-application edge.

source_roots = [
    "src",
    "libs/vs-evaluator-protocol/src",
    "libs/vs-github/src",
    "libs/vs-issue-tracker/src",
    "libs/vs-loop-state/src",
    "libs/vs-project/src",
    "libs/vs-prompts/src",
    "libs/vs-runtime/src",
    "libs/vs-sandbox/src",
    "libs/vs-agent/src",
]
exclude = ["**/tests", "**/__pycache__", "docs", "examples", "sdk", "resources", "build", "dist", ".venv"]
# Also freeze imports that exist only under TYPE_CHECKING.
ignore_type_checking_imports = false
forbid_circular_dependencies = true

# Orchestration-simplification target direction (loops > search >
# orchestration host > prompts + lower libs), enforced only where a module
# already carries a `layer` field below (`entrypoints`/`server`/`vibesys.api`
# stay unlayered; their order is still pinned by the explicit edges above).
# `vibesys.orchestration.prompts` (templates + renderer) sits with policy,
# other mechanics libraries: the host and lower layers render prompts, they
# don't hand policy to the template layer, so `prompts` is a leaf every layer
# above it may reach downward into.
# `layers_explicit_depends_on = true` keeps this ratchet's rule that every
# edge, same-layer or cross-layer, must still be listed in `depends_on`;
# layers add one more check on top: no module may list a dependency on a
# module in a strictly higher layer.
layers = ["loops", "roles_search", "orchestration_host", "prompts_and_lower_libs"]
layers_explicit_depends_on = true

