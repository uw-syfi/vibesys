depends_on = ["vibesys", "vibesys.agents", "vibesys.domains", "vibesys.evaluators", "vibesys.loops", "vibesys.run", "vibesys.sandbox", "vs_agent", "vs_loop_state", "vs_project", "vs_sandbox"]

