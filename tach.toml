# Architecture ratchet: enforces the Python module graph.
# `uv run tach check` fails on an import that is undeclared or violates a layer.
# To add an edge on purpose, edit `depends_on` in the same PR so a reviewer sees
# it. The goal is to only ever remove edges. `tach sync` regenerates
# `depends_on` from the code; review its diff before committing.
#
# Scope: src/ (entrypoints, server, vibesys) and every libs/*/src. sdk/ is out.
# Tach is the single boundary tool; there is no other import checker.
#
# Modeling: `vibesys` children (`vibesys.agents`, ...) are modules, and each
# top-level `vibesys/*.py` file is its own module (`vibesys.config`,
# `vibesys.schemas`, ...); bare `vibesys` is the package `__init__`. `server`
# is modeled the same way: `server.api`, `server.runtime`, ... are modules, and
# bare `server` is its package `__init__`.
#
# Layers, top to bottom: `entrypoints`, `server` (bare `server` and every
# `server.*`), `vibesys` (every `vibesys*` module, including the per-file root
# modules and `vibesys.context`), `libs` (all `vs_*` libs). A module may import
# from its own layer or a lower one. Layers therefore forbid core -> server,
# server -> entrypoints, libs -> core, and anything -> entrypoints.
#
# Everything finer is `depends_on` plus `forbid_circular_dependencies`: every
# same-layer edge (inside server, inside vibesys, between libs) must be listed,
# and every module, including each root file, is pinned (`depends_on = []` for
# leaves). Cross-layer downward edges need no entry.
#
# Cycles are forbidden (`forbid_circular_dependencies = true`). Do not add an
# upward edge; move the shared code down instead.
#
# Libs form a DAG by review: every lib edge is explicit here, and only
# `vs_project` -> `vs_loop_state` exists. Reject any other lib-to-lib edge.

source_roots = [
    "src",
    "libs/vs-evaluator-protocol/src",
    "libs/vs-feature-flags/src",
    "libs/vs-github/src",
    "libs/vs-issue-board/src",
    "libs/vs-loop-state/src",
    "libs/vs-project/src",
    "libs/vs-prompts/src",
    "libs/vs-sandbox/src",
]
exclude = ["**/tests", "**/__pycache__", "docs", "examples", "sdk", "resources", "build", "dist", ".venv"]
# Also freeze imports that exist only under TYPE_CHECKING.
ignore_type_checking_imports = false
forbid_circular_dependencies = true

layers = ["entrypoints", "server", "vibesys", "libs"]

[[modules]]
path = "entrypoints"
layer = "entrypoints"
depends_on = []

[[modules]]
path = "server"
layer = "server"
depends_on = []

