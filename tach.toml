[[modules]]
path = "server.tool_payloads"
depends_on = ["server.events"]

[[modules]]
path = "vibesys"
depends_on = ["vs_feature_flags"]

[[modules]]
# The narrow public facade over core (see the vibesys.api boundary plan): the
# only vibesys.* module entrypoints/server are meant to import once later
# waves repoint them. Reaches core internals directly, which is what makes it
# the one place allowed to.
