# Architecture ratchet: freezes the Python module graph as of today.
# `uv run tach check` fails if any module gains a dependency not listed here.
# To add an edge on purpose, edit `depends_on` in the same PR so a reviewer sees
# it. The goal is to only ever remove edges. `tach sync` regenerates
# `depends_on` from the code; review its diff before committing.
#
# Scope: src/ (entrypoints, server, vibesys) and every libs/*/src. sdk/ is out.
# Tach is the single boundary tool; there is no other import checker.
#
# Modeling: `vibesys` is a module whose children (`vibesys.agents`, ...) are
# also modules. tach assigns each file to its deepest module, so `vibesys` means
# the top-level vibesys/*.py files (config, context, schemas, ...). `server` is
# modeled the same way: `server.api`, `server.runtime`, ... are modules, and
# bare `server` is its package `__init__`.
#
# Cycles are forbidden (`forbid_circular_dependencies = true`). The core layers,
# bottom to top: `vibesys` (top-level vibesys/*.py: config, schemas, ...); then
# backends, evaluators, prompts, render, skypilot; then agents and domains;
# then sandbox; then run; then `vibesys.context` (per-run lifecycle context,
# imported only by loops and entrypoints); then loops. Do not add an upward
# edge; move the shared code down instead.
#
# No layers. Every edge is listed, including those of `entrypoints` and each
# `server.*` module. Order is enforced by the explicit edges: `server.runtime`
# sits on top, then transport, api, integration, chat, controller, execution,
# journal, events, diagnostics at the bottom; a lower module must not list a
# higher one. `entrypoints` is the composition root: it reaches core only
# through the `vibesys.api` facade, for both the server path and the headless
# path, so it lists no core-internal module. Upward imports (core importing
# server/entrypoints, server importing entrypoints) fail because the edge is
# undeclared.
#
# Libs form a DAG by review: every lib edge is explicit here. The edges are
# `vs_project` -> `vs_loop_state` and `vs_agent` -> {`vs_sandbox`,
# `vs_loop_state`, `vs_project`} (vs_agent constructs agents over sandboxes,
# reads loop-state schemas, and persists agent sessions to project state).
# Reject any other lib-to-lib edge.

source_roots = [
    "src",
    "libs/vs-evaluator-protocol/src",
    "libs/vs-feature-flags/src",
    "libs/vs-github/src",
    "libs/vs-issue-board/src",
    "libs/vs-loop-state/src",
    "libs/vs-project/src",
    "libs/vs-prompts/src",
    "libs/vs-sandbox/src",
    "libs/vs-agent/src",
]
exclude = ["**/tests", "**/__pycache__", "docs", "examples", "sdk", "resources", "build", "dist", ".venv"]
# Also freeze imports that exist only under TYPE_CHECKING.
ignore_type_checking_imports = false
forbid_circular_dependencies = true

# Orchestration-simplification target direction (loops > roles/search/prompts >
# orchestration host > lower libs), enforced only where a module already
# carries a `layer` field below (`entrypoints`/`server`/`vibesys.api`/
# `vibesys.agent_run` stay unlayered; their order is still pinned by the
# explicit edges above). `layers_explicit_depends_on = true` keeps this
# ratchet's rule that every edge, same-layer or cross-layer, must still be
# listed in `depends_on`; layers add one more check on top: no module may list
# a dependency on a module in a strictly higher layer. Known violations of the
# target direction that already exist in code (kept, not fixed, by design):
# `vibesys.sandbox` and `vibesys.domains` (lower_libs) import
# `vibesys.prompts` (roles_search_prompts), and `vibesys.orchestration.agents`
# (orchestration_host) imports `vibesys.prompts` (roles_search_prompts) too.
# `vibesys.roles` (roles_search_prompts) also imports `vibesys.search.hypothesis`
# and `vibesys.search.population` (same layer); roles and search should not
# import each other per the target design, but this edge is already needed.
layers = ["loops", "roles_search_prompts", "orchestration_host", "lower_libs"]
layers_explicit_depends_on = true

