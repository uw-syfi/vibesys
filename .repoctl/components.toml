# Repository component ownership, discovery, and change impact policy.
default_base = "main"
jobs = ["python", "clients", "examples", "dockerfiles", "agent_image", "real_tiers", "evaluators", "impact", "stitch", "proto", "gateway", "cli", "orchestrator", "desktop_path", "managed_install"]

ignored_roots = ["website", "third_party", ".agents", ".claude", ".claude-plugin", ".github/ISSUE_TEMPLATE", ".github/DISCUSSION_TEMPLATE"]
ignored_files = ["AGENTS.md", "CLAUDE.md", "LICENSE", "agent.toml.example", ".env.example", ".gitattributes", ".gitignore", ".github/CODEOWNERS", ".github/pull_request_template.md", ".github/delegated-merge.md"]

[[discoveries]]
adapter = "tach"
config = "tach.toml"
class = "python_module"
id_prefix = "python:"
job = "python"
ownership_group = "python_modules"

[[discoveries]]
adapter = "package_json"
manifest_glob = "clients/libs/*/package.json"
class = "workspace_package"
id_prefix = "pnpm:"
job = "clients"
ownership_group = "workspace_packages"
workspace_prefix = "workspace:"
dependency_fields = ["dependencies", "devDependencies", "optionalDependencies"]

[[discoveries]]
adapter = "package_json"
manifest_glob = "clients/apps/*/package.json"
class = "workspace_package"
id_prefix = "pnpm:"
job = "clients"
ownership_group = "workspace_packages"
workspace_prefix = "workspace:"
dependency_fields = ["dependencies", "devDependencies", "optionalDependencies"]

[[discoveries]]
adapter = "manifest_directories"
class = "native"
id_prefix = "native:"
target = true
ownership_group = "native_manifests"
manifests = { "Cargo.toml" = "rust", "go.mod" = "go" }
scope_roots = ["resources/evaluators", "sdk/vs-evaluator", "sdk/vibesys-evaluator"]
selected_roots = [
  "examples/data-structures/ordered-map",
  "examples/data-structures/prioqueue",
  "examples/data-structures/repositories/queue-rs",
  "examples/data-structures/stack",
  "examples/data-structures/unordered-map",
  "resources/evaluators/ordered-map",
  "resources/evaluators/ordered-map/native_runner",
  "resources/evaluators/priority-queue",
  "resources/evaluators/priority-queue/native_runner",
  "resources/evaluators/queue",
  "resources/evaluators/queue/native_runner",
  "resources/evaluators/stack",
  "resources/evaluators/stack/native_runner",
  "resources/evaluators/unordered-map",
  "resources/evaluators/unordered-map/native_runner",
  "sdk/vibesys-evaluator/examples/go-bench",
  "sdk/vibesys-evaluator/examples/kv-store/generator",
  "sdk/vibesys-evaluator/examples/kv-store/oracle",
  "sdk/vibesys-evaluator/go",
  "sdk/vs-evaluator/vseval",
]
selected_jobs = ["evaluators"]

# Every example Dockerfile is built when it, or a file in its directory (the build context), changes.
# `scope_roots` makes discovery fail for a Dockerfile under examples/ that is neither built nor
# excluded below, so a new task Dockerfile has to choose. An excluded root names why a CI runner
# cannot build it; it is still owned, but selects no job. The `dockerfile_contexts` collection holds
# the built directories a change selects, one matrix leg each (the `example-dockerfiles` CI job).
[[discoveries]]
adapter = "manifest_directories"
class = "dockerfile"
id_prefix = "dockerfile:"
ownership_group = "example_dockerfiles"
manifests = { "Dockerfile" = "docker" }
scope_roots = ["examples"]
selected_roots = [
  "examples/data-structures/kvstore-default/.vibesys/tasks/default",
  "examples/data-structures/ordered-map/.vibesys/tasks/mw",
  "examples/data-structures/ordered-map/.vibesys/tasks/point-heavy",
  "examples/data-structures/ordered-map/.vibesys/tasks/range-heavy",
  "examples/data-structures/ordered-map/.vibesys/tasks/swmr",
  "examples/data-structures/prioqueue/.vibesys/tasks/mpmc",
  "examples/data-structures/prioqueue/.vibesys/tasks/mpsc",
  "examples/data-structures/prioqueue/.vibesys/tasks/spmc",
  "examples/data-structures/prioqueue/.vibesys/tasks/spsc",
  "examples/data-structures/repositories/queue-rs/.vibesys/tasks/mpmc",
  "examples/data-structures/repositories/queue-rs/.vibesys/tasks/mpsc",
  "examples/data-structures/repositories/queue-rs/.vibesys/tasks/spsc",
  "examples/data-structures/repositories/queue-rs/.vibesys/tasks/verus-mpmc-open",
  "examples/data-structures/stack/.vibesys/tasks/mpmc",
  "examples/data-structures/stack/.vibesys/tasks/mpsc",
  "examples/data-structures/stack/.vibesys/tasks/spmc",
  "examples/data-structures/stack/.vibesys/tasks/spsc",
  "examples/data-structures/unordered-map/.vibesys/tasks/mw",
  "examples/data-structures/unordered-map/.vibesys/tasks/swmr",
  "examples/database/differential-dataflow/.vibesys/tasks/default",
  "examples/database/kv-store/.vibesys/tasks/default",
  "examples/model-serving/qwen3.5-397b-a17b-mi300a-bespoke/.vibesys/tasks/load-ramp",
]
selected_jobs = ["dockerfiles"]

[discoveries.excluded_roots]
"examples/model-serving/Llama-3-8B-trn2/.vibesys/tasks/default" = "builds FROM the Trainium Neuron deep-learning image passed as BASE_IMAGE, a multi-gigabyte base that needs a Neuron host to be useful and is not pulled on a CI runner"
"examples/model-serving/qwen3.5-9b-mi210/.vibesys/tasks/agentx" = "builds FROM the vibesys-evaluator-llm-serving image at its release tag, which exists only once the evaluator release publishes it; the release workflow builds and smoke-tests that image itself"
"examples/model-serving/qwen3.6-35b-a3b/.vibesys/tasks/mi2104x-agentx" = "builds FROM the vibesys-evaluator-llm-serving release image on ghcr.io, pinned by digest, which ghcr.io refuses to an anonymous pull; the release workflow builds and smoke-tests that image itself"
"examples/model-serving/qwen3.6-35b-a3b/.vibesys/tasks/mi300x-agentx" = "builds FROM the vibesys-evaluator-llm-serving release image on ghcr.io, pinned by digest, which ghcr.io refuses to an anonymous pull; the release workflow builds and smoke-tests that image itself"
"examples/model-serving/qwen3.6-35b-a3b/.vibesys/tasks/mi2508x-tracelab-scale" = "compiles Request Factory's session_runner from source (a Rust toolchain, a git fetch of the pinned revision and a crates.io dependency build), which does not fit a CI runner's time budget; the task image is built and run by vibesys-cli"
"examples/model-serving/qwen3.6-35b-a3b/.vibesys/tasks/mi2104x-tracelab" = "compiles Request Factory's session_runner from source (a Rust toolchain, a git fetch of the pinned revision and a crates.io dependency build), which does not fit a CI runner's time budget; the task image is built and run by vibesys-cli"
"examples/model-serving/qwen3.6-35b-a3b/.vibesys/tasks/mi300x-tracelab" = "compiles Request Factory's session_runner from source (a Rust toolchain, a git fetch of the pinned revision and a crates.io dependency build), which does not fit a CI runner's time budget; the task image is built and run by vibesys-cli"
"examples/model-serving/qwen3.5-9b-mi210/engine" = "builds FROM a ROCm PyTorch image (tens of GB) and installs a ROCm build of torch, which does not fit a CI runner disk or its time budget"
"examples/model-serving/images/rocm-mi30x-engine-free" ="builds FROM the SGLang ROCm image (about 25 GB) and its verify step imports a ROCm build of torch, which does not fit a CI runner disk or its time budget"

[[collections]]
name = "dockerfile_contexts"
class = "dockerfile"
field = "root"
selected_only = true

[[collections]]
name = "native_targets"
class = "native"
field = "root"
selected_only = true

[[collections]]
name = "native_languages"
class = "native"
field = "language"
selected_only = true

[[collections]]
name = "pnpm_packages"
class = "workspace_package"
field = "name"

[[components]]
id = "python_support"
class = "python_support"
job = "python"
# Central tests and project tooling are outside Tach's source roots. The committed goldens under
# proto/testdata have no input hash, so the Python tests that compare them with what the converter
# writes now run when one changes.
roots = ["tests", "libs", "sdk", "scripts", "packaging", "resources", "skills", "examples", "proto/testdata"]
files = [
  "tach.toml",
  "pyproject.toml",
  "uv.lock",
  "setup.py",
  "conftest.py",
  "MANIFEST.in",
  ".github/delegated-merge.toml",
  ".github/workflows/delegated-merge.yml",
  # The release workflows' static contracts are Python tests (tests/packaging).
  ".github/workflows/publish.yml",
  ".github/workflows/evaluator-release.yml",
]

[[components]]
id = "client_protocol"
roots = ["proto/vibesys"]

[[components]]
id = "clients"
class = "manual"
job = "clients"
root = "clients"
depends_on = ["client_protocol", "bun_fetcher"]

[[components]]
id = "stitch"
class = "manual"
job = "stitch"
# Stitch is one Cargo workspace with nested crate manifests. Check it once at
# its workspace root rather than registering each nested manifest as a target.
root = "experimental/stitch"

[[components]]
id = "test_isolation_policy"
class = "manual"
jobs = ["python", "clients"]
# The implementation, configuration, and ratchet data must select both jobs:
# Python exercises the scanner and the client job executes it over TypeScript.
files = [
  "scripts/check_test_isolation.py",
  "tests/quality/isolation_baseline.jsonl",
  "pyproject.toml",
]

[[components]]
id = "bun_fetcher"
files = ["packaging/fetch_bun.py", "packaging/bun_targets.py"]

[[components]]
id = "examples"
class = "manual"
job = "examples"
roots = ["examples", "docs"]
files = [".gitmodules", "README.md"]
depends_on = ["example_validation", "native_evaluator_examples"]
# CI still selects the examples job for a docs change. Locally those files are
# documentation: `repoctl test` ignores this root and runs only the always-on
# scripts. The root stays on the component, so the CI plan does not change.
local_ignore_roots = ["docs"]

[[components]]
id = "example_validation"
files = ["src/entrypoints/headless.py", "src/entrypoints/example_catalog.py", "src/vibesys/run/project_policy.py", "scripts/example_repositories.py", "tests/vibesys/test_input_sources.py", "tests/examples/test_example_registry.py", "tests/support/example_registry.py"]
roots = ["src/vibesys/inputs"]

# The build-and-run tests of the example evaluators (the `native_build` marker) run in the
# examples job. They read the evaluator SDK and reusable evaluator packages, which live outside
# `examples`, so a change there or in their offline preparation path must select the job too.
[[components]]
id = "native_evaluator_examples"
files = [
  "libs/vs-runtime/src/vs_runtime/_docker_evaluator_tools.py",
  "libs/vs-runtime/src/vs_runtime/_evaluator_packages.py",
  "libs/vs-runtime/src/vs_runtime/_run_environment.py",
  "libs/vs-runtime/src/vs_runtime/_slurm_environment.py",
  "libs/vs-runtime/src/vs_runtime/_trusted_evaluation_preparation.py",
  "libs/vs-sandbox/src/vs_sandbox/modal_evaluator.py",
  "tests/architecture/test_stack_evaluator.py",
  "tests/architecture/test_ordered_map_evaluator.py",
  "tests/architecture/test_unordered_map_evaluator.py",
  "tests/examples/test_prioqueue_evaluator.py",
  "tests/examples/test_queue_evaluator.py",
  "tests/e2e/test_bundled_go_evaluator_offline.py",
  "tests/e2e/test_kvstore_default_gate_e2e.py",
]
roots = ["sdk/vs-evaluator", "sdk/vibesys-evaluator", "resources/evaluators"]

[[components]]
id = "agent_image"
class = "manual"
job = "agent_image"
roots = ["libs/vs-agent/src/vs_agent/images", "libs/vs-sandbox", "libs/vs-runtime/src/vs_runtime/features"]
files = ["libs/vs-agent/src/vs_agent/images.py", "libs/vs-agent/src/vs_agent/agent_feature.py", "libs/vs-agent/src/vs_agent/provider_policy.py", "libs/vs-runtime/src/vs_runtime/_image_features.py", "scripts/ci_docker_data_root.sh", "scripts/ci_ubuntu_mirror.py", "scripts/ci_image_cache.py", "scripts/ci_registry_image_cache.sh", ".github/actions/docker-image-cache/action.yml"]

[[components]]
id = "real_tiers"
class = "manual"
job = "real_tiers"
# The two real-system tiers (tests/slurm_cluster, tests/minimal_container). Read
# off what they import and start, not guessed:
#   - vs-sandbox: the Slurm executor, host command broker and its client, gate
#     runners, process execution, signal relay and the Docker sandbox they drive;
#   - vs-slurm: the cluster connector and runner behind the `slurm` environment;
#   - vs-agent: the agent image (the Features and devcontainer CLI image, built by both tiers) and the
#     containerized in-container servers;
#   - vs-runtime and vs-evaluation: run environments, trusted evaluation and the
#     evaluation tool server started in the editor container;
#   - vs-mcp, vs-project, vs-sim: tool descriptors, run resources, simulation seams;
#   - src/vibesys/run and src/launch: `open_run_environment` and the tool bindings;
#   - src/entrypoints: the in-container tool-server entrypoints;
#   - the profiler MCP server's bundled support directory.
roots = [
  "libs/vs-sandbox",
  "libs/vs-slurm",
  "libs/vs-agent",
  "libs/vs-runtime",
  "libs/vs-evaluation",
  "libs/vs-mcp",
  "libs/vs-project",
  "libs/vs-sim",
  "src/vibesys/run",
  "src/launch",
  "src/entrypoints",
  "resources/profilers",
  "tests/slurm_cluster",
  "tests/minimal_container",
]
files = [
  "src/vibesys/config.py",
  "src/vibesys/orchestration/profilers.py",
  "scripts/run_slurm_cluster_tests.sh",
  "scripts/run_minimal_container_tests.sh",
  "scripts/ci_docker_data_root.sh",
  "scripts/ci_image_cache.py",
  "scripts/ci_registry_image_cache.sh",
  ".github/actions/docker-image-cache/action.yml",
]

