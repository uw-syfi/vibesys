# Repository component ownership, discovery, and change impact policy.
default_base = "main"
jobs = ["python", "clients", "examples", "agent_image", "real_tiers", "evaluators", "impact", "stitch", "proto", "gateway", "cli"]

ignored_roots = ["website", "third_party", ".agents", ".claude", ".github/ISSUE_TEMPLATE", ".github/DISCUSSION_TEMPLATE"]
ignored_files = ["AGENTS.md", "CLAUDE.md", "LICENSE", "agent.toml.example", ".env.example", ".gitattributes", ".gitignore", ".github/CODEOWNERS", ".github/pull_request_template.md", ".github/delegated-merge.md"]

[[discoveries]]
adapter = "tach"
config = "tach.toml"
class = "python_module"
id_prefix = "python:"
job = "python"
ownership_group = "python_modules"

[[discoveries]]
adapter = "package_json"
manifest_glob = "clients/libs/*/package.json"
class = "workspace_package"
id_prefix = "pnpm:"
job = "clients"
ownership_group = "workspace_packages"
workspace_prefix = "workspace:"
dependency_fields = ["dependencies", "devDependencies", "optionalDependencies"]

[[discoveries]]
adapter = "package_json"
manifest_glob = "clients/features/*/package.json"
class = "workspace_package"
id_prefix = "pnpm:"
job = "clients"
ownership_group = "workspace_packages"
workspace_prefix = "workspace:"
dependency_fields = ["dependencies", "devDependencies", "optionalDependencies"]

[[discoveries]]
adapter = "package_json"
manifest_glob = "clients/apps/*/package.json"
class = "workspace_package"
id_prefix = "pnpm:"
job = "clients"
ownership_group = "workspace_packages"
workspace_prefix = "workspace:"
dependency_fields = ["dependencies", "devDependencies", "optionalDependencies"]

[[discoveries]]
adapter = "manifest_directories"
class = "native"
id_prefix = "native:"
target = true
ownership_group = "native_manifests"
manifests = { "Cargo.toml" = "rust", "go.mod" = "go" }
scope_roots = ["resources/evaluators", "sdk/vs-evaluator"]
selected_roots = [
  "examples/data-structures/ordered-map",
  "examples/data-structures/prioqueue",
  "examples/data-structures/repositories/queue-rs",
  "examples/data-structures/stack",
  "examples/data-structures/unordered-map",
  "resources/evaluators/microservice",
  "resources/evaluators/ordered-map",
  "resources/evaluators/ordered-map/native_runner",
  "resources/evaluators/priority-queue",
  "resources/evaluators/priority-queue/native_runner",
  "resources/evaluators/queue",
  "resources/evaluators/queue/native_runner",
  "resources/evaluators/stack",
  "resources/evaluators/stack/native_runner",
  "resources/evaluators/unordered-map",
  "resources/evaluators/unordered-map/native_runner",
  "sdk/vs-evaluator/vseval",
]
selected_jobs = ["evaluators"]

[[collections]]
name = "native_targets"
class = "native"
field = "root"
selected_only = true

[[collections]]
name = "native_languages"
class = "native"
field = "language"
selected_only = true

[[collections]]
name = "pnpm_packages"
class = "workspace_package"
field = "name"

[[components]]
id = "python_support"
class = "python_support"
job = "python"
# Central tests and project tooling are outside Tach's source roots. The committed goldens under
# proto/testdata have no input hash, so the Python tests that compare them with what the converter
# writes now run when one changes.
roots = ["tests", "libs", "sdk", "scripts", "packaging", "resources", "skills", "examples", "proto/testdata"]
files = [
  "tach.toml",
  "pyproject.toml",
  "uv.lock",
  "setup.py",
  "conftest.py",
  "MANIFEST.in",
  ".github/delegated-merge.toml",
  ".github/workflows/delegated-merge.yml",
]

[[components]]
id = "server_protocol"
files = ["src/server/api/schema.py", "src/server/events.py", "src/server/api/protocol.py", "src/server/controller.py", "src/server/diagnostics.py", ]

[[components]]
id = "server_transport"
# The browser e2e suite is the only check that the served bundle still loads and
# still reaches the gateway, so a transport change has to select the `clients` job.
# Covers the directory rather than `websocket.py` alone: the framing in
# `unix_jsonl.py` and the fan-out in `subscriptions.py` are equally observable
# from a client.
roots = ["src/server/transport"]

[[components]]
id = "clients"
class = "manual"
job = "clients"
root = "clients"
depends_on = ["server_protocol", "server_transport", "bun_fetcher"]

# What the native replays derive from, listed once, in two tiers. Every entry is a key input:
# `tests/support/derived_replays.py` hashes it into the key of a replay set, so a set is never read
# stale. An entry is also a selection input, a change to which selects the client jobs in CI and
# locally, unless it is written `{ path = "...", selects = false }`. The libraries are every one the
# generators reach through module-level imports, whole. The five a trace saw run (vs-core,
# vs-proto, vs-runlog, vs-decode, vs-redaction) select; the thirteen the projection only imports
# are key-only, so editing the runtime or the sandbox regenerates the set but does not run the
# client jobs. The projection snapshots and the conversion golden, which the Python job runs,
# still see a change from them. The two declaration directories also sit under `clients`.
[[components]]
id = "derived_replays"
class = "manual"
job = "clients"
roots = [
  "proto/vibesys",
  { path = "libs/vs-agent/src", selects = false },
  { path = "libs/vs-async-ops/src", selects = false },
  "libs/vs-core/src",
  "libs/vs-decode/src",
  { path = "libs/vs-evaluation/src", selects = false },
  { path = "libs/vs-evaluator-protocol/src", selects = false },
  { path = "libs/vs-faults/src", selects = false },
  { path = "libs/vs-issue-tracker/src", selects = false },
  { path = "libs/vs-mcp/src", selects = false },
  { path = "libs/vs-project/src", selects = false },
  { path = "libs/vs-prompts/src", selects = false },
  "libs/vs-proto/src",
  "libs/vs-redaction/src",
  "libs/vs-runlog/src",
  { path = "libs/vs-runtime/src", selects = false },
  { path = "libs/vs-sandbox/src", selects = false },
  { path = "libs/vs-sim/src", selects = false },
  { path = "libs/vs-slurm/src", selects = false },
  "src/vibesys/records",
  "src/vibesys/search_spans",
  "clients/libs/run-fixtures/src/data",
  "clients/apps/desktop-shell/e2e/scenarios",
]
files = [
  "uv.lock",
  "pyproject.toml",
  { path = "libs/vs-agent/pyproject.toml", selects = false },
  { path = "libs/vs-async-ops/pyproject.toml", selects = false },
  "libs/vs-core/pyproject.toml",
  "libs/vs-decode/pyproject.toml",
  { path = "libs/vs-evaluation/pyproject.toml", selects = false },
  { path = "libs/vs-evaluator-protocol/pyproject.toml", selects = false },
  { path = "libs/vs-faults/pyproject.toml", selects = false },
  { path = "libs/vs-issue-tracker/pyproject.toml", selects = false },
  { path = "libs/vs-mcp/pyproject.toml", selects = false },
  { path = "libs/vs-project/pyproject.toml", selects = false },
  { path = "libs/vs-prompts/pyproject.toml", selects = false },
  "libs/vs-proto/pyproject.toml",
  "libs/vs-redaction/pyproject.toml",
  "libs/vs-runlog/pyproject.toml",
  { path = "libs/vs-runtime/pyproject.toml", selects = false },
  { path = "libs/vs-sandbox/pyproject.toml", selects = false },
  { path = "libs/vs-sim/pyproject.toml", selects = false },
  { path = "libs/vs-slurm/pyproject.toml", selects = false },
  "src/vibesys/__init__.py",
  "src/vibesys/events.py",
  "src/vibesys/metrics.py",
  "tests/support/__init__.py",
  "tests/support/derived_replays.py",
  "tests/support/journey_fixtures.py",
  "tests/support/lineage_fixture.py",
  "tests/support/materialize_replays.py",
  "tests/support/retained_events.py",
  "tests/support/shared_scenarios.py",
]

[[components]]
id = "stitch"
class = "manual"
job = "stitch"
# Stitch is one Cargo workspace with nested crate manifests. Check it once at
# its workspace root rather than registering each nested manifest as a target.
root = "experimental/stitch"

[[components]]
id = "test_isolation_policy"
class = "manual"
jobs = ["python", "clients"]
# The implementation, configuration, and ratchet data must select both jobs:
# Python exercises the scanner and the client job executes it over TypeScript.
files = [
  "scripts/check_test_isolation.py",
  "tests/quality/isolation_baseline.jsonl",
  "pyproject.toml",
]

[[components]]
id = "bun_fetcher"
files = ["packaging/fetch_bun.py", "packaging/bun_targets.py"]

[[components]]
id = "examples"
class = "manual"
job = "examples"
roots = ["examples", "docs"]
files = [".gitmodules", "README.md"]
depends_on = ["example_validation", "microservice_evaluator", "native_evaluator_examples"]
# CI still selects the examples job for a docs change. Locally those files are
# documentation: `repoctl test` ignores this root and runs only the always-on
# scripts. The root stays on the component, so the CI plan does not change.
local_ignore_roots = ["docs"]

[[components]]
id = "example_validation"
files = ["src/entrypoints/headless.py", "src/entrypoints/example_catalog.py", "src/vibesys/run/project_policy.py", "scripts/example_repositories.py", "tests/vibesys/test_microservice_inputs.py", "tests/vibesys/test_kubernetes_inputs.py", "tests/vibesys/test_kubernetes_runtime.py", "tests/vibesys/test_input_sources.py", "tests/examples/test_example_registry.py", "tests/support/example_registry.py"]
roots = ["src/vibesys/inputs"]

# The build-and-run tests of the example evaluators (the `native_build` marker) run in the
# examples job. They read the evaluator SDK and reusable evaluator packages, which live outside
# `examples`, so a change there or in their offline preparation path must select the job too.
[[components]]
id = "native_evaluator_examples"
files = [
  "libs/vs-runtime/src/vs_runtime/_docker_evaluator_tools.py",
  "libs/vs-runtime/src/vs_runtime/_evaluator_packages.py",
  "libs/vs-runtime/src/vs_runtime/_run_environment.py",
  "libs/vs-runtime/src/vs_runtime/_slurm_environment.py",
  "libs/vs-runtime/src/vs_runtime/_trusted_evaluation_preparation.py",
  "libs/vs-sandbox/src/vs_sandbox/modal_evaluator.py",
  "tests/architecture/test_stack_evaluator.py",
  "tests/architecture/test_ordered_map_evaluator.py",
  "tests/architecture/test_unordered_map_evaluator.py",
  "tests/examples/test_prioqueue_evaluator.py",
  "tests/examples/test_queue_evaluator.py",
  "tests/e2e/test_bundled_go_evaluator_offline.py",
  "tests/e2e/test_kvstore_default_gate_e2e.py",
]
roots = ["sdk/vs-evaluator", "resources/evaluators"]

[[components]]
id = "agent_image"
class = "manual"
job = "agent_image"
roots = ["libs/vs-agent/src/vs_agent/images", "libs/vs-sandbox", "libs/vs-runtime/src/vs_runtime/features"]
files = ["libs/vs-agent/src/vs_agent/images.py", "libs/vs-agent/src/vs_agent/agent_feature.py", "libs/vs-agent/src/vs_agent/provider_policy.py", "libs/vs-runtime/src/vs_runtime/_image_features.py", "scripts/ci_docker_data_root.sh", "scripts/ci_ubuntu_mirror.py", "scripts/ci_image_cache.py", "scripts/ci_registry_image_cache.sh", ".github/actions/docker-image-cache/action.yml"]

[[components]]
id = "real_tiers"
class = "manual"
job = "real_tiers"
# The two real-system tiers (tests/slurm_cluster, tests/minimal_container). Read
# off what they import and start, not guessed:
#   - vs-sandbox: the Slurm executor, host command broker and its client, gate
#     runners, process execution, signal relay and the Docker sandbox they drive;
#   - vs-slurm: the cluster connector and runner behind the `slurm` environment;
#   - vs-agent: the agent image (the Features and devcontainer CLI image, built by both tiers) and the
#     containerized in-container servers;
#   - vs-runtime and vs-evaluation: run environments, trusted evaluation and the
#     evaluation tool server started in the editor container;
#   - vs-mcp, vs-project, vs-sim: tool descriptors, run resources, simulation seams;
#   - src/vibesys/run and src/launch: `open_run_environment` and the tool bindings;
#   - src/entrypoints: the in-container tool-server entrypoints;
#   - the profiler MCP server's bundled support directory.
roots = [
  "libs/vs-sandbox",
  "libs/vs-slurm",
  "libs/vs-agent",
  "libs/vs-runtime",
  "libs/vs-evaluation",
  "libs/vs-mcp",
  "libs/vs-project",
  "libs/vs-sim",
  "src/vibesys/run",
  "src/launch",
  "src/entrypoints",
  "resources/profilers",
  "tests/slurm_cluster",
  "tests/minimal_container",
]
files = [
  "src/vibesys/config.py",
  "src/vibesys/orchestration/profilers.py",
  "scripts/run_slurm_cluster_tests.sh",
  "scripts/run_minimal_container_tests.sh",
  "scripts/ci_docker_data_root.sh",
  "scripts/ci_image_cache.py",
  "scripts/ci_registry_image_cache.sh",
  ".github/actions/docker-image-cache/action.yml",
]

[[components]]
id = "microservice_evaluator"
roots = ["resources/evaluators/microservice"]

[[edges]]
from = "native:sdk/vs-evaluator/vseval"
to = "native:resources/evaluators/microservice"

[[edges]]
from = "native:sdk/vs-evaluator/vseval"
to = "native:resources/evaluators/queue"

[[edges]]
from = "native:resources/evaluators/queue/native_runner"
to = "native:resources/evaluators/queue"

[[edges]]
from = "native:resources/evaluators/priority-queue/native_runner"
to = "native:resources/evaluators/priority-queue"

[[edges]]
from = "native:resources/evaluators/stack/native_runner"
to = "native:resources/evaluators/stack"

[[edges]]
from = "native:resources/evaluators/unordered-map/native_runner"
to = "native:resources/evaluators/unordered-map"

[[edges]]
from = "native:resources/evaluators/ordered-map/native_runner"
to = "native:resources/evaluators/ordered-map"

[[edges]]
from = "native:examples/data-structures/repositories/queue-rs/verus-mpmc"
to = "native:examples/data-structures/repositories/queue-rs"

[[components]]
id = "repo_policy"
# Policy inputs affect every CI selection.
roots = ["support/repoctl", ".repoctl"]
files = [".github/workflows/test.yml", ".github/actions/setup-clients/action.yml", ".github/actions/setup-clients/retry-download.sh", ".github/actions/setup-repoctl/action.yml", ".github/actions/docker-cache-week/action.yml", ".github/actions/setup-runner-apt/action.yml", "tests/repoctl/cases.toml"]
select_all_jobs = true
select_all_collections = true
# CI selects everything for a policy change; a local `repoctl test` runs only repoctl's own
# tests (the `impact` job), because CI runs the rest and no repoctl change can break them.
local_jobs = ["impact"]

# The tracked git hooks. The pre-push hook runs `repoctl gate`, so a change to it is checked by
# repoctl's own tests (the `impact` job), which also hold its executable bit and its call.
[[components]]
id = "git_hooks"
class = "manual"
job = "impact"
root = ".githooks"

[[components]]
id = "workflow_references"
class = "manual"
job = "examples"
root = ".github/workflows"

# All contract sources, generated bindings, and codegen pins share one fast check.
[[components]]
id = "proto"
class = "manual"
job = "proto"
roots = ["proto", "scripts/corevalue", "scripts/host_operations", "libs/vs-core/src/vs_core/_generated", "libs/vs-runtime/src/vs_runtime/_core_values", "libs/vs-proto", "clients/libs/proto", "gateway/gen", "gateway/schemahash", "gateway/cmd/schema-hashes", "cli/gen"]
files = ["buf.yaml", "buf.gen.yaml", "buf.gen.core.yaml", "buf.gen.cli.yaml", "scripts/check_proto_layers.py", "scripts/protoc_gen_corevalue.py", "scripts/generate_proto.sh", "scripts/check_schema_hashes.sh", "scripts/generate_proto_framing.py", "scripts/check_proto.sh", "scripts/check_proto_breaking.sh", "scripts/tests/test_proto_breaking.sh", "gateway/go.mod", "gateway/go.sum", "cli/go.mod", "cli/go.sum", "clients/package.json", "clients/pnpm-lock.yaml", "pyproject.toml", "uv.lock"]

[[components]]
id = "gateway"
class = "manual"
job = "gateway"
# The gateway tests read the conversion and retained goldens and compare the Skeleton wire golden
# byte for byte, so a change to any of them runs them.
roots = ["gateway", "proto/testdata"]

[[components]]
id = "cli"
class = "manual"
job = "cli"
# The contract the CLI is generated from selects its checks too, so an edit to it cannot leave the
# Go bindings unvetted. The proto job checks that the bindings are current.
roots = ["cli", "proto/vibesys/cli"]
files = ["buf.gen.cli.yaml"]
