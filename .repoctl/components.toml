# Repository component ownership, discovery, and change impact policy.
default_base = "main"
jobs = ["python", "tui", "examples", "agent_image", "evaluators", "impact"]

ignored_roots = ["website", "third_party", ".agents", ".claude", ".github/ISSUE_TEMPLATE", ".github/DISCUSSION_TEMPLATE"]
ignored_files = ["AGENTS.md", "CLAUDE.md", "LICENSE", "agent.toml.example", ".env.example", ".gitattributes", ".gitignore", ".github/CODEOWNERS", ".github/pull_request_template.md", ".github/delegated-merge.md"]

[[discoveries]]
adapter = "tach"
config = "tach.toml"
class = "python_module"
id_prefix = "python:"
job = "python"
ownership_group = "python_modules"

[[discoveries]]
adapter = "package_json"
manifest_glob = "clients/*/package.json"
class = "workspace_package"
id_prefix = "pnpm:"
job = "tui"
ownership_group = "workspace_packages"
workspace_prefix = "workspace:"
dependency_fields = ["dependencies", "devDependencies", "optionalDependencies"]

[[discoveries]]
adapter = "manifest_directories"
class = "native"
id_prefix = "native:"
target = true
ownership_group = "native_manifests"
manifests = { "Cargo.toml" = "rust", "go.mod" = "go" }
scope_roots = ["resources/evaluators", "examples/evaluators", "sdk/vs-evaluator"]
selected_roots = [
  "resources/evaluators/queue",
  "resources/evaluators/queue/native_runner",
  "resources/evaluators/microservice",
  "examples/data-structures/repositories/queue-rs",
  "examples/evaluators/priority-queue",
  "examples/evaluators/priority-queue/native_runner",
  "examples/starters/priority-queue-rs",
  "sdk/vs-evaluator/vseval",
]
selected_jobs = ["evaluators"]

[[collections]]
name = "native_targets"
class = "native"
field = "root"
selected_only = true

[[collections]]
name = "native_languages"
class = "native"
field = "language"
selected_only = true

[[collections]]
name = "pnpm_packages"
class = "workspace_package"
field = "name"

[[components]]
id = "python_support"
class = "python_support"
job = "python"
# Central tests and project tooling are outside Tach's source roots.
roots = ["tests", "libs", "sdk", "scripts", "packaging", "benchmarks", "resources", "examples"]
files = [
  "tach.toml",
  "pyproject.toml",
  "uv.lock",
  "setup.py",
  "conftest.py",
  "MANIFEST.in",
  ".github/delegated-merge.toml",
  ".github/workflows/delegated-merge.yml",
]

[[components]]
id = "server_protocol"
files = ["src/server/api/schema.py", "src/server/events.py", "src/server/api/protocol.py", "src/server/controller.py", "src/server/diagnostics.py", "src/server/settings.py"]

[[components]]
id = "clients"
class = "manual"
job = "tui"
root = "clients"
depends_on = ["server_protocol", "bun_fetcher"]

[[components]]
id = "bun_fetcher"
files = ["packaging/fetch_bun.py"]

[[components]]
id = "examples"
class = "manual"
job = "examples"
roots = ["examples", "docs"]
files = [".gitmodules", "README.md"]
depends_on = ["example_validation", "microservice_evaluator"]

[[components]]
id = "example_validation"
files = ["src/entrypoints/headless.py", "src/vibesys/run/project_policy.py", "scripts/example_repositories.py", "tests/vibesys/test_microservice_inputs.py", "tests/vibesys/test_kubernetes_inputs.py", "tests/vibesys/test_kubernetes_runtime.py", "tests/vibesys/test_input_sources.py", "tests/examples/test_example_registry.py", "tests/support/example_registry.py"]
roots = ["src/vibesys/evaluators"]

[[components]]
id = "agent_image"
class = "manual"
job = "agent_image"
roots = ["src/vibesys/sandbox/images", "libs/vs-sandbox"]
files = ["src/vibesys/sandbox/images.py", "src/vibesys/agents/provider_policy.py"]

[[components]]
id = "microservice_evaluator"
roots = ["resources/evaluators/microservice"]

[[edges]]
from = "native:sdk/vs-evaluator/vseval"
to = "native:resources/evaluators/microservice"

[[edges]]
from = "native:sdk/vs-evaluator/vseval"
to = "native:resources/evaluators/queue"

[[edges]]
from = "native:resources/evaluators/queue/native_runner"
to = "native:resources/evaluators/queue"

[[edges]]
from = "native:examples/evaluators/priority-queue/native_runner"
to = "native:examples/evaluators/priority-queue"

[[edges]]
from = "native:examples/data-structures/repositories/queue-rs/verus-mpmc"
to = "native:examples/data-structures/repositories/queue-rs"

[[components]]
id = "repo_policy"
# Policy inputs affect every CI selection.
roots = ["support/repoctl", ".repoctl", "support/ci_impact"]
files = [".github/workflows/test.yml", "repoctl.toml", "tests/repoctl/cases.toml", "ci-impact.toml"]
select_all_jobs = true
select_all_collections = true

[[components]]
id = "workflow_references"
class = "manual"
job = "examples"
root = ".github/workflows"
