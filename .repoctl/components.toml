[[components]]
id = "repo_policy"
# Policy inputs affect every CI selection.
roots = ["support/repoctl", ".repoctl"]
files = [".github/workflows/test.yml", ".github/actions/setup-clients/action.yml", ".github/actions/setup-clients/retry-download.sh", ".github/actions/setup-repoctl/action.yml", ".github/actions/docker-cache-week/action.yml", ".github/actions/setup-runner-apt/action.yml", "tests/repoctl/cases.toml"]
select_all_jobs = true
select_all_collections = true
# CI selects everything for a policy change; a local `repoctl test` runs only repoctl's own
# tests (the `impact` job), because CI runs the rest and no repoctl change can break them.
local_jobs = ["impact"]

# The tracked git hooks. The pre-push hook runs `repoctl gate`, so a change to it is checked by
# repoctl's own tests (the `impact` job), which also hold its executable bit and its call.
[[components]]
id = "git_hooks"
class = "manual"
job = "impact"
root = ".githooks"

[[components]]
id = "workflow_references"
class = "manual"
job = "examples"
root = ".github/workflows"

# All contract sources, generated bindings, and codegen pins share one fast check.
[[components]]
id = "proto"
class = "manual"
job = "proto"
roots = ["proto", "scripts/corevalue", "scripts/host_operations", "libs/vs-core/src/vs_core/_generated", "libs/vs-runtime/src/vs_runtime/_core_values", "libs/vs-proto", "clients/libs/proto", "clients/libs/orchestrator-proto/src/generated", "gateway/gen", "gateway/schemahash", "gateway/cmd/schema-hashes", "cli/gen", "orchestrator/gen", "sdk/vibesys-evaluator/go/gen", "sdk/vibesys-evaluator/python/src/vibesys_evaluator/_proto", "sdk/vs-evaluator/vseval/internal/gen"]
files = ["buf.yaml", "buf.gen.yaml", "buf.gen.core.yaml", "buf.gen.cli.yaml", "buf.gen.orchestrator.yaml", "buf.gen.orchestrator-ts.yaml", "buf.gen.evaluator.yaml", "buf.gen.evaluator-env.yaml", "buf.gen.evaluator-env-go.yaml", "buf.gen.vseval.yaml", "scripts/check_proto_layers.py", "scripts/protoc_gen_corevalue.py", "scripts/generate_proto.sh", "scripts/check_schema_hashes.sh", "scripts/generate_proto_framing.py", "scripts/check_proto.sh", "scripts/check_proto_breaking.sh", "scripts/tests/test_proto_breaking.sh", "gateway/go.mod", "gateway/go.sum", "cli/go.mod", "cli/go.sum", "orchestrator/go.mod", "orchestrator/go.sum", "sdk/vibesys-evaluator/go/go.mod", "sdk/vibesys-evaluator/go/go.sum", "sdk/vs-evaluator/vseval/go.mod", "sdk/vs-evaluator/vseval/go.sum", "clients/package.json", "clients/pnpm-lock.yaml", "pyproject.toml", "uv.lock"]

[[components]]
id = "gateway"
class = "manual"
job = "gateway"
# The gateway tests read the conversion and retained goldens and compare the Skeleton wire golden
# byte for byte, so a change to any of them runs them.
roots = ["gateway", "proto/testdata"]
# vibesys-host hosts the orchestrator through a replace of the sibling module, so its changes run these.
depends_on = ["orchestrator"]

[[components]]
id = "cli"
class = "manual"
job = "cli"
# The contract the CLI is generated from selects its checks too, so an edit to it cannot leave the
# Go bindings unvetted. The proto job checks that the bindings are current.
roots = ["cli", "proto/vibesys/cli"]
# The release workflow builds and publishes what these checks build, so a change to it runs them too.
files = ["buf.gen.cli.yaml", ".github/workflows/cli-release.yml"]

[[components]]
id = "orchestrator"
class = "manual"
job = "orchestrator"
# The contract the module is generated from selects its checks too, as for the CLI. The proto job
# checks that the bindings are current.
roots = ["orchestrator", "cli/gen", "proto/vibesys/orchestrator", "proto/vibesys/cli"]
files = ["buf.gen.orchestrator.yaml", "buf.gen.orchestrator-ts.yaml"]

[[components]]
id = "desktop_path"
class = "manual"
job = "desktop_path"
# The desktop path end to end test (gateway/e2e) runs the gateway, the orchestrator and its sidecar,
# the CLI and the skills plugin together, so a change to any of them selects it. The plugin
# marketplace manifest is read from the repository root.
roots = ["gateway", "cli", "orchestrator", "skills", "proto/vibesys/orchestrator", "proto/vibesys/cli"]
files = [".claude-plugin/marketplace.json"]
# With VIBESYS_E2E_DESKTOP_UI=1 the test also builds the desktop app and drives it on screen, so a
# change to the app or to a package it uses (found through the package graph) selects it too.
depends_on = ["pnpm:@vibesys/desktop"]

[[components]]
id = "managed_install"
class = "manual"
job = "managed_install"
# The installer test builds a bundle from the Go sources, installs it in a clean container and runs
# a managed run with what was installed, so it runs when the installer, the bundle builder, the
# workflow that publishes bundles, what a bundle carries (the sidecar, the skills and the plugin
# manifest), or the code of the binaries it holds (gateway, cli and orchestrator) changes.
roots = ["gateway", "cli", "orchestrator", "skills"]
files = ["install.sh", "scripts/build_release_bundle.sh", "scripts/tests/test_install.sh", "scripts/tests/test_install_in_container.sh", "scripts/tests/test_install_macos.sh", ".github/workflows/managed-release.yml", ".claude-plugin/marketplace.json"]
